  karlsson_2013_sweden:
    label: "Karlsson 2013 Swedish postmenopausal women"
    type: direction_panel
    evidence_type: TAX_REL
    claim_level: observed
    assay_transport: native
    study_group: karlsson_2013
    maturity: P3
    note: "145 European women; a discriminative model built on the Chinese cohort transferred poorly, which is itself a finding about population transportability."
