    evidence_type: TAX_REL
    claim_level: observed
    assay_transport: native
    study_group: qin_2012
    maturity: P3
    note: >-
      345 Chinese participants, the first large T2D shotgun study. Not
      metformin-stratified, so its Escherichia direction is partly drug; that
      feature is left out and the butyrate producers retained.
    sources: ["Qin J, et al. Nature 2012;490:55-60"]
    features:
      - name: Roseburia_intestinalis
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.7
        q: 0.7
        s: 0.3
        c: 0.7
      - name: Faecalibacterium_prausnitzii
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.7
        q: 0.7
        s: 0.2
        c: 0.7
      - name: Eubacterium_rectale
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.7
        q: 0.7
        s: 0.2
        c: 0.7
      - name: Clostridium_bolteae
        level: species
        direction: higher_in_case
        w: 0.5
        q: 0.6
        s: 0.4
        c: 0.6
      - name: Bacteroides_caccae
        level: species
        direction: higher_in_case
        w: 0.5
        q: 0.6
