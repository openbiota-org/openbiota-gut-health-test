name: t2d
version: 1.0.0
spec_version: 3
label: "Type 2 diabetes — gut pattern (metformin-gated)"
disease: type_2_diabetes
task: t2d_vs_normoglycaemic
family: cardiometabolic
body_site: stool
population: mixed_european_chinese_cohorts
status: research_beta
evidence_maturity: P3
mandatory_match: [metformin]

summary: >-
  Type 2 diabetes has large shotgun cohorts in China and Europe, and the
  first replicated lesson from them was a confounding one: much of the
  "diabetes signature" in early studies was metformin. Forslund et al. showed
  that metformin-treated patients carry more Escherichia and less
  Intestinibacter, and that the untreated-diabetes signal is a different,
  weaker pattern of butyrate-producer depletion. This profile therefore
  needs metformin status. In participant mode it abstains without it,
  because a score that cannot separate the drug from the disease measures
  the drug. In research and clinician mode an unsupplied medication list is
  read as "no metformin", the untreated-diabetes modules are scored on that
  stated assumption, and the card says how the reading would change if
  metformin were in fact being taken.

references:
  primary:
    source: null
    note: >-
      Normoglycaemic controls matched on BMI are rare; most cohorts are
      confounded by adiposity as well as metformin.
  secondary:
    source: curatedMetagenomicData
    match_on: [country, age_band, sex]

modules:
  forslund_2015_untreated:
    label: "Forslund 2015 metformin-disentangled T2D signature"
    type: direction_panel
    evidence_type: TAX_REL
    claim_level: observed
    assay_transport: native
    study_group: forslund_2015
    maturity: P3
    weight_in_combined: 1.0
    note: >-
      784 shotgun metagenomes across Danish, Swedish and Chinese cohorts,
      stratified by metformin. These are the directions that remain in
      untreated diabetes after the metformin effect is removed.
    sources: ["Forslund K, et al. Nature 2015;528:262-266"]
    features:
      - name: Roseburia_intestinalis
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.9
        q: 0.8
        s: 0.3
        c: 0.8
      - name: Roseburia_hominis
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.7
        q: 0.8
        s: 0.3
        c: 0.8
      - name: Eubacterium_rectale
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.8
        q: 0.8
        s: 0.2
        c: 0.8
      - name: Faecalibacterium_prausnitzii
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.7
        q: 0.8
        s: 0.2
        c: 0.8
      - name: Clostridium_bolteae
        level: species
        direction: higher_in_case
        w: 0.6
        q: 0.7
        s: 0.4
        c: 0.7
      - name: Lactobacillus_gasseri
        level: species
        direction: higher_in_case
        w: 0.5
        q: 0.6
        s: 0.4
        c: 0.6
      - name: Streptococcus_mutans
        level: species
        direction: higher_in_case
        w: 0.5
        q: 0.6
        s: 0.4
        c: 0.6
        conflict_note: "Genus Streptococcus is on the conflicted list; species only."

