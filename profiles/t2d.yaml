  functional:
    label: "Metabolite gene capacity"
    type: mechanism_lane
    evidence_type: GENE_ABUND
    claim_level: genomic_capacity
    maturity: P3
    note: >-
      Butyrate capacity falls with the producers. Imidazole propionate
      impairs insulin signalling through mTORC1 and is elevated in T2D
      serum; urdA is the responsible gene. Branched-chain amino acid
      biosynthesis potential was higher in insulin resistance in the Pedersen
      cohort. Bile salt hydrolase changes track metformin more than disease.
    sources:
      - "Koh A, et al. Cell 2018;175:947 (imidazole propionate)"
      - "Pedersen HK, et al. Nature 2016;535:376 (BCAA)"
    features:
      - name: butyrate
        engine: diamond
        direction: decreased
        w: 1.0
        q: 0.8
        s: 0.2
        c: 0.8
      - name: urda
        engine: diamond
        direction: increased
        w: 0.8
        q: 0.7
        s: 0.5
        c: 0.7
      - name: bcaa
        engine: diamond
        direction: increased
        w: 0.6
        q: 0.6
        s: 0.4
        c: 0.6
      - name: cutc
        engine: diamond
        direction: increased
        w: 0.4
        q: 0.5
        s: 0.3
        c: 0.5

  carriers:
    label: "Butyrate carriers"
    type: mechanism_lane
    evidence_type: CARRIER_ABUNDANCE
    claim_level: carrier_proxy
    maturity: P2
    features:
      - name: butyrate
        engine: carrier
        direction: decreased
        w: 0.8
        q: 0.8
        s: 0.2
        c: 0.8

confounders:
  - name: Metformin
    effect: "Raises Escherichia, lowers Intestinibacter; the largest single confounder in T2D cohorts"
    handling: "Mandatory: abstains without metformin status in participant mode; assumed absent and stated in research and clinician mode"
  - name: Adiposity
    effect: "Most T2D cohorts are heavier than their controls; obesity has its own ecological pattern"
    handling: "Recorded in the ledger; BMI matched where the stratum allows"
  - name: Geography
    effect: "Chinese and European cohorts do not transfer models to one another"
    handling: "population_transportability reported"

abstain_if:
  - recent_antibiotics_days_lt: 90
  - usable_nonhost_pairs_lt: 500000
  - missing_metadata: metformin

caveats:
  - >-
    Type 2 diabetes is diagnosed with fasting glucose, HbA1c or a glucose
    tolerance test. Those are cheap, direct and definitive. This profile is
    none of those things.
  - >-
    Metformin status decides how to read this pattern. With metformin, the
    Escherichia expansion is the drug; in an untreated subject it may not
    be. The two cannot be told apart from stool alone, so when no medication
    list is supplied the score is printed on the stated assumption of no
    metformin, and would need re-reading if that assumption is wrong.
  - >-
    Butyrate-producer depletion is shared with every other dysbiosis
    pattern; see the specificity column in the confidence vector.

effect_size_note: >-
  Forslund 2015: 784 metagenomes. Qin 2012: 345 Chinese. Karlsson 2013: 145
  Swedish women. Cross-population model transfer was poor.

citation: >-
  Forslund K, et al. Disentangling type 2 diabetes and metformin treatment
  signatures in the human gut microbiota. Nature 2015;528:262-266; Qin J, et
  al. A metagenome-wide association study of gut microbiota in type 2 diabetes.
  Nature 2012;490:55-60; Karlsson FH, et al. Gut metagenome in European women
  with normal, impaired and diabetic glucose control. Nature 2013;498:99-103;
  Koh A, et al. Microbially produced imidazole propionate impairs insulin
  signaling through mTORC1. Cell 2018;175:947.
