  bajaj_cdr:
    label: "Bajaj cirrhosis dysbiosis ratio (16S, US)"
    type: direction_panel
    evidence_type: TAX_REL
    claim_level: association_only
    assay_transport: amplicon_taxon_to_shotgun
    study_group: bajaj_2014
    maturity: P3
    note: >-
      Independent US cohorts; the CDR is a family-level ratio, and the
      transported species here are its dominant members. Concordant with
      Qin, which is a genuine cross-population replication.
    sources: ["Bajaj JS, et al. J Hepatol 2014;60:940-947"]
    features:
      - name: Veillonella_parvula
        level: species
        direction: higher_in_case
        cluster: oral_origin
        w: 0.7
        q: 0.7
        s: 0.5
        c: 0.8
        mapping_confidence: medium
      - name: Escherichia_coli
        level: species
        direction: higher_in_case
        w: 0.6
        q: 0.7
        s: 0.3
        c: 0.7
        mapping_confidence: medium
      - name: Roseburia_intestinalis
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.6
        q: 0.7
