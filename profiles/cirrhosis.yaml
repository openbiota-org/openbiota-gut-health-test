name: cirrhosis
version: 1.0.0
spec_version: 3
label: "Liver cirrhosis — gut pattern"
disease: liver_cirrhosis
task: cirrhosis_vs_healthy
family: liver
body_site: stool
population: chinese_cohort_derived
status: research_beta
evidence_maturity: P3
challenge_for: [crc, crohns]

summary: >-
  One of the largest effect sizes in the gut microbiome literature. Qin et al.
  found that cirrhosis drives oral bacteria into the gut — Veillonella,
  Streptococcus, Haemophilus — because reduced bile acid output and gastric
  acid suppression remove the barriers that normally keep them out. The
  Bajaj cirrhosis dysbiosis ratio captures the same thing: oral and
  Enterobacteriaceae taxa up, Lachnospiraceae and Ruminococcaceae down.
  Cross-validated AUC for cirrhosis versus healthy exceeds 0.9 in the
  discovery cohort.

  Proton pump inhibitors reproduce the oral-invasion part of this pattern on
  their own, and most cirrhotic patients are on them.

references:
  primary:
    source: null
    note: >-
      The right contrast is chronic liver disease without cirrhosis, on the
      same acid suppression. It does not exist in public shotgun data.
  secondary:
    source: curatedMetagenomicData
    match_on: [country, age_band, sex]

