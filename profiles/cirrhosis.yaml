    study_group: qin_2014
    maturity: P3
    weight_in_combined: 1.0
    note: "98 cirrhotic patients, 83 controls, 15-gene biomarker set with AUC 0.94 in discovery."
    sources: ["Qin N, et al. Nature 2014;513:59-64"]
