  ecology:
    label: "Community ecology"
    type: direction_panel
    evidence_type: ECO
    claim_level: observed
    study_group: qin_2014
    maturity: P3
    features:
      - name: shannon
        direction: decreased
        w: 0.6
        q: 0.8
        s: 0.1
        c: 0.8

  functional:
    label: "Metabolite gene capacity"
    type: mechanism_lane
    evidence_type: GENE_ABUND
    claim_level: genomic_capacity
    maturity: P3
    note: >-
      Cirrhosis reduces bile acid delivery to the gut, so 7-alpha-
      dehydroxylation capacity and secondary bile acids fall (Kakiyama).
      Urease capacity and ammonia production are the mechanism of hepatic
      encephalopathy. Butyrate falls with the producers.
    sources:
      - "Kakiyama G, et al. J Hepatol 2013;58:949"
      - "Qin 2014 Nature"
    features:
      - name: bai
        engine: diamond
        direction: decreased
        w: 0.9
        q: 0.8
        s: 0.5
        c: 0.8
      - name: urease
        engine: diamond
        direction: increased
        w: 0.7
        q: 0.7
        s: 0.4
        c: 0.7
      - name: butyrate
        engine: diamond
        direction: decreased
        w: 0.7
        q: 0.8
        s: 0.2
        c: 0.8
      - name: bsh
        engine: diamond
        direction: decreased
        w: 0.5
        q: 0.6
        s: 0.3
        c: 0.6

  carriers:
    label: "Oral-origin carrier cross-check"
    type: mechanism_lane
    evidence_type: CARRIER_ABUNDANCE
    claim_level: carrier_proxy
    maturity: P2
    features:
      - name: oral_origin
        engine: carrier
        direction: increased
        w: 1.0
        q: 0.8
        s: 0.5
        c: 0.9
      - name: butyrate
        engine: carrier
        direction: decreased
        w: 0.6
        q: 0.8
        s: 0.2
        c: 0.8

confounders:
  - name: Proton pump inhibitors
    effect: "PPIs alone drive oral taxa into the gut; most cirrhotic patients take them"
    handling: "Recorded in the ledger when supplied; the oral-invasion module cannot separate the two"
  - name: Alcohol
    effect: "Active alcohol use has its own pattern overlapping with cirrhosis"
    handling: "Recorded when supplied"
  - name: Lactulose and rifaximin
    effect: "Standard encephalopathy treatments reshape the community"
    handling: "Recorded when supplied"

abstain_if:
  - recent_antibiotics_days_lt: 90
  - usable_nonhost_pairs_lt: 500000

caveats:
  - >-
    Cirrhosis is diagnosed by imaging, elastography, liver tests and, where
    needed, biopsy. This profile does not diagnose it.
  - >-
    Proton pump inhibitor use reproduces the oral-invasion pattern that
    carries this profile. A PPI user without liver disease can score high
    here. The confounder ledger shows whether PPI use was recorded.

effect_size_note: >-
  Qin 2014: 98 cirrhosis, 83 controls; 15-gene classifier AUC 0.94 in
  discovery, 0.84 in validation.

citation: >-
  Qin N, et al. Alterations of the human gut microbiome in liver cirrhosis.
  Nature 2014;513:59-64; Bajaj JS, et al. Altered profile of human gut
  microbiome is associated with cirrhosis and its complications. J Hepatol
  2014;60:940-947; Kakiyama G, et al. Modulation of the fecal bile acid
  profile by gut microbiota in cirrhosis. J Hepatol 2013;58:949.
