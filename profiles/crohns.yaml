name: crohns
version: 1.0.0
spec_version: 3
label: "Crohn's disease — gut pattern"
disease: crohns_disease
task: cd_vs_non_ibd
family: ibd
body_site: stool
population: mixed_north_american_european_cohorts
status: research_beta
evidence_maturity: P3
challenge_for: [crc, uc]

summary: >-
  The best-replicated disease pattern in the gut microbiome literature after
  colorectal cancer, with independent shotgun cohorts in North America and
  Europe agreeing on direction for a core set of species: depletion of
  Faecalibacterium prausnitzii and the Roseburia and Eubacterium butyrate
  producers, and expansion of Escherichia coli, Ruminococcus gnavus and the
  oral-origin Veillonella and Haemophilus. Treatment-naive paediatric cohorts
  show the same pattern, so it is not a treatment artefact.

  The pattern is strongest in a dysbiotic subgroup. The HMP2 study found IBD
  patients moved in and out of a dysbiotic state over time, and at any one
  sampling many Crohn's patients look like controls. A high score here is
  also the general dysbiosis pattern, so read it with the shape analysis.

references:
  primary:
    source: curatedMetagenomicData
    note: >-
      HMP2 used non-IBD symptomatic controls — people scoped for GI symptoms
      and found not to have IBD — which is the right contrast for a stool
      test in someone with symptoms.
  secondary:
    source: curatedMetagenomicData
    match_on: [country, age_band, sex]

modules:
  gevers_2014_risk:
    label: "Gevers 2014 RISK treatment-naive paediatric cohort"
    type: direction_panel
    evidence_type: TAX_REL
    claim_level: observed
    assay_transport: native
    study_group: gevers_2014
    maturity: P3
    weight_in_combined: 1.0
    note: >-
      447 treatment-naive newly diagnosed children plus 221 controls, with
      shotgun on a subset. The oral-origin taxa and E. coli directions come
      from mucosal biopsy as well as stool; stool signal is weaker but
      concordant.
    sources: ["Gevers D, et al. Cell Host Microbe 2014;15:382-392"]
    features:
      - name: Escherichia_coli
        level: species
        direction: higher_in_case
        w: 1.0
        q: 0.8
        s: 0.3
        c: 0.9
      - name: Veillonella_parvula
        level: species
        direction: higher_in_case
        cluster: oral_origin
        w: 0.8
        q: 0.7
        s: 0.4
        c: 0.8
        conflict_note: "Genus Veillonella is on the conflicted list; species only."
      - name: Haemophilus_parainfluenzae
        level: species
        direction: higher_in_case
        cluster: oral_origin
        w: 0.8
        q: 0.7
        s: 0.4
        c: 0.8
      - name: Fusobacterium_nucleatum
        level: species
        direction: higher_in_case
        w: 0.6
        q: 0.6
        s: 0.3
        c: 0.7
        note: "Shared with the colorectal cancer pattern; low specificity."
      - name: Faecalibacterium_prausnitzii
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 1.0
        q: 0.9
        s: 0.2
        c: 0.9
      - name: Bifidobacterium_adolescentis
        level: species
        direction: lower_in_case
        w: 0.7
        q: 0.7
        s: 0.3
        c: 0.8
      - name: Eubacterium_rectale
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.8
        q: 0.8
        s: 0.2
        c: 0.8
      - name: Roseburia_intestinalis
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.8
        q: 0.8
        s: 0.2
        c: 0.8
      - name: Coprococcus_comes
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.6
        q: 0.7
        s: 0.3
        c: 0.7
      - name: Dorea_longicatena
        level: species
        direction: lower_in_case
        w: 0.5
        q: 0.6
        s: 0.3
        c: 0.7

  hmp2_2019:
    label: "HMP2 IBDMDB longitudinal multi-omics"
    type: direction_panel
    evidence_type: TAX_REL
    claim_level: observed
    assay_transport: native
    study_group: hmp2_2019
    maturity: P3
    note: >-
      132 participants sampled over a year, 1,638 stool metagenomes. Defined
      the dysbiotic state; directions here are dysbiotic-versus-non-dysbiotic
      as well as CD-versus-non-IBD.
    sources: ["Lloyd-Price J, et al. Nature 2019;569:655-662"]
    features:
      - name: Ruminococcus_gnavus
        level: species
        direction: higher_in_case
        w: 1.0
        q: 0.9
        s: 0.3
        c: 0.9
      - name: Escherichia_coli
        level: species
        direction: higher_in_case
        w: 0.9
        q: 0.8
        s: 0.3
        c: 0.9
      - name: Ruminococcus_torques
        level: species
        direction: higher_in_case
        w: 0.6
        q: 0.7
        s: 0.4
        c: 0.7
      - name: Clostridium_bolteae
        level: species
        direction: higher_in_case
        w: 0.6
        q: 0.7
        s: 0.4
        c: 0.7
      - name: Faecalibacterium_prausnitzii
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 1.0
        q: 0.9
        s: 0.2
        c: 0.9
      - name: Roseburia_hominis
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.7
        q: 0.8
        s: 0.3
        c: 0.8
      - name: Alistipes_putredinis
        level: species
        direction: lower_in_case
        w: 0.6
        q: 0.7
        s: 0.4
        c: 0.7
        conflict_note: "Genus Alistipes is on the conflicted list; species only."
      - name: Eubacterium_siraeum
        level: species
        direction: lower_in_case
        w: 0.5
        q: 0.6
        s: 0.4
        c: 0.7

  franzosa_2019_prism:
