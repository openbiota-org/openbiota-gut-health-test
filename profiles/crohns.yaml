    type: direction_panel
    evidence_type: TAX_REL
    claim_level: observed
    assay_transport: native
    study_group: franzosa_2019
    maturity: P3
    note: >-
      155-person discovery with 65-person Dutch validation; metabolomic and
      metagenomic. Independent participants from HMP2.
    sources: ["Franzosa EA, et al. Nat Microbiol 2019;4:293-305"]
    features:
      - name: Ruminococcus_gnavus
        level: species
        direction: higher_in_case
        w: 0.9
        q: 0.8
        s: 0.3
        c: 0.9
      - name: Escherichia_coli
        level: species
        direction: higher_in_case
        w: 0.8
        q: 0.8
        s: 0.3
        c: 0.9
      - name: Clostridium_bolteae
        level: species
        direction: higher_in_case
        w: 0.6
        q: 0.7
        s: 0.4
        c: 0.7
      - name: Roseburia_intestinalis
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.7
        q: 0.8
        s: 0.2
        c: 0.8
      - name: Faecalibacterium_prausnitzii
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.9
        q: 0.9
        s: 0.2
        c: 0.9
      - name: Alistipes_putredinis
        level: species
        direction: lower_in_case
        w: 0.6
        q: 0.7
        s: 0.4
