name: ibd
version: 1.0.0
spec_version: 3
label: "Inflammatory bowel disease (composite) — gut pattern"
disease: inflammatory_bowel_disease
task: ibd_vs_non_ibd
family: ibd
body_site: stool
population: mixed_north_american_european_cohorts
status: production_candidate
evidence_maturity: P3

summary: >-
  The composite IBD pattern: what Crohn's disease and ulcerative colitis
  share. This is the profile validated against labelled cohorts in the
  profile_validation file, because the public cohorts label IBD far more
  often than they separate CD from UC. It scores the core replicated
  directions — butyrate-producer depletion, Ruminococcus gnavus and
  Escherichia coli expansion, diversity loss — and leaves the CD-specific
  oral-origin taxa and the UC-specific sulfide story to the two
  disease-specific profiles.

  When this profile is high and the shape analysis reads specific, the sample
  resembles the IBD dysbiotic state. When many profiles are high together it
  is dysbiosis of some cause, and IBD is one of many.

references:
  primary:
    source: curatedMetagenomicData
    note: "HMP2 non-IBD symptomatic controls are the right contrast."
  secondary:
    source: curatedMetagenomicData
    match_on: [country, age_band, sex]

