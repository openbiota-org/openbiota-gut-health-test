cross_engine_checks:
  - taxonomic_feature: Faecalibacterium_prausnitzii
    functional_feature: butyrate
    expect: concordant
    on_disagreement: downgrade_confidence

confounders:
  - name: Disease activity
    effect: "The dysbiotic state is intermittent; remission samples can look like controls"
    handling: "Recorded in the ledger when supplied"
  - name: Treatment
    effect: "Anti-TNF, steroids and mesalamine shift composition toward controls"
    handling: "Recorded when supplied"

abstain_if:
  - recent_antibiotics_days_lt: 90
  - usable_nonhost_pairs_lt: 500000

caveats:
  - >-
    IBD is diagnosed by endoscopy, histology and imaging. This profile does
    not diagnose or exclude it. Calprotectin is the stool test that matters
    clinically, and it is a protein, not DNA.
  - >-
    This is the general dysbiosis pattern. Antibiotics, bowel preparation,
    gastroenteritis, hospitalisation and low-fibre diets all produce it.

effect_size_note: >-
  Validated against labelled public cohorts; see profile_validation.json for
  the measured AUROC and the empirical specificity across the library.

citation: >-
  Lloyd-Price J, et al. Nature 2019;569:655-662; Franzosa EA, et al. Nat
  Microbiol 2019;4:293-305; Hall AB, et al. A novel Ruminococcus gnavus clade
  enriched in inflammatory bowel disease patients. Genome Med 2017;9:103.
