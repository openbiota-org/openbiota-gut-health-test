  functional:
    label: "TMA and metabolite gene capacity"
    type: mechanism_lane
    evidence_type: GENE_ABUND
    claim_level: genomic_capacity
    maturity: P3
    note: >-
      cutC and cntA produce trimethylamine from choline and carnitine; TMAO
      in plasma predicts major adverse cardiac events (Tang 2013) and
      promotes atherosclerosis in mice (Wang 2011, Koeth 2013). Butyrate
      loss travels with the taxonomy. Bile salt hydrolase capacity governs
      cholesterol handling through FXR.
    sources:
      - "Wang Z, et al. Nature 2011;472:57"
      - "Tang WHW, et al. N Engl J Med 2013;368:1575"
      - "Koeth RA, et al. Nat Med 2013;19:576"
    features:
      - name: cutc
        engine: diamond
        direction: increased
        w: 1.0
        q: 0.9
        s: 0.6
        c: 0.9
      - name: butyrate
        engine: diamond
        direction: decreased
        w: 0.7
        q: 0.8
        s: 0.2
        c: 0.8
      - name: bsh
        engine: diamond
        direction: decreased
        w: 0.4
        q: 0.5
        s: 0.3
        c: 0.5
        direction_conflict: low
        conflict_note: "BSH direction in ACVD is inconsistent between cohorts and depends on statin use."

  carriers:
    label: "Oral-origin and hexa-LPS carriers"
    type: mechanism_lane
    evidence_type: CARRIER_ABUNDANCE
    claim_level: carrier_proxy
    maturity: P2
