name: acvd
version: 1.0.0
spec_version: 3
label: "Atherosclerotic cardiovascular disease — gut pattern"
disease: atherosclerotic_cardiovascular_disease
task: acvd_vs_healthy
family: cardiometabolic
body_site: stool
population: chinese_cohort_derived
status: research_beta
evidence_maturity: P3
challenge_for: [cirrhosis, t2d]

summary: >-
  Jie et al. sequenced 218 patients with atherosclerotic cardiovascular
  disease and 187 controls and found Enterobacteriaceae and oral-origin
  Streptococcus enriched, with Roseburia, Faecalibacterium and Bacteroides
  depleted — the same oral-invasion plus butyrate-loss pattern as cirrhosis,
  which is why the two are mutual challenge sets. The mechanistic layer is
  better than the taxonomy: trimethylamine production from choline and
  carnitine by cutC/cntA, converted to TMAO in the liver, is a replicated
  cardiovascular risk factor with a mouse causal chain.

  Statins, aspirin and PPIs are near-universal in ACVD cohorts and each
  shifts the community.

references:
  primary:
    source: null
    note: "Controls with the same medication burden and no vascular disease do not exist in public data."
  secondary:
    source: curatedMetagenomicData
    match_on: [country, age_band, sex]

