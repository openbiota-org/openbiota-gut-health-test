        c: 0.7
      - name: butyrate
        engine: carrier
        direction: decreased
        w: 0.6
        q: 0.8
        s: 0.2
        c: 0.8

confounders:
  - name: Statins
    effect: "Statin use is associated with lower Bacteroides2 enterotype prevalence and shifts composition (Vieira-Silva 2020)"
    handling: "Recorded in the ledger when supplied"
  - name: Proton pump inhibitors
    effect: "Drive the oral-invasion pattern independently"
    handling: "Recorded when supplied"
  - name: Diet
    effect: "Red meat and egg intake supply the choline and carnitine that cutC/cntA act on"
    handling: "Recorded when supplied"

abstain_if:
  - recent_antibiotics_days_lt: 90
  - usable_nonhost_pairs_lt: 500000

caveats:
  - >-
    Atherosclerosis is assessed by imaging, lipids and risk calculators.
    This profile is not a cardiovascular risk score.
  - >-
    The oral-invasion pattern is shared with cirrhosis and with PPI use; the
    butyrate-loss pattern with everything. Only the TMA lane is specific,
    and it is a capacity measurement, not a plasma TMAO level.

effect_size_note: >-
  Jie 2017: 218 ACVD, 187 controls, Chinese. Karlsson 2012: 12 vs 13,
  Swedish.

citation: >-
  Jie Z, et al. The gut microbiome in atherosclerotic cardiovascular disease.
  Nat Commun 2017;8:845; Karlsson FH, et al. Symptomatic atherosclerosis is
  associated with an altered gut metagenome. Nat Commun 2012;3:1245; Tang WHW,
  et al. Intestinal microbial metabolism of phosphatidylcholine and
  cardiovascular risk. N Engl J Med 2013;368:1575.
