        c: 0.7
      - name: Faecalibacterium_prausnitzii
        level: species
        direction: lower_in_case
        cluster: butyrate_producers
        w: 0.7
        q: 0.7
        s: 0.2
        c: 0.8

  functional:
    label: "Uraemic toxin and metabolite capacity"
    type: mechanism_lane
    evidence_type: GENE_ABUND
    claim_level: genomic_capacity
    maturity: P2
    note: >-
      Urease is the defining CKD gut enzyme: urea to ammonia, luminal pH up.
      Tryptophanase (indole, hence indoxyl sulfate) and p-cresol formation
      are the uraemic toxin routes; the indole panel's direction is up here
      even though indole-3-propionate — a different product — is protective.
      Butyrate falls. TMAO rises as renal clearance falls and is a
      cardiovascular risk factor in CKD.
    sources:
      - "Wong J, et al. Am J Nephrol 2014;39:230"
      - "Tang WHW, et al. Circ Res 2015;116:448 (TMAO in CKD)"
    features:
      - name: urease
        engine: diamond
        direction: increased
        w: 1.0
        q: 0.7
        s: 0.5
        c: 0.8
      - name: butyrate
        engine: diamond
        direction: decreased
        w: 0.7
        q: 0.7
        s: 0.2
        c: 0.7
      - name: cutc
        engine: diamond
        direction: increased
        w: 0.5
        q: 0.6
        s: 0.4
        c: 0.6
      - name: ipa
        engine: diamond
        direction: decreased
        w: 0.4
        q: 0.5
        s: 0.3
        c: 0.5

  carriers:
    label: "Oral-origin and hexa-LPS carriers"
    type: mechanism_lane
    evidence_type: CARRIER_ABUNDANCE
    claim_level: carrier_proxy
    maturity: P2
    features:
      - name: hexa_lps
        engine: carrier
        direction: increased
        w: 0.6
        q: 0.6
        s: 0.3
        c: 0.6
      - name: oral_origin
        engine: carrier
        direction: increased
        w: 0.5
        q: 0.6
        s: 0.3
        c: 0.6
      - name: butyrate
        engine: carrier
        direction: decreased
        w: 0.6
        q: 0.7
        s: 0.2
        c: 0.7

confounders:
  - name: Renal diet
    effect: "Low-protein, low-potassium diets remove fruit, vegetables and fibre; that alone depletes butyrate producers"
    handling: "Recorded in the ledger when supplied"
  - name: Phosphate binders and iron
    effect: "Sevelamer and oral iron shift the community"
    handling: "Recorded when supplied"
  - name: Diabetes and hypertension
    effect: "The two leading causes of CKD each have their own pattern"
    handling: "t2d and hypertension are challenge sets"

abstain_if:
  - recent_antibiotics_days_lt: 90
  - usable_nonhost_pairs_lt: 500000

caveats:
  - >-
    Kidney function is measured by eGFR and urine albumin. Both are cheap
    blood and urine tests. This profile adds nothing to them.
  - >-
    The renal diet produces most of this pattern on its own.

effect_size_note: >-
  Wang 2020: 223 ESRD, 69 controls, shotgun with metabolomics. Ren 2020:
  Chinese CKD cohort with stage-tracking.

citation: >-
  Wang X, et al. Aberrant gut microbiota alters host metabolome and impacts
  renal failure in humans and rodents. Gut 2020;69:2131-2142; Ren Z, et al.
  Alterations of the human gut microbiome in chronic kidney disease. Front
  Cell Infect Microbiol 2020;10:5; Wong J, et al. Expansion of urease- and
  uricase-containing, indole- and p-cresol-forming and contraction of
  short-chain fatty acid-producing intestinal microbiota in ESRD. Am J Nephrol
  2014;39:230.
