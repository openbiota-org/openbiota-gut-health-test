name: ckd
version: 1.0.0
spec_version: 3
label: "Chronic kidney disease — gut pattern"
disease: chronic_kidney_disease
task: ckd_vs_healthy
family: cardiometabolic
body_site: stool
population: mixed_chinese_european_cohorts
status: research_beta
evidence_maturity: P2
challenge_for: [t2d, hypertension, cirrhosis]

summary: >-
  Kidney failure changes the gut chemically before it changes it
  ecologically: urea diffuses into the colon and is hydrolysed to ammonia by
  bacterial urease, raising luminal pH and selecting for urease-, uricase-
  and indole- and p-cresol-forming organisms (Wong 2014). Those uraemic
  toxins — indoxyl sulfate and p-cresyl sulfate — are made by gut bacteria
  from tryptophan and tyrosine and accumulate as filtration falls. Ren et al.
  and Wang et al. shotgun cohorts show Enterobacteriaceae and oral-origin
  taxa enriched with butyrate producers depleted, and the pattern tracks
  eGFR stage.

  Phosphate binders, potassium restriction and the low-protein renal diet
  each reshape the gut.

references:
  primary:
    source: null
    note: "Controls with the same diet restriction and medication burden do not exist in public data."
  secondary:
    source: curatedMetagenomicData
    match_on: [country, age_band, sex]

