        level: species
        direction: higher_in_case
        w: 0.8
        q: 0.7
        s: 0.3
        c: 0.8
      - name: Klebsiella_pneumoniae
        level: species
        direction: higher_in_case
        w: 0.7
        q: 0.6
        s: 0.4
        c: 0.7
      - name: Enterococcus_faecalis
        level: species
        direction: higher_in_case
        w: 0.6
        q: 0.6
        s: 0.4
        c: 0.6
      - name: Streptococcus_salivarius
        level: species
        direction: higher_in_case
        cluster: oral_origin
        w: 0.5
        q: 0.6
        s: 0.3
        c: 0.6
        conflict_note: "Genus Streptococcus is on the conflicted list; species only."
      - name: Faecalibacterium_prausnitzii
        level: species
        direction: lower_in_case
