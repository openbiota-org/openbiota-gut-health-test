  wang_2020_esrd:
    label: "Wang 2020 end-stage renal disease shotgun + metabolomics"
    type: direction_panel
    evidence_type: TAX_REL
    claim_level: observed
    assay_transport: native
    study_group: wang_2020
    maturity: P2
    note: "223 ESRD, 69 controls; uraemic toxin production traced to specific species, with faecal transfer raising toxins in mice."
    sources: ["Wang X, et al. Gut 2020;69:2131-2142"]
    features:
      - name: Eggerthella_lenta
        level: species
        direction: higher_in_case
        w: 0.7
        q: 0.7
        s: 0.5
        c: 0.7
        note: "A p-cresol and indole producer enriched in ESRD."
      - name: Flavonifractor_plautii
        level: species
        direction: higher_in_case
        w: 0.6
        q: 0.6
        s: 0.5
        c: 0.6
      - name: Alistipes_shahii
        level: species
        direction: higher_in_case
        w: 0.4
        q: 0.6
        s: 0.4
        c: 0.5
        direction_conflict: low
        conflict_note: "Higher in ESRD here; lower in most inflammatory cohorts. Genus Alistipes is on the conflicted list; species only."
      - name: Fusobacterium_nucleatum
        level: species
        direction: higher_in_case
        w: 0.4
        q: 0.6
        s: 0.3
        c: 0.5
      - name: Prevotella_copri
        level: species
        direction: lower_in_case
        w: 0.5
        q: 0.6
        s: 0.3
        c: 0.6
