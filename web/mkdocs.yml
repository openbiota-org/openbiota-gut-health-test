# The documentation pages of openbiota.com, rendered from the software
# repository's docs/*.md with mkdocs + Material.
#
#   build_site.py --serve   live preview at http://127.0.0.1:8000/docs/
#   build_site.py           strict build into openbiota.com/docs/
#
# Everything about how the pages look lives in this folder: this file, the
# theme in docs-theme/ (templates, hooks, stylesheet). The only input from
# outside is the Markdown itself, docs_dir - the software repository's docs/
# folder (with its screenshots and the validation JSON the pages link to),
# the parent folder by default (the layout inside the software repository).
# build_site.py points it at any other checkout (DOCS_SOURCE) with a derived
# config that inherits this one.
#
# The built pages are committed: openbiota.com/ is the complete site —
# the landing page at its root and the documentation at /docs/ — browsable
# from disk and deployable to any static host as one folder.
# `use_directory_urls: false` makes every page a plain .html file with
# relative links, so nothing depends on server-side index resolution or
# redirects. `strict: true` turns a broken link into a failed build.

site_name: OpenBiota Gut Health Test
site_url: https://openbiota.com/docs/
site_description: >-
  Free, open-source software that turns raw shotgun stool-metagenome reads
  into a readable, evidence-linked gut health report.
site_author: OpenBiota contributors
# The footer line lives in docs-theme/partials/copyright.html so its link
# to the landing page can be relative.

repo_url: https://github.com/openbiota-org/openbiota-gut-health-test
repo_name: GitHub
edit_uri: edit/main/docs/

docs_dir: ../docs
site_dir: openbiota.com/docs
strict: true
use_directory_urls: false

theme:
  name: material
  custom_dir: docs-theme
  # The marks are the site's own, one folder up from /docs/; the theme keeps
  # no copy. docs-theme/stylesheets/openbiota.css reaches the fonts the same way.
  logo: ../img/openbiota-mark.svg
  favicon: ../img/openbiota-mark.svg
  # Fonts come from the stylesheet (the same Google Fonts request as the main
  # site, including the 550 weight Material would not load).
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - toc.follow

# No search: the docs are short and the main site has none.
plugins: []

# Lower-case URLs for the upper-case source names; external links open in a
# new tab. Both are hooks in the theme folder.
hooks:
  - docs-theme/hooks/lowercase_urls.py
  - docs-theme/hooks/external_links.py

# Copied from docs-theme/ into the built site with the theme's other static files.
extra_css:
  - stylesheets/openbiota.css

extra:
  generator: false
  # The footer's Code link (docs-theme/partials/social.html) uses repo_url.
  social: [{icon: fontawesome/brands/github, link: https://github.com/openbiota-org/openbiota-gut-health-test}]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Docs home: index.md
  - Quickstart: QUICKSTART.md
  - Installation: INSTALL.md
  - Usage: USAGE.md
  - Reading the report: OUTPUT.md
  - Method: METHOD.md
  - Metabolite pathways: PANELS.md
  - Disease patterns: PROFILES.md
  - FMT donor matching: FMT.md
  - Organism detection: EXPANDED_DETECTION.md
  - Measured capability: MEASURED_CAPABILITY.md
  - Validation: VALIDATION.md
  - Testing: TESTING.md
  - Attribution: ATTRIBUTION.md
