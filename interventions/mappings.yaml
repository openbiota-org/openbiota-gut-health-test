  # Chronic urticaria (chronic hives) — CSU and symptomatic dermographism
  # ============================================================================
  - action_mapping_id: MAP_PROFILE_CSU_PROBIOTIC_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: csu, direction: high, min_level: somewhat_high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_CU_LREUTERI_ATCC55730_4W_ADJUNCT_V1
    evidence_assertion_refs: [IE_CU_PROBIOTIC_CAN_2024_V1, IE_CU_PROBIOTIC_BI_2021_V1, IE_CU_PROBIOTIC_DABAGHZADEH_2023_V1, IE_CU_PROBIOTIC_ATEFI_2022_V1, IE_CU_PROBIOTIC_NETTIS_2016_V1, IE_CU_SCFA_LG1_PRECLINICAL_E_V1]
    against_evidence_assertion_refs: [IE_CU_PROBIOTIC_GODSE_2025_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1, PROBIOTIC_IMMUNOCOMPROMISE_V1, PREGNANCY_BREASTFEEDING_SUPPLEMENT_V1]
    confirmation_rule_refs: [chronic_spontaneous_urticaria]
    title: Chronic hives — what probiotic studies have actually tested
    context_note: >
      Resemblance to the published chronic-hives stool pattern is a research observation, and no
      study has shown that a microbiome result should pick a product. Six adjunct studies exist
      in people with a clinical diagnosis of chronic urticaria (chronic hives) and they disagree:
      the most favourable was not randomized, the largest was in children, the largest adult
      placebo-controlled trial was null on hive control, and the earliest was mostly
      non-response. Each result belongs to its exact product only.
    never_say: ["probiotics cure hives", "this probiotic treats urticaria", "eradicate the bacteria causing your hives", "microbiome-selected probiotic"]
    follow_up_route: "Guideline urticaria (hives) care with a clinician — second-generation H1 antihistamine first line, specialist escalation if hives persist (CLINICAL_ROUTE_URTICARIA_GUIDELINE_CARE_V1)."

  - action_mapping_id: MAP_PROFILE_CSU_DIET_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: csu, direction: high, min_level: somewhat_high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_CU_LOW_HISTAMINE_3W_V1
    evidence_assertion_refs: [IE_CU_DIET_WAGNER_2017_V1, IE_CU_DIET_SON_2018_V1]
    against_evidence_assertion_refs: [IE_CU_FIBER_FERMENTED_X_V1]
    safety_rule_refs: [RESTRICTIVE_DIET_EATING_DISORDER_V1, FIBER_ESCALATION_STRUCTURAL_GI_V1]
    confirmation_rule_refs: [chronic_urticaria]
    title: Chronic hives — the dietary evidence, and what it does not show
    context_note: >
      Both dietary studies in chronic hives are uncontrolled. A time-limited, dietitian-supported
      low-histamine trial improved symptom scores in about two-thirds of people who also had gut
      symptoms, without changing the enzyme the diet is usually justified by — so it is a
      diagnostic trial with a defined end, not a permanent restriction, and not a correction of
      anything in the microbiome. Nothing here tells you to add fibre or fermented foods because
      the panel shows depleted fibre fermenters; in someone reacting to foods, fermented foods
      are specifically not an automatic suggestion.
    never_say: ["histamine intolerance", "your gut bacteria are making the histamine", "avoid these foods permanently", "low-histamine diet corrects the microbiome"]
    follow_up_route: "Dietitian and clinician review before any elimination diet, with a planned reintroduction step (CLINICAL_ROUTE_URTICARIA_GUIDELINE_CARE_V1)."

  - action_mapping_id: MAP_PROFILE_CSU_CLINICAL_ROUTE_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: csu, direction: high, min_level: somewhat_high}
    render: guideline_route_after_confirmation
    intervention_protocol_ref: PROTOCOL_ROUTE_URTICARIA_CARE_V1
    evidence_assertion_refs: [IE_CU_GUIDELINE_2026_V1, IE_CU_VITD_MONY_2020_V1, IE_CU_HPYLORI_PAWLOWICZ_2018_V1]
    against_evidence_assertion_refs: [IE_CU_HPYLORI_VALSECCHI_1998_X_V1, IE_CU_ANTIMICROBIAL_STACK_X_V1]
    safety_rule_refs: [PRESCRIPTION_REQUIRES_CONFIRMED_INDICATION_V1, BOTANICAL_ALLERGY_AND_QUALITY_V1]
    confirmation_rule_refs: [chronic_urticaria]
    title: Chronic hives — the actual clinical route
    context_note: >
      Hives are diagnosed and treated clinically. The current international guideline starts with
      a second-generation H1 antihistamine and escalates through specialist assessment when hives
      persist; choice of any further agent is a prescriber decision under local labelling. Two
      lab-confirmed side routes have randomized or placebo-controlled evidence — vitamin D
      repletion where a blood test shows deficiency, and H. pylori eradication where a clinical
      test is positive, paired here with an older study that found no clear benefit. Neither can
      be triggered from stool DNA: this report measures no vitamin and does not detect a gastric
      organism.
    never_say: ["stop your antihistamine", "your hives are caused by your gut bacteria", "take vitamin D", "you have H. pylori", "antimicrobial protocol for hives"]
    follow_up_route: "Clinician assessment for hives, with serum 25-hydroxyvitamin D or H. pylori testing only if clinically indicated (CLINICAL_ROUTE_URTICARIA_GUIDELINE_CARE_V1)."

  - action_mapping_id: MAP_PROFILE_CSU_FMT_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: csu, direction: high, min_level: notably_high}
    render: clinician_review
    intervention_protocol_ref: PROTOCOL_FMT_CU_CASE_WU_V1
    evidence_assertion_refs: []
    against_evidence_assertion_refs: [IE_CU_FMT_WU_2023_V1, IE_CU_FMT_ALLERGIC_REACTION_2026_X_V1]
    safety_rule_refs: [FMT_CLINICIAN_ONLY_V1, FMT_SEVERE_IMMUNOCOMPROMISE_V1]
    confirmation_rule_refs: [chronic_urticaria]
    title: Chronic hives and faecal microbiota transplantation — one case report, no trial
    context_note: >
      One genuine human case report describes transplantation in chronic hives with recurrent
      abdominal pain and food allergy; its dose, donor, delivery route and durability were not
      verifiable and are left empty rather than guessed. No controlled human trial in hives was
      located. Transplantation is therefore not established for this condition and is not the
      only option for it — guideline antihistamine care is the route with actual evidence. Two
      children developed allergic reactions after transplantation for an unrelated indication,
      which is relevant context for anyone with an allergic condition. Single-strain and
      short-chain fatty acid treatments for hives have only been given to mice.
    never_say: ["FMT is the only solution", "FMT treats hives", "a transplant will reset your immune system", "eligible donor"]
    fmt_status: investigational_non_cdi
    follow_up_route: "Investigational only, under a clinical trial with regulatory and ethics oversight; discuss with a clinician (CLINICAL_ROUTE_URTICARIA_GUIDELINE_CARE_V1)."

