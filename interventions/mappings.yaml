# Action mappings (spec v04 §7.6–7.7). A mapping binds a typed trigger
# selector (profile / panel / group / species / condition) to one studied
# protocol, its supporting evidence, its against-evidence and its safety rules.
# Several mappings may fire for one finding; all are rendered, none is ranked
# by a benefit score. Selectors on `research_profile_resemblance`,
# `functional_capacity_finding` and `ecological_finding` use the seven-band
# levels; `min_level` is the weakest level that fires.
#
# Directions: high | low | present | any. Level rank: notably_low -3 … notably_high +3.
action_mappings:

  # =====================================================================
  # DISEASE-PATTERN PROFILES (research resemblance) — one block per profile
  # =====================================================================

  # ---------------------------------------------------------------- longcovid
  - action_mapping_id: MAP_PROFILE_LONGCOVID_SIM01_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: longcovid, direction: high, min_level: somewhat_high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_SIM01_PACS_6M_V1
    evidence_assertion_refs: [IE_SIM01_PACS_RCT_V1, IE_STOP_FATIGUE_LONGCOVID_V1]
    against_evidence_assertion_refs: [IE_LONGCOVID_2026_MECHANISTIC_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1, PROBIOTIC_IMMUNOCOMPROMISE_V1, PREGNANCY_BREASTFEEDING_SUPPLEMENT_V1]
    confirmation_rule_refs: [post_acute_covid19_syndrome]
    title: Long COVID — what human trials have tested
    context_note: >
      Resemblance to a published Long-COVID stool signature is a research observation. The only
      randomized evidence with a clinical endpoint is for one exact synbiotic (SIM01) in people
      with a clinical Long-COVID diagnosis; it does not transfer to other probiotics.
    never_say: ["treats Long COVID", "clears the virus", "antimicrobials for Long COVID"]
    fmt_status: investigational_non_cdi

  # ---------------------------------------------------------------- alopecia areata
  - action_mapping_id: MAP_PROFILE_AA_PROBIOTIC_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: alopecia_areata, direction: high, min_level: somewhat_high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_AA_BTHS_24W_ADJUNCT_V1
    evidence_assertion_refs: [IE_AA_BTHS_PILOT_RCT_V1]
    against_evidence_assertion_refs: [IE_AA_FMT_CASES_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1, PROBIOTIC_IMMUNOCOMPROMISE_V1]
    confirmation_rule_refs: [alopecia_areata]
    title: Alopecia areata — the state of microbiome-directed evidence
    context_note: >
      One small adjunct probiotic pilot was null on hair outcomes, and the FMT literature is two
      incidental case reports. Alopecia areata is diagnosed and managed by dermatology.
    never_say: ["probiotics regrow hair", "FMT for alopecia"]
    follow_up_route: "Dermatology/scalp examination if hair loss is present (CLINICAL_ROUTE_DERMATOLOGY_SCALP_V1)."
    fmt_status: investigational_non_cdi

  # ---------------------------------------------------------------- androgenetic alopecia
  - action_mapping_id: MAP_PROFILE_AGA_PROBIOTIC_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: androgenetic_alopecia, direction: high, min_level: somewhat_high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_AGA_DCN_16W_V1
    evidence_assertion_refs: [IE_AGA_DCN_RCT_V1]
    against_evidence_assertion_refs: []
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1, PROBIOTIC_IMMUNOCOMPROMISE_V1]
    confirmation_rule_refs: [androgenetic_alopecia]
    title: Androgenetic alopecia — one exact-product trial
    context_note: >
      A single industry trial of three exact Lactiplantibacillus strains reported mixed hair-cycle
      endpoints in diagnosed androgenetic alopecia. Other probiotics are not covered by it.
    never_say: ["probiotic cures hair loss"]
    follow_up_route: "Dermatology evaluation for pattern hair loss (CLINICAL_ROUTE_DERMATOLOGY_SCALP_V1)."

  # ---------------------------------------------------------------- Alzheimer / cognition
  - action_mapping_id: MAP_PROFILE_AD_LIFESTYLE_FINGER_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: ad_*, direction: high, min_level: somewhat_high}
    render: inform_only
    intervention_protocol_ref: PROTOCOL_FINGER_2Y_V1
    evidence_assertion_refs: [IE_FINGER_RCT_V1]
    against_evidence_assertion_refs: [IE_MIND_NULL_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: []
    title: Cognition — what has replicated evidence independent of the microbiome
    context_note: >
      Resemblance to an Alzheimer-cohort stool pattern does not indicate cognitive impairment. The
      multidomain FINGER lifestyle programme has randomized evidence for cognition in at-risk older
      adults; the MIND diet did not beat a control diet.
    never_say: ["you have Alzheimer's", "prevents dementia"]
    follow_up_route: "Neurologic/cognitive evaluation only if memory or thinking symptoms are present (CLINICAL_ROUTE_NEURO_COGNITIVE_EVALUATION_V1)."
  - action_mapping_id: MAP_PROFILE_AD_PROBIOTIC_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: ad_*, direction: high, min_level: high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_AD_MILK_12W_AKBARI_V1
    evidence_assertion_refs: [IE_AD_PROBIOTIC_MILK_AKBARI_V1]
    against_evidence_assertion_refs: [IE_AD_PROBIOTIC_SEVERE_NULL_X_V1, IE_AD_PROBIOTIC_META_X_V1, IE_MCI_PROBIOTIC_REVIEW_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1, PROBIOTIC_IMMUNOCOMPROMISE_V1]
    confirmation_rule_refs: [alzheimer_disease]
    title: Alzheimer disease — probiotic trials, positive and null
    context_note: >
      One 60-person trial reported MMSE gains; a later trial in severe disease was null and pooled
      analyses are not robust. FMT in Alzheimer disease is animal and case-level only.
    never_say: ["reverses dementia"]
    fmt_status: investigational_non_cdi

  # ---------------------------------------------------------------- IBS family
  - action_mapping_id: MAP_PROFILE_IBS_DIET_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: ibs*, direction: high, min_level: somewhat_high}
    render: guideline_route_after_confirmation
    intervention_protocol_ref: PROTOCOL_LOW_FODMAP_3PHASE_V1
    evidence_assertion_refs: [IE_AGA_DIET_IBS_A_V1, IE_ACG_IBS_GUIDELINE_A_V1, IE_LOW_FODMAP_HISTAMINE_MCINTOSH_V1]
    against_evidence_assertion_refs: [IE_ACG_IBS_PROBIOTICS_AGAINST_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1, RESTRICTIVE_DIET_EATING_DISORDER_V1, FIBER_ESCALATION_STRUCTURAL_GI_V1]
    confirmation_rule_refs: [ibs]
    title: IBS — guideline-backed diet and what is advised against
    context_note: >
      IBS is a symptom-based clinical diagnosis. For people with that diagnosis, ACG 2021 and the
      AGA diet update support soluble fibre, peppermint oil and a limited dietitian-guided
      low-FODMAP trial; ACG suggests against probiotics for global symptoms.
    never_say: ["you have IBS", "cure IBS"]
    follow_up_route: "Symptom-based diagnosis with red-flag review (CLINICAL_ROUTE_IBS_DIAGNOSIS_ACG_V1)."
    fmt_status: guideline_against_outside_trials
  - action_mapping_id: MAP_PROFILE_IBS_MIMBB75_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: ibs*, direction: high, min_level: high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_MIMBB75_IBS_8W_V1
    evidence_assertion_refs: [IE_MIMBB75_IBS_RCT_V1, IE_BINFANTIS_35624_IBS_RCT_V1]
    against_evidence_assertion_refs: [IE_AGA_PROBIOTICS_GUIDELINE_X_V1, IE_ACG_IBS_PROBIOTICS_AGAINST_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1, PROBIOTIC_IMMUNOCOMPROMISE_V1]
    confirmation_rule_refs: [ibs]
    title: IBS — the two probiotic trials that met their endpoints, and the guideline position
    context_note: >
      Heat-inactivated B. bifidum MIMBb75 (443 people) and B. infantis 35624 at one specific dose
      are the exact products with positive randomized IBS trials; guidelines still place probiotics
      in the trial-only or advised-against category for global symptoms.
    never_say: ["any probiotic", "Bifidobacterium supplement fixes IBS"]
  - action_mapping_id: MAP_PROFILE_IBSD_RIFAXIMIN_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: ibs_d, direction: high, min_level: high}
    render: clinician_review
    intervention_protocol_ref: PROTOCOL_RIFAXIMIN_IBSD_V1
    evidence_assertion_refs: [IE_RIFAXIMIN_IBSD_GUIDELINE_A_V1]
    against_evidence_assertion_refs: []
    safety_rule_refs: [PRESCRIPTION_REQUIRES_CONFIRMED_INDICATION_V1, MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: [ibs_d]
    title: IBS-D — prescription route for a clinician to review
    context_note: >
      Rifaximin is guideline-listed for global IBS-D symptoms after clinical diagnosis. It is a
      prescription decision made by a clinician, never a response to organisms in stool.
    never_say: ["take rifaximin for your bacteria"]

  # ---------------------------------------------------------------- IBD family
  - action_mapping_id: MAP_PROFILE_IBD_ROUTE_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: "{ibd,crohns,uc}", direction: high, min_level: somewhat_high}
    render: guideline_route_after_confirmation
    intervention_protocol_ref: PROTOCOL_ROUTE_GI_CALPROTECTIN_V1
    evidence_assertion_refs: [IE_AGA_FMT_2024_A_V1]
    against_evidence_assertion_refs: [IE_AGA_FMT_2024_IBD_IBS_AGAINST_X_V1, IE_AGA_PROBIOTICS_GUIDELINE_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: []
    title: Inflammatory bowel disease — confirmation route and what guidelines say about FMT and probiotics
    context_note: >
      Resemblance to an IBD-cohort pattern is not a diagnosis. Persistent diarrhoea, blood in
      stool, weight loss or pain warrant gastroenterology evaluation with fecal calprotectin. AGA
      2024 recommends against conventional FMT for Crohn's disease and ulcerative colitis outside
      trials, and AGA 2020 places probiotics in IBD in the trial-only category.
    never_say: ["you have Crohn's", "you have colitis", "FMT for IBD"]
    follow_up_route: "Gastroenterology evaluation with fecal calprotectin if symptomatic (CLINICAL_ROUTE_GASTROENTEROLOGY_CALPROTECTIN_V1)."
    fmt_status: guideline_against_outside_trials
  - action_mapping_id: MAP_PROFILE_UC_FMT_TRIAL_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: "{ibd,uc}", direction: high, min_level: high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_FMT_UC_PARAMSOTHY_8W_V1
    evidence_assertion_refs: [IE_UC_FMT_PARAMSOTHY_RCT_V1]
    against_evidence_assertion_refs: [IE_AGA_FMT_2024_IBD_IBS_AGAINST_X_V1, IE_FDA_FMT_SAFETY_ALERTS_X_V1]
    safety_rule_refs: [FMT_CLINICIAN_ONLY_V1, FMT_SEVERE_IMMUNOCOMPROMISE_V1, MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: [ulcerative_colitis]
    title: Ulcerative colitis — the FMT trial evidence and its regulatory status
    context_note: >
      Intensive multidonor FMT produced remission in 27% versus 8% in one trial of active
      ulcerative colitis; guidelines still limit FMT for UC to clinical trials.
    never_say: ["FMT cures colitis"]
    fmt_status: investigational_non_cdi
  - action_mapping_id: MAP_PROFILE_CROHNS_CDED_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: "{ibd,crohns}", direction: high, min_level: high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_CDED_PEN_12W_V1
    evidence_assertion_refs: [IE_CDED_PEN_RCT_V1]
    against_evidence_assertion_refs: []
    safety_rule_refs: [RESTRICTIVE_DIET_EATING_DISORDER_V1, MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: [crohns_disease]
    title: Crohn's disease — dietary therapy with randomized evidence (clinician-confirmed disease)
    context_note: >
      The Crohn's Disease Exclusion Diet with partial enteral nutrition induced sustained remission
      in children with confirmed mild-to-moderate Crohn's disease. It is delivered by an IBD team,
      not started from a stool pattern.
    never_say: ["diet cures Crohn's"]

  # ---------------------------------------------------------------- CRC / adenoma
  - action_mapping_id: MAP_PROFILE_CRC_SCREENING_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: "{crc,adenoma}", direction: high, min_level: somewhat_high}
    render: guideline_route_after_confirmation
    intervention_protocol_ref: PROTOCOL_ROUTE_GENERIC_V1
    evidence_assertion_refs: [IE_USPSTF_CRC_SCREENING_A_V1, IE_WCRF_CRC_PREVENTION_V1]
    against_evidence_assertion_refs: [IE_ADENOMA_PROBIOTIC_META_X_V1, IE_FNUCLEATUM_PERIODONTAL_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: []
    title: Colorectal cancer / adenoma pattern — the screening route is the action
    context_note: >
      A stool pattern resembling colorectal-cancer or adenoma cohorts does not detect cancer.
      Guideline screening (FIT or colonoscopy, ages 45–75) is the established route, and whole
      grains, fibre, physical activity and limiting red/processed meat and alcohol carry
      population-level prevention evidence.
    never_say: ["you have cancer", "probiotics prevent colon cancer", "kill Fusobacterium"]
    follow_up_route: "Age-appropriate colorectal cancer screening per USPSTF; earlier if symptoms or family history (CLINICAL_ROUTE_CRC_SCREENING_USPSTF_V1)."
  - action_mapping_id: MAP_PROFILE_ADENOMA_CBM588_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: adenoma, direction: high, min_level: high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_CBM588_ADENOMA_V1
    evidence_assertion_refs: [IE_CBM588_ADENOMA_RCT_V1]
    against_evidence_assertion_refs: [IE_ADENOMA_PROBIOTIC_META_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1, PROBIOTIC_IMMUNOCOMPROMISE_V1]
    confirmation_rule_refs: [colorectal_adenoma]
    title: Adenoma — one exact-product probiotic trial after polypectomy
    context_note: >
      Early, conflicting evidence for the exact Clostridium butyricum MIYAIRI 588 product after
      polypectomy; pooled adenoma probiotic trials are inconclusive and surveillance intervals do
      not change.
    never_say: ["prevents polyps"]

  # ---------------------------------------------------------------- metabolic
  - action_mapping_id: MAP_PROFILE_T2D_HIGH_FIBER_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: t2d, direction: high, min_level: somewhat_high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_HIGH_FIBER_T2D_12W_V1
    evidence_assertion_refs: [IE_HIGH_FIBER_T2D_ZHAO_RCT_V1]
    against_evidence_assertion_refs: [IE_AKK_WST01_ZHANG2025_X_V1]
    safety_rule_refs: [FIBER_ESCALATION_STRUCTURAL_GI_V1, MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: [type_2_diabetes]
    title: Type 2 diabetes pattern — confirmation first, then dietary trial evidence
    context_note: >
      Resemblance to a type-2-diabetes cohort is not a glucose measurement. HbA1c and fasting
      glucose confirm or exclude diabetes. In diagnosed diabetes, a 12-week high-fibre diet
      improved HbA1c in one trial; a live Akkermansia product did not improve HbA1c or weight.
    never_say: ["you have diabetes", "Akkermansia treats diabetes"]
    follow_up_route: "HbA1c, fasting glucose, lipids, blood pressure and waist (CLINICAL_ROUTE_METABOLIC_CONFIRMATION_V1)."
    fmt_status: investigational_non_cdi
  - action_mapping_id: MAP_PROFILE_T2D_FMT_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: "{t2d,obesity}", direction: high, min_level: high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_FMT_LEAN_DONOR_VRIEZE_V1
    evidence_assertion_refs: [IE_FMT_LEAN_DONOR_VRIEZE_V1]
    against_evidence_assertion_refs: [IE_FMT_LEAN_DONOR_KOOTTE_X_V1, IE_FMT_ADOLESCENT_OBESITY_LEONG_X_V1, IE_FDA_FMT_SAFETY_ALERTS_X_V1]
    safety_rule_refs: [FMT_CLINICIAN_ONLY_V1, FMT_SEVERE_IMMUNOCOMPROMISE_V1, MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: [metabolic_syndrome]
    title: Metabolic syndrome / obesity — what FMT trials actually showed
    context_note: >
      Lean-donor FMT transiently improved insulin sensitivity in one small trial; the follow-up
      trial found the effect only in a subset and lost by 18 weeks, and encapsulated FMT did not
      change BMI in adolescents. FMT for metabolic disease is investigational.
    never_say: ["FMT for weight loss"]
    fmt_status: investigational_non_cdi
  - action_mapping_id: MAP_PROFILE_OBESITY_AKK_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: "{obesity,t2d}", direction: high, min_level: somewhat_high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_AKK_MUCT_PASTEURISED_3M_V1
    evidence_assertion_refs: [IE_AKK_MUCT_DEPOMMIER_PILOT_V1, IE_AKK_MOUNT_WEIGHT_REGAIN_V1, IE_AKK_2026_OBESITY_RCT_V1]
    against_evidence_assertion_refs: [IE_AKK_WST01_ZHANG2025_X_V1, IE_AKK_SUENAERT2026_NULL_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1, PROBIOTIC_IMMUNOCOMPROMISE_V1, PREGNANCY_BREASTFEEDING_SUPPLEMENT_V1]
    confirmation_rule_refs: [insulin_resistance]
    title: Pasteurised Akkermansia — positive pilot, null primaries, an exact product
    context_note: >
      The Akkermansia evidence is for one pasteurised strain at one dose; positive pilot results
      and null primary endpoints exist side by side, and stool Akkermansia abundance does not
      predict response.
    never_say: ["boost your Akkermansia", "over-the-counter Akkermansia"]
  - action_mapping_id: MAP_PROFILE_OBESITY_ROUTE_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: obesity, direction: high, min_level: somewhat_high}
    render: guideline_route_after_confirmation
    intervention_protocol_ref: PROTOCOL_ROUTE_METABOLIC_V1
    evidence_assertion_refs: [IE_PREDIMED_RCT_V1, IE_WASTYK_HETEROGENEITY_V1]
    against_evidence_assertion_refs: [IE_IPE_IPREVENT_NULL_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1, RESTRICTIVE_DIET_EATING_DISORDER_V1]
    confirmation_rule_refs: []
    title: Obesity pattern — dietary-pattern evidence and what did not work
    context_note: >
      Body weight is measured, not inferred from stool. A Mediterranean dietary pattern reduced
      cardiovascular events in PREDIMED; the fibre-supplement ingredient inulin-propionate ester
      did not reduce weight gain over twelve months.
    never_say: ["microbiome weight-loss plan"]
    follow_up_route: "Weight, waist, blood pressure, lipids and HbA1c with a clinician (CLINICAL_ROUTE_METABOLIC_CONFIRMATION_V1)."
  - action_mapping_id: MAP_PROFILE_MASLD_ROUTE_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: masld, direction: high, min_level: somewhat_high}
    render: guideline_route_after_confirmation
    intervention_protocol_ref: PROTOCOL_ROUTE_MASLD_V1
    evidence_assertion_refs: [IE_EASL_MASLD_2024_A_V1, IE_PREDIMED_RCT_V1]
    against_evidence_assertion_refs: [IE_FMT_MASLD_CRAVEN_X_V1]
    safety_rule_refs: [MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: []
    title: Fatty liver (MASLD) pattern — staging route and dietary evidence
    context_note: >
      Fatty liver is assessed with metabolic risk and non-invasive fibrosis tests, not stool.
      Weight reduction and a Mediterranean pattern are guideline lifestyle care; FMT did not
      improve insulin resistance or hepatic fat in the one randomized trial.
    never_say: ["you have fatty liver", "liver detox"]
    follow_up_route: "Metabolic risk assessment with FIB-4 or elastography per EASL/AASLD (CLINICAL_ROUTE_MASLD_EASL_V1)."
    fmt_status: investigational_non_cdi
  - action_mapping_id: MAP_PROFILE_T1D_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: t1d, direction: high, min_level: somewhat_high}
    render: evidence_only
    intervention_protocol_ref: PROTOCOL_FMT_T1D_DEGROOT_V1
    evidence_assertion_refs: [IE_FMT_T1D_DEGROOT_V1]
    against_evidence_assertion_refs: [IE_FDA_FMT_SAFETY_ALERTS_X_V1]
    safety_rule_refs: [FMT_CLINICIAN_ONLY_V1, FMT_SEVERE_IMMUNOCOMPROMISE_V1, MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: [type_1_diabetes]
    title: Type 1 diabetes pattern — research only
    context_note: >
      Type 1 diabetes is an autoimmune diagnosis made by blood tests. The single FMT trial in
      recent-onset disease is hypothesis-generating; no microbiome-directed treatment exists.
    never_say: ["prevents type 1 diabetes"]
    fmt_status: investigational_non_cdi
  - action_mapping_id: MAP_PROFILE_CELIAC_ROUTE_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: celiac, direction: high, min_level: somewhat_high}
    render: guideline_route_after_confirmation
    intervention_protocol_ref: PROTOCOL_ROUTE_CELIAC_V1
    evidence_assertion_refs: [IE_ACG_CELIAC_2023_A_V1]
    against_evidence_assertion_refs: []
    safety_rule_refs: [GLUTEN_AVOIDANCE_BEFORE_DIAGNOSIS_V1, MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: []
    title: Celiac pattern — test before changing gluten
    context_note: >
      A gluten-free diet follows a proper celiac diagnosis. Removing gluten before serology and
      biopsy can make the tests falsely negative, so this pattern is a reason to test, not to
      change diet.
    never_say: ["go gluten-free now", "you have celiac"]
    follow_up_route: "tTG-IgA with total IgA while still eating gluten; biopsy per ACG 2023 (CLINICAL_ROUTE_CELIAC_SEROLOGY_BIOPSY_V1)."

  # ---------------------------------------------------------------- liver / renal / CV
  - action_mapping_id: MAP_PROFILE_CIRRHOSIS_HE_V1
    trigger_selector: {trigger_type: research_profile_resemblance, target: cirrhosis, direction: high, min_level: somewhat_high}
    render: clinician_review
    intervention_protocol_ref: PROTOCOL_RIFAXIMIN_HE_6M_BASS_V1
    evidence_assertion_refs: [IE_EASL_HE_2022_A_V1, IE_RIFAXIMIN_HE_BASS_RCT_V1, IE_HE_PROBIOTIC_DHIMAN_RCT_V1, IE_HE_PROBIOTIC_META_V1, IE_FMT_HE_BAJAJ_PILOT_V1]
    against_evidence_assertion_refs: [IE_FDA_FMT_SAFETY_ALERTS_X_V1]
    safety_rule_refs: [PRESCRIPTION_REQUIRES_CONFIRMED_INDICATION_V1, FMT_CLINICIAN_ONLY_V1, MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: [hepatic_encephalopathy]
    title: Cirrhosis / hepatic encephalopathy — guideline care for a clinician to review
    context_note: >
      Cirrhosis is diagnosed by imaging, blood tests and history. In confirmed hepatic
      encephalopathy, lactulose and add-on rifaximin are guideline care; probiotic and FMT
      evidence is adjunct or investigational.
    never_say: ["you have cirrhosis", "treat your ammonia bacteria"]
    follow_up_route: "Hepatology evaluation; HE management per EASL 2022 / AASLD (CLINICAL_ROUTE_HE_GUIDELINE_V1)."
    fmt_status: investigational_non_cdi
