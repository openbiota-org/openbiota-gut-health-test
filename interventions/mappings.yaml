    evidence_assertion_refs: [IE_BERBERINE_ETEC_1987_D_V1, IE_BOTANICAL_INVITRO_E_V1]
    against_evidence_assertion_refs: [IE_HERBAL_SIBO_CHEDID_X_V1, IE_BRIEF_SIBO_PROTOCOL_X_V1, IE_MULTI_INGREDIENT_NO_HUMAN_X_V1]
    safety_rule_refs: [BOTANICAL_ANTICOAGULANT_ANTIPLATELET_V1, BOTANICAL_GLUCOSE_LOWERING_V1, BOTANICAL_LIVER_KIDNEY_V1, BOTANICAL_ALLERGY_AND_QUALITY_V1, PREGNANCY_BREASTFEEDING_SUPPLEMENT_V1, MINOR_LIVE_MICROBE_AND_SUPPLEMENT_V1]
    confirmation_rule_refs: []
    title: Natural antimicrobials (berberine, oregano oil, allicin, black-seed oil, GI Microb-X) — the evidence on record
    context_note: >
      People often take botanical antimicrobials to 'clear' E. coli or Klebsiella. What exists:
      one 1987 trial of a single berberine dose for acute enterotoxigenic E. coli diarrhoea (stool
      volume, not decolonisation); in-vitro and animal work for carvacrol, allicin and Nigella
      sativa; and a retrospective breath-test chart review comparing herbal pairs with rifaximin.
      No human trial shows any of them reduce stool E. coli or Klebsiella or improve an outcome.
      Interactions with anticoagulants, glucose-lowering drugs, pregnancy, and liver/kidney
      disease are documented.
    never_say: ["eradicate", "natural antibiotic protocol", "kill Klebsiella"]
    follow_up_route: "Culture and susceptibility only when infection is clinically suspected (CLINICAL_ROUTE_CLINICAL_CULTURE_AMR_V1)."
