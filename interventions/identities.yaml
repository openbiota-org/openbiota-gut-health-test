# Exact intervention identities and studied protocols (spec v04 §7.2–7.3).
# A protocol is a SOURCE FACT: what a study administered. It is never a
# personalised instruction. Prescription and FMT doses are stripped from
# participant output by the renderer; every other dose is suppressed unless a
# participant_claim_release_ref exists on the mapping (§7.8).
interventions:
  # ------------------------------------------------------------- probiotics
  - intervention_id: PROBIOTIC_SIM01_V1
    version: 1.0.0
    class: probiotic
    display_name: SIM01 synbiotic (Bifidobacterium adolescentis, B. bifidum, B. longum with galacto-, xylo- oligosaccharides and resistant dextrin; Hong Kong)
    identity:
      evidence_transfer_key: exact_product
      components:
        - {entity_type: probiotic_strain, taxon: Bifidobacterium adolescentis, strain_designation: "proprietary (not disclosed at strain level in the trial report)"}
        - {entity_type: probiotic_strain, taxon: Bifidobacterium bifidum, strain_designation: "proprietary"}
        - {entity_type: probiotic_strain, taxon: Bifidobacterium longum, strain_designation: "proprietary"}
        - {entity_type: prebiotic, molecule: "galacto-oligosaccharides, xylo-oligosaccharides, resistant dextrin"}
      formulation: {delivery: sachet, coating: unknown}
      product_version: "SIM01 as used in the RECOVERY trial (Lancet Infect Dis 2024)"
    transfer_policy: {exact_protocol: permitted, same_strain_different_dose: sensitivity_only, same_species_other_strain: prohibited, genus_only: prohibited}
    exact_protocol_reproducibility: incomplete

