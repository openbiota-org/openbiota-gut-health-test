    study: {design: "uncontrolled open-label adjunct study, no comparator arm", participants_randomized: 0, analysis_population: "52 enrolled, 38 evaluated, 14 withdrawals", risk_of_bias: high, funding_and_conflicts: "see source"}
    pico: {comparator: none, outcome: {name: "clinician-assessed improvement in hives at 8 weeks", class: patient_clinical, timepoint_days: 56}, effect: {direction: "null", estimate: "of 38 evaluated: 27 no improvement, 9 mild improvement, 1 significant, 1 complete; 11 of the 14 who withdrew also reported no improvement"}}
    lane: D
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: chronic spontaneous urticaria (chronic hives), microbiome_profile_alone_sufficient: false}
