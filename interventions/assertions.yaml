  # ============================================================= chronic urticaria (hives)
  # Chronic urticaria is chronic hives. These records answer "what has been
  # studied in people with hives", never "what this person should take". No
  # pooled response rate may be computed across them: the populations
  # (adults, children, refractory, treated), the products, the endpoints and
  # the designs all differ, and several disagree with their own abstracts.
  - evidence_assertion_id: IE_CU_PROBIOTIC_NETTIS_2016_V1
    protocol_ref: PROTOCOL_CU_BIFIDERM_8W_ADJUNCT_V1
