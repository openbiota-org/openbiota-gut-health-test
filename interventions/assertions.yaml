# PICO evidence assertions (spec v04 §7.3–7.4). Every record names its source
# (PMID/DOI/URL), design, population, comparator, outcome class, effect
# direction and lane. Lane X records are against-evidence and are never
# discarded because a supportive record exists. `proposition` says which of
# the three independent propositions the record speaks to.
assertions:
  # ------------------------------------------------------------ Long COVID
  - evidence_assertion_id: IE_SIM01_PACS_RCT_V1
    protocol_ref: PROTOCOL_SIM01_PACS_6M_V1
    source: {source_type: randomized_trial, pmid: 38071990, citation: "Lau RI et al. Lancet Infect Dis 2024;24:256 (RECOVERY, SIM01)", publication_status: peer_reviewed}
    study: {design: "triple-blind placebo-controlled RCT, single centre (Hong Kong)", participants_randomized: 463, risk_of_bias: some_concerns, funding_and_conflicts: "investigators hold patents/commercial interest in SIM01"}
    pico: {comparator: placebo, outcome: {name: "alleviation of individual PACS symptoms at 6 months", class: patient_reported, timepoint_days: 180}, effect: {direction: benefit, estimate: "higher alleviation rates for fatigue, memory loss, concentration difficulty, GI upset and general unwellness; adverse events similar"}}
    lane: C
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: post-acute COVID-19 syndrome, microbiome_profile_alone_sufficient: false}
    summary: "In 463 adults with clinically defined post-acute COVID-19 syndrome, six months of the exact SIM01 synbiotic improved several patient-reported symptoms versus placebo; immunocompromised, pregnant and breastfeeding people were excluded and the product's exact composition is proprietary."
  - evidence_assertion_id: IE_STOP_FATIGUE_LONGCOVID_V1
    protocol_ref: PROTOCOL_STOP_FATIGUE_V1
    source: {source_type: randomized_trial, pmid: 39592468, citation: "STOP-FATIGUE trial (2024)", publication_status: peer_reviewed}
    study: {design: "small randomized trial", risk_of_bias: some_concerns, funding_and_conflicts: "see source"}
    pico: {comparator: placebo, outcome: {name: "fatigue score", class: patient_reported}, effect: {direction: benefit, estimate: "smaller trial; formulation-specific"}}
    lane: C
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: Long COVID fatigue, microbiome_profile_alone_sufficient: false}
    summary: "A smaller randomized trial (STOP-FATIGUE) of a different multistrain product reported reduced Long-COVID fatigue; it does not transfer to other products and the classifier does not predict response."
  - evidence_assertion_id: IE_LONGCOVID_2026_MECHANISTIC_X_V1
    intervention_ref: null
    source: {source_type: observational_study, doi: 10.1007/s12602-026-11197-2, citation: "Zhang et al. Probiotics Antimicrob Proteins 2026 (11 two-year Long-COVID participants, mouse transfer)", publication_status: peer_reviewed}
    study: {design: "11 cases vs 11 controls with fecal transfer to antibiotic-treated mice", risk_of_bias: high, funding_and_conflicts: "no public data or accession"}
    pico: {comparator: unexposed controls, outcome: {name: "taxonomic/metabolomic directions and mouse phenotypes", class: mechanistic}, effect: {direction: not_estimable}}
    lane: X
    against_kind: conflicting
    proposition: evidence_signal_associated_with_state
    target_binding: {trigger_type: research_profile_resemblance, required_condition: null, microbiome_profile_alone_sufficient: false}
    summary: "The 2026 two-year Long-COVID study is an 11-person mechanistic cohort with mouse transfer and no public data; its taxonomic directions are a candidate module, not evidence for any antimicrobial, probiotic or FMT treatment."

  # ------------------------------------------------------------ alopecia
  - evidence_assertion_id: IE_AA_BTHS_PILOT_RCT_V1
    protocol_ref: PROTOCOL_AA_BTHS_24W_ADJUNCT_V1
    source: {source_type: randomized_trial, url: "https://www.mdpi.com/2079-9284/11/4/119", citation: "Cosmetics 2024;11:119 — L. rhamnosus Bths-08 + B. longum Bths-06 adjunct pilot in alopecia areata", publication_status: peer_reviewed}
    study: {design: "randomized double-blind placebo-controlled adjunct pilot", participants_randomized: 26, analysis_population: "19 completers", risk_of_bias: high, funding_and_conflicts: "industry"}
    pico: {comparator: placebo (both arms intralesional triamcinolone), outcome: {name: "plaque area / SALT and other hair outcomes", class: patient_clinical, timepoint_days: 168}, effect: {direction: "null", estimate: "primary and other between-group hair outcomes not statistically significant; no gut microbiome change"}}
    lane: C
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: alopecia areata, microbiome_profile_alone_sufficient: false}
    summary: "A 26-person adjunct pilot of an exact two-strain probiotic with intralesional steroid found no statistically significant between-group hair outcomes and no gut microbiome change — hypothesis-generating, null on the primary endpoint."
  - evidence_assertion_id: IE_AA_FMT_CASES_X_V1
    protocol_ref: PROTOCOL_FMT_AA_CASE_V1
    source: {source_type: case_report, pmid: 28932754, citation: "Rebello D et al. ACG Case Rep J 2017 (two alopecia universalis regrowth cases after FMT for CDI)", publication_status: peer_reviewed}
    study: {design: "two incidental case reports", risk_of_bias: high}
    pico: {comparator: none, outcome: {name: "hair regrowth", class: patient_clinical}, effect: {direction: not_estimable}}
    lane: X
    against_kind: conflicting
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: alopecia areata, microbiome_profile_alone_sufficient: false}
    summary: "Two incidental hair-regrowth cases after FMT given for C. difficile infection are hypothesis-generating only; FMT for alopecia remains investigational under IND and is not a treatment route from this report."
  - evidence_assertion_id: IE_AGA_DCN_RCT_V1
    protocol_ref: PROTOCOL_AGA_DCN_16W_V1
    source: {source_type: randomized_trial, pmid: 39275216, citation: "2024 RCT — L. plantarum DCn_07 + DCn_06 + L. pentosus DCn1_05 in androgenetic alopecia", publication_status: peer_reviewed}
    study: {design: "randomized double-blind placebo-controlled", participants_randomized: 136, analysis_population: "115 completers", risk_of_bias: some_concerns, funding_and_conflicts: "industry/product-specific"}
    pico: {comparator: placebo, outcome: {name: "hair-cycle endpoints (trichogram, density)", class: patient_clinical, timepoint_days: 112}, effect: {direction: mixed, estimate: "some endpoints significant, several nonsignificant"}}
    lane: C
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: androgenetic alopecia, microbiome_profile_alone_sufficient: false}
    summary: "One 16-week industry trial of an exact three-strain Lactiplantibacillus product in androgenetic alopecia reported mixed hair-cycle endpoints — several significant, several not. It does not transfer to any other probiotic and needs sex/age matching."

  # ------------------------------------------------------------ Alzheimer / cognition
  - evidence_assertion_id: IE_AD_PROBIOTIC_MILK_AKBARI_V1
    protocol_ref: PROTOCOL_AD_MILK_12W_AKBARI_V1
    source: {source_type: randomized_trial, pmid: 27891089, citation: "Akbari E et al. Front Aging Neurosci 2016;8:256", publication_status: peer_reviewed}
    study: {design: "randomized double-blind controlled", participants_randomized: 60, risk_of_bias: some_concerns}
    pico: {comparator: plain milk, outcome: {name: "MMSE and metabolic markers", class: patient_clinical, timepoint_days: 84}, effect: {direction: benefit, estimate: "MMSE improved versus control"}}
    lane: C
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: Alzheimer disease, microbiome_profile_alone_sufficient: false}
    summary: "One 60-person 12-week trial of a four-organism probiotic milk reported MMSE and metabolic-marker changes in people with Alzheimer disease."
  - evidence_assertion_id: IE_AD_PROBIOTIC_SEVERE_NULL_X_V1
    source: {source_type: randomized_trial, url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6104449/", citation: "Agahi A et al. Front Neurol 2018 (severe AD, negative)", publication_status: peer_reviewed}
    study: {design: "randomized double-blind placebo-controlled", risk_of_bias: some_concerns}
    pico: {comparator: placebo, outcome: {name: "cognitive test scores", class: patient_clinical}, effect: {direction: "null"}}
    lane: X
    against_kind: null_primary
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: Alzheimer disease, microbiome_profile_alone_sufficient: false}
    summary: "A later trial in severe Alzheimer disease found no cognitive benefit from probiotics."
  - evidence_assertion_id: IE_AD_PROBIOTIC_META_X_V1
    source: {source_type: meta_analysis, pmid: 34957177, citation: "meta-analysis of probiotics in Alzheimer disease/MCI (2021)", publication_status: peer_reviewed}
    study: {design: "systematic review / meta-analysis", risk_of_bias: not_assessed}
    pico: {comparator: placebo, outcome: {name: "cognition", class: patient_clinical}, effect: {direction: mixed, estimate: "pooled evidence not robust"}}
    lane: X
    against_kind: conflicting
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: Alzheimer disease, microbiome_profile_alone_sufficient: false}
    summary: "Conservative pooled analyses find the probiotic evidence in Alzheimer disease inconsistent and not robust."
  - evidence_assertion_id: IE_AD_FMT_REVIEW_E_V1
    source: {source_type: systematic_review, pmid: 36381829, citation: "review of FMT in Alzheimer disease (2022): animal experiments and human case literature", publication_status: peer_reviewed}
    study: {design: "narrative/systematic review", risk_of_bias: not_assessed}
    pico: {comparator: none, outcome: {name: "cognition (animal and case-level)", class: mechanistic}, effect: {direction: not_estimable}}
    lane: E
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: Alzheimer disease, microbiome_profile_alone_sufficient: false}
    summary: "FMT in Alzheimer disease rests on animal experiments and human case reports; it is investigational and not a treatment route."
  - evidence_assertion_id: IE_FINGER_RCT_V1
    protocol_ref: PROTOCOL_FINGER_2Y_V1
    source: {source_type: randomized_trial, pmid: 25771249, citation: "Ngandu T et al. Lancet 2015;385:2255 (FINGER)", publication_status: peer_reviewed}
    study: {design: "randomized controlled, 2 years", participants_randomized: 1260, risk_of_bias: low}
    pico: {comparator: general health advice, outcome: {name: "neuropsychological test battery composite", class: patient_clinical, timepoint_days: 730}, effect: {direction: benefit, estimate: "small but significant improvement in cognition"}}
    lane: B
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: research_profile_resemblance, required_condition: null, microbiome_profile_alone_sufficient: false}
    summary: "The FINGER trial showed that a two-year multidomain lifestyle programme (diet, exercise, cognitive training, vascular risk control) improved or maintained cognition in at-risk older adults — evidence independent of the microbiome."
  - evidence_assertion_id: IE_MIND_NULL_X_V1
    protocol_ref: PROTOCOL_MIND_3Y_V1
    source: {source_type: randomized_trial, pmid: 37466280, citation: "Barnes LL et al. N Engl J Med 2023;389:602 (MIND diet)", publication_status: peer_reviewed}
    study: {design: "randomized controlled, 3 years", participants_randomized: 604, risk_of_bias: low}
    pico: {comparator: usual diet with mild caloric restriction, outcome: {name: "global cognition", class: patient_clinical, timepoint_days: 1095}, effect: {direction: "null", estimate: "no significant difference between groups"}}
    lane: X
    against_kind: null_primary
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: research_profile_resemblance, required_condition: null, microbiome_profile_alone_sufficient: false}
    summary: "The MIND-diet trial did not improve cognition more than a control diet with the same mild caloric restriction over three years."
  - evidence_assertion_id: IE_MCI_PROBIOTIC_REVIEW_X_V1
    source: {source_type: systematic_review, url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11863739/", citation: "2024 evidence review — probiotics in mild cognitive impairment", publication_status: peer_reviewed}
    study: {design: "review", risk_of_bias: not_assessed}
    pico: {comparator: placebo, outcome: {name: "cognition", class: patient_clinical}, effect: {direction: mixed}}
    lane: X
    against_kind: conflicting
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: mild cognitive impairment, microbiome_profile_alone_sufficient: false}
    summary: "Probiotic trials in mild cognitive impairment are small and inconsistent."

  # ------------------------------------------------------------ IBS
  - evidence_assertion_id: IE_MIMBB75_IBS_RCT_V1
    protocol_ref: PROTOCOL_MIMBB75_IBS_8W_V1
    source: {source_type: randomized_trial, pmid: 32277872, citation: "Andresen V et al. Lancet Gastroenterol Hepatol 2020;5:658", publication_status: peer_reviewed}
    study: {design: "randomized double-blind placebo-controlled", participants_randomized: 443, risk_of_bias: low, funding_and_conflicts: "industry-funded"}
    pico: {comparator: placebo, outcome: {name: "composite responder (≥30% abdominal pain reduction + adequate relief ≥4/8 weeks)", class: patient_reported, timepoint_days: 56}, effect: {direction: benefit, estimate: "34% vs 19% responders"}}
    lane: C
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: IBS, microbiome_profile_alone_sufficient: false}
    summary: "In 443 adults with diagnosed IBS, eight weeks of heat-inactivated B. bifidum MIMBb75 produced a composite response in 34% versus 19% on placebo. The product is non-viable and exact; it is not interchangeable with live B. bifidum and is not selected by stool abundance."
  - evidence_assertion_id: IE_BINFANTIS_35624_IBS_RCT_V1
    protocol_ref: PROTOCOL_BINFANTIS_35624_IBS_4W_V1
    source: {source_type: randomized_trial, pmid: 16863564, citation: "Whorwell PJ et al. Am J Gastroenterol 2006;101:1581", publication_status: peer_reviewed}
    study: {design: "randomized double-blind placebo-controlled, three dose arms", participants_randomized: 362, risk_of_bias: some_concerns, funding_and_conflicts: "industry"}
    pico: {comparator: placebo, outcome: {name: "abdominal pain/discomfort and composite symptom score", class: patient_reported, timepoint_days: 28}, effect: {direction: benefit, estimate: "significant only at 10^8 CFU/day; not at 10^6 or 10^10"}}
    lane: C
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: IBS, microbiome_profile_alone_sufficient: false}
    summary: "In 362 women with IBS, B. infantis 35624 improved symptoms only at 10^8 CFU/day — not at a lower or a higher dose — illustrating that probiotic effects are strain- and dose-specific and do not generalise."
  - evidence_assertion_id: IE_AGA_PROBIOTICS_GUIDELINE_X_V1
    source: {source_type: guideline, pmid: 32531291, citation: "Su GL et al. AGA Clinical Practice Guideline on probiotics. Gastroenterology 2020;159:697", publication_status: issued_guidance}
    study: {design: "guideline", risk_of_bias: not_assessed}
    pico: {comparator: none, outcome: {name: "guideline position", class: patient_clinical}, effect: {direction: not_estimable}}
    lane: X
    against_kind: guideline_against
    guideline_position: trial_only
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: null, microbiome_profile_alone_sufficient: false}
    summary: "AGA 2020 recommends probiotics for Crohn's disease, ulcerative colitis and IBS only in the context of a clinical trial, and finds the evidence formulation- and indication-specific."
  - evidence_assertion_id: IE_ACG_IBS_GUIDELINE_A_V1
    source: {source_type: guideline, pmid: 33315591, citation: "Lacy BE et al. ACG Clinical Guideline: Management of IBS. Am J Gastroenterol 2021;116:17", publication_status: issued_guidance}
    study: {design: "guideline", risk_of_bias: not_assessed}
    pico: {comparator: none, outcome: {name: "global IBS symptoms", class: patient_reported}, effect: {direction: benefit, estimate: "soluble fibre, peppermint oil and a limited low-FODMAP trial are suggested; probiotics are suggested against for global symptoms"}}
    lane: A
    guideline_position: conditional_for
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: IBS, microbiome_profile_alone_sufficient: false}
    summary: "ACG 2021 suggests soluble fibre, peppermint oil and a limited dietitian-guided low-FODMAP trial for diagnosed IBS, suggests against probiotics for global symptoms, and lists rifaximin for global IBS-D symptoms after clinical diagnosis."
  - evidence_assertion_id: IE_ACG_IBS_PROBIOTICS_AGAINST_X_V1
    source: {source_type: guideline, pmid: 33315591, citation: "Lacy BE et al. ACG 2021 — suggests against probiotics for global IBS symptoms", publication_status: issued_guidance}
    study: {design: "guideline", risk_of_bias: not_assessed}
    pico: {comparator: none, outcome: {name: "global IBS symptoms", class: patient_reported}, effect: {direction: not_estimable}}
    lane: X
    against_kind: guideline_against
    guideline_position: conditional_against
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: IBS, microbiome_profile_alone_sufficient: false}
    summary: "ACG 2021 suggests against probiotics for global IBS symptoms (very low quality of evidence)."
  - evidence_assertion_id: IE_AGA_DIET_IBS_A_V1
    protocol_ref: PROTOCOL_LOW_FODMAP_3PHASE_V1
    source: {source_type: guideline, pmid: 35337654, citation: "Chey WD et al. AGA Clinical Practice Update on the role of diet in IBS. Gastroenterology 2022;162:1737", publication_status: issued_guidance}
    study: {design: "clinical practice update", risk_of_bias: not_assessed}
    pico: {comparator: none, outcome: {name: "IBS symptoms", class: patient_reported}, effect: {direction: benefit, estimate: "limited low-FODMAP with restriction, reintroduction and personalisation under dietitian guidance"}}
    lane: A
    guideline_position: conditional_for
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: IBS, microbiome_profile_alone_sufficient: false}
    summary: "The AGA diet update endorses a limited, dietitian-guided low-FODMAP diet (restrict, reintroduce, personalise) for diagnosed IBS and warns against indefinite restriction, eating-disorder risk and malnutrition."
  - evidence_assertion_id: IE_LOW_FODMAP_HISTAMINE_MCINTOSH_V1
    protocol_ref: PROTOCOL_LOW_FODMAP_3W_MCINTOSH_V1
    source: {source_type: randomized_trial, pmid: 26976734, citation: "McIntosh K et al. Gut 2017;66:1241", publication_status: peer_reviewed}
    study: {design: "randomized controlled", participants_randomized: 40, analysis_population: "37", risk_of_bias: some_concerns}
    pico: {comparator: high-FODMAP diet, outcome: {name: "IBS-SSS and urinary histamine", class: patient_reported, timepoint_days: 21}, effect: {direction: benefit, estimate: "symptom improvement; urinary histamine reduced eightfold"}}
    lane: C
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: IBS, microbiome_profile_alone_sufficient: false}
    summary: "A three-week randomized low-FODMAP diet in diagnosed IBS improved symptoms and lowered urinary histamine — a diet effect in IBS, not a treatment for stool histamine genes."
  - evidence_assertion_id: IE_HISTAMINE_IBS_DEPALMA_E_V1
    source: {source_type: observational_study, pmid: 35895832, citation: "De Palma G et al. Sci Transl Med 2022;14:eabj1895", publication_status: peer_reviewed}
    study: {design: "human subgroup + gnotobiotic mouse experiments", risk_of_bias: not_assessed}
    pico: {comparator: none, outcome: {name: "histamine-producing K. aerogenes and visceral hypersensitivity", class: mechanistic}, effect: {direction: not_estimable}}
    lane: E
    proposition: evidence_signal_associated_with_state
    target_binding: {trigger_type: functional_capacity_finding, required_condition: null, microbiome_profile_alone_sufficient: false}
    summary: "A high-urinary-histamine IBS subgroup and a K. aerogenes hdc variant were identified, with the causal treatment work done in mice."
  - evidence_assertion_id: IE_RIFAXIMIN_IBSD_GUIDELINE_A_V1
    protocol_ref: PROTOCOL_RIFAXIMIN_IBSD_V1
    source: {source_type: guideline, pmid: 33315591, citation: "ACG 2021 — rifaximin for global IBS-D symptoms", publication_status: issued_guidance}
    study: {design: "guideline", risk_of_bias: not_assessed}
    pico: {comparator: placebo, outcome: {name: "global IBS-D symptoms", class: patient_reported, timepoint_days: 14}, effect: {direction: benefit}}
    lane: A
    guideline_position: strong_for
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: IBS-D, microbiome_profile_alone_sufficient: false}
    summary: "ACG 2021 recommends rifaximin for global IBS-D symptoms in clinically diagnosed patients. It is not a treatment for organisms seen in shotgun data and is not triggered by any stool finding."

  # ------------------------------------------------------------ IBD
  - evidence_assertion_id: IE_AGA_FMT_2024_A_V1
    protocol_ref: PROTOCOL_FMT_RCDI_AGA_V1
    source: {source_type: guideline, pmid: 38395525, citation: "Peery AF et al. AGA Clinical Practice Guideline on fecal microbiota-based therapies. Gastroenterology 2024;166:409", publication_status: issued_guidance}
    study: {design: "guideline (conditional, low certainty)", risk_of_bias: not_assessed}
    pico: {comparator: none, outcome: {name: "prevention of recurrent CDI", class: patient_clinical}, effect: {direction: benefit, estimate: "conditional recommendation for selected adults after standard antibiotics"}}
    lane: A
    guideline_position: conditional_for
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: recurrent C. difficile infection, microbiome_profile_alone_sufficient: false}
    summary: "AGA 2024 conditionally supports fecal microbiota-based therapy to prevent recurrent C. difficile infection after standard antibiotics in selected immunocompetent or mildly/moderately immunocompromised adults, and recommends against it in severely immunocompromised adults."
  - evidence_assertion_id: IE_AGA_FMT_2024_IBD_IBS_AGAINST_X_V1
    source: {source_type: guideline, pmid: 38395525, citation: "AGA 2024 — against conventional FMT for Crohn's disease, ulcerative colitis, IBS and pouchitis outside trials", publication_status: issued_guidance}
    study: {design: "guideline", risk_of_bias: not_assessed}
    pico: {comparator: none, outcome: {name: "disease remission", class: patient_clinical}, effect: {direction: not_estimable}}
    lane: X
    against_kind: guideline_against
    guideline_position: conditional_against
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: null, microbiome_profile_alone_sufficient: false}
    summary: "AGA 2024 recommends against conventional FMT for Crohn's disease, ulcerative colitis, IBS and pouchitis except within a clinical trial."
  - evidence_assertion_id: IE_UC_FMT_PARAMSOTHY_RCT_V1
    protocol_ref: PROTOCOL_FMT_UC_PARAMSOTHY_8W_V1
    source: {source_type: randomized_trial, pmid: 28214091, citation: "Paramsothy S et al. Lancet 2017;389:1218", publication_status: peer_reviewed}
    study: {design: "randomized double-blind placebo-controlled", participants_randomized: 85, analysis_population: "81", risk_of_bias: low}
    pico: {comparator: placebo enemas, outcome: {name: "steroid-free clinical remission with endoscopic remission or response at week 8", class: patient_clinical, timepoint_days: 56}, effect: {direction: benefit, estimate: "27% vs 8%"}}
    lane: C
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: ulcerative colitis, microbiome_profile_alone_sufficient: false}
    summary: "Intensive multidonor FMT achieved steroid-free clinical and endoscopic remission/response in 27% versus 8% with placebo in active ulcerative colitis — a positive trial signal that current guidelines still place in the trial-only category."
  - evidence_assertion_id: IE_CDED_PEN_RCT_V1
    protocol_ref: PROTOCOL_CDED_PEN_12W_V1
    source: {source_type: randomized_trial, pmid: 31170412, citation: "Levine A et al. Gastroenterology 2019;157:440", publication_status: peer_reviewed}
    study: {design: "randomized controlled, paediatric", participants_randomized: 78, risk_of_bias: some_concerns}
    pico: {comparator: exclusive enteral nutrition, outcome: {name: "tolerance and corticosteroid-free remission at week 6/12", class: patient_clinical, timepoint_days: 84}, effect: {direction: benefit, estimate: "better tolerated; sustained remission more common at week 12"}}
    lane: C
    proposition: evidence_intervention_changes_clinical_outcome
    target_binding: {trigger_type: clinician_confirmed_condition, required_condition: Crohn's disease, microbiome_profile_alone_sufficient: false}
    summary: "In children with mild-to-moderate Crohn's disease, CDED + partial enteral nutrition was better tolerated than exclusive enteral nutrition and induced sustained remission in more patients at 12 weeks. This is guideline-care context for clinician-confirmed disease, not an action from a stool pattern."

  # ------------------------------------------------------------ CRC / adenoma / PDAC
  - evidence_assertion_id: IE_USPSTF_CRC_SCREENING_A_V1
    protocol_ref: PROTOCOL_ROUTE_GENERIC_V1
    source: {source_type: guideline, url: "https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/colorectal-cancer-screening", citation: "USPSTF 2021 colorectal cancer screening recommendation", publication_status: issued_guidance}
    study: {design: "guideline", risk_of_bias: not_assessed}
    pico: {comparator: no screening, outcome: {name: "CRC mortality", class: patient_clinical}, effect: {direction: benefit}}
    lane: A
    guideline_position: strong_for
