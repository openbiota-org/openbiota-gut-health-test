name: nitrogen
description: >-
  Protein and amino-acid handling: peptide uptake, amino-acid fermentation
  including Stickland pairs, branched-chain fatty acid formation, and the
  non-urease routes to ammonia. Urease keeps its own reading.
metabolite: Protein and nitrogen metabolism
pathway: >-
  protein -> peptides (peptidases, transport) -> amino acids ->
  fermentation to branched-chain fatty acids, ammonia and aromatic
  precursors
category: metabolite

extension: true

