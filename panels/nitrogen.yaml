aggregate: sum
aggregate_from: [PEPT, ILVE, GDHA]
aggregate_reason: >-
  Peptide cleavage, branched-chain transamination and glutamate
  dehydrogenase: one marker each from the three arms of protein handling.
  The near-universal housekeeping peptidases are deliberately excluded,
  because a total containing them would track biomass.

min_fragments_for_stability: 20
min_alignment_aa: 25

citation: >-
  Diether N.E., Willing B.P., "Microbial fermentation of dietary protein:
  an important factor in diet-microbe-host interaction", Microorganisms
  7:19 (2019), doi:10.3390/microorganisms7010019.

interpretation:
  what_it_is: >-
    How much of your community is set up to ferment protein rather than
    carbohydrate.
  made_from: >-
    Dietary and host protein reaching the colon
  summary: >-
    Protein fermentation produces branched-chain fatty acids, ammonia and
    phenolic compounds, which is a different chemistry from fibre
    fermentation and generally a less favourable one.
  evidence_detail: >-
    Generic peptidase abundance is not a measurement of dietary protein
    digestion: every organism carries peptidases for its own protein
    turnover, so a raw count tracks how many organisms are present. The
    informative markers are the ones specific to fermenting amino acids
    for energy - Stickland reductases, branched-chain dehydrogenases - and
    those are what this counts. Protein breakdown, branched-chain amino
    acid synthesis and branched-chain amino acid fermentation are three
    different things, and this report keeps three separate readings for
    them.
  higher_means: context-dependent
  evidence_strength: limited
  implications:
    higher: >-
      More protein-fermentation capacity than most samples. This
      chemistry yields branched-chain fatty acids, ammonia and phenols
      rather than butyrate, and it rises when fermentable fibre runs
      short.
    typical: >-
      Mid-range protein-fermentation capacity, which is the usual
      finding. This chemistry rises when fermentable fibre runs short,
      so it is worth reading beside the carbohydrate breadth reading
      rather than on its own.
    lower: >-
      Less protein-fermentation capacity than most samples carry.
      Protein fermentation yields branched-chain fatty acids, ammonia
      and phenols rather than butyrate, so less of it is generally the
      more favourable direction.
  citation: >-
    Diether N.E., Willing B.P., "Microbial fermentation of dietary
    protein: an important factor in diet-microbe-host interaction",
    Microorganisms 7:19 (2019), doi:10.3390/microorganisms7010019.
