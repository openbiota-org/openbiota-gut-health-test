name: carbohydrates
description: >-
  The enzymes your gut bacteria use to open dietary carbohydrates. Each
  substrate is reported as its own reading in the functions section, with
  how specific the evidence is, because an enzyme family that acts on a
  whole class of molecules is not evidence about one member of it.
metabolite: Dietary fibre and carbohydrate breakdown
pathway: >-
  dietary polysaccharide -> backbone-cleaving enzyme + side-chain and
  linkage-specific enzymes -> oligosaccharides -> uptake and fermentation
category: substrate

extension: true

