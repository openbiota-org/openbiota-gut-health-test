aggregate: sum
aggregate_from: [AMYA, BGAL, XYNA, PGAL]
aggregate_reason: >-
  One backbone enzyme from each of four unrelated substrate classes -
  starch, galactoside, xylan and pectin. The sum is a breadth measure and
  is deliberately not a total of all the enzymes: the per-substrate
  readings in the functions section are where specificity is judged.

min_fragments_for_stability: 20
min_alignment_aa: 25
expected_copies_per_genome: 2

citation: >-
  Drula E. et al., "The carbohydrate-active enzyme database: functions and
  literature", Nucleic Acids Res 50:D571-D577 (2022),
  doi:10.1093/nar/gkab1045; Zheng J. et al., "dbCAN3", Nucleic Acids Res
  51:W115-W121 (2023), doi:10.1093/nar/gkad328.

interpretation:
  what_it_is: >-
    The breadth of dietary carbohydrates your gut bacteria carry enzymes
    for, across starch, pectin, xylan and galactoside chemistry.
  made_from: >-
    Dietary fibre, resistant starch and other carbohydrates reaching the
    colon
  summary: >-
    Fourteen individual fibre and starch readings are built from these
    enzymes in the functions section. This panel is their shared evidence
    and a breadth summary; the specificity judgement happens per
    substrate.
  evidence_detail: >-
    A carbohydrate-active enzyme family usually acts on a class of
    molecules rather than on one, so a family alone answers a broader
    question than the one a reader asks. GH13 supports general amylolysis
    but not resistant starch in particular; a beta-galactosidase is
    carried by every lactose-using organism and does not establish
    galactooligosaccharide use. The per-substrate readings therefore state
    whether the evidence is substrate-specific or only class-level, and a
    gene shared between two substrates appears on both cards and is
    counted once in any total. What none of this measures is how much
    fibre you eat: it is the capacity to use what arrives.
  higher_means: favourable
  evidence_strength: limited
  implications:
    higher: >-
      Your community carries enzymes for a wider range of dietary
      carbohydrates than most samples. Breadth of this kind travels with
      dietary variety, and it means fewer fibres pass through unused.
    typical: >-
      Mid-range breadth of carbohydrate-active enzymes, which is the
      usual finding in an adult gut. The individual substrate readings
      in this section are more informative than the total, because they
      say which fibres in particular your community can open.
    lower: >-
      Fewer carbohydrate-active enzyme families than most samples carry.
      That can follow a narrow diet, and it is capacity rather than
      intake: adding a fibre nothing here can open would not help.
  citation: >-
    Drula E. et al., "The carbohydrate-active enzyme database: functions
    and literature", Nucleic Acids Res 50:D571-D577 (2022),
    doi:10.1093/nar/gkab1045; Zheng J. et al., "dbCAN3", Nucleic Acids Res
    51:W115-W121 (2023), doi:10.1093/nar/gkad328.
