    evidence:
      - claim_id: brett_kombucha
        label: in_vitro
        direction: context
        endpoint: antioxidant and antimicrobial properties described for kombucha yeasts
        host: none (food science)
        site: fermented drink
        design: reviews of kombucha SCOBY
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: A property of the drink, not of stool DNA (review refs 231, 232).
    must_not_infer: Residence.

