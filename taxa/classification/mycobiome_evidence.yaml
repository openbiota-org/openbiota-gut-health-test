    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: Osmotolerant yeasts of honey, syrups, soy sauce and miso; in stool, a sweet or fermented-food signal.
    evidence: []
    must_not_infer: Residence.

  - name: Wickerhamomyces anomalus
    taxid: 4927
    synonyms: ["Pichia anomala"]
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: A yeast of grain, sourdough and fruit with biocontrol use in food storage; dietary passage.
    evidence: []
    must_not_infer: Residence.

  - name: Yarrowia lipolytica
    taxid: 4952
    synonyms: []
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: A lipid-metabolising yeast of cheese, cured meat and industrial fermentation; an occasional opportunist in the immunocompromised.
    evidence: []
    must_not_infer: Infection or residence.

  - name: Saccharomycopsis fibuligera
    taxid: 4944
    synonyms: []
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: The amylolytic yeast of rice wine and fermented starch foods (ragi, nuruk). Dietary passage.
    evidence: []
    must_not_infer: Residence.

  - name: Monascus
    rank: genus
    taxid: 5098
    synonyms: []
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: >
      The red yeast rice mould. Red yeast rice products contain monacolin K
      (chemically lovastatin); the mould's DNA in stool is a supplement or food
      signal, and some strains make the nephrotoxin citrinin - which DNA does not measure.
    evidence: []
    must_not_infer: Citrinin exposure, or a statin effect, from DNA.

  - name: Rhizopus
    rank: genus
    taxid: 4842
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: The tempeh mould (R. oligosporus/microsporus) and a common food-spoilage mould; also an agent of mucormycosis in the severely immunocompromised.
    evidence:
      - claim_id: rhizopus_tempeh
        label: in_vitro
        direction: favorable
        endpoint: probiotic properties described for the tempeh mould R. oligosporus
        host: none (food science)
        site: fermented food
        design: reviews of tempeh fermentation
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: A property of the food, not of stool DNA (review ref 233).
    must_not_infer: Infection from DNA alone.

  - name: Mucor
    rank: genus
    taxid: 4830
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: >
      Fast-growing moulds of soil, soft cheese rinds (M. lanceolatus) and fermented
      soy foods (M. circinelloides in sufu). Stool DNA is usually food or air. A
      cause of mucormycosis only in the severely immunocompromised or in diabetic
      ketoacidosis.
    evidence:
      - claim_id: mucor_mash_ratio
        label: human_association
        direction: concerning
        endpoint: Mucor/Saccharomyces ratio raised in MASH with advanced fibrosis
        host: human
        site: stool
        design: cohort summarised in a 2024 review
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: A ratio in liver-disease patients; food and air are the usual source of Mucor DNA (review ref 164).
    must_not_infer: Infection from DNA alone.

  - name: Rhizomucor
    rank: genus
    taxid: 4839
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: Thermophilic moulds of compost and rennet production (R. miehei makes microbial rennet for cheese); dietary or environmental passage.
    evidence: []
    must_not_infer: Infection from DNA alone.

  - name: Schizothecium
    rank: genus
    taxid: 5180
    synonyms: ["Podospora"]
    category: environmental_or_food
    origin_default: unknown
    role: Dung- and soil-dwelling fungi of the Sordariales, common on herbivore manure and in agricultural soil; in human stool a plausible environmental or dietary (plant surface) passenger with no health evidence.
    evidence: []
    must_not_infer: Residence or any health effect.

  - name: Cryptococcus neoformans
    taxid: 5207
    synonyms: []
    category: pathogen_alert_route
    origin_default: unknown
    role: An environmental yeast that causes meningitis in the immunocompromised. Routed to the pathogen alert policy.
    evidence: []
    must_not_infer: Infection from DNA alone.

  - name: Candida
    rank: genus
    taxid: 5475
    synonyms: []
    category: commensal_opportunist
    origin_default: unknown
    role: >
      A large, polyphyletic genus of yeasts. A finding placed only at genus level
      means the reads could not be told between species - the evidence for any
      one Candida species does not transfer to it.
    evidence: []
    must_not_infer: Any species-specific evidence; infection.

  - name: Candida dubliniensis
    taxid: 42374
    synonyms: []
    category: commensal_opportunist
    origin_default: unknown
    role: A close relative of C. albicans, mostly oral; a less virulent opportunist in the immunocompromised.
    evidence:
      - claim_id: cd_ald_severity
        label: human_association
        direction: concerning
        endpoint: rises with alcohol-associated liver disease severity
        host: human
        site: stool
        design: cross-sectional cohort summarised in a 2024 review
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: Association in drinkers; not a finding about healthy carriers (review ref 199).
    must_not_infer: Infection; the C. albicans isolate evidence.

  - name: Malassezia
    rank: genus
    taxid: 55193
    synonyms: []
    category: commensal_opportunist
    origin_default: compatible_with_oral_or_skin_source
    role: Lipid-dependent skin yeasts; in stool at low levels in most people, usually from skin. Species-level evidence exists for M. restricta and M. globosa only.
    evidence: []
    must_not_infer: Skin or gut disease from stool DNA.

  - name: Debaryomyces
    rank: genus
    taxid: 4958
    synonyms: []
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: Salt-tolerant yeasts of cheese and cured meat. Species-level evidence exists for D. hansenii only.
    evidence: []
    must_not_infer: The D. hansenii wound-repair evidence, for another species.

  - name: Trichosporon
    rank: genus
    taxid: 5552
    synonyms: []
    category: opportunist
    origin_default: compatible_with_oral_or_skin_source
    role: Skin and environmental yeasts; T. asahii causes disseminated infection in neutropenic patients. In stool of a healthy person, a skin or environmental passenger.
    evidence: []
    must_not_infer: Infection from DNA alone.

  - name: Cladosporium
    rank: genus
    taxid: 5498
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: The most common airborne mould; on food surfaces and in every home. Stool DNA is passage. Species-level evidence exists for C. sphaerospermum only.
    evidence: []
    must_not_infer: Anything from a genus-level hit.

  - name: Alternaria
    rank: genus
    taxid: 5598
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: Plant and air moulds common on fruit, vegetables and grain; a major outdoor allergen. Stool DNA is dietary or airborne passage.
    evidence: []
    must_not_infer: Mycotoxin exposure or infection.

  - name: Trichoderma
    rank: genus
    taxid: 5543
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: Soil moulds used as agricultural biocontrol and enzyme sources (cellulases in food processing); dietary or environmental passage.
    evidence: []
    must_not_infer: Any health effect.

  - name: Neurospora
    rank: genus
    taxid: 5140
    synonyms: []
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: The orange bread mould and the mould of oncom, an Indonesian fermented food; a laboratory model organism. Dietary passage.
    evidence: []
    must_not_infer: Any health effect.

  - name: Aureobasidium
    rank: genus
    taxid: 5579
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: Black yeast-like fungi of leaf and fruit surfaces; A. pullulans makes the food additive pullulan. Passage.
    evidence: []
    must_not_infer: Any health effect.

  - name: Metschnikowia
    rank: genus
    taxid: 27320
    synonyms: []
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: Fruit and flower yeasts used in winemaking and fruit biocontrol; a fruit signal.
    evidence: []
    must_not_infer: Residence.

  - name: Lichtheimia
    rank: genus
    taxid: 4830
    synonyms: ["Absidia"]
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: Mucoralean moulds of soil, compost and fermented soy foods (L. corymbifera); in the severely immunocompromised an agent of mucormycosis. Stool DNA is food or environment.
    evidence: []
    must_not_infer: Infection from DNA alone.

  - name: Ogataea
    rank: genus
    taxid: 461281
    synonyms: ["Hansenula polymorpha", "Pichia angusta"]
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: Methylotrophic yeasts of fruit, tree sap and industrial fermentation (O. polymorpha is a biotech workhorse); dietary passage.
    evidence: []
    must_not_infer: Residence.

  - name: Cystobasidium
    rank: genus
    taxid: 1653335
    synonyms: ["Rhodotorula minuta", "Rhodotorula slooffiae"]
    category: environmental_or_food
    origin_default: unknown
    role: Pink basidiomycetous yeasts of air, water and plant surfaces; formerly filed under Rhodotorula. Environmental passage.
    evidence: []
    must_not_infer: Any health effect.

  - name: Kodamaea ohmeri
    taxid: 27327
    synonyms: ["Pichia ohmeri", "Candida guilliermondii var. membranaefaciens"]
    category: commensal_opportunist
    origin_default: compatible_with_food_or_supplement
    role: A yeast of pickles, brines and fruit that is also a rare opportunist in hospitalised patients. In a healthy person's stool, a food signal.
    evidence: []
    must_not_infer: Infection from DNA alone.

  - name: Leptographium
    rank: genus
    taxid: 5482
    synonyms: ["Grosmannia"]
    category: environmental_or_food
    origin_default: unknown
    role: Bark-beetle-associated fungi of conifer wood with no known human relevance; a signal here is environmental DNA or a repeat-sequence artefact, and is held as a trace.
    evidence: []
    must_not_infer: Any health effect.

  - name: Pichia
    rank: genus
    taxid: 4919
    synonyms: []
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: Yeasts of fermented foods and fruit (P. fermentans, P. membranifaciens). Species-level evidence exists for P. kudriavzevii only.
    evidence: []
    must_not_infer: Residence.

  - name: Talaromyces
    rank: genus
    taxid: 5094
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: Soil and food moulds related to Penicillium; T. marneffei, a pathogen of the immunocompromised in Southeast Asia, is handled by the pathogen screen, not here.
    evidence: []
    must_not_infer: Infection from a genus-level hit.

  - name: Histoplasma capsulatum
    taxid: 5037
    synonyms: []
    category: pathogen_alert_route
    origin_default: unknown
    role: A dimorphic fungal pathogen of soil enriched by bird and bat droppings. Routed to the pathogen alert policy.
    evidence: []
    must_not_infer: Infection from DNA alone.

# --------------------------------------------------------------------------- #
# MHS-E1 rule manifest (spec §7.5.3). This table IS the initial policy.
# `cap` is OpenBiota engineering policy; `source_ids` are the facts.
# `required_identity`: species | reference_genotype | lineage
# `trigger_type`: presence | genotype | co_presence | abundance_rank
# --------------------------------------------------------------------------- #

rules:

  - rule_id: P4013B_B
    direction: B
    biological_claim_id: clavispora_lusitaniae_protection:strain
    source_ids: [cl_p4013b_protection]
    required_identity: reference_genotype
    taxon: Clavispora lusitaniae
    reference_accessions: [GCA_023627835.1]
    trigger_type: genotype
    cap: 0.50
    extrapolations: [preclinical_protection_not_human_benefit]
    note: >
      Resolved P4013B reference genotype. Species identity or a generic PDC gene
      alone does not activate this row.

  - rule_id: CL_LUSITANIAE_B
    direction: B
    biological_claim_id: clavispora_lusitaniae_protection:species
    source_ids: [cl_p4013b_protection]
    required_identity: species
    taxon: Clavispora lusitaniae
    trigger_type: presence
    cap: 0.25
    extrapolations: [species_to_tested_strain, preclinical_protection_not_human_benefit]
    note: >
      Supported species without a resolved P4013B match. When P4013B remains
      compatible with the observed discriminating evidence, P4013B_B enters the
      sensitivity range as an unresolved alternative; the point uses this row.

  - rule_id: CA_HD_C
    direction: C
    biological_claim_id: candida_albicans_high_damaging:strain
    source_ids: [ca_hd_isolates]
    required_identity: reference_genotype
    taxon: Candida albicans
    reference_genotypes: [IDB311, IDB101]
    trigger_type: genotype
    cap: 0.50
    extrapolations: [isolate_phenotype_not_measured_in_participant]
    note: >
      Resolved natural high-damaging study isolate genotype. Species identity,
      generic ECE1, candidalysin variants or a nearest-neighbour result do not
      activate. An equivalence set containing high- and low-damaging references
      gives C in 0-0.50 as an unresolved alternative; no member is preferred.

  - rule_id: CA_LD_CONTEXT
    direction: B
    biological_claim_id: candida_albicans_low_damaging:strain
    source_ids: [ca_hd_isolates]
    required_identity: reference_genotype
    taxon: Candida albicans
    reference_genotypes: [IDC561, IDB891]
    trigger_type: genotype
    cap: 0.0
    note: Lower damage in one assay is not a demonstrated health benefit. No points.

  - rule_id: CPAR_GUT_C
    direction: C
    biological_claim_id: candida_parapsilosis_obesity:species
    source_ids: [cpar_obesity_mouse]
    required_identity: species
    taxon: Candida parapsilosis
    trigger_type: presence
    cap: 0.25
    extrapolations: [mouse_model_to_human, tested_isolates_to_detected_species]
    note: Supported C. parapsilosis species; an unresolved complex does not identify it.

  - rule_id: DH_REPAIR_C
    direction: C
    biological_claim_id: debaryomyces_hansenii_repair:species
    source_ids: [dh_wound_repair]
    required_identity: species
    taxon: Debaryomyces hansenii
    trigger_type: presence
    cap: 0.25
    extrapolations: [stool_to_injured_tissue, mouse_model_to_human]

  - rule_id: MR_COLITIS_C
    direction: C
    biological_claim_id: malassezia_restricta_colitis:species
    source_ids: [mr_colitis]
    required_identity: species
    taxon: Malassezia restricta
    trigger_type: presence
    cap: 0.25
    extrapolations: [susceptible_model_to_unknown_host_genotype, skin_source_possible]

  - rule_id: CT_EC_SM_INTERACTION_C
    direction: C
    biological_claim_id: candida_tropicalis_biofilm_interaction:in_vitro
    source_ids: [ct_ec_sm_biofilm]
    required_identity: species
    taxon: Candida tropicalis
    co_present_bacteria: [Escherichia coli, Serratia marcescens]
    trigger_type: co_presence
    cap: 0.125
    extrapolations: [in_vitro_interaction_not_observed_biofilm]

  - rule_id: SB_STUDIED_B
    direction: B
    biological_claim_id: saccharomyces_boulardii_trial:strain
    source_ids: [sb_aad_trial]
    required_identity: reference_genotype
    taxon: Saccharomyces cerevisiae
    trigger_type: genotype
    cap: 0.50
    required_context: [documented_relevant_antibiotic_exposure]
    bound: false
    note: >
      Unbound: no verified genotype-to-trial join exists for the studied strain.
      A boulardii-like lineage, product label or supplement history is not that
      join. The finding stays visible; it scores nothing.

  - rule_id: FUNGAL_ABUNDANCE_ASSOCIATION
    direction: C
    biological_claim_id: fungal_abundance_association:adapter
    source_ids: []
    required_identity: species
    trigger_type: abundance_rank
    cap: 0.25
    bound: false
    note: >
      Generic adapter for a reviewed human stool abundance-outcome rule with a
      qualified same-pipeline reference. No such reference is qualified; unbound.
