# Gut mycobiome: what each fungus is, what the evidence says, and the frozen
# MHS-E1 rule manifest (BUILD_SPEC_v08.2 §9, §7.5.3).
#
# Evidence labels (spec §9.2): human_trial | human_association |
# human_isolate_plus_experiment | animal_experiment | in_vitro |
# genome_inference | insufficient_evidence.
#
# Every claim states organism, host, site, endpoint, design, direction and
# its inference limit. A claim's direction is about a named endpoint under
# the stated conditions; it is never "good fungus" or "bad fungus". The same
# organism may carry favorable and concerning claims at once - both are kept.
#
# `category` is a reader-facing grouping only. It does not score anything.
#   studied_probiotic_species | commensal_opportunist | opportunist |
#   food_associated | environmental_or_food | beneficial_preclinical |
#   pathogen_alert_route | unknown

taxa:

  - name: Saccharomyces cerevisiae
    taxid: 4932
    synonyms: ["Saccharomyces boulardii", "Saccharomyces cerevisiae var. boulardii"]
    category: studied_probiotic_species
    origin_default: compatible_with_food_or_supplement
    role: >
      Baker's, brewer's and wine yeast, and the species that contains the studied
      probiotic strains sold as S. boulardii. Common in stool after bread, beer,
      wine or a yeast probiotic; usually transient rather than resident.
    evidence:
      - claim_id: sacch_ibd_incidence
        label: human_association
        direction: favorable
        endpoint: IBD incidence across populations
        host: human
        site: stool
        design: multi-ethnic cohort; Saccharomyces-rich mycobiomes in populations with lower IBD incidence
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: Association at population level; Saccharomyces in stool is largely dietary and transient (review ref 81).
      - claim_id: sacch_depleted_disease
        label: human_association
        direction: context
        endpoint: depletion in IBD, alcohol-related liver disease, obesity and cirrhosis-to-HCC progression
        host: human
        site: stool
        design: case-control comparisons summarised in a 2024 review
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: Depletion in disease does not make supplementation protective; direction in Crohn's is contested between ITS2 and shotgun studies (review refs 161, 103).
      - claim_id: sb_aad_trial
        label: human_trial
        direction: favorable
        endpoint: antibiotic-associated diarrhoea incidence
        host: human
        site: gut
        design: randomised placebo-controlled trial of a studied S. boulardii strain
        detail: >
          22% diarrhoea with placebo versus 9.5% with the yeast among 180 completing
          participants.
        source: https://pubmed.ncbi.nlm.nih.gov/2494098/
        limit: >
          Species-level reads do not identify the trial strain; the trial's benefit
          required antibiotic exposure. Presence is not evidence the host is
          receiving the studied effect.
      - claim_id: sc_colitis_mouse
        label: animal_experiment
        direction: concerning
        endpoint: colitis severity
        host: mouse
        site: colon
        design: gnotobiotic mouse colonisation with S. cerevisiae strains
        detail: Some S. cerevisiae strains worsened experimental colitis.
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC5994919/
        limit: Strain- and model-specific; not all Saccharomyces, and not a human finding.
      - claim_id: sb_fungemia_hospital
        label: human_association
        direction: concerning
        endpoint: probiotic-associated fungemia
        host: human
        site: bloodstream
        design: hospital case series in susceptible patients
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC8314839/
        limit: Hospital proportions are not risk estimates for healthy users.
    must_not_infer: >
      A probiotic product strain from species-level DNA; benefit; deficiency when
      absent; universal safety.

  - name: Candida albicans
    taxid: 5476
    synonyms: []
    category: commensal_opportunist
    origin_default: unknown
    role: >
      The most common fungus in human stool and mouths, carried by a large share of
      healthy adults, and also the leading opportunistic yeast. Isolates differ:
      in a 2022 study, human gut isolates ranged from low- to high-damaging to
      immune cells, and the high-damaging ones aggravated experimental
      inflammation through candidalysin-related mechanisms.
    evidence:
      - claim_id: ca_immune_training
        label: animal_experiment
        direction: favorable
        endpoint: Th17 calibration, antifungal IgG, protection from S. aureus and influenza in mice
        host: mouse; human association
        site: gut
        design: commensal colonisation experiments summarised in a 2024 review
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: Benefit of commensal carriage at ordinary levels; not a reason to acquire or expand it (review refs 86, 95-97, 157).
      - claim_id: ca_dominance_dysbiosis
        label: human_association
        direction: concerning
        endpoint: expansion tracks IBD relapse, alcohol-related liver disease, cirrhosis and failed FMT in C. difficile infection
        host: human
        site: stool
        design: case-control and longitudinal cohorts summarised in a 2024 review
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: The pattern is dominance and expansion, not presence; C. albicans is a normal constituent in most people (review refs 44, 161, 193, 240).
      - claim_id: ca_hd_isolates
        label: human_isolate_plus_experiment
        direction: concerning
        endpoint: immune-cell damage and experimental intestinal inflammation
        host: human isolates; mouse
        site: gut
        design: phenotyped human gut isolates with mouse colonisation
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC9166917/
        limit: >
          Only a resolved high-damaging study isolate genotype carries this evidence.
          Species presence, generic ECE1 or candidalysin variants do not - the four
          candidalysin variants did not separate high- from low-damaging isolates.
      - claim_id: ca_commensal
        label: human_association
        direction: context
        endpoint: carriage in healthy adults
        host: human
        site: stool
        design: population sequencing surveys
        source: https://link.springer.com/article/10.1186/s40168-017-0373-4
        limit: Presence is not candidiasis.
    must_not_infer: Candidiasis from presence; the high-damaging phenotype from species abundance.

  - name: Candida tropicalis
    taxid: 5482
    synonyms: []
    category: commensal_opportunist
    origin_default: unknown
    role: >
      An opportunistic yeast related to C. albicans. Associated with Crohn's disease
      in a family study, where it interacted with E. coli and Serratia marcescens to
      form denser biofilms in the laboratory.
    evidence:
      - claim_id: ct_asca_cd
        label: human_association
        direction: concerning
        endpoint: Crohn's disease; ASCA antibodies that predict Crohn's up to five years ahead
        host: human
        site: stool; serum
        design: cohort studies summarised in a 2024 review
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: Association; ASCA is the antibody biomarker, not this organism's DNA (review refs 161, 176, 177).
      - claim_id: ct_crohns_family
        label: human_association
        direction: concerning
        endpoint: Crohn's disease in a family cohort
        host: human
        site: stool
        design: family-based association with in vitro interaction assays
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC5030358/
        limit: Association, not causation; the biofilm was formed in a dish.
      - claim_id: ct_ec_sm_biofilm
        label: in_vitro
        direction: concerning
        endpoint: mixed-species biofilm formation
        host: none (laboratory)
        site: in vitro
        design: co-culture with E. coli and S. marcescens
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC5030358/
        limit: Co-detection in stool is interaction potential, not an observed intestinal biofilm.
    must_not_infer: An intestinal biofilm or disease causation from co-detection.

  - name: Candida parapsilosis
    taxid: 5480
    synonyms: ["Lodderomyces parapsilosis"]
    complex: Candida parapsilosis complex
    category: commensal_opportunist
    origin_default: unknown
    role: >
      A skin- and gut-associated opportunistic yeast; a common cause of bloodstream
      infection in neonates and the catheterised. In mice fed a high-fat diet, gut
      C. parapsilosis promoted obesity through fungal lipase-related mechanisms.
    evidence:
      - claim_id: cpar_obesity_mouse
        label: animal_experiment
        direction: concerning
        endpoint: diet-induced obesity and lipid handling
        host: mouse
        site: gut
        design: colonisation on a high-fat diet
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC8546080/
        limit: >
          A mouse phenotype from tested isolates; no human obesity probability follows.
          Does not apply to unresolved C. orthopsilosis / C. metapsilosis.
    must_not_infer: An individual obesity risk; the mechanism for an unresolved complex member.

  - name: Candida orthopsilosis
    taxid: 273371
    synonyms: ["Lodderomyces orthopsilosis"]
    complex: Candida parapsilosis complex
    category: commensal_opportunist
    origin_default: unknown
    role: A member of the C. parapsilosis complex, distinguished from C. parapsilosis only by sequence.
    evidence: []
    must_not_infer: The C. parapsilosis experimental phenotype.

  - name: Candida metapsilosis
    taxid: 273372
    synonyms: ["Lodderomyces metapsilosis"]
    complex: Candida parapsilosis complex
    category: commensal_opportunist
    origin_default: unknown
    role: A member of the C. parapsilosis complex, distinguished from C. parapsilosis only by sequence.
    evidence:
      - claim_id: cm_m2006b_fxr
        label: animal_experiment
        direction: favorable
        endpoint: alleviates colitis in antibiotic-treated mice by activating FXR
        host: mouse
        site: colon
        design: colonisation with isolate M2006B; sesquiterpenoid FXR agonists
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: One isolate in mice; species-level DNA does not identify it and no human benefit is shown (review ref 236).
    must_not_infer: The C. parapsilosis experimental phenotype.

  - name: Nakaseomyces glabratus
    taxid: 5478
    synonyms: ["Candida glabrata", "Nakaseomyces glabrata"]
    category: opportunist
    origin_default: unknown
    role: >
      Formerly Candida glabrata: one concept under two names, not two fungi. A
      clinically important opportunistic yeast, common in the gut of healthy
      adults and the second most common cause of candidaemia in many countries,
      with intrinsically reduced susceptibility to fluconazole.
    evidence:
      - claim_id: ng_ibd_obesity
        label: animal_experiment
        direction: concerning
        endpoint: elevated in IBD; drives high-fat-diet obesity in mice, reversed by antifungals
        host: human association; mouse
        site: gut
        design: cohorts and mouse experiments summarised in a 2024 review
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: Mouse phenotype; selected for by long-term antifungal use (review refs 65, 161, 174).
      - claim_id: ng_clinical
        label: human_association
        direction: context
        endpoint: bloodstream infection epidemiology
        host: human
        site: bloodstream
        design: clinical epidemiology
        source: https://academic.oup.com/cid/article-abstract/83/1/e109/8653119
        limit: No healthy stool abundance threshold follows from bloodstream-infection data.
    must_not_infer: Infection or a stool threshold.

  - name: Debaryomyces hansenii
    taxid: 4959
    synonyms: ["Candida famata"]
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: >
      A salt-tolerant yeast of cheese rinds and cured meats, and a common stool
      finding after dairy. In mice and human tissue it was enriched in injured,
      inflamed intestinal wounds and impaired their repair.
    evidence:
      - claim_id: dh_wound_repair
        label: animal_experiment
        direction: concerning
        endpoint: intestinal wound repair
        host: mouse; human tissue
        site: injured intestinal mucosa
        design: colonisation of injured mucosa with human-tissue enrichment
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC10114606/
        limit: Stool presence cannot establish tissue localisation, impaired healing or a need for eradication.
    must_not_infer: Impaired healing in this person.

  - name: Malassezia restricta
    taxid: 76775
    synonyms: []
    category: commensal_opportunist
    origin_default: compatible_with_oral_or_skin_source
    role: >
      A lipid-dependent skin yeast found in healthy stool at low levels. Associated
      with Crohn's disease mucosa in carriers of a CARD9 variant, and it worsened
      colitis in susceptible experimental models.
    evidence:
      - claim_id: mr_alcohol_liver
        label: animal_experiment
        direction: concerning
        endpoint: worsens ethanol-induced liver injury via CLEC4N on Kupffer cells
        host: mouse
        site: gut-liver
        design: acute and chronic ethanol models
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: Mouse model under ethanol; enriched in ALD versus MASLD in one human cohort (review refs 195, 198).
      - claim_id: mr_colitis
        label: animal_experiment
        direction: concerning
        endpoint: colitis severity in susceptible hosts
        host: mouse; human association
        site: colon mucosa
        design: colonisation in CARD9-dependent models with human mucosal association
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC6417942/
        limit: Host genotype (CARD9) is not known here and is not imputed; skin carriage can contribute to stool DNA.
    must_not_infer: Crohn's disease, skin disease or invasive infection from a stool hit.

  - name: Malassezia globosa
    taxid: 76773
    synonyms: []
    category: commensal_opportunist
    origin_default: compatible_with_oral_or_skin_source
    role: >
      A skin yeast; in stool it usually reflects skin or handling contribution.
      Tumour-tissue and mouse research on Malassezia in pancreatic cancer is a
      tissue finding, not a stool threshold.
    evidence:
      - claim_id: mg_tissue_model
        label: animal_experiment
        direction: context
        endpoint: pancreatic tumour progression
        host: mouse; human tumour tissue
        site: pancreas
        design: tissue mycobiome and mouse model
        source: https://pubmed.ncbi.nlm.nih.gov/31578522/
        limit: Not a stool cancer-risk threshold.
    must_not_infer: Cancer risk from stool DNA.

  - name: Clavispora lusitaniae
    taxid: 36911
    synonyms: ["Candida lusitaniae"]
    category: beneficial_preclinical
    origin_default: unknown
    role: >
      A yeast depleted in people with IBD in a 2025 study, where one gut isolate
      (P4013B) protected mice from colitis through indole-3-ethanol and the AHR
      pathway. A promising preclinical beneficial strain; the species is also an
      occasional opportunist.
    evidence:
      - claim_id: cl_p4013b_protection
        label: human_isolate_plus_experiment
        direction: favorable
        endpoint: colitis protection via indole-3-ethanol / AHR
        host: human isolate; mouse
        site: colon
        design: IBD depletion association with mouse colonisation by isolate P4013B
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC12615640/
        limit: >
          Species-level detection is not P4013B; the benefit is preclinical; a
          generic pyruvate-decarboxylase gene is not this strain's identifier.
    must_not_infer: Proven human benefit; a supplementation recommendation; P4013B from species DNA.

  - name: Cladosporium sphaerospermum
    taxid: 47458
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: >
      A common indoor and food mould. A 2026 study found it depleted in Crohn's
      ileal mucosa while stool abundance was unchanged, with protective mechanisms
      investigated in mice and cells - biology that stool alone can miss.
    evidence:
      - claim_id: cs_mucosal_protection
        label: animal_experiment
        direction: context
        endpoint: mucosal protection in models
        host: mouse; cells; human mucosa association
        site: ileal mucosa
        design: mucosal versus faecal comparison with experiments
        source: https://pubmed.ncbi.nlm.nih.gov/41501528/
        limit: Faecal non-detection does not mean missing mucosal protection; not all Cladosporium is bad mould.
    must_not_infer: Anything from faecal absence.

  - name: Aspergillus
    rank: genus
    taxid: 5052
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: >
      Ubiquitous moulds of food, air and fermented products (soy sauce and miso use
      A. oryzae). Stool DNA is most often passage from food or air. Species and
      complex matter: toxin-capable and food-fermentation relatives cannot be
      told apart at genus level.
    evidence:
      - claim_id: asp_rambellii_crc
        label: human_association
        direction: concerning
        endpoint: A. rambellii enriched in colorectal cancer alongside Fusobacterium nucleatum; promoted tumour growth experimentally
        host: human; mouse
        site: stool; tumour
        design: meta-analysis of 1,329 metagenomes with functional validation
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: One species; stool Aspergillus in general is usually environmental exposure, not colonisation (review refs 76, 77, 187).
      - claim_id: asp_food_passage
        label: human_trial
        direction: context
        endpoint: stool fungal signal after controlled diet
        host: human
        site: stool
        design: controlled-diet study
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC5874442/
        limit: DNA does not establish mycotoxin production, viability, colonisation or invasive disease.
    must_not_infer: Mycotoxin exposure or infection.

  - name: Penicillium
    rank: genus
    taxid: 5073
    synonyms: []
    category: environmental_or_food
    origin_default: compatible_with_food_or_supplement
    role: >
      Cheese, fruit and indoor-air moulds; P. camemberti and P. roqueforti make
      soft and blue cheeses. Stool DNA is usually dietary passage.
    evidence:
      - claim_id: pen_longitudinal_culture
        label: human_association
        direction: context
        endpoint: recurrent culture from stool over time
        host: human
        site: stool
        design: longitudinal culture study
        source: https://doi.org/10.3389/fmicb.2019.01575
        limit: Recurrence can still reflect repeated ingestion.
    must_not_infer: Mycotoxin exposure or infection.

  - name: Rhodotorula mucilaginosa
    taxid: 5537
    synonyms: []
    category: environmental_or_food
    origin_default: unknown
    role: >
      A pink environmental yeast and occasional opportunist. In early-life mouse
      experiments its metabolic effects differed from other fungi.
    evidence:
      - claim_id: rm_early_life_mouse
        label: animal_experiment
        direction: context
        endpoint: metabolic outcomes after early-life colonisation
        host: mouse
        site: gut
        design: neonatal colonisation
        source: https://www.nature.com/articles/s41467-025-56743-8
        limit: A mouse phenotype, not a universal human good/bad label.
    must_not_infer: A human metabolic effect.

  - name: Candidozyma auris
    taxid: 498019
    synonyms: ["Candida auris"]
    category: pathogen_alert_route
    origin_default: unknown
    role: >
      An emerging multidrug-resistant yeast that spreads in healthcare settings.
      Gut carriage is documented in outbreak contexts. Any supported detection is
      routed to the existing pathogen alert policy; it is never folded into the
      health index.
    evidence:
      - claim_id: cauris_alert
        label: human_association
        direction: concerning
        endpoint: healthcare-associated colonisation and infection
        host: human
        site: skin; gut
        design: outbreak epidemiology
        source: https://www.ncbi.nlm.nih.gov/bioproject/PRJNA328792
        limit: A clade assignment does not establish resistance genotype or infection.
    must_not_infer: Infection, or susceptibility, from DNA alone.

  - name: Pichia kudriavzevii
    taxid: 4909
    synonyms: ["Candida krusei", "Issatchenkia orientalis"]
    category: commensal_opportunist
    origin_default: compatible_with_food_or_supplement
    role: >
      A yeast of fermented foods (cocoa, sourdough, some cheeses) that is also the
      opportunist formerly called Candida krusei, intrinsically resistant to
      fluconazole. One species, two names, two contexts.
    evidence: []
    must_not_infer: Infection or a food source, from DNA alone.

  - name: Kluyveromyces marxianus
    taxid: 4911
    synonyms: ["Candida kefyr"]
    category: food_associated
    origin_default: compatible_with_food_or_supplement
    role: A dairy yeast of kefir and cheese whey; in stool it nearly always reflects recent dairy.
    evidence:
      - claim_id: kluyv_aud
        label: human_association
        direction: context
        endpoint: Kluyveromyces raised in alcohol use disorder and alcohol-related liver disease
        host: human
        site: stool
        design: cohorts summarised in a 2024 review
        source: https://doi.org/10.1080/19490976.2024.2440111
        limit: A dairy yeast; the association is with drinking, not with dairy (review refs 193, 198).
    must_not_infer: Residence.

