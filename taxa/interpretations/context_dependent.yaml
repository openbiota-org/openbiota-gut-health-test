# Species interpretation registry — context-dependent taxa (spec v04 §6.5).
# A high or low level of these organisms reads differently by population,
# diet, medication and disease; the card says so rather than picking a side.
species_interpretations:
  - species: Akkermansia_muciniphila
    polarity: context_dependent
    evidence_state: curated_human_action_evidence
    guilds: [mucin_degraders]
    summary: >
      Mucin-degrading Verrucomicrobium. Higher levels are associated with metabolic health in
      several cohorts and a pasteurised strain (MucT) has human trial evidence, yet the same
      species is enriched in multiple sclerosis and Parkinson's disease cohorts. Endogenous
      abundance does not predict response to any Akkermansia product.
    assertions:
      - direction: higher
        statement: Pasteurised A. muciniphila MucT improved insulin sensitivity and metabolic markers in an exploratory 3-month trial of overweight/obese insulin-resistant volunteers.
        citation: "Depommier C et al. Nat Med 2019;25:1096. PMID 31263284"
        claim: intervention_context
      - direction: higher
        statement: Akkermansia is enriched in multiple sclerosis patients across cohorts (iMSMS).
        citation: "iMSMS Consortium. Cell 2022;185:3467. PMID 36113426"
      - direction: higher
        statement: Akkermansia enrichment is one of the most consistent taxonomic findings in Parkinson's disease meta-analyses.
        citation: "Romano S et al. NPJ Parkinsons Dis 2021;7:27. PMID 33692356"
    tags: [mucin_degrader, ms_enriched, pd_enriched]
    last_reviewed: "2026-09-07"

  - species: Prevotella_copri
    polarity: context_dependent
    evidence_state: human_association_only
    summary: >
      A complex of four clades whose prevalence tracks non-Western, fibre-rich diets. Enriched
      in new-onset rheumatoid arthritis in one US cohort and linked to insulin resistance via
      branched-chain amino acid synthesis in Danes, yet associated with improved glucose
      metabolism after fibre in others. Level alone carries no fixed meaning.
    assertions:
      - direction: any
        statement: P. copri comprises four distinct clades whose distribution follows Westernisation; metagenomic analysis of >6,500 samples.
        citation: "Tett A et al. Cell Host Microbe 2019;26:666. PMID 31607556"
      - direction: higher
        statement: P. copri and BCAA biosynthesis were associated with insulin resistance; causality was tested in mice.
        citation: "Pedersen HK et al. Nature 2016;535:376. PMID 27409811"
      - direction: higher
        statement: P. copri was enriched in new-onset untreated rheumatoid arthritis.
        citation: "Scher JU et al. eLife 2013;2:e01202. PMID 24192039"
    tags: [westernisation_marker]
    last_reviewed: "2026-09-07"

  - species: Bacteroides_uniformis
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Among the most prevalent Bacteroides in Western adults; level varies with diet and has no established directional meaning on its own.
    assertions:
      - direction: any
        statement: Bacteroides species are dominant, diet-responsive members of Western adult stool with both commensal and opportunistic behaviours.
        citation: "Wexler HM. Clin Microbiol Rev 2007;20:593. PMID 17934076"
    tags: [bacteroides]
    last_reviewed: "2026-09-07"

  - species: Bacteroides_vulgatus
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Very common Bacteroides species (now Phocaeicola vulgatus); implicated in some IBD and metabolic cohorts and protective in others. No fixed reading.
    assertions:
      - direction: any
        statement: Bacteroides as dominant commensals with strain-dependent effects.
        citation: "Wexler HM. Clin Microbiol Rev 2007;20:593. PMID 17934076"
    tags: [bacteroides]
    last_reviewed: "2026-09-07"

  - species: Bacteroides_dorei
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Common Bacteroides species; a rise preceded seroconversion in a Finnish type 1 diabetes birth cohort, while other cohorts associate it with lower atherosclerosis. Context-dependent.
    assertions:
      - direction: higher
        statement: B. dorei abundance peaked before islet autoantibody seroconversion in the DIABIMMUNE cohort.
        citation: "Davis-Richardson AG et al. Front Microbiol 2014;5:678. PMID 25540641"
    tags: [bacteroides]
    last_reviewed: "2026-09-07"

  - species: Bacteroides_ovatus
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Versatile polysaccharide degrader; common commensal with no fixed directional interpretation.
    assertions:
      - direction: any
        statement: Bacteroides as diet-responsive commensals.
        citation: "Wexler HM. Clin Microbiol Rev 2007;20:593. PMID 17934076"
    tags: [bacteroides]
    last_reviewed: "2026-09-07"

  - species: Bacteroides_thetaiotaomicron
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Model glycan-degrading commensal with a large polysaccharide-utilisation repertoire; common and without a fixed directional reading.
    assertions:
      - direction: any
        statement: Bacteroides as glycan-degrading commensals.
        citation: "Wexler HM. Clin Microbiol Rev 2007;20:593. PMID 17934076"
    tags: [bacteroides]
    last_reviewed: "2026-09-07"

  - species: Bacteroides_xylanisolvens
    polarity: context_dependent
    evidence_state: human_association_only
