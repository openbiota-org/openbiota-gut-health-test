    tags: [bacteroides]
    last_reviewed: "2026-09-07"

  - species: Bacteroides_caccae
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Common mucin-utilising Bacteroides; context-dependent.
    assertions:
      - direction: any
        statement: Bacteroides as commensals with mucin-degrading capacity.
        citation: "Wexler HM. Clin Microbiol Rev 2007;20:593. PMID 17934076"
    tags: [bacteroides]
    last_reviewed: "2026-09-07"

  - species: Bacteroides_stercoris
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Common Bacteroides species with no fixed directional interpretation.
    assertions:
      - direction: any
        statement: Bacteroides as commensals.
        citation: "Wexler HM. Clin Microbiol Rev 2007;20:593. PMID 17934076"
    tags: [bacteroides]
    last_reviewed: "2026-09-07"

  - species: Alistipes_putredinis
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Bile-tolerant Rikenellaceae member; higher in some depression and CRC cohorts, protective in others (liver fibrosis, colitis models). Reviewed as a genus with both faces.
    assertions:
      - direction: any
        statement: Review of Alistipes as a genus with both pathogenic and protective associations.
        citation: "Parker BJ et al. Front Immunol 2020;11:906. PMID 32582143"
    tags: [alistipes]
    last_reviewed: "2026-09-07"

  - species: Alistipes_onderdonkii
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Common Alistipes species; lower in a small two-year Long-COVID cohort (unreplicated) and variable elsewhere.
    assertions:
      - direction: any
        statement: Review of Alistipes with both protective and disease associations.
        citation: "Parker BJ et al. Front Immunol 2020;11:906. PMID 32582143"
    tags: [alistipes]
    last_reviewed: "2026-09-07"

  - species: Alistipes_shahii
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Alistipes species associated with response to anti-PD-1 immunotherapy in one cohort and with inflammation in others.
    assertions:
      - direction: any
        statement: Review of Alistipes across immunotherapy, inflammation and metabolic cohorts.
        citation: "Parker BJ et al. Front Immunol 2020;11:906. PMID 32582143"
    tags: [alistipes]
    last_reviewed: "2026-09-07"

  - species: Alistipes_finegoldii
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Alistipes species with mixed associations; protective in mouse colitis, higher in some human disease cohorts.
    assertions:
      - direction: any
        statement: Review of Alistipes across cohorts.
        citation: "Parker BJ et al. Front Immunol 2020;11:906. PMID 32582143"
    tags: [alistipes]
    last_reviewed: "2026-09-07"

  - species: Dialister_invisus
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Dialister was depleted in depression cohorts, yet D. invisus is also enriched in some spondyloarthritis and IBD cohorts. Context-dependent.
    assertions:
      - direction: lower
        statement: Dialister and Coprococcus depleted in depression in two population cohorts.
        citation: "Valles-Colomer M et al. Nat Microbiol 2019;4:623. PMID 30718848"
      - direction: higher
        statement: D. invisus correlated with disease activity in spondyloarthritis ileal biopsies.
        citation: "Tito RY et al. Arthritis Rheumatol 2017;69:114. PMID 27390077"
    tags: []
    last_reviewed: "2026-09-07"

  - species: Methanobrevibacter_smithii
    polarity: context_dependent
    evidence_state: human_association_only
    guilds: [methanogens]
    summary: >
      The dominant human gut methanogen. Stool abundance is not intestinal methanogen
      overgrowth; that needs a constipation phenotype and a standardised breath methane test.
      Methane slows intestinal transit in experimental models and methane-positive breath tests
      associate with constipation-predominant IBS.
    assertions:
      - direction: higher
        statement: Methane infusion slowed small-intestinal transit in animal models; methane on breath testing associates with constipation.
        citation: "Pimentel M et al. Am J Physiol Gastrointest Liver Physiol 2006;290:G1089. PMID 16293652"
      - direction: any
        statement: North American consensus defines a positive methane breath test as ≥10 ppm and separates it from stool findings.
        citation: "Rezaie A et al. Am J Gastroenterol 2017;112:775. PMID 28323273"
    tags: [methanogen]
    last_reviewed: "2026-09-07"

  - species: Parabacteroides_distasonis
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Common commensal; lower in some IBD/obesity cohorts and enriched in others; mouse work suggests metabolic benefit via succinate and bile acids. Not directional in humans.
    assertions:
      - direction: any
        statement: P. distasonis alleviated obesity and metabolic dysfunction in mice via succinate and secondary bile acids; human data are associative.
        citation: "Wang K et al. Cell Rep 2019;26:222. PMID 30605678"
    tags: []
    last_reviewed: "2026-09-07"

  - species: Parabacteroides_merdae
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Common commensal Parabacteroides species without a fixed directional reading.
    assertions:
      - direction: any
        statement: Parabacteroides as common Bacteroidales commensals with mixed associations.
        citation: "Wexler HM. Clin Microbiol Rev 2007;20:593. PMID 17934076"
    tags: []
    last_reviewed: "2026-09-07"

  - species: Desulfovibrio_piger
    polarity: context_dependent
    evidence_state: human_association_only
    guilds: [sulfate_reducers]
    summary: The most common human gut sulfate-reducing bacterium; a normal low-abundance commensal whose hydrogen sulfide has both epithelial-toxic and signalling roles. Abundance alone does not justify antimicrobials or sulfur restriction.
    assertions:
      - direction: any
        statement: D. piger colonisation and sulfate reduction studied in gnotobiotic mice; H2S production depends on dietary and host sulfate sources.
        citation: "Rey FE et al. PNAS 2013;110:13582. PMID 23898195"
    tags: [sulfate_reducer]
    last_reviewed: "2026-09-07"

  - species: Eggerthella_lenta
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Actinobacterium notable for drug metabolism (inactivates digoxin via cgr genes; decarboxylates levodopa-derived dopamine). Higher in some IBD/RA cohorts. Relevant to medication history, not a target.
    assertions:
      - direction: any
        statement: E. lenta strains carrying the cgr operon inactivate digoxin; arginine suppresses this in mice.
        citation: "Haiser HJ et al. Science 2013;341:295. PMID 23869020"
      - direction: any
        statement: E. lenta dehydroxylates dopamine produced from levodopa by Enterococcus faecalis tyrosine decarboxylase.
        citation: "Maini Rekdal V et al. Science 2019;364:eaau6323. PMID 31196984"
    tags: [drug_metabolism]
    last_reviewed: "2026-09-07"

  - species: Lactobacillus_rhamnosus
    polarity: context_dependent
    evidence_state: human_association_only
    guilds: [probiotics]
    summary: Detection in stool usually reflects recent food or supplement transit; colonisation is person- and strain-specific. Level does not indicate whether any L. rhamnosus product (e.g. GG) would help, and strain evidence does not transfer to the species.
    assertions:
      - direction: any
        statement: An 11-strain probiotic showed person-, strain- and region-specific mucosal colonisation; stool detection reflected transit.
        citation: "Zmora N et al. Cell 2018;174:1388. PMID 30193112"
    tags: [probiotic_genus]
    last_reviewed: "2026-09-07"

  - species: Lactobacillus_plantarum
    polarity: context_dependent
    evidence_state: human_association_only
    guilds: [probiotics]
    summary: Usually food-derived in stool (fermented vegetables, supplements); transient. Trial evidence exists only for specific strains and products.
    assertions:
      - direction: any
        statement: Probiotic colonisation is person- and strain-specific; stool presence reflects transit.
        citation: "Zmora N et al. Cell 2018;174:1388. PMID 30193112"
    tags: [probiotic_genus]
    last_reviewed: "2026-09-07"

  - species: Lactobacillus_acidophilus
    polarity: context_dependent
    evidence_state: human_association_only
    guilds: [probiotics]
    summary: Typically supplement- or dairy-derived when seen in adult stool; transient and strain-specific.
    assertions:
      - direction: any
        statement: Probiotic colonisation is person- and strain-specific.
        citation: "Zmora N et al. Cell 2018;174:1388. PMID 30193112"
    tags: [probiotic_genus]
    last_reviewed: "2026-09-07"

  - species: Lactobacillus_reuteri
    polarity: context_dependent
    evidence_state: curated_human_action_evidence
    guilds: [probiotics]
    summary: Detected transiently after food or supplements. Strain NCIMB 30242 has cholesterol trial evidence in hypercholesterolaemic adults; it does not transfer to the species or to any other strain.
    assertions:
      - direction: any
        statement: L. reuteri NCIMB 30242 in yogurt reduced LDL-cholesterol in hypercholesterolaemic adults over 6 weeks.
        citation: "Jones ML et al. Br J Nutr 2012;107:1505. PMID 22067612"
        claim: intervention_context
    tags: [probiotic_genus]
    last_reviewed: "2026-09-07"

  - species: Lactobacillus_gasseri
    polarity: context_dependent
    evidence_state: human_association_only
    guilds: [probiotics]
    summary: Vaginal and oral commensal occasionally seen in stool; transient, strain-specific evidence only.
    assertions:
      - direction: any
        statement: Probiotic colonisation is person- and strain-specific.
        citation: "Zmora N et al. Cell 2018;174:1388. PMID 30193112"
    tags: [probiotic_genus]
    last_reviewed: "2026-09-07"

  - species: Lactobacillus_fermentum
    polarity: context_dependent
    evidence_state: human_association_only
    guilds: [probiotics]
    summary: Food-associated lactobacillus; transient in stool.
    assertions:
      - direction: any
        statement: Probiotic colonisation is person- and strain-specific.
        citation: "Zmora N et al. Cell 2018;174:1388. PMID 30193112"
    tags: [probiotic_genus]
    last_reviewed: "2026-09-07"

  - species: Streptococcus_thermophilus
    polarity: context_dependent
    evidence_state: human_association_only
    guilds: [probiotics]
    summary: Yogurt starter culture; stool detection reflects recent dairy intake rather than colonisation.
    assertions:
      - direction: any
        statement: Probiotic and starter cultures are detected transiently after intake.
