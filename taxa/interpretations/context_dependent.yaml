    tags: [food_derived]
    last_reviewed: "2026-09-07"

  - species: Lactococcus_lactis
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Cheese and fermented-dairy starter; transient in stool.
    assertions:
      - direction: any
        statement: Fermented-food organisms are detected transiently after intake.
