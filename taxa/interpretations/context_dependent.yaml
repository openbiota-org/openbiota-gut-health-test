    tags: [probiotic_genus]
    last_reviewed: "2026-09-07"

  - species: Bifidobacterium_breve
    polarity: context_dependent
    evidence_state: human_association_only
    guilds: [probiotics]
    summary: Infant-associated Bifidobacterium; in adults usually supplement-derived.
    assertions:
      - direction: any
        statement: Review of Bifidobacterium species across life stages.
        citation: "O'Callaghan A, van Sinderen D. Front Microbiol 2016;7:925. PMID 27379055"
    tags: [bifidobacteria]
    last_reviewed: "2026-09-07"

  - species: Bifidobacterium_dentium
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Oral-cavity Bifidobacterium associated with dental caries; in stool it is an oral-origin organism, not a probiotic.
    assertions:
      - direction: any
        statement: Review of Bifidobacterium species including oral B. dentium.
        citation: "O'Callaghan A, van Sinderen D. Front Microbiol 2016;7:925. PMID 27379055"
    tags: [oral_origin]
    last_reviewed: "2026-09-07"

  - species: Candida_albicans
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Commensal yeast present in a large share of healthy people at low abundance; expansion follows antibiotics and immunosuppression. Stool DNA is not a fungal infection diagnosis.
    assertions:
      - direction: any
        statement: The gut mycobiome is dominated by Saccharomyces, Malassezia and Candida in healthy adults, with C. albicans common and diet-responsive.
        citation: "Nash AK et al. Microbiome 2017;5:153. PMID 29178920"
    tags: [fungus]
    prohibited_language: ["candida overgrowth (from stool DNA)", "fungal infection"]
    last_reviewed: "2026-09-07"

  - species: Blautia_obeum
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Abundant Lachnospiraceae member; Blautia is higher in some obesity cohorts and lower in others. No fixed reading.
    assertions:
      - direction: any
        statement: Review of Blautia as a widespread genus with mixed disease associations.
        citation: "Liu X et al. Gut Microbes 2021;13:1875796. PMID 33525961"
    tags: []
    last_reviewed: "2026-09-07"

  - species: Blautia_wexlerae
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Common Blautia species; associated with lower visceral fat in a Japanese cohort and mixed elsewhere.
    assertions:
      - direction: any
        statement: Review of Blautia associations across metabolic and inflammatory cohorts.
        citation: "Liu X et al. Gut Microbes 2021;13:1875796. PMID 33525961"
    tags: []
    last_reviewed: "2026-09-07"

  - species: Dorea_formicigenerans
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Gas-producing Lachnospiraceae member; higher in some IBS and obesity cohorts.
    assertions:
      - direction: any
        statement: Dorea among taxa enriched in IBS in a large cohort study with functional readouts.
        citation: "Tap J et al. Gastroenterology 2017;152:111. PMID 27725146"
    tags: []
    last_reviewed: "2026-09-07"

  - species: Dorea_longicatena
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Common Lachnospiraceae member with mixed metabolic associations.
    assertions:
      - direction: any
        statement: Dorea among taxa with IBS/metabolic associations of uncertain direction.
        citation: "Tap J et al. Gastroenterology 2017;152:111. PMID 27725146"
    tags: []
    last_reviewed: "2026-09-07"

  - species: Phascolarctobacterium_faecium
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Succinate-consuming propionate producer; common, with mixed associations.
    assertions:
      - direction: any
        statement: Phascolarctobacterium converts succinate to propionate; reviewed among propionate producers.
        citation: "Louis P, Flint HJ. Environ Microbiol 2017;19:29. PMID 27928878"
    tags: [propionate_producer]
    last_reviewed: "2026-09-07"

  - species: Odoribacter_splanchnicus
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Butyrate-producing Bacteroidales member; lower in some IBD and hypertension cohorts, but variable between healthy adults.
    assertions:
      - direction: lower
        statement: Odoribacter was among taxa depleted in hypertension cohorts (meta-analysis of gut microbiome and blood pressure).
        citation: "Palmu J et al. J Am Heart Assoc 2020;9:e016641. PMID 32691653"
    tags: [butyrate_producer]
    last_reviewed: "2026-09-07"

  - species: Barnesiella_intestinihominis
    polarity: context_dependent
    evidence_state: human_association_only
    guilds: [mucin_degraders]
    summary: Common Bacteroidales member; listed among mucin utilisers. Context-dependent, with no fixed directional reading.
    assertions:
      - direction: any
        statement: Barnesiella associated with resistance to vancomycin-resistant Enterococcus colonisation in mice and mixed human associations.
        citation: "Ubeda C et al. Infect Immun 2013;81:965. PMID 23319552"
    tags: []
    last_reviewed: "2026-09-07"

  - species: Intestinibacter_bartlettii
    polarity: context_dependent
    evidence_state: human_association_only
    summary: Common Peptostreptococcaceae member; reduced by metformin in T2D cohorts, so its level partly reflects medication.
    assertions:
      - direction: lower
        statement: Metformin treatment lowered Intestinibacter in T2D metagenomes, a confounder of disease signatures.
        citation: "Forslund K et al. Nature 2015;528:262. PMID 26633628"
    tags: [metformin_responsive]
    last_reviewed: "2026-09-07"

  - species: Escherichia_coli
    polarity: potential_pathobiont
    evidence_state: human_association_only
    guilds: [opportunistic_pathogens, hexa_lps]
    summary: >
      Carried by most people at low abundance. Species-level detection says nothing about
      pathotype: enterohaemorrhagic, enterotoxigenic, adherent-invasive and colibactin-producing
      lineages are strains, identified by toxin and virulence genes, not by the species name.
      Relative expansion is common after antibiotics or in inflammation and is reported as
      such; it is not an infection.
    qualification_needed: pathotype/toxin genes (stx, eae, LT/ST, pks/clb) at qualifying coverage, or a clinical stool test
    prohibited_language: ["E. coli overgrowth", "pathogenic E. coli", "E. coli infection", "E. coli eradication"]
    assertions:
      - direction: any
        statement: Pathogenic E. coli are defined by pathotype-specific virulence factors; commensal and pathogenic strains share the species.
        citation: "Kaper JB et al. Nat Rev Microbiol 2004;2:123. PMID 15040260"
      - direction: higher
        statement: Enterobacteriaceae/E. coli expansion is a hallmark of inflammation-associated dysbiosis across IBD cohorts.
        citation: "Lloyd-Price J et al. Nature 2019;569:655. PMID 31142855"
    tags: [enterobacterales]
    last_reviewed: "2026-09-07"

  - species: Klebsiella_pneumoniae
    polarity: potential_pathobiont
    evidence_state: human_association_only
    guilds: [opportunistic_pathogens, oral_origin, hexa_lps]
    summary: >
      Common low-level colonist of the gut and mouth; a frequent cause of hospital infection,
      with hypervirulent and multidrug-resistant lineages defined at strain level. Oral
      Klebsiella strains from IBD patients drove Th1 responses in mice. Stool relative
      abundance is not infection, colonisation pressure or resistance.
    qualification_needed: strain/hypervirulence (rmpA, iuc, K1/K2) and AMR gene resolution with carrier attribution, or clinical culture
    prohibited_language: ["Klebsiella overgrowth", "Klebsiella infection", "Klebsiella eradication"]
    assertions:
      - direction: higher
        statement: Salivary Klebsiella strains from IBD patients colonised the gut of germ-free mice and induced Th1 cells.
        citation: "Atarashi K et al. Science 2017;358:359. PMID 29051379"
      - direction: any
        statement: Review of K. pneumoniae biology, colonisation and virulence determinants.
        citation: "Paczosa MK, Mecsas J. Microbiol Mol Biol Rev 2016;80:629. PMID 27307579"
    tags: [enterobacterales]
    last_reviewed: "2026-09-07"

  - species: Klebsiella_oxytoca
    polarity: potential_pathobiont
    evidence_state: human_association_only
    guilds: [opportunistic_pathogens]
    summary: Commensal Klebsiella; toxin-producing (tilivalline) strains cause antibiotic-associated haemorrhagic colitis. Species detection does not establish toxin production.
    qualification_needed: tilivalline biosynthesis (npsA/npsB) genes and a compatible clinical picture
    prohibited_language: ["Klebsiella infection", "eradication"]
    assertions:
      - direction: any
        statement: Cytotoxin-producing K. oxytoca causes antibiotic-associated haemorrhagic colitis.
        citation: "Högenauer C et al. N Engl J Med 2006;355:2418. PMID 17151366"
    tags: [enterobacterales]
    last_reviewed: "2026-09-07"

  - species: Klebsiella_variicola
    polarity: potential_pathobiont
    evidence_state: human_association_only
