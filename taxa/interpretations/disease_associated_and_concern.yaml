        statement: Intestinal P. aeruginosa carriage as a source of infection in critically ill and immunocompromised patients.
        citation: "Gómez-Zorrilla S et al. Antimicrob Agents Chemother 2015;59:5213. PMID 26077248"
    tags: []
    last_reviewed: "2026-09-07"

