    guilds: [opportunistic_pathogens]
    summary: Formerly S. bovis biotype I; bacteraemia and endocarditis with this organism are strongly associated with colorectal neoplasia, and colonoscopic evaluation is standard after such infections. Stool detection is a screening reminder, not a diagnosis.
    assertions:
      - direction: presence
        statement: Meta-analysis of S. bovis/gallolyticus infection and colorectal neoplasia.
        citation: "Boleij A et al. Clin Infect Dis 2011;53:870. PMID 21960713"
    tags: [crc_associated]
    last_reviewed: "2026-09-07"

  - species: Collinsella_aerofaciens
