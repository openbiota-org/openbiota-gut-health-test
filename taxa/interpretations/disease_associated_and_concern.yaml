    evidence_state: human_association_only
    summary: Gastric organism whose DNA is occasionally shed into stool; stool metagenomic detection is not a validated H. pylori test (stool antigen, urea breath test or biopsy are). Carriage is common worldwide.
    assertions:
      - direction: presence
        statement: Maastricht VI/Florence consensus on H. pylori diagnosis and management.
        citation: "Malfertheiner P et al. Gut 2022;71:1724. PMID 35944925"
    tags: [gastric]
    prohibited_language: ["H. pylori infection (from stool metagenomics)"]
    last_reviewed: "2026-09-07"

  - species: Staphylococcus_aureus
