        statement: Collinsella expanded in rheumatoid arthritis and increased gut permeability and IL-17A in mouse and cell models.
        citation: "Chen J et al. Genome Med 2016;8:43. PMID 27102666"
      - direction: higher
        statement: Collinsella enriched in symptomatic atherosclerosis patients versus controls.
