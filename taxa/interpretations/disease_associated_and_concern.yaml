# Species interpretation registry — disease-associated taxa and potential
# concern signals (spec v04 §6.5–6.6). A concern polarity is a FLAG that names
# the qualification it would need (strain, toxin, virulence or clinical test);
# it is never an infection, overgrowth or eradication statement.
species_interpretations:
  - species: Ruminococcus_gnavus
    polarity: disease_associated
    evidence_state: human_association_only
    guilds: [mucin_degraders]
    summary: >
      Mucin-degrading Lachnospiraceae member present in most healthy adults at low level.
      Blooms are one of the most consistent features of active Crohn's disease and it produces
      an inflammatory glucorhamnan polysaccharide. It is an ecological pathobiont, not an
      infectious agent, and must not share an infection rule with Enterobacterales.
    assertions:
      - direction: higher
        statement: R. gnavus blooms during inflammatory bowel disease flares in longitudinal metagenomes.
        citation: "Hall AB et al. Genome Med 2017;9:103. PMID 29183332"
      - direction: higher
        statement: R. gnavus synthesises a glucorhamnan that induces TNF-alpha via TLR4 in dendritic cells.
        citation: "Henke MT et al. PNAS 2019;116:12672. PMID 31235834"
    tags: [ibd_enriched, mucin_degrader]
    prohibited_language: ["R. gnavus infection", "eradication"]
    last_reviewed: "2026-09-07"

  - species: Bilophila_wadsworthia
    polarity: disease_associated
    evidence_state: human_association_only
    guilds: [sulfate_reducers]
    summary: >
      Taurine-respiring, hydrogen-sulfide-producing member of the Desulfovibrionaceae that
      expands on high-saturated-fat diets. It aggravated colitis in genetically susceptible
      mice and metabolic dysfunction in high-fat-fed mice; human data are associative and it is
      a normal low-abundance commensal.
    assertions:
      - direction: higher
        statement: Milk-fat diet promoted taurocholate-driven B. wadsworthia expansion and colitis in IL-10-deficient mice.
        citation: "Devkota S et al. Nature 2012;487:104. PMID 22722865"
      - direction: higher
        statement: B. wadsworthia aggravated high-fat-diet-induced metabolic dysfunction in mice.
        citation: "Natividad JM et al. Nat Commun 2018;9:2802. PMID 30006546"
    tags: [sulfate_reducer, h2s]
    last_reviewed: "2026-09-07"

  - species: Fusobacterium_nucleatum
    polarity: potential_pathobiont
    evidence_state: human_association_only
    guilds: [oral_origin, opportunistic_pathogens]
    summary: >
      Oral anaerobe enriched in colorectal tumour tissue and stool across many CRC cohorts;
      FadA adhesin and Fap2 mediate epithelial and immune effects. Stool detection is a
      CRC-associated signal and a screening reminder, not a diagnosis; no trial shows that
      removing it prevents cancer, and periodontal treatment lowered stool F. nucleatum without
      demonstrated cancer benefit.
    qualification_needed: conventional colorectal screening; fadA/fap2 fragments with carrier attribution are association evidence only
    prohibited_language: ["cancer detected", "eradicate F. nucleatum", "treat F. nucleatum from a profile"]
    assertions:
      - direction: higher
        statement: F. nucleatum enrichment in colorectal carcinoma tissue versus matched normal tissue.
        citation: "Kostic AD et al. Genome Res 2012;22:292. PMID 22009990"
      - direction: higher
        statement: F. nucleatum enrichment in CRC tissue confirmed by RNA-seq and qPCR in an independent series.
        citation: "Castellarin M et al. Genome Res 2012;22:299. PMID 22009989"
      - direction: higher
        statement: Meta-analysis of stool metagenomes across eight CRC cohorts confirms F. nucleatum among the most reproducible CRC-enriched species.
        citation: "Wirbel J et al. Nat Med 2019;25:679. PMID 30936547"
    tags: [crc_enriched, oral_origin]
    last_reviewed: "2026-09-07"

  - species: Bacteroides_fragilis
    polarity: potential_pathobiont
    evidence_state: human_association_only
    guilds: [opportunistic_pathogens]
    summary: >
      Common commensal whose non-toxigenic strains have immunomodulatory properties (PSA), while
      enterotoxigenic strains carrying bft are associated with colorectal neoplasia and
      inflammatory diarrhoea. The species name does not separate the two.
    qualification_needed: bft (fragilysin) gene detection with carrier attribution
    prohibited_language: ["B. fragilis infection", "eradication"]
    assertions:
      - direction: presence
        statement: Enterotoxigenic B. fragilis (bft) was enriched in colorectal cancer mucosa, particularly late-stage tumours.
        citation: "Boleij A et al. Clin Infect Dis 2015;60:208. PMID 25305284"
      - direction: any
        statement: Non-toxigenic B. fragilis polysaccharide A directs host immune development in mice.
        citation: "Mazmanian SK et al. Cell 2005;122:107. PMID 16009137"
    tags: [bacteroides, etbf]
    last_reviewed: "2026-09-07"

  - species: Enterococcus_faecalis
    polarity: potential_pathobiont
    evidence_state: human_association_only
    guilds: [opportunistic_pathogens]
    summary: >
      Common low-abundance commensal that expands after antibiotics and dominates the stool of
      many hospitalised patients; a major cause of hospital infection with vancomycin-resistant
      lineages. Stool abundance is not infection. Its tyrosine decarboxylase metabolises
      levodopa, relevant to Parkinson's medication.
    qualification_needed: clinical culture and susceptibility; AMR genes with carrier attribution
    prohibited_language: ["Enterococcus infection", "eradication"]
    assertions:
      - direction: any
        statement: Review of Enterococcus pathogenesis, antibiotic resistance and gut domination after antibiotics.
        citation: "Fiore E et al. Microbiol Spectr 2019;7:GPP3-0053-2018. PMID 31298205"
      - direction: any
        statement: E. faecalis tyrosine decarboxylase converts levodopa to dopamine in the gut; tdc abundance correlated with levodopa dose requirement.
        citation: "Maini Rekdal V et al. Science 2019;364:eaau6323. PMID 31196984"
    tags: [levodopa_metabolism]
    last_reviewed: "2026-09-07"

  - species: Enterococcus_faecium
    polarity: potential_pathobiont
    evidence_state: human_association_only
    guilds: [opportunistic_pathogens]
    summary: Hospital-adapted lineages are a leading VRE cause; community strains are common low-level colonists. Stool abundance is not infection or resistance.
    qualification_needed: clinical culture and susceptibility; vanA/vanB with carrier attribution
    prohibited_language: ["Enterococcus infection", "eradication"]
    assertions:
      - direction: any
        statement: Review of Enterococcus pathogenesis and resistance.
        citation: "Fiore E et al. Microbiol Spectr 2019;7:GPP3-0053-2018. PMID 31298205"
    tags: []
    last_reviewed: "2026-09-07"

  - species: Clostridioides_difficile
    polarity: potential_pathobiont
    evidence_state: curated_human_action_evidence
    guilds: [opportunistic_pathogens]
    summary: >
      Asymptomatic carriage is common, particularly in infants and after hospitalisation; disease
      requires toxin production (tcdA/tcdB) and a clinical picture. Species DNA in stool is not
      C. difficile infection. Recurrent CDI is the only indication with approved microbiota
      products (REBYOTA, VOWST, adults ≥18, after antibacterial treatment).
    qualification_needed: toxin gene (tcdA/tcdB) detection plus a clinical stool toxin test and symptoms
    prohibited_language: ["C. difficile infection (from DNA)", "eradication"]
    assertions:
      - direction: presence
        statement: "Primer on C. difficile infection: carriage versus disease, toxins and diagnosis."
        citation: "Smits WK et al. Nat Rev Dis Primers 2016;2:16020. PMID 27158839"
      - direction: presence
        statement: AGA 2024 conditionally recommends fecal microbiota-based therapies for prevention of recurrent CDI in selected adults after standard antibiotics.
        citation: "Peery AF et al. Gastroenterology 2024;166:409. PMID 38395525"
        claim: intervention_context
    tags: [toxin_dependent]
    last_reviewed: "2026-09-07"

  - species: Clostridium_perfringens
    polarity: potential_pathobiont
    evidence_state: human_association_only
    guilds: [opportunistic_pathogens]
    summary: Common low-level gut commensal; toxinotypes carrying cpe or netB cause food poisoning and enteritis. Species detection is not toxin production.
    qualification_needed: toxin genes (cpe, cpb, netB) and a clinical picture
    prohibited_language: ["C. perfringens infection", "eradication"]
    assertions:
      - direction: any
        statement: Review of C. perfringens toxins and their role in human and animal enteric disease by toxinotype.
        citation: "Uzal FA et al. Future Microbiol 2014;9:361. PMID 24762309"
    tags: [toxin_dependent]
    last_reviewed: "2026-09-07"

  - species: Salmonella_enterica
    polarity: validated_pathogen_signal
    evidence_state: human_association_only
    guilds: [opportunistic_pathogens]
    summary: Not a normal stool resident; detection at qualifying coverage is a clinical concern that requires confirmatory testing (culture/PCR) and clinical assessment. Antibiotic choice is a clinical decision, not a report output.
    qualification_needed: confirmatory stool culture or PCR; clinical assessment per IDSA infectious-diarrhoea guidance
    prohibited_language: ["treat with", "antibiotic recommended"]
    assertions:
      - direction: presence
        statement: IDSA guideline on diagnosis and management of infectious diarrhoea, including when antimicrobial therapy is and is not indicated.
        citation: "Shane AL et al. Clin Infect Dis 2017;65:e45. PMID 29053792"
    tags: [enteric_pathogen]
    last_reviewed: "2026-09-07"

  - species: Campylobacter_jejuni
