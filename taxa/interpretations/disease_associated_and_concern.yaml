    guilds: [opportunistic_pathogens]
    summary: Skin and nasal colonist occasionally detected in stool, more often in infants and after antibiotics. Stool DNA is not infection and says nothing about MRSA status without mecA attribution.
    qualification_needed: clinical culture; mecA with carrier attribution for resistance
    prohibited_language: ["staph infection", "MRSA (from stool abundance)"]
    assertions:
      - direction: any
        statement: Review of S. aureus colonisation and infection epidemiology.
        citation: "Tong SYC et al. Clin Microbiol Rev 2015;28:603. PMID 26016486"
    tags: []
    last_reviewed: "2026-09-07"

