  - Solobacterium moorei
  - Parvimonas micra
  - Peptostreptococcus stomatis

caveats:
  - >-
    Proton pump inhibitors raise this group substantially and are extremely
    common. Before reading anything else into a high value, check whether the
    person takes one.
  - >-
    Periodontal disease increases the oral load being swallowed, which raises
    this group without any change in gut barrier function.
  - >-
    A high value is a real observation with several ordinary explanations. It
    appears in the cirrhosis, colorectal cancer, Crohn's and cardiovascular
    patterns, which is precisely why it cannot distinguish between them.

citation: >-
  Schmidt T.S.B., Hayward M.R., Coelho L.P., et al., "Extensive
  transmission of microbes along the gastrointestinal tract", eLife 8:e42693
  (2019), doi:10.7554/eLife.42693; Imhann F. et al., "Proton pump inhibitors
  affect the gut microbiome", Gut 65:740-748 (2016).
