# Oxygen phenotypes for the aerotolerance balance (A09, spec section 6.3).
#
# Only genera whose oxygen relationship is unambiguous in standard cultivation
# literature are listed. A genus left out is *unresolved*, which reduces the
# reported trait coverage and moves nothing into either group - the module is
# built so that an unknown trait costs coverage rather than inventing a side.
#
# `evidence` records how the phenotype was established, strongest first:
#   cultured_strain       a resolved strain with a measured phenotype
#   cultured_species      the species is cultured and its requirement measured
#   genus_generalisation  the genus is uniform enough in culture to generalise
#
# A species entry always beats the genus entry for the same organism, and the
# module labels a genus-derived answer as `genus_generalisation` whatever this
# file says, so a generalisation can never be displayed as strain evidence.
#
# GTDB splits many of these genera with a letter suffix (Blautia_A,
# Ruminococcus_E, Eubacterium_F). The suffix marks a new genus boundary, not a
# different oxygen requirement, so lookups strip it. Where a split genus is
# genuinely different, list it explicitly and it wins.
#
# Sources: E06 (BacDive 2025 cultivation records), E07 (metaTraits/porTraits
# genome-derived traits, used only where cultivation agrees), E04/E05 (the
# MAPI papers, for the aerotolerant/anaerobe partition itself).

schema_version: openbiota.oxygen-traits/1.0
spec_version: 0.8.3
default_evidence: genus_generalisation
default_source_id: E06

