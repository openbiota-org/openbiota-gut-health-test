# --------------------------------------------------------------------------- #
# Species-level records, where the species differs from its genus or where a
# cultivation record is more specific than the generalisation.
# --------------------------------------------------------------------------- #
species:
  Bifidobacterium animalis:
    phenotype: strict_anaerobe
    evidence: cultured_species
    note: >-
      Anaerobic, though notably oxygen-tolerant in food-processing conditions;
      the requirement for growth is still anaerobic.
  Cutibacterium acnes:
    phenotype: strict_anaerobe
    evidence: cultured_species
    note: Aerotolerant anaerobe; requires anaerobic conditions for growth.
  Streptococcus thermophilus:
    phenotype: aerotolerant
    evidence: cultured_species
  Enterococcus faecalis:
    phenotype: aerotolerant
    evidence: cultured_species
  Enterococcus faecium:
    phenotype: aerotolerant
    evidence: cultured_species
  Escherichia coli:
    phenotype: aerotolerant
    evidence: cultured_species
  Klebsiella pneumoniae:
    phenotype: aerotolerant
    evidence: cultured_species
  Akkermansia muciniphila:
    phenotype: strict_anaerobe
    evidence: cultured_species
  Faecalibacterium prausnitzii:
    phenotype: strict_anaerobe
    evidence: cultured_species
    note: Extremely oxygen-sensitive; among the first organisms lost to gut oxygenation.
  Bilophila wadsworthia:
    phenotype: strict_anaerobe
    evidence: cultured_species
    note: Sulfite-reducing anaerobe, not a sulfate reducer (spec section 5.2, F26).
  Methanobrevibacter smithii:
    phenotype: strict_anaerobe
    evidence: cultured_species
    note: Methanogenic archaeon; oxygen-intolerant.
