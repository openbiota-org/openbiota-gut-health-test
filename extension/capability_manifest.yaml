# The normative completeness manifest of BUILD_SPEC_v0.8.3 section 16.
#
# Generated from the specification's own tables, then reviewed. Every row is
# a report *concept*: several rows may share one canonical measurement (M064
# and M090 are the same organism seen twice), and a row bound to a legacy
# metric must not be re-implemented. `binding` is the specification's text;
# `implementation` is what this application actually does about it, and is
# the field the coverage report reads.
#
# implementation states:
#   legacy_surfaced      an existing measurement, newly viewed; value unchanged
#   extension_computed   a new measurement this release calculates
#   evidence_card        a mechanism/context card, where the spec asks for one
#   external_assay       needs an imported laboratory result to have a value
#   not_implemented      owed, and not yet built

schema_version: openbiota.capability-manifest/1.0
spec_version: 0.8.3
features:
- id: A01
  addition: Fibre and carbohydrate utilization
  retain: Existing SCFA panels and fibre advice
  required_output: Fourteen distinct substrate views with shared evidence explicitly linked and
    mandatory specificity discrimination
  implementation: extension_computed
  module: openbiota.extension.substrates
  metric_ids:
  - ext083.carb.cellulose
  - ext083.carb.starch_general
  - ext083.carb.resistant_starch
  - ext083.carb.chitin
  - ext083.carb.pectin
  - ext083.carb.inulin
  - ext083.carb.fos
  - ext083.carb.gos
  - ext083.carb.xos
  - ext083.carb.imo
  - ext083.carb.lactose
  - ext083.carb.beta_glucan
  - ext083.carb.arabinoxylan
  - ext083.carb.galactomannan
  tests:
  - tests/test_extension_substrates.py
  report_section: report.functions
  source_ids:
  - F01
  - F02
  - F03
  - F04
  - F05
  note: All fourteen views and their discrimination rules are built and tested, including each of
    the four overclaims the specification names by hand - GH13 alone is general amylolysis and not
    resistant starch, GH32 alone cannot separate FOS from inulin, GH2/GH42 alone do not establish
    GOS utilisation, and GH18 alone is not an intact chitin pathway. Shared families are declared
    from both sides and a shared gene is counted once in any total. The enzyme reference set the
    rules grade is a dbCAN snapshot installed by "make substrate-refs", which also reconciles the
    declared families against the release's own family-substrate mapping and reports every
    disagreement. Until it is installed every card reads not_assayed, which is not the same as
    these enzymes were not found.

- id: A02
  addition: Fermentation network
  retain: Existing butyrate, propionate, methane, H2S and TMA scores, unchanged
  required_output: Acetate, lactate formation and utilization, succinate formation and
    utilization, hydrogen production and consumption, and a substrate-intermediate-product
    cross-feeding diagram
  implementation: extension_computed
  module: openbiota.extension.fermentation
  metric_ids:
  - ext083.fermentation.acetate_formation
  - ext083.fermentation.lactate_formation
  - ext083.fermentation.lactate_utilisation
  - ext083.fermentation.succinate_formation
  - ext083.fermentation.succinate_utilisation
  - ext083.fermentation.hydrogen_production
  - ext083.fermentation.hydrogen_consumption
  tests:
  - tests/test_extension_substrates.py
  report_section: report.functions
  source_ids:
  - F08
  - F24
  - F25
  note: Thirteen routes across the seven required measurements, each naming the genes it needs and
    the genes that are suggestive but insufficient. Both discriminations the specification names
    are enforced - an AMP-forming acs supports acetate assimilation and not formation, and a
    glycyl-radical enzyme is not IslA without its activase - and the three propionate chemistries
    and the separate sulfur endpoints stay apart. Production and consumption of a metabolite are
    never netted, because a community that both makes and uses hydrogen is not one with no
    hydrogen. Only a route with every required gene draws a solid edge; the rest are dashed
    hypotheses. The existing five scores are read and preserved, not recomputed. Against the
    current 25 panels every route is partial with its missing genes named, which is the honest
    state until the F08-F14 and F24-F27 reference sets are installed.

- id: A03
  addition: Complete vitamin pathway overview
  retain: Existing B2, B7, B9, B12 and K2 panels, unchanged
  required_output: Nine vitamins with separate synthesis, salvage and uptake columns; B1, B3, B5
    and B6 newly reconstructed
  implementation: extension_computed
  module: openbiota.extension.vitamins
  metric_ids:
  - ext083.vitamin.b1
  - ext083.vitamin.b3
  - ext083.vitamin.b5
  - ext083.vitamin.b6
  tests:
  - tests/test_extension_substrates.py
  report_section: report.functions
  source_ids:
  - F06
  - F07
  note: Four vitamins reconstructed and five reused without rescoring. Synthesis, salvage and
    uptake are three columns and are never added, so a transport gene cannot read as production.
    A branch is not a pathway - B1 needs both rings and the synthase that joins them, B5 needs
    both branches and the ligase - and downstream use is not a second production route, which is
    why coaA is absent from the B5 definition. B6 treats the DXP-dependent and DXP-independent
    routes as genuine alternatives, so either complete route suffices and one isolated homolog
    does not. A gene no panel searched for reads not_assayed rather than absent, and a column the
    vitamin has no modelled route for reads not_applicable; both are distinct from a route that
    was looked for and not found. The reused K2 and B12 details say what their genes cannot
    establish - a chain length and a specific corrinoid respectively.

- id: A04
  addition: Protein and nitrogen metabolism
  retain: Existing urease, indole, IPA, p-cresol, BCAA and CutC readings, unchanged
  required_output: Proteolysis, peptide transport, amino-acid fermentation including Stickland,
    branched-chain fatty acid formation, non-urease ammonia routes, and aromatic precursors
  implementation: extension_computed
  module: openbiota.extension.nitrogen
  metric_ids:
  - ext083.nitrogen.proteolysis
  - ext083.nitrogen.peptide_transport
  - ext083.nitrogen.amino_acid_fermentation
  - ext083.nitrogen.bcfa
  - ext083.nitrogen.ammonia
  - ext083.nitrogen.aromatic
  tests:
  - tests/test_extension_substrates.py
  report_section: report.functions
  source_ids:
  - F10
  - F11
  - F12
  - F13
  - F14
  note: Six modules that keep apart what a reader blurs. Protein breakdown, BCAA synthesis and
    BCAA fermentation are three concepts with three readings - the existing bcaa panel measures
    the second and this adds the third, which runs the other way. Proteolysis is deliberately not
    aggregated, because its housekeeping members would make the total track biomass rather than
    dietary protein reaching the colon, and those members are marked so they cannot carry a
    finding on their own. Urease keeps its own reading and the non-urease ammonia routes are
    separate. Microbial phenylacetate and TMA are carried as precursors with the host step named,
    so neither is printed as the circulating PAGln or TMAO the host makes from it.

- id: A05
  addition: Expanded neuroactive metabolism
  retain: Existing GABA, dopamine, tryptamine and histamine readings
  required_output: GABA degradation as a measured addition, synthesis and degradation side by
    side, and the 4-aminobutyrate-to-butyrate route where supported
  implementation: extension_computed
  module: openbiota.extension.biotransform
  metric_ids:
  - ext083.neuro.gaba_synthesis
  - ext083.neuro.gaba_degradation
  - ext083.neuro.gaba_to_butyrate
  tests:
  - tests/test_extension_substrates.py
  report_section: report.functions
  source_ids:
  - F15
  - F16
  note: Synthesis and degradation are shown side by side and never subtracted, because a
    difference between two percentiles is not a net flux. Where a ratio is offered it uses raw
    copies per 100 genomes, prints its formula and shows both components, and it is withheld
    rather than dividing by zero. An independent scorer over the Gut Brain Module definitions
    avoids making a noncommercial binary a production dependency.

- id: A06
  addition: Polyphenol and plant-compound conversion
  retain: Existing readings unchanged
  required_output: Urolithin 9-dehydroxylation, equol conversion and glucosinolate-to-
    isothiocyanate as distinct metric IDs with their own reference distributions
  implementation: extension_computed
  module: openbiota.extension.biotransform
  metric_ids:
  - ext083.polyphenol.urolithin_9_dehydroxylation
  - ext083.polyphenol.equol_daidzein_conversion
  - ext083.diet.glucosinolate_isothiocyanate_conversion
  tests:
  - tests/test_extension_substrates.py
  report_section: report.functions
  source_ids:
  - F19
  - F20
  - F21
  - F22
  - F23
  note: All three ucdCFO components are required and the step is declared as one reaction of the
    ellagitannin pathway rather than the whole of it. UrdA is a declared negative control, and a
    panel matching it withholds the urolithin step rather than publishing the false positive,
    because UrdA acts on urocanate and makes imidazole propionate. Equol needs the validated
    DZNR, DHDR and THDR chemistry - a general reductase domain is not evidence, and the eqlA/B/C
    aliases need strain-specific mapping. The glucosinolate core is carried as the boolean the
    specification states, BT2158 with either BT2156 or BT2157, rather than flattened to a gene
    list. DNA evidence is never a producer metabotype; that needs a substrate challenge.

- id: A07
  addition: GLP-1-related microbial mechanisms
  retain: Existing SCFA, bile-acid and indole readings, unchanged
  required_output: Separate channels for SCFA signalling, bile-acid transformation, indole
    routes and experimentally supported microbial proteins
  implementation: extension_computed
  module: openbiota.extension.biotransform
  metric_ids:
  - ext083.glp1.scfa_signalling
  - ext083.glp1.bile_acid_signalling
  - ext083.glp1.indole_signalling
  - ext083.glp1.microbial_protein
  tests:
  - tests/test_extension_substrates.py
  report_section: report.functions
  source_ids:
  - F43
  note: Four channels kept apart and never summed, because they are not measurements of the same
    thing. FFAR2, FFAR3, GCG, TGR5 and DPP4 are named as host rather than microbial, and none of
    them is a gene any channel searches for - a stool metagenome cannot contain them. Indole
    routes are assigned no universal direction, since the evidence goes both ways and depends on
    exposure and context.

- id: A08
  addition: Mucin, LPS and bile-acid detail
  retain: Existing mucin-associated group, hexa-LPS group and bile-acid scores
  required_output: Mucin glycan CAZymes with substrate context, a lipid-A structural evidence
    table, and BSH preference, bai completeness, HSDH transformations and reconjugation as
    distinct components
  implementation: extension_computed
  module: openbiota.extension.biotransform
  metric_ids:
  - ext083.mucin.glycan_foraging
  - ext083.lps.lipid_a_modification
  - ext083.bile.deconjugation
  - ext083.bile.dehydroxylation
  - ext083.bile.hsdh_transformation
  tests:
  - tests/test_extension_substrates.py
  report_section: report.functions
  source_ids:
  - F33
  - F34
  - F35
  - F36
  - F41
  - F42
  note: Mucin foraging is stated as physiological - capacity is not an image of an eroded mucus
    layer - and mucin enzymes are kept apart from the dietary-fibre CAZymes with gastric and
    colonic substrate context preserved. Lipid A reports gene evidence and its uncertainty rather
    than an endotoxin figure, because one modification gene does not resolve a structure and
    total Gram-negative abundance resolves nothing. Bile chemistry is a graph rather than a
    chain - BSH also reconjugates and some HSDHs act on conjugated substrates - and BileActome
    models are candidate annotations whose rumen validation population supplies no human
    percentile.

- id: A09
  addition: Ecology companion dashboard
  retain: Existing Shannon, evenness, richness and GMWI2
  required_output: Gut community type/context, dominance, Hill diversity, composition ratios, aerotolerance
    balance, functional redundancy and longitudinal resilience
  implementation: extension_computed
  module: openbiota.extension.ecology
  metric_ids:
  - ext083.ecology.effective_shannon_species
  - ext083.ecology.inverse_simpson
  - ext083.ecology.gini_simpson
  - ext083.ecology.dominance_top1
  - ext083.ecology.dominance_top5
  - ext083.ecology.aerotolerant_fraction
  - ext083.ecology.mapi
  - ext083.ecology.composition_unresolved_share
  - ext083.ecology.community_type.distance
  tests:
  - tests/test_extension_ecology.py
  - tests/test_extension_communitytype.py
  report_section: report.community
  source_ids:
  - E01
  - E02
  - E03
  - E04
  - E05
  - E06
  - E07
  note: Diversity, dominance, ratios, aerotolerance, functional redundancy, the genus composition
    view and the community-type classifier all compute for a real sample. The classifier is a
    frozen 2-medoid model trained by scripts/train_community_type.py on 3,027 reference samples
    from 22 studies; nothing clusters at report time. The HACK-top-17 resilience profile is still
    owed because it needs the published 17-taxon manifest, and longitudinal recovery needs three
    eligible baseline samples; both say so in their own rows rather than in this one.

