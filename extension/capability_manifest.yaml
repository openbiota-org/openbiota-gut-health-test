  note: 'Model-assisted scenarios implemented and running: MICOM 0.37.0, AGORA2 species models, osqp.
    Four arms solved on a real sample; published replay reproduced at 1e-8. Evidence-matching mode (SYN
    seeds and ranking) still owed.'
  readiness:
    source_identified: true
    retrievable: true
    bytes_verified: true
    registry_validated: true
    example_reproduced: true
    application_validated: false
    note: solved four arms end-to-end; clinical response remains unvalidated
