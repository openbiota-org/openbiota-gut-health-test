# Section 5.8 — the additional capacities. The specification calls these
# research additions and states that research is a visible evidence level,
# not permission to use untraceable markers, so each carries the same
# declarations a required panel carries.
- id: C5801
  concept: Anaerobic urate degradation
  binding: Curated anaerobic clusters from F28-F29; distinguish oxygen-requiring uricase
    and purine salvage
  implementation: extension_computed
  module: openbiota.extension.capacities
  metric_ids:
  - ext083.capacity.urate_anaerobic
  report_section: report.functions
  source_ids: [F28, F29]
  note: Uricase and purine salvage are measured and shown, and deliberately not summed
    into the anaerobic route. Not a serum urate, which the card states.
- id: C5802
  concept: Putrescine formation
  binding: Putrescine, agmatine and spermidine as separate capacities with
    context-dependent interpretation
  implementation: extension_computed
  module: openbiota.extension.capacities
  metric_ids:
  - ext083.capacity.putrescine
  report_section: report.functions
  source_ids: [F30, F31]
  note: Direction is context-dependent by design. Polyamines are required for
    epithelial renewal and are elevated in tumour tissue.
- id: C5803
  concept: Agmatine formation
  binding: Agmatine as a capacity separate from putrescine and spermidine
  implementation: extension_computed
  module: openbiota.extension.capacities
  metric_ids:
  - ext083.capacity.agmatine
  report_section: report.functions
  source_ids: [F30, F31]
  note: The same decarboxylase serves acid resistance, so a high reading is not
    necessarily about polyamine or neuroactive chemistry.
- id: C5804
  concept: Spermidine formation
  binding: Canonical and validated carboxyaminopropylagmatine alternatives
  implementation: extension_computed
  module: openbiota.extension.capacities
  metric_ids:
  - ext083.capacity.spermidine
  report_section: report.functions
  source_ids: [F30, F31]
  note: Counts the carboxyspermidine route as well as the aminopropyltransferase one.
    Searching only for spermidine synthase reports an absence in most gut Bacteroidetes.
- id: C5805
  concept: Glutathione synthesis
  binding: gshA plus gshB or validated fused gshF; distinguish utilization and recycling
  implementation: extension_computed
  module: openbiota.extension.capacities
  metric_ids:
  - ext083.capacity.glutathione
  report_section: report.functions
  source_ids: [F32]
  note: Reductase and transpeptidase are measured and shown separately, because a
    community that recycles is not one that synthesises.
- id: C5806
  concept: Microbial ethanol formation
  binding: Mixed-acid and heterolactic fermentation, ethanolamine-associated pathways,
    ethanol formation and acetaldehyde transformations where routes can be resolved
  implementation: extension_computed
  module: openbiota.extension.capacities
  metric_ids:
  - ext083.capacity.ethanol
  report_section: report.functions
  source_ids: [C03, C04, C05]
  note: An independently curated adhE panel, named as such rather than claimed as the
    authors' asset. No acetaldehyde-disposal reading is given, because the aldehyde
    dehydrogenase family is not substrate-specific enough for a count over it to mean
    acetaldehyde rather than any other aldehyde.
- id: C5807
  concept: Glucuronidase substrate detail
  binding: Validated loop/domain and catalytic-motif classes; new substrate-specific
    table; no automatic estrogen or drug exposure estimate
  implementation: evidence_card
  module: openbiota.extension.gusclasses
  report_section: report.functions
  source_ids: [F39]
  note: Built, tested, and withheld by its own validation. Loop class assigned by
    pairwise alignment to the E. coli enzyme disagrees with the published structures
    for the divergent gut enzymes - B. fragilis came out Loop 1 where it is mini-Loop 1,
    B. uniformis came out No Loop where it is the Loop 2 type example - so the breakdown
    is not shown. The curated loop alignment, or a profile model built from the solved
    structures, would unlock it; the per-reference counts it needs are already recorded.
- id: C5808
  concept: Microbial drug metabolism
  binding: Experimentally characterized microbial reactions, exact drug and enzyme;
    mechanism/context card with the existing report unchanged; no dose adjustment
  implementation: evidence_card
  module: openbiota.extension.capacities
  report_section: report.functions
  source_ids: [F40]
  note: Four characterised reactions as cards, not measurements. The digoxin card
    records that arginine inhibits rather than increases the reduction.
- id: C1603
  concept: Symptom and condition navigation
  binding: Links from supported findings to the fifteen contexts of section 16.3, each
    listing all contributing features rather than a truncated count
  implementation: evidence_card
  module: openbiota.extension.contexts
  report_section: report.patterns_detail
  note: No context computes a score. Existing disease profiles are linked exactly as
    calculated, and a context without one is an evidence card. The number of
    contributors is labelled a navigation count, not a likelihood.
