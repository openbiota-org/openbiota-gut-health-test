  retain: Existing metabolism, action and matching algorithms
  required_output: Required strain–substrate evidence matching and transparent candidate ranking; optional
    reproducible metabolic scenarios with explicit coverage and uncertainty
  implementation: extension_computed
  module: openbiota.extension.simulation
