- id: A12
  addition: Consolidated action planner
  retain: Existing intervention registry, evidence cards and safety rules
  required_output: One ranked view across every evidence card, a start-here list of one to three,
    the full catalogue by category, tradeoffs and monitoring questions, and a deduplicated food
    checklist
  implementation: extension_computed
  module: openbiota.extension.planner
  metric_ids:
  - ext083.planner.options
  - ext083.planner.findings_addressed
  tests:
  - tests/test_extension_longitudinal.py
  report_section: report.actions
  note: Consolidation over the existing cards, not a replacement; every option points back at the
    cards it came from and nothing appears that the registry does not hold. The sort is
    deterministic down to the identifier and every reason is printed, because this is
    prioritisation and not a predicted probability of benefit. Laboratory and animal evidence
    appears in the ordinary list with its setting named. A supplied allergy removes an option from
    this person start-here list only, leaving the evidence record and its card intact; an unknown
    fact is never a contraindication. A study exposure is shown as what the study did, never
    converted into a dose. Every option carries a question that could actually be answered, and
    none promises colonisation or a score change. The checklist reads shopping items from each
    intervention recorded components rather than from study titles, merges aliases such as
    cacao and cocoa, and keeps materially different products such as cocoa husk apart.

- id: A13
  addition: Longitudinal and context views
  retain: Existing single-sample readings and their references
  required_output: Last-three and full-trajectory views, comparability fingerprint, Bray-Curtis and
    Jaccard distances, recovery envelope and exposure-specific follow-up templates
  implementation: extension_computed
  module: openbiota.extension.longitudinal
  metric_ids:
  - ext083.longitudinal.bray_curtis
  - ext083.longitudinal.jaccard_distance
  - ext083.longitudinal.return_percent
  tests:
  - tests/test_extension_longitudinal.py
  report_section: report.community
  note: A comparability fingerprint records the specimen, participant, lane, tool and database
    versions; a change in any blocking field makes the pair descriptive_only and no distance is
    quoted across it, because that number would measure the method change. Re-analysing one
    specimen keeps its identity and never becomes a second timepoint. The presence floor is fixed
    at 0.1% so a deeper run is not a richer gut, and an empty union is undefined rather than
    perfect agreement. Recovery is computed only for a recorded event with at least three eligible
    baselines and a displacement clearing the baseline envelope; otherwise the displacement is
    shown and the percentage withheld. Four follow-up templates, each with its own question and
    interval; no universal retesting interval. A single sample renders the honest view rather than
    suppressing the section.

- id: A14
  addition: Your information, inputs and assumptions
  retain: Existing metadata inputs, defaults and sequence analyses
  required_output: One combined report section 25 covering supplied facts, effective assumptions,
    optional questionnaire inputs and useful laboratory imports linked to relevant findings
  implementation: extension_computed
  module: openbiota.extension.inputs
  metric_ids:
  - ext083.inputs.register
  tests:
  - tests/test_extension_inputs.py
  report_section: report.context
  note: One register of every supplied fact, effective assumption, absence and optional laboratory
    import, rendered as the report's new section 25 with the four following sections renumbered.
    The existing subject-context ledger is imported rather than redesigned. An assumption can never
    carry a reported value, an absent assay has no imputed normal and produces no normal/abnormal
    classification, and a stored value with no consumer is labelled "Recorded; not used in this
    report". All eight laboratory panels of spec 10.4 are recognised with their destinations; none
    is required for the report to render.

- id: A15
  addition: Integrated layout and navigation
  retain: Existing section structure and readings
  required_output: New readings in their existing domain sections; clickable major-section contents
    on page 3; linked details, complete metric index, evidence links and printable actions
  implementation: extension_computed
  module: openbiota.pdfsynbiotic
  metric_ids:
  - ext083.report.metric_index
  tests:
  - tests/test_pdflinks.py
  - tests/test_extension_communitytype.py
  report_section: report.guide
  note: Page 3 keeps its reading guide and scale legend; the two-engine explanation, the sample-QC
    strip and the assumptions block are removed and their content relocated, and the released space
    carries an "Explore your results" contents table whose every cell is a clickable link generated
    from the stable section anchors. The cover and sections 10/20 carry the "Microbial Functions &
    Metabolism" umbrella with its one-line description; section and metric IDs are unchanged. The
    complete index of the additional measurements sits in the technical section with each metric's
    ID, value, unit, status and home, separating unique measurements from unavailable ones. Section
    numbering after the inserted register is generated from the anchors, and the outline, named
    destinations and internal links were verified on the rendered report.

- id: A16
