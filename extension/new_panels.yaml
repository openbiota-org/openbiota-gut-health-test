  aggregate_reason: Only synthesis is summed. Reductase recycles glutathione that already
    exists and transpeptidase takes it apart; both are measured and shown next to the synthesis
    reading, because a community that recycles heavily is not the same as one that synthesises
    heavily, and adding them together would hide that.
  what_it_is: Your gut bacteria's capacity to make glutathione, the main small-molecule antioxidant
    inside cells.
  made_from: glutamate, cysteine and glycine
  summary: Some gut bacteria synthesise glutathione. This counts those genes. It is not a
    measurement of glutathione in you, and it is not a marker of your own antioxidant status.
  evidence_detail: 'Bacterial glutathione synthesis is real but patchy: many gut anaerobes
    lack the route entirely and import what they need, and the fused gshF enzyme found in
    some Gram-positives does both steps at once, so a search for the two-enzyme route alone
    will miss it. A 2026 study described glutathione handling in Eubacterium rectale specifically.
    What this cannot establish is any effect on your own glutathione: host glutathione is
    made by your own cells from cysteine supply, and there is no established route by which
    bacterial glutathione in the colon becomes host glutathione in the liver.'
  implications:
    higher: More bacterial glutathione synthesis capacity than most samples carry. This says
      nothing about your own glutathione status, which is made by your cells and is not measurable
      from a stool gene count.
    typical: A mid-range amount of bacterial glutathione synthesis capacity, similar to most
      samples. Many gut anaerobes import glutathione rather than making it, so the synthesis
      reading is only part of how a community handles it.
    lower: Less bacterial glutathione synthesis capacity than most samples carry. Read this
      beside the recycling and breakdown readings, and not as a statement about your own antioxidant
      status, which this cannot measure.
  citation: Smirnova G.V., Oktyabrsky O.N., "Glutathione in bacteria", Biochemistry (Moscow)
    70:1199-1211 (2005), doi:10.1007/s10541-005-0248-3.
- name: ethanol
  metabolite: Microbial ethanol formation
  category: metabolite
  higher_means: context-dependent
  evidence_strength: preliminary
  description: Bacterial ethanol formation, centred on the bifunctional enzyme identified
    in the high-alcohol-producing Klebsiella work, together with the ethanolamine route that
    is a separate chemistry sharing part of the same space.
  pathway: acetyl-CoA -> acetaldehyde -> ethanol, both steps by the bifunctional adhE; pyruvate
    -> acetaldehyde -> ethanol via pyruvate decarboxylase and an alcohol dehydrogenase; ethanolamine
    -> acetaldehyde + ammonia via the ethanolamine ammonia-lyase route
  targets:
  - id: ADHE
    gene: adhE
    n_uniprot: 3947
    label: adhE (bifunctional aldehyde-alcohol dehydrogenase)
    query: Aldehyde-alcohol dehydrogenase
  - id: ADHP
    gene: adhP
    n_uniprot: 286
    label: adhP (alcohol dehydrogenase, propanol-preferring)
    query: Alcohol dehydrogenase, propanol-preferring
  - id: PDC
    gene: pdc
    n_uniprot: 761
    label: pdc (pyruvate decarboxylase)
    query: Pyruvate decarboxylase
  - id: EUTB
    gene: eutB
    n_uniprot: 50
    label: eutB (ethanolamine ammonia-lyase, heavy subunit)
    query_raw: (protein_name:"Ethanolamine ammonia-lyase" AND protein_name:"heavy")
    max_sequences: 200
  - id: EUTC
    gene: eutC
    n_uniprot: 28
    label: eutC (ethanolamine ammonia-lyase, light subunit)
    query_raw: (protein_name:"Ethanolamine ammonia-lyase" AND protein_name:"light")
    max_sequences: 200
  aggregate_from:
  - ADHE
  aggregate_reason: Only adhE is summed into the panel value. It is the bifunctional enzyme
    the high-alcohol-producing Klebsiella work identifies, and it performs both steps from
    acetyl-CoA to ethanol on its own. The others are different chemistries that can end at
    the same molecule, and they are reported individually rather than folded into one number
    that would no longer mean ethanol from adhE.
  what_it_is: Capacity of your gut bacteria to produce ethanol, and the separate ethanolamine
    route that produces acetaldehyde.
  made_from: dietary sugars, and ethanolamine from cell membrane turnover
  summary: Some gut bacteria make ethanol. High-producing strains have been linked to fatty
    liver disease in specific studies. This is a gene count and does not diagnose anything.
  evidence_detail: 'The clearest evidence concerns particular high-alcohol-producing Klebsiella
    pneumoniae strains found in people with non-alcoholic fatty liver disease, where colonising
    mice with those strains produced liver changes. That is a strain-level finding: carrying
    adhE is ordinary and most bacteria that carry it are not high producers, so this reading
    cannot identify auto-brewery syndrome or fatty liver. Acetaldehyde, the intermediate,
    is the genotoxic part of this chemistry. A separate reading for acetaldehyde disposal
    is deliberately not given, because the aldehyde dehydrogenase family is not substrate-specific
    enough for a count over it to mean acetaldehyde rather than any other aldehyde.'
  implications:
    higher: More ethanol-forming gene capacity than most samples carry. Carrying adhE is common
      and is not the same as being a high-producing strain, which is what the fatty liver
      disease studies identified.
    typical: A mid-range amount of ethanol-forming gene capacity, similar to most samples
      in the reference set. Endogenous ethanol production is normal at low levels and this
      reading does not estimate how much is produced.
    lower: Less ethanol-forming gene capacity than most samples carry. This is a count of
      genes rather than a measurement of ethanol, and no clinical conclusion about liver health
      follows from it in either direction.
  citation: Yuan J. et al., "Fatty liver disease caused by high-alcohol-producing Klebsiella
    pneumoniae", Cell Metab 30:675-688 (2019), doi:10.1016/j.cmet.2019.08.018.
- name: p9
  metabolite: P9 protein (experimental)
  category: metabolite
  higher_means: context-dependent
  evidence_strength: preliminary
  description: One Akkermansia muciniphila protein with experimental evidence for an effect
    on GLP-1 secretion, detected from the exact sequence that was tested rather than from
    the species. The protease family it belongs to competes against it here instead of counting
    towards it.
  pathway: Amuc_1631, a carboxyl-terminal protease of the peptidase S41A family, reported
    to act on a host receptor in cell and mouse experiments
  targets:
  - id: P9
    gene: Amuc_1631
    n_uniprot: 1
    max_sequences: 1
    min_identity: 85.0
    label: P9 / Amuc_1631 (the exact experimentally tested sequence)
    query_raw: (accession:B2UM07)
  decoys:
  - id: S41A
    label: the wider carboxyl-terminal protease family this protein belongs to
    query_or:
    - Carboxyl-terminal processing protease
    - Tail-specific protease
    - Carboxyl-terminal protease
    max_sequences: 2500
    note: 'P9 belongs to the peptidase S41A family, so its relatives are the most likely source
      of a false match. They are counted here, against the target rather than with it: a homolog
      of a protease family is not the protein that was tested.'
  - id: WRONGID
    label: Amuc_1831, the identifier this protein is sometimes confused with
    query_raw: (accession:B2UN38) OR (protein_name:"Four helix bundle protein")
    max_sequences: 800
    note: 'Amuc_1831 is a 98-residue four helix bundle protein against P9''s 748 residues,
      and belongs to no protease family. It has been cited for P9 in error, so it is searched
      for separately: a read that belongs to it lands here and not on the target.'
  aggregate_from:
  - P9
  aggregate_reason: One target, because the specification requires this detector to be the
    experimentally tested sequence. The family and the misattributed identifier are measured
    as competitors and are never added in.
  what_it_is: Whether the reads carry the exact Akkermansia protein that was tested in the
    GLP-1 experiments, as opposed to something in the same family.
  made_from: not a metabolite; this is a bacterial protein-coding gene
  summary: A single protein with preclinical evidence. Finding its gene is a long way from
    a hormone response, and this is not comparable to a GLP-1 medication.
  evidence_detail: 'The protein was purified and tested in cell and mouse work, where it increased
    GLP-1 secretion through a host receptor. That is experimental evidence about a protein,
    not about a person: what this screen can say is whether reads map to the tested sequence
    at high identity. Detection is deliberately strict. One reference sequence means a diverged
    version in another strain will not reach the identity floor, and is reported as unresolved
    rather than counted, because transferring a functional annotation onto a divergent homolog
    is exactly the error the specification forbids here. Neither secretion nor any GLP-1 level
    is measured by these reads.'
  implications:
    higher: Reads map to the experimentally tested sequence. That is a gene being present,
      not a protein being made or secreted, and it says nothing about your own GLP-1 or about
      GLP-1 medication.
    typical: A mid-range amount of read evidence on the tested sequence, read beside the family
      competition shown with it. Neither number is a hormone level, and the evidence for an
      effect is preclinical.
    lower: Little or no read evidence on the exact tested sequence. Because the detector is
      one sequence, a diverged version in another strain would also read this way, so this
      is not evidence that no such protein is present.
  citation: Yoon H.S. et al., "Akkermansia muciniphila secretes a protein P9 that improves
    glucose homeostasis", Nat Microbiol 6:563-573 (2021), doi:10.1038/s41564-021-00880-5.
- name: peptides
  metabolite: Peptide uptake
  category: metabolite
  higher_means: context-dependent
  evidence_strength: limited
  description: Capacity to take whole peptides in, which is a separate capability from cutting
    proteins up outside the cell. An organism can do either without the other, and the two
    are measured separately for that reason.
  pathway: extracellular peptides -> ABC oligopeptide transport (oppABCDF) or proton-coupled
    di- and tripeptide transport (dtpT) -> intracellular peptides; branched-chain amino acids
    enter by their own carriers
  targets:
  - id: OPPA
    gene: oppA
    n_uniprot: 3343
    label: oppA (oligopeptide-binding protein, the ABC system's receptor)
    query: Oligopeptide-binding protein
  - id: OPPB
    gene: oppB
    n_uniprot: 11380
    max_sequences: 2500
    label: oppB (oligopeptide transport permease)
    query: Oligopeptide transport system permease
  - id: OPPD
    gene: oppD
    n_uniprot: 3591
    label: oppD (oligopeptide transport ATP-binding subunit)
    query: Oligopeptide transport ATP-binding
  - id: DTPT
    gene: dtpT
    n_uniprot: 915
    label: dtpT (proton-coupled di- and tripeptide transporter)
    query: Di-/tripeptide transporter
  - id: LIVK
    gene: livK
    n_uniprot: 164
    label: livK (leucine-binding protein)
    query: Leucine-specific-binding protein
  - id: BRNQ
    gene: brnQ
    n_uniprot: 32
    max_sequences: 200
    label: brnQ (branched-chain amino acid carrier)
    query: Branched-chain amino acid transport system 2 carrier
  aggregate_from:
  - OPPA
  - DTPT
  aggregate_reason: 'The two independent uptake systems are summed: the ABC oligopeptide receptor
    and the proton-coupled di- and tripeptide transporter. The other oppABCDF subunits are
    measured and shown as route detail, because adding every subunit would count one transporter
    four times.'
  what_it_is: How much capacity your gut bacteria have to import peptides whole, rather than
    breaking them down outside the cell first.
  made_from: peptides from dietary and host protein
  summary: Taking peptides in is a different capability from cutting proteins up. This is
    the uptake side, and it is a gene count rather than a rate.
  evidence_detail: 'Peptide transport is how most gut bacteria actually acquire amino acids:
    importing a short peptide costs less than making each residue, and the transporters are
    among the most highly expressed genes in gut isolates. What this cannot tell you is how
    much dietary protein reaches your colon. That is set by how much you eat and how well
    your small intestine digests it, and a transporter count in stool speaks to neither. Nor
    does high uptake capacity mean more protein fermentation: the same peptides can be built
    into bacterial protein instead, which is the opposite outcome.'
  implications:
    higher: More peptide-uptake capacity than most samples carry. That can mean peptides are
      being used for growth rather than fermented, so it does not point in a single direction
      on its own.
    typical: A mid-range amount of peptide-uptake capacity, which is what most samples carry.
      Read it beside the protein-fermentation reading rather than on its own, since the same
      peptides can go either way.
    lower: Less peptide-uptake capacity than most samples carry. Bacteria can also take in
      free amino acids and make their own, so this is not a limit on the community's nitrogen
      supply.
  citation: Detmers F.J., Lanfermeijer F.C., Poolman B., "Peptides and ATP binding cassette
    peptide transporters", Res Microbiol 152:245-258 (2001), doi:10.1016/s0923-2508(01)01196-2.
