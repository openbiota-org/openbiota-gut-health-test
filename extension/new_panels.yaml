    isothiocyanates are present in your sample.
  made_from: Glucosinolates from broccoli, rocket and other cruciferous vegetables
  summary: Measured against the B. thetaiotaomicron locus itself at a high identity floor,
    because this route is described in one organism rather than carried by an enzyme family.
  evidence_detail: 'Three reference sequences is the right size for a reaction characterised
    in a single organism, and the high identity floor is what keeps a distant homolog from
    matching; the consequence is that this under-calls rather than over-calls. This bacterial
    route is not plant myrosinase, which is an enzyme of the vegetable and is destroyed by
    cooking, and it is not the only bacterial route described. A gene finding is also not
    a conversion: whether you actually produce isothiocyanates is settled by a substrate challenge
    with metabolomics, which can be imported beside this.'
