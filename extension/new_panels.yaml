  aggregate_reason: 'One backbone enzyme from each of four unrelated substrate classes - starch,
    galactoside, xylan and pectin. The sum is a breadth measure and is deliberately not a
    total of all the enzymes: the per-substrate readings in the functions section are where
    specificity is judged.'
  what_it_is: The breadth of dietary carbohydrates your gut bacteria carry enzymes for, across
    starch, pectin, xylan and galactoside chemistry.
  made_from: Dietary fibre, resistant starch and other carbohydrates reaching the colon
  summary: Fourteen individual fibre and starch readings are built from these enzymes in the
    functions section. This panel is their shared evidence and a breadth summary; the specificity
    judgement happens per substrate.
  evidence_detail: 'A carbohydrate-active enzyme family usually acts on a class of molecules
    rather than on one, so a family alone answers a broader question than the one a reader
    asks. GH13 supports general amylolysis but not resistant starch in particular; a beta-galactosidase
    is carried by every lactose-using organism and does not establish galactooligosaccharide
    use. The per-substrate readings therefore state whether the evidence is substrate-specific
    or only class-level, and a gene shared between two substrates appears on both cards and
    is counted once in any total. What none of this measures is how much fibre you eat: it
    is the capacity to use what arrives.'
  implications:
    higher: Your community carries enzymes for a wider range of dietary carbohydrates than
      most samples. Breadth of this kind travels with dietary variety, and it means fewer
      fibres pass through unused.
    typical: Mid-range breadth of carbohydrate-active enzymes, which is the usual finding
      in an adult gut. The individual substrate readings in this section are more informative
      than the total, because they say which fibres in particular your community can open.
    lower: 'Fewer carbohydrate-active enzyme families than most samples carry. That can follow
      a narrow diet, and it is capacity rather than intake: adding a fibre nothing here can
      open would not help.'
  citation: 'Drula E. et al., "The carbohydrate-active enzyme database: functions and literature",
    Nucleic Acids Res 50:D571-D577 (2022), doi:10.1093/nar/gkab1045; Zheng J. et al., "dbCAN3",
    Nucleic Acids Res 51:W115-W121 (2023), doi:10.1093/nar/gkad328.'
  expected_copies_per_genome: 2
- name: fermentation
  metabolite: Fermentation routes and cross-feeding
  category: metabolite
  higher_means: context-dependent
  evidence_strength: limited
  description: The routes behind the short-chain fatty acids, and the hydrogen and sulfur
    chemistry that runs alongside them. Production and consumption of a metabolite are measured
    separately and are never netted.
  pathway: sugars -> pyruvate -> acetate (pta, ackA), lactate (ldhA), succinate (frdA) ->
    propionate and butyrate by several distinct routes
  targets:
  - id: PTA
    gene: pta
    label: pta (phosphate acetyltransferase)
    query: Phosphate acetyltransferase
    n_uniprot: 13306
  - id: ACSB
    gene: acsB
    label: acsB (CO-methylating acetyl-CoA synthase)
    query: CO-methylating acetyl-CoA synthase
    n_uniprot: 480
  - id: COOS
    gene: cooS
    label: cooS (carbon monoxide dehydrogenase)
    query: Carbon monoxide dehydrogenase
    n_uniprot: 21470
  - id: FHS
    gene: fhs
    label: fhs (formate--tetrahydrofolate ligase)
    query: Formate--tetrahydrofolate ligase
    n_uniprot: 7453
  - id: LDHD
    gene: ldhA
    label: ldhA (D-lactate dehydrogenase)
    query: D-lactate dehydrogenase
    n_uniprot: 5639
  - id: MUTB
    gene: mutB
    label: mutB (methylmalonyl-CoA mutase)
    query: Methylmalonyl-CoA mutase
    n_uniprot: 19630
  - id: SCPA
    gene: scpA
    label: scpA (propionyl-CoA:succinate CoA transferase)
    query: Propionyl-CoA:succinate CoA transferase
    n_uniprot: 344
  - id: PDUC2
    gene: pduC
    label: pduC (propanediol dehydratase large subunit)
    query: Propanediol dehydratase large subunit
    n_uniprot: 222
  - id: HYDA
    gene: hydA
    label: hydA ([FeFe] hydrogenase)
    query: Iron hydrogenase 1
    n_uniprot: 157
  - id: LDHL
    gene: ldhL
    n_uniprot: 16623
    label: ldhL (L-lactate dehydrogenase, the other stereoisomer)
    query: L-lactate dehydrogenase
  - id: XFP
    gene: xfp
    n_uniprot: 6384
    label: xfp (phosphoketolase, the heterolactic and bifid shunt route)
    query: phosphoketolase
  aggregate_from:
  - PTA
  - LDHD
  aggregate_reason: 'Phosphotransacetylase and D-lactate dehydrogenase, the committed steps
    of the two commonest fermentation endpoints. Acetate kinase and fumarate reductase are
    deliberately absent: the butyrate and imidazole-propionate panels already carry them as
    decoys, and duplicating a target in a shared database takes reads from the established
    reading rather than adding one.'
  what_it_is: The specific routes your bacteria use to ferment carbohydrate into acids and
    gases.
  made_from: Pyruvate and other products of carbohydrate fermentation
  summary: The existing butyrate, propionate, methane and sulfide readings say how much capacity
    is present. These say by which chemistry.
  evidence_detail: 'Propionate is reached by three unrelated routes - succinate, acrylate
    and propanediol - and a single propionate number cannot distinguish them, which matters
    because they use different substrates. Acetate is the case where a gene count misleads
    most easily: an AMP-forming acetyl-CoA synthetase runs towards acetate assimilation rather
    than formation, so finding it is evidence the community can consume acetate, not make
    it, and it is excluded here. Hydrogen is shown as production and consumption separately
    because a healthy community makes a great deal of it and netting the two would hide both.'
  implications:
    higher: More fermentation-route capacity than most samples carry, across the acetate and
      lactate chemistry measured here. The individual route readings show which specific chemistries
      are complete.
    typical: Mid-range fermentation route capacity, which is the usual finding in an adult
      gut. The individual route readings show which chemistries are complete and which are
      missing a step, and that detail matters more than this total.
    lower: Fewer of these routes than most samples carry. The per-route readings show which
      are incomplete and which genes were missing.
  citation: Reichardt N. et al., "Phylogenetic distribution of three pathways for propionate
    production within the human gut microbiota", ISME J 8:1323-1335 (2014), doi:10.1038/ismej.2014.14;
    Louis P., Flint H.J., Environ Microbiol 19:29-41 (2017), doi:10.1111/1462-2920.13589.
- name: nitrogen
  metabolite: Protein and nitrogen metabolism
  category: metabolite
  higher_means: context-dependent
  evidence_strength: limited
  description: 'Protein and amino-acid handling: peptide uptake, amino-acid fermentation including
    Stickland pairs, branched-chain fatty acid formation, and the non-urease routes to ammonia.
    Urease keeps its own reading.'
  pathway: protein -> peptides (peptidases, transport) -> amino acids -> fermentation to branched-chain
    fatty acids, ammonia and aromatic precursors
  targets:
  - id: PEPT
