schema_version: openbiota.new-panels/1.0
spec_version: 0.8.3
panels:
- name: thiamine
  metabolite: Vitamin B1 (thiamine)
  category: vitamin
  higher_means: favourable
  evidence_strength: limited
  description: 'Thiamine synthesis. The thiazole and pyrimidine rings are built separately
    and joined by thiamine phosphate synthase, so all three are measured: either ring on its
    own makes an intermediate and stops.'
  pathway: thiazole (thiG) + hydroxymethylpyrimidine (thiC) -> thiE -> thiamine phosphate
  targets:
  - id: THIE
    gene: thiE
    label: thiE (thiamine phosphate synthase)
    query: Thiamine phosphate synthase
    n_uniprot: 26160
  - id: THIC
    gene: thiC
    label: thiC (phosphomethylpyrimidine synthase)
    query: Phosphomethylpyrimidine synthase
    n_uniprot: 11962
  - id: THID
    gene: thiD
    label: thiD (phosphomethylpyrimidine kinase)
    query: Phosphomethylpyrimidine kinase
    n_uniprot: 7548
  - id: THIM
    gene: thiM
    label: thiM (hydroxyethylthiazole kinase)
    query: Hydroxyethylthiazole kinase
    n_uniprot: 5952
  - id: THIG
    gene: thiG
    label: thiG (thiazole synthase)
    query: Thiazole synthase
    n_uniprot: 9000
  - id: THIH
    gene: thiH
    label: thiH (2-iminoacetate synthase)
    query: 2-iminoacetate synthase
    n_uniprot: 2265
  - id: THIS
    gene: thiS
    label: thiS (sulfur carrier protein)
    query: Sulfur carrier protein ThiS
    n_uniprot: 13407
  - id: THIB
    gene: thiB
    n_uniprot: 1535
    label: thiB (thiamine-binding protein, uptake not synthesis)
    query: Thiamine-binding periplasmic protein
  - id: THIP
    gene: thiP
    n_uniprot: 1952
    label: thiP (thiamine transport permease, uptake not synthesis)
    query: Thiamine transport system permease
  - id: THIQ
    gene: thiQ
    n_uniprot: 614
    label: thiQ (thiamine import ATP-binding, uptake not synthesis)
    query: Thiamine import ATP-binding protein
  aggregate_from:
  - THIE
  - THIC
  - THIG
  aggregate_reason: The coupling step and both rings. Their sum tracks complete synthesis
    better than any one, and the salvage kinases are reported separately because salvage is
    not synthesis.
  what_it_is: Your gut bacteria's capacity to build thiamine from scratch, rather than only
    take in thiamine that is already there.
  made_from: Built de novo by bacteria from a thiazole ring and a pyrimidine ring, joined
    by thiamine phosphate synthase
  summary: Most gut species cannot make thiamine and depend on the ones that can. This counts
    how much of your community carries the complete route.
  evidence_detail: 'Magnusdottir and colleagues reconstructed B-vitamin synthesis across gut
    genomes and found thiamine synthesis in a minority of them, with most species depending
    on what others make or on what arrives in food. That makes thiamine one of the clearer
    cases of cross-feeding in the gut, and it is why the two rings and their coupling step
    are counted separately: a community can carry the branches without the synthase that joins
    them. What this cannot tell you is your thiamine status. Dietary thiamine is absorbed
    in the small intestine, upstream of where most of this synthesis happens, and deficiency
    is a clinical diagnosis rather than a stool one.'
  implications:
    higher: More of your bacteria carry a complete route to thiamine than in most samples.
      The colon absorbs little of what they make, so the likeliest consequence is within the
      community, where thiamine-dependent species have a nearer source.
    typical: Your community's thiamine synthesis capacity sits in the middle of the reference
      range. Most gut species cannot make thiamine and rely on the ones that can, so a middling
      value is the ordinary arrangement rather than a shortfall.
    lower: Fewer complete thiamine routes than most people carry. This says nothing about
      your vitamin B1 status, which comes from food and is absorbed before the colon.
  citation: Magnusdottir S., Ravcheev D., de Crecy-Lagard V., Thiele I., "Systematic genome
    assessment of B-vitamin biosynthesis suggests co-operation among gut microbes", Front
    Genet 6:148 (2015), doi:10.3389/fgene.2015.00148.
- name: niacin
  metabolite: Vitamin B3 (niacin and NAD precursors)
  category: vitamin
  higher_means: favourable
  evidence_strength: limited
  description: NAD synthesis by the de-novo aspartate route, kept apart from nicotinamide
    salvage. Salvaging an intact pyridine ring is not the same as building one, and the two
    reach NAD by different chemistry.
  pathway: aspartate -> quinolinate (nadB, nadA) -> NaMN (nadC) -> NAD
  targets:
  - id: NADA
    gene: nadA
    label: nadA (quinolinate synthase)
    query: Quinolinate synthase
    n_uniprot: 15076
  - id: NADB
    gene: nadB
    label: nadB (L-aspartate oxidase)
    query: L-aspartate oxidase
    n_uniprot: 13959
  - id: NADC
    gene: nadC
    label: nadC (nicotinate-nucleotide pyrophosphorylase)
    query: Nicotinate-nucleotide pyrophosphorylase [carboxylating]
    n_uniprot: 13255
  - id: NADD
    gene: nadD
    label: nadD (nicotinate-nucleotide adenylyltransferase)
    query: Nicotinate-nucleotide adenylyltransferase
    n_uniprot: 18873
  - id: NADE
    gene: nadE
    label: nadE (NAD synthetase)
    query: NAD synthetase
    n_uniprot: 476
  - id: PNCA
    gene: pncA
    n_uniprot: 16636
    max_sequences: 2500
    label: pncA (nicotinamidase, salvage not synthesis)
    query: Nicotinamidase
  - id: PNCB
    gene: pncB
    n_uniprot: 15379
    max_sequences: 2500
    label: pncB (nicotinate phosphoribosyltransferase, salvage)
    query: Nicotinate phosphoribosyltransferase
  - id: PNUC
    gene: pnuC
    n_uniprot: 6977
    max_sequences: 2500
    label: pnuC (nicotinamide riboside transporter, uptake)
    query: Nicotinamide riboside transporter
  decoys:
  - id: NADSALV
    label: nicotinamide and nicotinate salvage
    query_or:
    - Nicotinamidase
    - Nicotinate phosphoribosyltransferase
    note: Salvage recovers a ring that already exists and is close to universal. Holding it
      out of the target set is what makes this a de-novo measurement rather than a census.
  aggregate_from:
  - NADA
  - NADB
  - NADC
  aggregate_reason: Three consecutive steps of one obligate route from aspartate. Their sum
    is steadier than any one of them.
  what_it_is: Whether your bacteria can build the niacin ring from aspartate, as distinct
    from recycling nicotinamide that already exists.
  made_from: Built de novo from aspartate through quinolinate, or salvaged from nicotinamide
  summary: The de-novo route and the salvage route both end at NAD. This measures the first
    and deliberately excludes the second.
  evidence_detail: 'A gene count that pooled the two routes would report almost every community
    as a producer, because salvage is close to universal. Rodionov and colleagues mapped both
    across gut genomes and found the de-novo route much less common, which is why the salvage
    enzymes are held out as a decoy set here rather than counted as production. Niacin is
    also one of the vitamins where host and bacterial supply are hard to separate: your own
    cells make NAD from tryptophan, and colonic absorption of bacterial niacin is limited.'
  implications:
    higher: More of your bacteria carry the aspartate route to the niacin ring than in most
      samples. They are building the ring rather than recycling one.
    typical: Your community's de-novo niacin capacity is mid-range, which is the usual finding.
      Most gut bacteria salvage nicotinamide rather than building the ring from aspartate,
      and this reading deliberately does not count that salvage.
    lower: Fewer bacteria here carry the de-novo route. They can still salvage nicotinamide,
      and your own niacin status depends on diet and on tryptophan rather than on this.
  citation: Rodionov D.A. et al., "Micronutrient requirements and sharing capabilities of
    the human gut microbiome", Front Microbiol 10:1316 (2019), doi:10.3389/fmicb.2019.01316.
- name: pantothenate
  metabolite: Vitamin B5 (pantothenate)
  category: vitamin
  higher_means: favourable
  evidence_strength: limited
  description: Pantothenate synthesis from both of its branches. Pantoate and beta-alanine
    are made separately and joined by pantothenate synthetase. Downstream use of pantothenate
    to make coenzyme A is consumption, not a second route to production, and is deliberately
    not counted.
  pathway: pantoate (panB, panE) + beta-alanine (panD) -> panC -> pantothenate
  targets:
  - id: PANC
    gene: panC
    label: panC (pantothenate synthetase)
    query: Pantothenate synthetase
    n_uniprot: 15329
  - id: PANB
    gene: panB
    label: panB (ketopantoate hydroxymethyltransferase)
    query: 3-methyl-2-oxobutanoate hydroxymethyltransferase
    n_uniprot: 16547
  - id: PAND
    gene: panD
    label: panD (aspartate 1-decarboxylase)
    query: Aspartate 1-decarboxylase
    n_uniprot: 12006
  - id: PANE
    gene: panE
    label: panE (ketopantoate reductase)
    query: 2-dehydropantoate 2-reductase
    n_uniprot: 18311
  - id: PANF
    gene: panF
    n_uniprot: 1776
    label: panF (pantothenate symporter, uptake not synthesis)
    query: Sodium/pantothenate symporter
  aggregate_from:
  - PANC
  - PANB
  - PAND
  aggregate_reason: Both branches and the ligase that joins them. A community with only one
    branch makes an intermediate and stops.
  what_it_is: Whether your bacteria can build pantothenate from both of its branches, rather
    than only use the vitamin once it exists.
  made_from: Built de novo from pantoate and beta-alanine, joined by pantothenate synthetase
  summary: Pantothenate is the precursor of coenzyme A, so the enzymes that consume it are
    universal and the enzymes that make it are not. Only the making is counted here.
  evidence_detail: Every living cell needs coenzyme A, so counting the consuming step would
    turn every organism into a producer; coaA is deliberately absent from this panel for that
    reason. Magnusdottir and colleagues found pantothenate synthesis in roughly half the gut
    genomes they reconstructed, with the beta-alanine branch the more commonly missing of
    the two, which is why that branch is measured on its own as well as in the total.
  implications:
    higher: More complete pantothenate routes than most samples carry, with both the pantoate
      and beta-alanine branches present along with the ligase that joins them into the finished
      vitamin.
    typical: Mid-range pantothenate synthesis capacity, which is the usual finding. About
      half of gut species can build it from both branches and the rest take up what is already
      available, so a middling value reflects the ordinary division of labour.
    lower: Fewer complete routes here. Pantothenate is widespread in food and deficiency is
      rare, so this is a statement about your bacteria rather than about you.
  citation: Magnusdottir S., Ravcheev D., de Crecy-Lagard V., Thiele I., Front Genet 6:148
    (2015), doi:10.3389/fgene.2015.00148.
- name: b6
  metabolite: Vitamin B6 (pyridoxal phosphate)
  category: vitamin
  higher_means: favourable
  evidence_strength: limited
  description: Both documented routes to vitamin B6, treated as alternatives. The DXP-independent
    route is the common bacterial one; the DXP-dependent route is found in Escherichia coli
    and its relatives. Either complete route is enough.
  pathway: pdxS with pdxT (DXP-independent), or pdxA with pdxJ (DXP-dependent) -> pyridoxal
    5-phosphate
  targets:
  - id: PDXS
    gene: pdxS
    label: pdxS (PLP synthase
    synthase subunit): null
    query: Pyridoxal 5'-phosphate synthase subunit PdxS
    n_uniprot: 6388
  - id: PDXT
    gene: pdxT
    label: pdxT (PLP synthase
    glutaminase subunit): null
    query: Pyridoxal 5'-phosphate synthase subunit PdxT
    n_uniprot: 5961
  - id: PDXA
    gene: pdxA
    label: pdxA (4-hydroxythreonine-4-phosphate dehydrogenase)
    query: 4-hydroxythreonine-4-phosphate dehydrogenase
    n_uniprot: 13631
  - id: PDXJ
    gene: pdxJ
    label: pdxJ (pyridoxine 5-phosphate synthase)
    query: Pyridoxine 5'-phosphate synthase
    n_uniprot: 9769
  - id: PDXH
    gene: pdxH
    n_uniprot: 11770
    max_sequences: 2500
    label: pdxH (pyridoxine 5'-phosphate oxidase, salvage)
    query: Pyridoxine/pyridoxamine 5'-phosphate oxidase
  - id: PDXK
    gene: pdxK
    n_uniprot: 7832
    max_sequences: 2500
    label: pdxK (pyridoxal kinase, salvage)
    query: Pyridoxal kinase
  aggregate_from:
  - PDXS
  - PDXA
  aggregate_reason: One marker from each alternative route, summed because either route produces
    the vitamin. The partner subunits are reported separately so that an incomplete route
    stays visible as incomplete.
  what_it_is: Whether your bacteria carry either of the two known routes to vitamin B6.
  made_from: Built de novo by one of two unrelated routes, DXP-dependent or DXP-independent
  summary: Two unrelated chemistries reach the same vitamin. Requiring both would call almost
    every community unable to make B6; accepting one isolated subunit would call almost all
    of them able to.
  evidence_detail: The DXP-independent route, a PdxS synthase working with its PdxT glutaminase,
    is the one most bacteria use; the DXP-dependent route through PdxA and PdxJ is found in
    Escherichia coli and its relatives. They are alternatives, so both are measured and the
    partner subunits are shown separately. Pyridoxal phosphate is the cofactor for most amino-acid
    chemistry in the cell, which is why the capacity is common without being universal.
  implications:
    higher: More of your bacteria carry a complete B6 route than in most samples, by one or
      other of the two chemistries.
    typical: Your community's B6 synthesis capacity sits in the middle of the reference range.
      Pyridoxal phosphate is the cofactor for most amino-acid chemistry in a cell, so the
      capacity to make it is common without being universal, and a middling value is the ordinary
      finding.
    lower: Fewer complete B6 routes here than in most samples. Your own B6 status comes from
      diet and is absorbed before the colon.
  citation: Rodionov D.A. et al., Front Microbiol 10:1316 (2019), doi:10.3389/fmicb.2019.01316;
    Fitzpatrick T.B. et al., Biochem J 407:1-13 (2007), doi:10.1042/BJ20070765.
- name: carbohydrates
