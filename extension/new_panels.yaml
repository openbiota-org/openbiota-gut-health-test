  made_from: ellagitannins in pomegranate, walnuts, raspberries and strawberries
  summary: Only some people's microbiomes make urolithin A. This measures the published enzyme
    for the final step; it is not a urolithin measurement.
  evidence_detail: 'The enzyme responsible was identified in 2025 as a dehydroxylase encoded
    by an operon in gut Enterocloster species, and this panel holds the three proteins from
    that record rather than a gene-symbol search, which returns an unrelated fungal protein.
