  - syn_id: SYN017
    source_ref: S14
    label: DS-01 bundle
    probiotic:
      taxon: multiple
      strain_designation: >-
        A 24-strain bundle. The strains are named in the source but the record
        stays atomic.
      dose: 53.6 billion AFU
    substrate:
      name: pomegranate extract
      preparation: 400 mg, greater than 40% polyphenols
      residual_sugars: null
    setting: human_randomised_trial
    design: A trial of the bundle as supplied.
    arms_available: [bundle, control]
    arms_missing: [component_arms]
    outcome_type: gastrointestinal_symptoms
    outcome: Positive gastrointestinal outcomes for the tested bundle.
    demonstrated_synergy: null
    why_it_matters: >-
      The dose is in AFU and not CFU, which is a different unit and not
