    probiotic:
      taxon: Bifidobacterium longum subsp. infantis
      strain_designation: LMG 11588
      dose: 1e8 CFU/mL
    substrate:
      name: six-HMO blend
      preparation: >-
        2.5 g total HMO per litre, as 3FL, 2FL, DFL, 3SL, 6SL and LNT. The
        proportions differ by donor age and are part of the identity: infant
        13.5/50.1/5.9/6.0/8.2/16.3 wt%, toddler 37.4/29.3/3.4/14.4/5.3/10.2 wt%.
      residual_sugars: null
    setting: ex_vivo_colonic_reactor
    design: >-
      48-hour colonic reactors, the same six donors sampled at about three
      months and about twelve months. Four core conditions plus a fifth adding
      B. lactis CNCM I-3446.
    arms_available: [blank, probiotic_only, substrate_only, combination]
    arms_missing: []
    outcome_type: substrate_consumption_and_scfa
    outcome: >-
      The combination increased HMO consumption and SCFA production, including
      in donors who initially responded poorly.
    demonstrated_synergy: true
    why_it_matters: >-
      An ex-vivo interaction with no host health outcome. The blend's
      composition and the donor age must travel with it, because a different
