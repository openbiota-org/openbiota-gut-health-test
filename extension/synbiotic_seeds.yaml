  - syn_id: SYN006
    source_ref: S05
    label: B. longum subsp. infantis EVC001 with purified LNnT
    probiotic:
      taxon: Bifidobacterium longum subsp. infantis
      strain_designation: EVC001
      dose: 8e9 CFU/day
    substrate:
      name: lacto-N-neotetraose (LNnT)
      preparation: 1.6 g/day, purified single HMO
      residual_sugars: null
    setting: human_randomised_trial
    design: >-
      SYNERGIE single-blind randomised pilot; 62 Bangladeshi infants aged two
      to six months with severe acute malnutrition; 28 days, follow-up to day
      56; probiotic alone n=20, probiotic plus LNnT n=21, lactose placebo n=21.
    arms_available: [probiotic_only, combination, placebo_lactose]
    arms_missing: [substrate_only]
    outcome_type: growth_anthropometry_and_colonisation
    outcome: >-
      EVC001 increased in both active arms and later declined. The probiotic
      improved weight-for-age and mid-upper-arm circumference; the combination
      improved weight-for-age against placebo. Synbiotic superiority is
      unproven.
    demonstrated_synergy: null
    why_it_matters: >-
      With no LNnT-only arm the substrate's own contribution is unmeasured.
      Low breast-milk consumption, geography and diet all mattered, and
      colonisation was lower than in healthy infants, so findings from
      breastfed infants elsewhere do not transfer here.
    evidence_transfer_key: exact_strain_combination
    sources:
      - https://doi.org/10.1126/scitranslmed.abk1107
    accessions: [PRJEB45396]
    incomplete_fields: []

  - syn_id: SYN007
