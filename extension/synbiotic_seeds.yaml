    sources: []
    accessions: []
    incomplete_fields:
      - >-
        The specification cites this record's source through the register entry
        S14 rather than giving a DOI in §24, so the citation is resolved there
        and no direct link is recorded here.
      - >-
        The 24 strain labels are named in the original section 2.3 identities
        and are deliberately not expanded here, because expanding them is what
        would turn one bundle into 24 promotable records.
