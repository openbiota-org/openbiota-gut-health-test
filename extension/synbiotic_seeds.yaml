    evidence_transfer_key: exact_strain_combination
    sources:
      - https://doi.org/10.1186/s40168-018-0494-4
    accessions: []
    incomplete_fields: []

  - syn_id: SYN003
    source_ref: S02
    label: B. animalis subsp. lactis Bi-07 with XOS
    probiotic:
      taxon: Bifidobacterium animalis subsp. lactis
      strain_designation: Bi-07
      dose: 1e9 CFU/day
    substrate:
      name: xylo-oligosaccharides
      preparation: 8 g/day
      residual_sugars: null
    setting: human_randomised_trial
    design: >-
      Double-blind randomised factorial crossover; 44 recruited, 41 completed,
      21 days per treatment, with a maltodextrin control.
    arms_available: [probiotic_only, substrate_only, combination, placebo_maltodextrin]
    arms_missing: []
    outcome_type: bifidogenesis_and_immune_markers
    outcome: >-
      XOS was bifidogenic, but faecal B. lactis was not significantly higher
      in the combination than with Bi-07 alone: no specific ecological
      synergy. Immune markers changed, which is not established clinical
      benefit. Carryover meant some immune outcomes used the first period only.
    demonstrated_synergy: false
    why_it_matters: >-
      A full factorial with component arms, so the absence of added strain
      enrichment is a measured result rather than an untested assumption.
    evidence_transfer_key: exact_strain_combination
    sources:
      - https://doi.org/10.1017/S0007114513004261
      - https://pubmed.ncbi.nlm.nih.gov/24661576/
    accessions: []
    incomplete_fields: []

  - syn_id: SYN004
    source_ref: S03
    label: Lactobacillus acidophilus NCFM with cellobiose
    probiotic:
      taxon: Lactobacillus acidophilus
      strain_designation: NCFM (ATCC 700396)
      dose: 1e9 CFU/day
    substrate:
      name: cellobiose
      preparation: 5 g/day, 97% purity
      residual_sugars: null
    setting: human_randomised_trial
    design: >-
      Randomised double-blind crossover, 18 healthy adults, three weeks with a
      three-week washout, combination against maltodextrin.
    arms_available: [combination, placebo_maltodextrin]
    arms_missing: [probiotic_only, substrate_only]
    outcome_type: community_composition_and_fatty_acids
    outcome: >-
      Lactobacilli, bifidobacteria and branched-chain fatty acids increased;
      diversity and short-chain fatty acids did not.
    demonstrated_synergy: null
    why_it_matters: >-
      With no component-only arms this cannot show synergy in either
      direction. And branched-chain fatty acids are not short-chain fatty
      acids: the increase here is a protein-fermentation signal and must not
      be read as an SCFA benefit.
    evidence_transfer_key: exact_strain_combination
    sources:
      - https://doi.org/10.1111/1574-6941.12397
    accessions: [NCT01716910]
    incomplete_fields: []

