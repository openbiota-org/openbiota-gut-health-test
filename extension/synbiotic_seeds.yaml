    probiotic:
      taxon: Anaerostipes caccae
      strain_designation: LAHUC
      dose: 1e6 CFU gavage (gnotobiotic), 1e7 CFU (SPF)
    substrate:
      name: lactulose
      preparation: 5 g/L in drinking fluid
      residual_sugars: null
    setting: animal_model
    design: >-
      Gnotobiotic mice carrying allergic-infant microbiota and
      antibiotic-treated SPF mice, with component and control comparisons.
    arms_available: [control, probiotic_only, substrate_only, combination]
    arms_missing: []
    outcome_type: luminal_butyrate_and_allergy_protection
    outcome: >-
      Luminal butyrate rose and allergy was reduced in prophylactic and
      therapeutic mouse models. Engraftment alone did not increase butyrate,
      and a competing resident strain impeded engraftment.
