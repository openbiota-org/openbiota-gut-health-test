    label: B. animalis subsp. lactis CNCM I-3446 with BMOS
    probiotic:
      taxon: Bifidobacterium animalis subsp. lactis
      strain_designation: CNCM I-3446
      dose: not fully extracted
    substrate:
      name: bovine-milk oligosaccharides (BMOS)
      preparation: >-
        A demineralised-whey-derived mixture containing GOS and natural 3'- and
        6'-sialyllactose. It is not a pure HMO and must not be recorded as one.
      residual_sugars: present, from the whey source
    setting: ex_vivo_culture
    design: >-
      48-hour infant faecal cultures; substrate screening across ten donors,
      detailed component and combination comparison in two; the strain was also
      pre-grown on dextrose and on BMOS.
    arms_available: [probiotic_only, substrate_only, combination]
    arms_missing: []
    outcome_type: strain_abundance_and_metabolites
    outcome: >-
      BMOS promoted strain abundance, with the metabolic advantage strongest in
      the donor lowest in bifidobacteria. Acetate was often similar to BMOS
