# The seventeen synbiotic evidence records of BUILD_SPEC_v0.8.3 §24.
#
# These are the strain-substrate pairs the A16 matching ranks against, and
# most of them are negative. SYN001, SYN002, SYN003 and SYN005 each tested a
# strain, a substrate, and the two together, and found the combination no
# better than the strain alone. A registry that quietly dropped those would
# turn a field with four careful negative results into one with none, so
# `demonstrated_synergy: false` is recorded as a finding rather than as an
# absence of data.
#
# Three things every record carries, because each is a way evidence gets
# overstated:
#
#   `arms_available` and `arms_missing` - a study with no component-only arm
#   cannot show that the combination beat its parts, whatever its outcome.
#   `evidence_transfer_key` - what this result may be lent to. An ex-vivo
#   reactor result is not a human outcome and a bundle is not its strains.
#   `incomplete_fields` - what the specification says still needs extracting
#   before production use, so a gap is visible rather than assumed filled.
#
# Two identity corrections are recorded as refusals because the literature
# itself confuses them: PLMB0001 is not PBI001, and LAHUC is not DSM14662.

schema_version: openbiota.synbiotic-seeds/1.0
spec_version: 0.8.3

records:
  - syn_id: SYN001
    source_ref: S01
    label: Bifidobacterium adolescentis IVS-1 (iVS-1) with GOS
    probiotic:
      taxon: Bifidobacterium adolescentis
      strain_designation: IVS-1 (iVS-1)
      dose: 1e9 CFU/day
    substrate:
      name: galacto-oligosaccharides
      preparation: >-
        5 g/day GOS supplied as 6.9 g Vivinal powder, which is 72.5% GOS,
        22.8% lactose and 4.7% monosaccharides. The lactose is not inert and
        the placebo arm was lactose for that reason.
      residual_sugars: lactose 22.8%, monosaccharides 4.7%
    setting: human_randomised_trial
    design: >-
      Double-blind six-arm randomised controlled trial; 114 randomised, 94
      analysed, obese adults, three weeks.
    arms_available: [probiotic_only, substrate_only, combination, placebo_lactose]
    arms_missing: []
    outcome_type: strain_abundance_and_clinical_function
    outcome: >-
      Higher faecal abundance than BB-12. GOS did not significantly enhance
      strain abundance or clinical function. Some permeability markers
      improved; no functional synergism.
    demonstrated_synergy: false
    why_it_matters: >-
      A critical negative-control benchmark, and one that contradicts earlier
      successful rat results, which is exactly why it has to be kept.
    evidence_transfer_key: exact_strain_combination
    sources:
      - https://doi.org/10.1186/s40168-018-0494-4
    accessions: [PRJNA434249, SRP133159]
    incomplete_fields: []

