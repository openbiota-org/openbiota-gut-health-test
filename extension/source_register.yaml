    warning: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=protein&id=WP_407418999.1&rettype=fasta&retmode=text
    . Its 624-aa uppercase unwrapped sequence SHA256 is 3b161781132370598a9462d8d0573589ca4c72d5ee04bbb8c88cb3bab9ffcf62.
    Reference contig NZ_JAZOPK010000041.1, assembly GCF_045655505.1, BioSample SAMN37894531, belongs to a reference
    MAG, not a deposited WL68 isolate. The reconstructed study CDS was 1,875 bp with a 60-bp reference-derived gap
    fill; the exact study construct remains to be resolved. Purified-enzyme evidence uses tryptophan and produces
    tryptamine; serotonin-specific activity is not established by that assay. Preserve candidate-enzyme versus consortium
