# The acceptance tests of BUILD_SPEC_v0.8.3 section 15, extracted from the
# specification's own table and joined to the tests that exercise them.
#
# `covered_by` is refreshed from the test files themselves, so it cannot
# drift: a file that stops naming an ID stops covering it. Anything with
# no coverage carries a reason, and the count of those is in `summary`
# rather than left to be discovered by counting.

schema_version: openbiota.acceptance-ledger/1.0
