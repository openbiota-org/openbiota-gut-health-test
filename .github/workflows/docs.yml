# Checks that the website still builds: the documentation renders under
# mkdocs --strict (a broken link fails the check) and web/build_site.py
# completes. This workflow deploys nothing. The site is published from a
# developer's machine with web/deploy_site.sh (S3 + CloudFront, see
# web/README.md), so a documentation typo never goes live by itself.

name: site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "web/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5" pillow
      - name: Build the site (strict)
        run: python web/build_site.py
      - name: The built site carries no secrets, no results and no sample identifiers
        run: |
          ! grep -rIl -E "AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH) PRIVATE KEY" web/openbiota.com
          ! grep -rIl -E "ERICK_|MONICA_|KRY799|FCG748|BGE623|BXP835|AMD614|FXX745" web/openbiota.com
