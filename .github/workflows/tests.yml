# The suite gates every push and pull request. It needs no reference data,
# no profilers and no network: tests that read a finished run skip when
# results/ is absent, and everything else runs from the package alone.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check openbiota tests scripts
      - name: Every module imports on this Python
        run: python -c "import compileall, sys; sys.exit(0 if compileall.compile_dir('openbiota', quiet=1) else 1)"
      - name: Test suite
        run: python -m pytest -q -p no:warnings --ignore=tests/test_layout_holds_under_pressure.py
