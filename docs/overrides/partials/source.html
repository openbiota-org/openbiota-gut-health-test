{#-
  Material's source badge without data-md-component="source": that hook makes the
  theme fetch repository statistics from api.github.com on every page load.
-#}
<a href="{{ config.repo_url }}" title="{{ lang.t('source') }}" class="md-source" target="_blank" rel="noopener noreferrer">
  <div class="md-source__icon md-icon">
    {% set icon = config.theme.icon.repo or "fontawesome/brands/git-alt" %}
    {% include ".icons/" ~ icon ~ ".svg" %}
  </div>
  <div class="md-source__repository">
    {{ config.repo_name }}
  </div>
</a>
