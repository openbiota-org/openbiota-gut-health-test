    clinical_source_urls: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4922554/"]
    note: >-
      Curated bft-2 isotype of the fragilysin family, requiring credible B.
      fragilis linkage on the same strain and the BfPAI locus context. B.
      fragilis abundance alone is not ETBF, and the three isotypes are close
      enough that isotype assignment needs adequate allele coverage rather
      than a family-level match.
  - determinant_id: toxin.bft_3
    source_section: "8.2"
    display_name: "Bacteroides fragilis toxin isotype 3 (bft-3)"
    gene_family: bft-3
    kind: toxin
    associated_seed_ids: [bacteria.bacteroides_fragilis_etbf]
    requires_locus_completeness: true
