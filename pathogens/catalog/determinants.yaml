      than a family-level match.
  - determinant_id: toxin.ctxa
    source_section: "8.2"
    display_name: "Cholera toxin A subunit (ctxA)"
    gene_family: ctxA
    kind: toxin
    associated_seed_ids: [bacteria.vibrio_cholerae, bacteria.vibrio_mimicus]
    phage_encoded: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      Cholera-toxin gene DNA detected; the carrying organism is unresolved and
      CTXphi bacteriophage context is possible.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/foodborne-pathogens/bad-bug-book-second-edition"]
    note: >-
      ctxA is assessed independently from the species call: V. cholerae
      species alone is not cholera and non-toxigenic environmental strains are
      common. The locus is carried by the CTXphi prophage, so unlinked ctx is
      phage-context DNA. O1/O139 or other lineage claims require validated
      typing evidence. V. mimicus can also carry cholera-toxin genes.
  - determinant_id: toxin.ctxb
    source_section: "8.2"
    display_name: "Cholera toxin B subunit (ctxB)"
    gene_family: ctxB
    kind: toxin
    associated_seed_ids: [bacteria.vibrio_cholerae, bacteria.vibrio_mimicus]
    phage_encoded: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      Cholera-toxin gene DNA detected; the carrying organism is unresolved and
      CTXphi bacteriophage context is possible.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/foodborne-pathogens/bad-bug-book-second-edition"]
    note: >-
      ctxB is assessed independently from the species call and from ctxA; the
      classical and El Tor ctxB genotypes are distinguished only with adequate
      allele coverage. ctxB is closely related to ETEC eltB, so discriminate
      rather than accepting a shared-family match.
  - determinant_id: pathotype_marker.tcpa
    source_section: "8.2"
    display_name: "Toxin-coregulated pilus A (tcpA)"
