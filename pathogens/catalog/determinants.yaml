# Machine-readable determinant catalog: toxin/pathotype logic and AMR panel.
# Generated from specs/BUILD_SPEC_v05.0.md sections 8.2 and 8.3 (BUILD_SPEC v05.0).
# Gene families refer to curated experimentally characterised families/alleles with
# exact reference records, not a substring match to an annotation. Community-level
# co-occurrence never supplies strain linkage.
schema_version: pathogens.determinant.v1
catalog_section: "8.2,8.3"
determinants:
  - determinant_id: toxin.stx1
    source_section: "8.2"
    display_name: "Shiga toxin 1 (stx1)"
    gene_family: stx1
    kind: toxin
    associated_seed_ids: [bacteria.stec]
    subunits: [A, B]
    subtype_resolution_optional: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      Shiga-toxin-associated gene DNA detected; the carrying organism or
      strain is unresolved, and bacteriophage context is possible.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli", "https://www.cdc.gov/ecoli/php/technical-info/index.html"]
    note: >-
      Curated stx1 family with A/B subunit and subtype resolution where
      coverage permits. Do not require eae or O157: eae-negative and non-O157
      STEC exist. Only credible E. coli linkage supports the organism-trait
      statement; stx genes are phage-encoded and are also carried by other
      organisms including Shigella dysenteriae serotype 1 and some Escherichia
      albertii strains. stx1 subtypes a/c/d exist; subtype naming needs
      adequate allele coverage.
  - determinant_id: toxin.stx2
    source_section: "8.2"
    display_name: "Shiga toxin 2 (stx2)"
    gene_family: stx2
    kind: toxin
    associated_seed_ids: [bacteria.stec]
    subunits: [A, B]
    subtype_resolution_optional: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      Shiga-toxin-associated gene DNA detected; the carrying organism or
      strain is unresolved, and bacteriophage context is possible.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli", "https://www.cdc.gov/ecoli/php/technical-info/index.html"]
    note: >-
      Curated stx2 family with A/B subunit and subtype resolution where
      coverage permits. Do not require eae or O157: eae-negative and non-O157
      STEC exist. Only credible E. coli linkage supports the organism-trait
      statement; stx genes are phage-encoded and are also carried by other
      organisms including Shigella dysenteriae serotype 1 and some Escherichia
      albertii strains. stx2a and stx2d subtypes carry the strongest
      haemolytic-uraemic-syndrome association, but subtype claims require
      adequate allele coverage.
  - determinant_id: toxin.elta
    source_section: "8.2"
    display_name: "Heat-labile enterotoxin A subunit (eltA)"
    gene_family: eltA
    kind: toxin
    associated_seed_ids: [bacteria.etec]
    subunits_assessed_separately: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      Heat-labile-enterotoxin gene DNA detected; the carrying E. coli strain
      is unresolved and cannot be attributed to any coexisting Escherichia
      population.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli"]
    note: >-
      Human-relevant curated eltA allele evidence, the catalytic A subunit of
      LT. Assess eltA and eltB separately and report operon completeness; do
      not treat an LT-like annotation as a human-relevant enterotoxin allele.
  - determinant_id: toxin.eltb
    source_section: "8.2"
    display_name: "Heat-labile enterotoxin B subunit (eltB)"
    gene_family: eltB
    kind: toxin
    associated_seed_ids: [bacteria.etec]
    requires_host_linkage: true
    linkage_absent_statement: >-
      Heat-labile-enterotoxin gene DNA detected; the carrying E. coli strain
      is unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli"]
    note: >-
      Human-relevant curated eltB allele evidence, the binding B subunit of
      LT. It is closely related to cholera toxin B, so discriminate against
      Vibrio ctxB rather than accepting a shared-family match.
  - determinant_id: toxin.esta_sta
    source_section: "8.2"
    display_name: "Heat-stable enterotoxin ST (estA/STa)"
    gene_family: estA/STa
    kind: toxin
    associated_seed_ids: [bacteria.etec]
    human_relevant_allele_required: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      Heat-stable-enterotoxin gene DNA detected; the carrying E. coli strain
      is unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli"]
    note: >-
      Human-relevant estA/STa alleles only. Do not treat every est-like
      annotation as an enterotoxin: the porcine STb/estB and the human STh/STp
      variants are distinct, the gene is very short, and short-read hits
      therefore need exact curated allele matching rather than substring
      similarity.
  - determinant_id: pathotype_marker.eae
    source_section: "8.2"
    display_name: "Intimin (eae)"
    gene_family: eae
    kind: pathotype_marker
    associated_seed_ids: [bacteria.epec, bacteria.stec]
    requires_host_linkage: true
    linkage_absent_statement: >-
      Intimin gene DNA detected; the carrying organism and pathotype are
      unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli", "https://www.cdc.gov/ecoli/php/technical-info/index.html", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5852171/"]
    note: >-
      eae-associated evidence for the LEE attaching-and-effacing phenotype,
      with stx assessed independently. If stx absence is unassessable, output
      EPEC-associated markers rather than a definitive EPEC or atypical-EPEC
      strain. eae is also carried by STEC and by Escherichia albertii, so it
      is not by itself an EPEC call.
  - determinant_id: pathotype_marker.bfpa
    source_section: "8.2"
    display_name: "Bundle-forming pilus A (bfpA)"
    gene_family: bfpA
    kind: pathotype_marker
    associated_seed_ids: [bacteria.epec]
    requires_host_linkage: true
    linkage_absent_statement: >-
      Bundle-forming-pilus gene DNA detected; the carrying strain and its eae
      status are unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli"]
    note: >-
      Typical EPEC requires appropriate bfpA/EAF context linked to the same
      strain as eae. bfpA alone is not a pathotype, and its absence supports
      'atypical EPEC' only when the locus was actually evaluable.
  - determinant_id: virulence_locus.eaf
    source_section: "8.2"
    display_name: "EPEC adherence factor plasmid (EAF)"
    gene_family: EAF
    kind: virulence_locus
    associated_seed_ids: [bacteria.epec]
    requires_locus_completeness: true
    plasmid_context: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      EAF-plasmid-associated DNA detected; plasmid-to-chromosome linkage is
      unresolved, so the host strain cannot be named.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli"]
    note: >-
      EPEC adherence factor plasmid context, historically detected by the EAF
      probe and carrying the bfp operon and perA regulator. Report locus
      completeness; a plasmid replicon or fragment in a mixed community does
      not establish which E. coli carries it.
  - determinant_id: pathotype_marker.aggr
    source_section: "8.2"
    display_name: "AggR regulator (aggR)"
    gene_family: aggR
    kind: pathotype_marker
    associated_seed_ids: [bacteria.eaec]
    requires_host_linkage: true
    linkage_absent_statement: >-
      AggR-regulon gene DNA detected; the carrying E. coli strain is
      unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5852171/"]
    note: >-
      Master regulator of the AggR regulon and the most widely used EAEC
      marker. Requires supported adhesin/regulon context in the same strain;
      preserve heterogeneous atypical phenotypes and mixed-strain uncertainty.
  - determinant_id: pathotype_marker.aata
    source_section: "8.2"
    display_name: "Dispersin transporter (aatA)"
    gene_family: aatA
    kind: pathotype_marker
    associated_seed_ids: [bacteria.eaec]
    requires_host_linkage: true
    linkage_absent_statement: >-
      EAEC plasmid marker DNA detected; the carrying E. coli strain is
      unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5852171/"]
    note: >-
      Plasmid-borne dispersin transport marker (the CVD432 probe target) used
      with aggR and aaiC. A single marker is not a pathotype call; require an
      appropriate linked marker set.
  - determinant_id: pathotype_marker.aaic
    source_section: "8.2"
    display_name: "AaiC secreted protein (aaiC)"
    gene_family: aaiC
    kind: pathotype_marker
    associated_seed_ids: [bacteria.eaec]
    requires_host_linkage: true
    linkage_absent_statement: >-
      EAEC chromosomal-island marker DNA detected; the carrying E. coli strain
      is unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5852171/"]
    note: >-
      Chromosomal aai type-VI-secretion island marker, complementary to the
      plasmid-borne aggR and aatA markers; discordant plasmid and chromosomal
      markers in one community indicate mixed strains rather than one hybrid
      strain.
  - determinant_id: toxin.asta
    source_section: "8.2"
    display_name: "EAST1 heat-stable toxin (astA)"
    gene_family: astA
    kind: toxin
    associated_seed_ids: [bacteria.eaec]
    sufficient_alone: false
    requires_host_linkage: true
    linkage_absent_statement: >-
      EAST1 toxin gene DNA detected; the carrying E. coli strain is
      unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5852171/"]
    note: >-
      astA/EAST1 alone is insufficient for an EAEC call and is explicitly not
      sufficient alone: it occurs in EAEC, in other pathotypes and in
      commensal E. coli. Report it only alongside aggR/aatA/aaiC regulon
      context in the same strain.
  - determinant_id: pathotype_marker.ipah
    source_section: "8.2"
    display_name: "Invasion plasmid antigen H (ipaH)"
    gene_family: ipaH
    kind: pathotype_marker
    associated_seed_ids: [bacteria.eiec, bacteria.shigella_eiec_combined_group, bacteria.shigella_sonnei, bacteria.shigella_flexneri, bacteria.shigella_dysenteriae, bacteria.shigella_boydii]
    multi_copy_target: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      ipaH family DNA detected; the carrying organism is unresolved between
      Shigella species and enteroinvasive E. coli.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC8767346/", "https://www.fda.gov/food/laboratory-methods-food/bam-chapter-4a-diarrheagenic-escherichia-coli"]
    note: >-
      ipaH family plus invasion-context evidence, defaulting to the combined
      Shigella/EIEC group unless validated discriminatory markers support
      narrower resolution. ipaH is not uniquely Shigella - EIEC carries it too
      - and it is multi-copy, present on both the plasmid and the chromosome,
      so copy number is not abundance.
  - determinant_id: pathotype_marker.afa_daa_dr
    source_section: "8.2"
    display_name: "Afa/Dr adhesin family (afa/daa/dr)"
    gene_family: afa/daa/dr
    kind: pathotype_marker
    associated_seed_ids: [bacteria.daec]
    sufficient_alone: false
    exploratory_only: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      Afa/Dr adhesin gene DNA detected; the carrying E. coli strain is
      unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.cdc.gov/ecoli/php/technical-info/index.html", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5852171/"]
    note: >-
      afa/daa/dr adhesin evidence is supportive and exploratory, not
      universally specific: the family is heterogeneous, overlaps
      uropathogenic E. coli adhesins and occurs in strains from healthy
      carriers. Report as an exploratory marker, never as an established cause
      of diarrhoea.
  - determinant_id: toxin.tcda
    source_section: "8.2"
    display_name: "Toxin A (tcdA)"
    gene_family: tcdA
    kind: toxin
    associated_seed_ids: [bacteria.clostridioides_difficile]
    requires_locus_completeness: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      tcdA major-toxin gene DNA detected; linkage to a C. difficile strain in
      this sample is unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.cdc.gov/c-diff/hcp/diagnosis-testing/index.html"]
    note: >-
      Enterotoxin of the PaLoc, assessed independently of tcdB;
      A-negative/B-positive strains are well described, so a tcdA-negative
      result does not exclude a toxigenic strain. Major-toxin DNA implies
      genetic potential, not expressed toxin and not C. difficile infection;
      toxin detection in stool by immunoassay plus a compatible clinical
      picture is what supports CDI. Asymptomatic carriage of toxigenic strains
      is common, especially in children under about two years, so age-aware
      interpretation is required.
  - determinant_id: toxin.tcdb
    source_section: "8.2"
    display_name: "Toxin B (tcdB)"
    gene_family: tcdB
    kind: toxin
    associated_seed_ids: [bacteria.clostridioides_difficile]
    requires_locus_completeness: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      tcdB major-toxin gene DNA detected; linkage to a C. difficile strain in
      this sample is unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.cdc.gov/c-diff/hcp/diagnosis-testing/index.html"]
    note: >-
      Cytotoxin of the PaLoc and the principal virulence factor, assessed
      independently of tcdA. Major-toxin DNA implies genetic potential, not
      expressed toxin and not C. difficile infection; toxin detection in stool
      by immunoassay plus a compatible clinical picture is what supports CDI.
      Asymptomatic carriage of toxigenic strains is common, especially in
      children under about two years, so age-aware interpretation is required.
  - determinant_id: toxin.cdta
    source_section: "8.2"
    display_name: "Binary toxin CDTa (cdtA)"
    gene_family: cdtA
    kind: toxin
    associated_seed_ids: [bacteria.clostridioides_difficile]
    substitutes_for_major_toxins: false
    requires_host_linkage: true
    linkage_absent_statement: >-
      cdtA binary-toxin gene DNA detected; linkage to a C. difficile strain in
      this sample is unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.cdc.gov/c-diff/hcp/diagnosis-testing/index.html"]
    note: >-
      Enzymatic component of the binary toxin CDT, encoded on the separate
      CdtLoc. Reported separately from tcdA/tcdB, and binary toxin does not
      substitute for the major toxins: a cdtA/cdtB-only result is not a
      toxigenic C. difficile result. Binary-toxin genes are enriched in
      lineages such as RT027/ST1, but ribotype claims need validated typing
      evidence, not marker presence.
  - determinant_id: toxin.cdtb
    source_section: "8.2"
    display_name: "Binary toxin CDTb (cdtB)"
    gene_family: cdtB
    kind: toxin
    associated_seed_ids: [bacteria.clostridioides_difficile]
    substitutes_for_major_toxins: false
    requires_host_linkage: true
    linkage_absent_statement: >-
      cdtB binary-toxin gene DNA detected; linkage to a C. difficile strain in
      this sample is unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.cdc.gov/c-diff/hcp/diagnosis-testing/index.html"]
    note: >-
      Binding component of the binary toxin CDT, encoded on the separate
      CdtLoc. Reported separately from tcdA/tcdB, and binary toxin does not
      substitute for the major toxins: a cdtA/cdtB-only result is not a
      toxigenic C. difficile result. Binary-toxin genes are enriched in
      lineages such as RT027/ST1, but ribotype claims need validated typing
      evidence, not marker presence.
  - determinant_id: toxin.cpe
    source_section: "8.2"
    display_name: "Clostridium perfringens enterotoxin (cpe)"
    gene_family: cpe
    kind: toxin
    associated_seed_ids: [bacteria.clostridium_perfringens]
    requires_host_linkage: true
    linkage_absent_statement: >-
      C. perfringens enterotoxin gene DNA detected; linkage to a C.
      perfringens strain in this sample is unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/foodborne-pathogens/bad-bug-book-second-edition"]
    note: >-
      cpe carries the enterotoxin-associated potential for food-poisoning and
      antibiotic-associated diarrhoea. Only a minority of C. perfringens
      strains carry it, and chromosomal versus plasmid location differs by
      syndrome. Gene presence is genetic potential, not expressed toxin:
      food-poisoning diagnosis rests on enterotoxin detection in stool plus
      epidemiology.
  - determinant_id: toxin.plc_cpa
    source_section: "8.2"
    display_name: "Alpha-toxin phospholipase C (plc/cpa)"
    gene_family: plc/cpa
    kind: toxin
    associated_seed_ids: [bacteria.clostridium_perfringens]
    sufficient_alone: false
    species_marker_not_pathotype: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      Alpha-toxin gene DNA detected; linkage to a C. perfringens strain in
      this sample is unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://www.fda.gov/food/foodborne-pathogens/bad-bug-book-second-edition"]
    note: >-
      plc/cpa alone does not establish food-poisoning potential and is
      explicitly not sufficient alone: alpha-toxin is present in essentially
      every C. perfringens strain, so it behaves as a species marker rather
      than a pathotype marker. Curated other toxin families are assessed
      separately.
  - determinant_id: toxin.bft_1
    source_section: "8.2"
    display_name: "Bacteroides fragilis toxin isotype 1 (bft-1)"
    gene_family: bft-1
    kind: toxin
    associated_seed_ids: [bacteria.bacteroides_fragilis_etbf]
    requires_locus_completeness: true
    requires_host_linkage: true
    linkage_absent_statement: >-
      bft-1 fragilysin gene DNA detected; linkage to a B. fragilis strain in
      this sample is unresolved.
    candidate_sources: ["NCBI_NDARO", "GenBank_characterised_allele"]
    clinical_source_urls: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4922554/"]
    note: >-
      Curated bft-1 isotype of the fragilysin family, requiring credible B.
      fragilis linkage on the same strain and the BfPAI locus context. B.
      fragilis abundance alone is not ETBF, and the three isotypes are close
      enough that isotype assignment needs adequate allele coverage rather
      than a family-level match.
  - determinant_id: toxin.bft_2
    source_section: "8.2"
    display_name: "Bacteroides fragilis toxin isotype 2 (bft-2)"
    gene_family: bft-2
    kind: toxin
    associated_seed_ids: [bacteria.bacteroides_fragilis_etbf]
    requires_locus_completeness: true
