      diagnose infection. The intrinsic fluconazole resistance of the species
      is a clinical laboratory fact, not a sequence-derived susceptibility
      result. Excluded from the background Pichia dietary-yeast seed to avoid
      double counting. WHO fungal priority list medium group.

