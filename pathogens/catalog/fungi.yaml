    parent_seed_id: fungi.nakaseomyces_glabrata_group_unresolved
    expansion_state: installed
    who_priority: true
    note: >-
      Conditional opportunist; current accepted name Nakaseomyces glabratus
      (WHO list spelling Nakaseomyces glabrata). Gut carriage is common;
      detection does not diagnose infection or establish a need for
      antifungal treatment, and the reduced azole susceptibility typical of
      the species is a clinical laboratory matter, not a sequence result.
      Kept distinct from Candida nivariensis and C. bracarensis; only this
      species' own legacy and current synonyms are deduplicated here. Report
      via the parent unresolved group when discrimination among the three is
      insufficient. WHO fungal priority list high group.

