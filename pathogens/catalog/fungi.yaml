# Fungal and other opportunistic-eukaryote seed catalog.
# Compiled from specs/BUILD_SPEC_v05.0.md section 10 ("Fungal and other
# opportunistic-eukaryote catalog"). Every row of the section 10 table is
# represented; semicolon-separated organisms are separate seeds, explicitly
# named species complexes stay as one seed, and unnamed "curated" /
# "clinically relevant" genus members become one genus- or group-level seed
# with expansion_state: manual_review_required.
#
# These are pre-resolution seeds (no taxids/accessions yet). None of the
# organisms below is asserted to be a normal cause of intestinal infection:
# colonisation, food passage, skin/oral contamination and invasive disease
# are separate interpretations, and every fungal seed carries the
# hard_to_lyse_cell_wall limitation because fungal walls resist standard
# stool lysis protocols.
schema_version: pathogens.seed.v1
catalog_section: "10"
seeds:
  # ---------------------------------------------------------------------
  # Common Candida
  # ---------------------------------------------------------------------
  - seed_id: fungi.candida_albicans
    source_section: "10"
    requested_name: Candida albicans
    display_name: Candida albicans
    aliases: ["Candida stellatoidea"]
    group: fungi
    family: "Common Candida"
    interpretation_class: conditional_opportunist
    taxonomic_resolution: species
    allowed_nucleic_acids: [DNA]
    stool_role: carriage_common
    candidate_sources: ["NCBI", "FungiDB", "CandidaGenomeDatabase", "UNITE_ITS", "EukDetect2"]
    report_template_id: opportunistic_fungus
    confirmation_options: [clinical_culture_with_species_identification, specialist_referral]
    negative_limitation_codes: [sampling, extraction, depth, reference_diversity, hard_to_lyse_cell_wall]
    clinical_source_urls: ["https://www.cdc.gov/fungal/about/types-of-fungal-diseases.html", "https://www.cdc.gov/candidiasis/about/index.html", "https://www.who.int/publications/i/item/9789240060241"]
    expansion_state: installed
    who_priority: true
    note: >-
      Conditional opportunist and the most common human commensal yeast.
      Stool carriage and food or oral sources may occur; detection does not
      diagnose invasive candidiasis or mucosal disease and does not establish
      a need for antifungal treatment. No "Candida overgrowth" claim is made
      from relative abundance alone. WHO fungal priority list critical group.

