  bacteria.staphylococcus_aureus:
    display_name: Staphylococcus aureus
    what_it_is: >
      A common bacterium that lives on skin and in the nose of many healthy
      people. Some strains produce toxins, and some, known as MRSA, are
      resistant to several antibiotics. It is not a typical gut organism, but it
      can be found in the intestine, particularly in infants and in people who
      have recently been in hospital.
    why_it_matters: >
      In the gut its main relevance is food poisoning: if the bacteria grow in
      food left unrefrigerated, they produce heat-stable enterotoxins that cause
      sudden vomiting and cramping within one to six hours of eating. This is
      caused by toxin already in the food, settles within a day, and needs
      fluids rather than antibiotics. Separately, gut carriage matters as a
      reservoir: people who carry S. aureus in the intestine are more likely to
      develop infections elsewhere, such as skin abscesses, and more likely to
      spread it. Very rarely, heavy overgrowth after antibiotics causes
      staphylococcal enterocolitis. Spreading skin infection, fever, or an
      unwell patient with a line or prosthetic joint needs medical assessment.
    normal_carriage: >
      Skin and nasal carriage is entirely normal, in roughly a third of healthy
      people at any one time, and it usually causes no problem. Intestinal
      carriage is also common and usually harmless, found in roughly a fifth of
      healthy adults and much more often in infants, where it is close to
      universal in the first weeks of life. What changes the picture is toxin
      genes, recent antibiotics that clear the competing flora, a
      hospital-acquired resistant strain, or the presence of a prosthetic joint,
      catheter or line that the organism could seed.
    overgrowth_signal: >
      Sequencing cannot establish that gut S. aureus is causing illness, and in
      most people a modest detection is normal carriage. A result becomes more
      interesting at high relative abundance in someone with recent antibiotics
      and unexplained diarrhoea, or with detection of enterotoxin genes (sea to
      see) alongside a food-poisoning history, or with methicillin resistance
      (mecA or mecC) in someone awaiting surgery or carrying an implanted
      device. Food poisoning is confirmed by finding enterotoxin in the suspect
      food, not by stool sequencing.
    agents:
      - name: Bacillus subtilis (probiotic, fengycin-producing strains)
        kind: probiotic
        evidence_tier: human_observational
        effect: >
          In a rural Thai population, people whose gut contained Bacillus
          bacteria had no detectable S. aureus intestinal colonisation at all,
          an association the authors describe as comprehensive. The mechanism
          was worked out experimentally: Bacillus lipopeptides called fengycins
          block the S. aureus quorum sensing system it needs to colonise, and
          feeding fengycin-producing Bacillus eliminated S. aureus gut and nasal
          colonisation in mice. The human part of this work is observational
          rather than a randomised trial.
        dose_studied: "not established in humans; mouse experiments used oral administration of fengycin-producing Bacillus subtilis spores"
        reaches_gut: >
          Bacillus subtilis is taken as spores, which are almost completely
          resistant to stomach acid and bile and germinate in the intestine.
          Fengycin production happens in the gut from the germinated bacteria
          rather than being swallowed as a preformed compound, which sidesteps
          the usual problem of an active molecule being destroyed or absorbed on
          the way down.
        citation_title: "Pathogen elimination by probiotic Bacillus via signalling interference"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/30305736/"
        caution: >
          The human evidence is a correlation, not a trial, and not every
          commercial B. subtilis product makes fengycin, so an off-the-shelf
          supplement may not reproduce the effect. Bacillus probiotics have
          occasionally caused bacteraemia in immunocompromised patients and
          should be avoided by anyone severely immunosuppressed or with a
          central venous catheter. This does not treat an active S. aureus
          infection.

      - name: Monolaurin (glycerol monolaurate)
        kind: nutrient
        evidence_tier: animal
        effect: >
          Gave partial protection in rodents challenged with S. aureus, with 50
          to 70 per cent survival compared with essentially none in controls,
          and comparable to vancomycin in that model. Notably, the coconut oils
          tested in the same study performed no better than control, so the
          effect was specific to monolaurin rather than to coconut oil.
        dose_studied: "Aqueous monolaurin administered to rodents; a human dose is not established"
        reaches_gut: >
          Monolaurin is a monoglyceride and is a substrate for pancreatic
          lipase, so a proportion is hydrolysed and absorbed in the small
          intestine. Some does survive to the lower gut, but the fraction is not
          well characterised in people, and this is a genuine limitation on
          treating it as a colonic agent.
        citation_title: "In vitro and in vivo effects of two coconut oils in comparison to monolaurin on Staphylococcus aureus: rodent studies"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/23767861/"
        caution: >
          Rodent evidence only, and no substitute for antibiotics in an active
          infection. Note specifically that eating coconut oil did not work in
          this study, so the popular equivalence between coconut oil and
          monolaurin is not supported. High doses commonly cause loose stools
          and stomach upset.

      - name: Oregano essential oil (carvacrol-rich)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          A carvacrol-rich oregano essential oil showed potent bactericidal
          activity against S. aureus in culture, and a separate study found
          oregano, carvacrol and thymol active against S. aureus biofilms.
          Culture-dish activity only; there is no human data on clearing gut or
          nasal carriage.
        dose_studied: "not established"
        reaches_gut: >
          Carvacrol is absorbed and conjugated in the upper small intestine, so
          plain oregano oil capsules deliver little to the colon. If the target
          is intestinal carriage rather than a skin infection, this delivery
          problem is the main obstacle, and no formulation has been shown to
          overcome it in people for this purpose.
        citation_title: 'A Carvacrol-Rich Essential Oil Extracted From Oregano (Origanum vulgare "Hot & Spicy") Exerts Potent Antibacterial Effects Against Staphylococcus aureus'
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/34803958/"
        caution: >
          Culture-dish evidence only. Undiluted oregano oil burns mucous
          membranes and must be diluted for any topical use. Taken orally it
          suppresses beneficial gut bacteria along with S. aureus. Avoid in
          pregnancy and in young children.

      - name: Epigallocatechin gallate (EGCG, green tea catechin)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Altered gene expression in S. aureus in culture, including genes
          related to resistance and stress response, consistent with a direct
          antibacterial effect. This is a mechanistic culture study; it does not
          show that drinking green tea or taking an extract clears carriage.
        dose_studied: "not established"
        reaches_gut: >
          EGCG is poorly absorbed, so most of an oral dose reaches the colon,
          which suits an intestinal target. It is unstable at small-intestinal
          pH and heavily metabolised by gut bacteria, so much of what arrives is
          in the form of breakdown products.
        citation_title: "Effect of epigallocatechin gallate on gene expression of Staphylococcus aureus"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/32679222/"
        caution: >
          Culture-dish evidence only. Concentrated green tea extracts have
          caused liver injury and several regulators cap EGCG per daily dose,
          with higher risk on an empty stomach. Catechins reduce absorption of
          non-haem iron.

      - name: Lactoferrin
        kind: nutrient
        evidence_tier: in_vitro
        effect: >
          Reduced the resilience of S. aureus colonies in culture, with the
          study identifying an optimal concentration and noting that the effect
          was not simply dose-proportional. Laboratory evidence only, with no
          human data on gut carriage.
        dose_studied: "not established for this indication"
        reaches_gut: >
          Lactoferrin is partly digested by pepsin in the stomach but is more
          resistant than most dietary proteins, and its cleavage product
          lactoferricin is itself antibacterial. Intact lactoferrin and active
          fragments have been recovered from stool after oral dosing, so a
          useful fraction does reach the lower gut.
        citation_title: "Optimal dose of lactoferrin reduces the resilience of in vitro Staphylococcus aureus colonies"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/35960734/"
        caution: >
          Culture-dish evidence only. Bovine lactoferrin is a milk protein and
          must be avoided by anyone with cow's-milk protein allergy. It binds
          iron, so people being treated for iron deficiency should discuss
          timing with their clinician. This does not treat an active infection.

  # ---------------------------------------------------------------------------
  bacteria.yersinia_enterocolitica:
    display_name: Yersinia enterocolitica
    what_it_is: >
      A bacterium found mainly in pigs, which carry it in the throat and
      tonsils without being ill. People usually catch it from undercooked pork,
      especially raw pork products, from unpasteurised milk, or from
      contaminated water. Unlike most gut bacteria it grows well in the cold, so
      it can multiply in refrigerated food.
    why_it_matters: >
      It causes fever, abdominal pain and diarrhoea that may be bloody. In older
      children and young adults the pain often settles in the lower right
      abdomen and mimics appendicitis closely enough that people have had
      unnecessary operations. Most cases resolve without antibiotics in one to
      three weeks. Complications include reactive arthritis and a skin rash
      called erythema nodosum, occurring weeks after the gut illness, and
      bloodstream infection in people with iron overload conditions such as
      haemochromatosis or thalassaemia, or who are having iron chelation
      treatment, in whom it is dangerous and needs prompt medical care.
      Persistent fever, bloody diarrhoea or severe right-sided pain should be
      assessed by a clinician.
    normal_carriage: >
      Healthy people do not usually carry it long term. Importantly, only some
      biotypes and serotypes cause disease; many environmental Y. enterocolitica
      strains, particularly biotype 1A, are widespread in soil, water and food
      and are generally considered non-pathogenic. So a species-level detection
      is not by itself evidence of a disease-causing strain. Shedding continues
      for several weeks after symptoms settle, sometimes for two to three
      months.
    overgrowth_signal: >
      Abundance is less informative here than strain type, and sequencing often
      cannot settle that question. What matters is whether the virulence
      plasmid (pYV, carrying yadA and the ysc genes) and the chromosomal ail
      gene are present, since pathogenic biotypes carry these and the common
      environmental biotype 1A does not. A detection without those markers, in
      someone with no symptoms, most likely reflects a harmless environmental
      strain or recent dietary exposure. A detection with them, alongside fever
      and abdominal pain, is meaningful.
    agents:
      - name: Lactobacillus plantarum (kefir isolate)
        kind: probiotic
        evidence_tier: animal
        effect: >
          A Lactobacillus plantarum strain isolated from kefir protected mice
          against intestinal infection with Yersinia enterocolitica O9 and
          modulated the immune response. This is a mouse study using a defined
          strain; there is no human trial.
        dose_studied: "Oral administration to mice; a human dose is not established"
        reaches_gut: >
          Lactobacillus plantarum is among the more acid and bile tolerant
          probiotic species, and live organisms are recoverable from human stool
          during supplementation, so colonic delivery of viable cells is well
          established for the species. The specific kefir isolate used here is a
          research strain.
        citation_title: "A Lactobacillus plantarum strain isolated from kefir protects against intestinal infection with Yersinia enterocolitica O9 and modulates immunity in mice"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/26272025/"
        caution: >
          Mouse evidence only, using a specific strain that may not match what
          is in a commercial product. Live probiotics should be avoided by
          people who are severely immunosuppressed or have a central venous
          catheter. This does not treat bloodstream infection, which is the
          serious form in people with iron overload.

      - name: Levilactobacillus brevis
        kind: probiotic
        evidence_tier: animal
        effect: >
          Protected mice against Yersinia enterocolitica infection, with the
          study attributing the effect to regulation of the MAPK and NF-kappa-B
          inflammatory signalling pathways. Mouse evidence; no human data.
        dose_studied: "Oral administration to mice; a human dose is not established"
        reaches_gut: >
          Levilactobacillus brevis, formerly Lactobacillus brevis, is a
          fermentation organism found in sauerkraut, kimchi and sourdough, and
          it tolerates acid and bile well enough to be recovered live from stool
          during supplementation.
        citation_title: "Protective Effect of Levilactobacillus brevis Against Yersinia enterocolitica Infection in Mouse Model via Regulating MAPK and NF-κB Pathway"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/35665480/"
        caution: >
          Mouse evidence only. The mechanism described is anti-inflammatory
          rather than directly antibacterial, so it should not be assumed to
          clear the organism. Live probiotics are not appropriate for severely
          immunosuppressed people or those with central lines.

      - name: Bifidobacterium adolescentis
        kind: probiotic
        evidence_tier: animal
        effect: >
          Inhibited Yersinia enterocolitica infection in mice, with the study
          showing that plasmacytoid dendritic cells, a type of immune cell, were
          necessary for the effect. This is host-immune-mediated protection in a
          mouse model, not direct killing, and there is no human data.
        dose_studied: "Oral administration to mice; a human dose is not established"
        reaches_gut: >
          Bifidobacterium adolescentis is a normal resident of the adult human
          colon, so it is adapted to that environment. Bifidobacteria are more
          sensitive to stomach acid and oxygen than lactobacilli, which is why
          commercial products use protective coatings or high doses, but viable
          delivery to the colon is achievable and documented.
        citation_title: "Plasmacytoid dendritic cells are crucial in Bifidobacterium adolescentis-mediated inhibition of Yersinia enterocolitica infection"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/23977019/"
        caution: >
          Mouse evidence only. Because the protection depends on a functioning
          immune cell population, it cannot be assumed to work in people who are
          immunosuppressed, who are also the ones at greatest risk. Live
          probiotics should be avoided in severe immunosuppression and with
          central venous catheters.

      - name: Oregano essential oil
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited the growth and survival of Yersinia enterocolitica in
          barbecued chicken, a food-matrix study that also tested nutmeg oil and
          Listeria monocytogenes. Other work confirms in-vitro activity of
          oregano and thyme oils against this organism. Food-model and culture
          evidence only.
        dose_studied: "not established for humans; tested at food-preservative concentrations in barbecued chicken"
        reaches_gut: >
          Carvacrol and thymol are absorbed and conjugated in the upper small
          intestine, so plain oregano oil delivers little to the lower gut.
          Since Y. enterocolitica invades the terminal ileum and the lymphoid
          tissue there rather than the colon, an upper-gut-acting agent is at
          least better positioned here than for a colonic organism, but this has
          not been tested in people.
        citation_title: "Effects of essential oils of oregano and nutmeg on growth and survival of Yersinia enterocolitica and Listeria monocytogenes in barbecued chicken"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/18044446/"
        caution: >
          Food-matrix evidence only. Undiluted oregano oil burns mucous
          membranes and suppresses beneficial gut bacteria. Avoid in pregnancy
          and in young children. The practical lesson from this literature is
          about cooking pork thoroughly rather than about taking a supplement.

  # ---------------------------------------------------------------------------
  bacteria.campylobacter_jejuni:
    display_name: Campylobacter jejuni
    what_it_is: >
      A curved, spiral bacterium that lives harmlessly in the gut of chickens
      and other birds. It is the most common bacterial cause of diarrhoea in
      most high-income countries, and people usually catch it from undercooked
      chicken, from cross-contamination in the kitchen, or from unpasteurised
      milk.
    why_it_matters: >
      It causes an unpleasant but usually self-limiting illness: fever, severe
      cramping abdominal pain and diarrhoea that is often bloody, typically
      lasting three to seven days. Most people recover without antibiotics.
      The complications are what make it matter more than the acute illness
      suggests. It is the commonest identified trigger of Guillain-Barre
      syndrome, a paralysing nerve condition, and it also causes reactive
      arthritis and can precipitate post-infectious irritable bowel syndrome.
      Antibiotic resistance, particularly to fluoroquinolones, is now common.
      Bloody diarrhoea with high fever, illness lasting more than a week, or any
      new weakness or tingling in the limbs after a gut infection needs medical
      assessment.
    normal_carriage: >
      Healthy people in high-income countries do not normally carry it, and
      detection generally means recent infection or exposure. The picture is
      different in low-income settings with heavy poultry contact, where
      asymptomatic carriage in children is common and repeated infections lead
      to partial immunity. Shedding continues for two to seven weeks after
      symptoms settle, which is often longer than people expect and matters for
      food handlers and nursery staff.
    overgrowth_signal: >
      Sequencing cannot on its own establish that a detection is causing
      illness, though it is more informative here than for a commensal organism
      because carriage is not normal in most adults. A result is more meaningful
      at high relative abundance with matching symptoms, and less meaningful at
      trace level in a well person, where it may reflect recent dietary exposure
      or reads misassigned from another Campylobacter species. Distinguishing
      C. jejuni from C. coli by short reads is imperfect, and the two are
      treated similarly in any case.
    agents:
      - name: Carvacrol
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited Campylobacter jejuni motility and reduced its infection of
          epithelial cells in culture. Because C. jejuni depends on its
          corkscrew motility to reach and invade the gut lining, this is a
          mechanistically relevant target, but the work was done in cell culture
          with no human data.
        dose_studied: "not established for humans"
        reaches_gut: >
          Carvacrol is absorbed and conjugated in the upper small intestine, so
          little of a plain oregano oil dose reaches the lower bowel where
          C. jejuni sits. Encapsulated formulations designed for distal release
          exist, and one carvacrol-based product has been studied for its
          pharmacokinetics against this organism, but human gut delivery for
          treatment is not established.
        citation_title: "The natural antimicrobial carvacrol inhibits Campylobacter jejuni motility and infection of epithelial cells"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/23049787/"
        caution: >
          Culture-dish evidence only, and no substitute for medical assessment
          of bloody diarrhoea with fever. Undiluted oregano oil burns mucous
          membranes and suppresses beneficial gut bacteria. Avoid in pregnancy
          and in young children.

      - name: Caprylic acid (octanoic acid, a medium-chain fatty acid)
        kind: nutrient
        evidence_tier: animal
        effect: >
          Fed at 0.35 and 0.7 per cent of the diet, caprylic acid consistently
          decreased Campylobacter jejuni counts in the caecal contents of
          market-aged broiler chickens, with the effect confirmed across
          multiple trials by the same group. This is well-replicated animal
          evidence in the natural host of the organism, but a later study by the
          same group found the effect variable when given in drinking water
          instead of feed, and there is no human trial.
        dose_studied: "0.35% to 0.7% caprylic acid in broiler feed for the last 7 days before slaughter; not translatable to a human dose"
        reaches_gut: >
          Medium-chain fatty acids are absorbed efficiently in the upper small
          intestine and taken directly to the liver by the portal vein, which
          means plain caprylic acid does not reach the colon in quantity. The
          poultry work delivered it continuously in feed, maintaining luminal
          concentrations along the whole gut, which a single human capsule does
          not reproduce. Enteric-coated and salt forms are sold to address this,
          but distal delivery has not been verified for this purpose.
        citation_title: "The natural feed additive caprylic acid decreases Campylobacter jejuni colonization in market-aged broiler chickens"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19096058/"
        caution: >
          Poultry evidence only. Caprylic acid commonly causes nausea, reflux
          and loose stools, and undiluted it irritates the gullet. Effects on
          the organism in chickens do not establish a benefit for a person who
          is already ill.

      - name: Curcumin
        kind: botanical
        evidence_tier: animal
        effect: >
          Oral curcumin given in drinking water before infection reduced the
          severity of acute campylobacteriosis in mice, lessening clinical
          disease and pro-inflammatory responses in the gut and in distant
          organs. Note that this was given as prophylaxis before infection
          rather than as a treatment afterwards, and it was a mouse study.
          Separate culture work has shown direct activity against C. jejuni.
        dose_studied: "Synthetic curcumin in drinking water from one week before infection in mice; a human dose is not established"
        reaches_gut: >
          Curcumin is very poorly absorbed, so most of an oral dose reaches the
          colon, which suits a luminal target. It is chemically unstable at
          intestinal pH, and formulations designed to boost absorption, such as
          those with piperine or phospholipid carriers, deliberately reduce the
          amount remaining in the lumen, so a high-bioavailability product may
          be the wrong choice for a gut target.
        citation_title: "Oral curcumin ameliorates acute murine campylobacteriosis"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/38855111/"
        caution: >
          Mouse evidence, and given before infection rather than during it.
          Curcumin supplements have been linked to liver injury, particularly
          the high-bioavailability formulations, and they stimulate gallbladder
          contraction, which can worsen gallstone symptoms. They may add to the
          effect of anticoagulants.

      - name: Cranberry extract (high-molecular-weight fraction)
        kind: food
        evidence_tier: in_vitro
        effect: >
          A high-molecular-weight fraction of cranberry extract reduced the
          adherence of Campylobacter jejuni and Campylobacter coli strains to
          cultured HEp-2 cells, alongside mannan oligosaccharides. The endpoint
          was reduced attachment rather than killing, measured in cell culture
          only.
        dose_studied: "Up to 3 mg/mL of the high-molecular-weight cranberry fraction in cell culture"
        reaches_gut: >
          Cranberry proanthocyanidins are large polymeric molecules that are
          essentially unabsorbed, so they travel intact through the small
          intestine to the colon. This is the same property that underlies their
          use against urinary tract bacteria, and it means the anti-adhesion
          activity is at least plausible in the gut lumen.
        citation_title: "Adherence Reduction of Campylobacter jejuni and Campylobacter coli Strains to HEp-2 Cells by Mannan Oligosaccharides and a High-Molecular-Weight Component of Cranberry Extract"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/26219363/"
        caution: >
          Cell-culture evidence only. Cranberry products are acidic and high in
          oxalate, so they can worsen reflux and increase the risk of calcium
          oxalate kidney stones in susceptible people. Large amounts may
          interact with warfarin. Cranberry juice drinks are usually high in
          sugar.

      - name: Tannin extracts (hydrolysable and condensed)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Both hydrolysable and condensed tannin extracts were bactericidal
          against Campylobacter jejuni in culture, meaning they killed the
          organism rather than merely slowing it. Laboratory evidence only, with
          no animal or human data in this study.
        dose_studied: "not established"
        reaches_gut: >
          Tannins are large polyphenols that are poorly absorbed and pass
          largely intact into the colon, where gut bacteria break them down.
          Delivery to the lower gut is therefore not the limiting problem;
          the limitation is that tannins bind proteins indiscriminately, so
          their behaviour in a real gut full of food and mucus differs a lot
          from a clean culture medium.
        citation_title: "Bactericidal effect of hydrolysable and condensed tannin extracts on Campylobacter jejuni in vitro"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/22528299/"
        caution: >
          Culture-dish evidence only. Tannins bind dietary protein and non-haem
          iron and reduce their absorption, which matters for anyone with iron
          deficiency. In quantity they cause nausea and stomach irritation.
          Some hydrolysable tannin preparations have been associated with liver
          toxicity at high intakes.

      - name: Lactobacillus helveticus
        kind: probiotic
        evidence_tier: in_vitro
        effect: >
          A specific Lactobacillus helveticus strain inhibited Campylobacter
          jejuni invasion of human intestinal epithelial cells in culture. The
          study emphasised that the effect was strain-specific, so it cannot be
          generalised to lactobacilli as a class or to other L. helveticus
          products.
        dose_studied: "not established"
        reaches_gut: >
          Lactobacillus helveticus is a dairy fermentation organism used in
          cheese making, and lactobacilli of this group tolerate gastric acid
          and bile well enough to be recovered live from stool during
          supplementation, so viable colonic delivery is achievable.
        citation_title: "Strain-specific probiotic (Lactobacillus helveticus) inhibition of Campylobacter jejuni invasion of human intestinal epithelial cells"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19765084/"
        caution: >
          Cell-culture evidence only, and explicitly strain-specific, so a
          commercial product naming the species is not evidence of the same
          effect. Live probiotics should be avoided by people who are severely
          immunosuppressed or have a central venous catheter.

  # ---------------------------------------------------------------------------
  bacteria.helicobacter_pylori:
    display_name: Helicobacter pylori
    what_it_is: >
      A spiral bacterium that lives in the mucus layer lining the stomach. It is
      one of the most common chronic bacterial infections in the world, usually
      acquired in childhood and carried for life unless it is treated. It
      survives stomach acid by producing an enzyme, urease, that generates
      ammonia to neutralise the acid immediately around it.
    why_it_matters: >
      It causes long-term inflammation of the stomach lining, and in a minority
      of people this leads to stomach and duodenal ulcers, which can bleed or
      perforate. It is also classified as a definite human carcinogen and is the
      main cause of stomach cancer and of a lymphoma called gastric MALT
      lymphoma. Current guidelines recommend that anyone found to have it should
      be offered eradication treatment, which is a prescription combination of
      two or more antibiotics with an acid-suppressing drug. That is what
      actually clears it. The supplements below have been studied as additions
      to that treatment or as ways of reducing bacterial load, not as
      replacements for it.
    normal_carriage: >
      Carriage is extremely common and often causes no symptoms at all. Roughly
      half the world's population carries it, with prevalence above 70 per cent
      in parts of Africa, Asia and South America and typically 20 to 40 per cent
      in Western Europe and North America. Most carriers never develop an ulcer
      or cancer. What raises risk is a strain carrying the cagA and vacA s1/m1
      virulence genes, a family history of stomach cancer, long duration of
      infection, smoking, and a high-salt diet. Because the lifetime risk is
      real and eradication is straightforward, current guidance treats
      detection as a reason for treatment even without symptoms.
    overgrowth_signal: >
      This organism is a special case for stool metagenomics: it lives in the
      stomach, not the colon, so stool sequencing is not the standard way to
      detect it and often misses it. Read abundance in stool is not a measure of
      gastric bacterial load. Detection at all is meaningful because carriage is
      not benign, but it should be confirmed with a urea breath test, a stool
      antigen test or endoscopic biopsy before treatment. Detection of the cagA
      gene alongside the species raises the risk profile. A negative stool
      sequencing result does not rule the organism out.
    agents:
      - name: Mastic gum (Pistacia lentiscus resin)
        kind: botanical
        evidence_tier: human_rct
        effect: >
          In a randomised single-blind pilot trial of 64 adults, adding mastic
          gum to standard bismuth quadruple therapy raised the eradication rate
          from 67 to 85 per cent, but this did not reach statistical
          significance (p = 0.19) and so the trial missed its primary endpoint.
          It did significantly improve dyspepsia symptom scores and was well
          tolerated. Separate laboratory work confirms mastic essential oil is
          active against drug-resistant H. pylori in culture.
        dose_studied: "Mastic gum added to a two-week course of standard bismuth quadruple therapy in a pilot trial"
        reaches_gut: >
          Mastic gum is chewed or swallowed as a resin and acts in the stomach
          itself, which is exactly where H. pylori lives, so the usual problem
          of surviving to a distal site does not arise. It is not appreciably
          absorbed, and it has been used traditionally as a gastric remedy for
          this reason.
        citation_title: "Mastic gum as an adjunct therapy to standard bismuth quadruple therapy for Helicobacter pylori eradication: A randomized single-blind pilot study"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/41832367/"
        caution: >
          An addition to eradication therapy, not a replacement, and the main
          result was not statistically significant, so treat it as promising
          rather than proven. Mastic is a tree resin and can cause allergic
          reactions, particularly in people sensitive to other Pistacia species
          such as pistachio. Mild stomach upset and headache have been reported.

      - name: Broccoli sprouts (sulforaphane)
        kind: food
        evidence_tier: human_rct
        effect: >
          In a randomised trial, 48 H. pylori-infected patients ate 70 grams of
          broccoli sprouts daily for 8 weeks or an equal weight of alfalfa
          sprouts as placebo. The broccoli sprout group showed reduced urea
          breath test values and stool antigen levels, both markers of bacterial
          load, and reduced markers of gastric inflammation. Importantly, the
          values returned to baseline two months after stopping, so this
          suppressed the infection rather than eradicating it.
        dose_studied: "70 g of broccoli sprouts daily, containing 420 micromol of sulforaphane precursor (glucoraphanin), for 8 weeks"
        reaches_gut: >
          Glucoraphanin in broccoli sprouts is converted to active sulforaphane
          by the plant enzyme myrosinase when the sprouts are chewed, and by gut
          bacteria further down. The conversion happens in the mouth and stomach
          on eating, which is where H. pylori lives, so the active compound is
          generated at the right site. Cooking destroys myrosinase, which is why
          raw sprouts were used.
        citation_title: "Dietary sulforaphane-rich broccoli sprouts reduce colonization and attenuate gastritis in Helicobacter pylori-infected mice and humans"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19349290/"
        caution: >
          This reduced bacterial load but did not eradicate the infection, and
          the effect disappeared after stopping, so it does not remove the need
          for eradication therapy or the associated cancer risk. Raw sprouts
          carry a recognised risk of Salmonella and E. coli contamination and
          are not recommended for pregnant women, young children, older people
          or anyone immunosuppressed. Large amounts of raw brassicas can affect
          thyroid function in people who are iodine deficient.

      - name: Cranberry juice (proanthocyanidin-standardised)
        kind: food
        evidence_tier: human_rct
        effect: >
          In a double-blind randomised placebo-controlled dose-ranging trial,
          proanthocyanidin-standardised cranberry juice twice daily suppressed
          H. pylori infection, with the effective dose being 44 mg
          proanthocyanidin per 240 mL serving taken twice daily for 8 weeks.
          Encapsulated cranberry powder was not significantly effective at
          either time point, so the form mattered.
        dose_studied: "240 mL of cranberry juice standardised to 44 mg proanthocyanidin, twice daily for 8 weeks"
        reaches_gut: >
          Cranberry proanthocyanidins are large polymers that are essentially
          unabsorbed. In this case the relevant site is the stomach, which the
          juice reaches directly and bathes, and the proposed mechanism is
          blocking bacterial adhesion to the gastric lining rather than killing
          the organism.
        citation_title: "Suppression of Helicobacter pylori infection by daily cranberry intake: A double-blind, randomized, placebo-controlled trial"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/32783238/"
        caution: >
          Suppression is not eradication, and this does not remove the need for
          standard treatment or the long-term cancer risk. The capsule form did
          not work in this trial. Cranberry juice is acidic and may worsen
          reflux, is high in oxalate and can raise kidney stone risk, and in
          large amounts may interact with warfarin. Commercial cranberry drinks
          are usually high in sugar.

      - name: Bovine lactoferrin
        kind: nutrient
        evidence_tier: human_rct
        effect: >
          A meta-analysis of five randomised or quasi-randomised controlled
          trials covering 682 subjects found that adding bovine lactoferrin to
          eradication therapy improved H. pylori eradication rates. It was
          studied as an addition to antibiotic regimens, never on its own.
        dose_studied: "Varies across the pooled trials; commonly 200 to 400 mg of bovine lactoferrin daily alongside a standard eradication regimen"
        reaches_gut: >
          Lactoferrin resists gastric digestion better than most dietary
          proteins, and its acid-cleaved fragment lactoferricin is itself
          antibacterial, so active material is present in the stomach where
          H. pylori lives. The proposed mechanism is iron sequestration, denying
          the bacterium an essential nutrient.
        citation_title: "Meta-analysis: efficacy of bovine lactoferrin in Helicobacter pylori eradication"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19183156/"
        caution: >
          An adjunct to eradication therapy, not a replacement. Bovine
          lactoferrin is a milk protein and must be avoided by anyone with
          cow's-milk protein allergy. Because it binds iron, people being
          treated for iron deficiency should discuss timing with their
          clinician. This meta-analysis is now some years old and the pooled
          trials were relatively small.

      - name: Limosilactobacillus reuteri DSM 17648
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          In a randomised double-blind placebo-controlled trial, L. reuteri DSM
          17648 given as an adjunct for four weeks significantly increased the
          H. pylori eradication rate and reduced symptoms and treatment side
          effects. This strain works by co-aggregating with H. pylori so that it
          is cleared from the stomach, rather than by producing an antibiotic
          substance. Broader meta-analyses of Lactobacillus supplementation in
          eradication support a modest benefit.
        dose_studied: "L. reuteri DSM 17648 daily for 4 weeks alongside standard eradication therapy"
        reaches_gut: >
          The relevant site is the stomach rather than the colon, and this
          strain is selected specifically for binding H. pylori under gastric
          conditions. Notably, the DSM 17648 preparation works even in
          heat-inactivated form, since the co-aggregation depends on surface
          binding rather than on the organism being alive, which removes the
          usual concern about survival through the stomach.
        citation_title: "Probiotic containing Lactobacillus reuteri DSM 17648 as an adjunct treatment for Helicobacter pylori infection: A randomized, double-blind, placebo-controlled trial"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/37614081/"
        caution: >
          An adjunct, not a replacement for antibiotics, and the effect is
          strain-specific, so a generic L. reuteri product is not the same
          thing. Live probiotics should be avoided by people who are severely
          immunosuppressed or have a central venous catheter, though the
          inactivated form avoids that concern.

      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          A systematic review and meta-analysis of 11 randomised controlled
          trials in 2,200 participants found that adding S. boulardii to
          standard eradication therapy raised the eradication rate from 71 to 80
          per cent, and significantly reduced treatment side effects. The
          authors noted that even with the improvement the rate remained below
          what is considered a good result, so this helps at the margin.
        dose_studied: "Varies across the pooled trials; typically 500 mg to 1 g daily (roughly 10^9 to 10^10 colony-forming units) for the duration of eradication therapy and often for two to four weeks in total"
        reaches_gut: >
          S. boulardii is a yeast and is unaffected by the antibiotics given
          alongside it, which is its main practical advantage in this setting.
          It tolerates gastric acid and bile and is recovered live from stool
          during dosing. Much of its benefit here is in reducing
          antibiotic-associated diarrhoea, which improves the chance of people
          completing the course.
        citation_title: "Systematic review with meta-analysis: Saccharomyces boulardii supplementation and eradication of Helicobacter pylori infection"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/25898944/"
        caution: >
          An adjunct only. S. boulardii must be avoided in critically ill
          patients, in severe immunosuppression, and in anyone with a central
          venous catheter, because fungaemia has occurred in these groups,
          sometimes from airborne spread when capsules are opened at the
          bedside. Avoid in yeast allergy.

  # ---------------------------------------------------------------------------
  bacteria.morganella_morganii:
    display_name: Morganella morganii
    what_it_is: >
      A bacterium found in soil, sewage and the intestines of humans and
      animals. In the gut it is usually a minor and harmless resident. It is
      best known for two things: causing infections outside the gut, especially
      urinary tract infections and wound infections, and converting the amino
      acid histidine in fish into histamine.
    why_it_matters: >
      As a gut organism it rarely causes diarrhoea directly, and its presence in
      stool is not usually the problem. Where it matters is elsewhere: it is a
      recognised cause of urinary tract infection, wound infection and
      bloodstream infection, mostly in hospital patients, older people and those
      with catheters or recent surgery, and it is naturally resistant to several
      common antibiotics including ampicillin and first-generation
      cephalosporins, so treatment needs susceptibility testing. Its other role
      is in scombroid fish poisoning: when fish such as tuna and mackerel are
      not chilled promptly, M. morganii converts histidine to histamine, and
      eating the fish causes flushing, headache, palpitations and a rash within
      minutes to an hour. That reaction is caused by histamine already in the
      fish, so it is treated with antihistamines and has nothing to do with gut
      bacteria.
    normal_carriage: >
      Yes, healthy people commonly carry it, and this is normal. Morganella
      morganii is a regular if minor member of the human gut flora, reported in
      a substantial minority of healthy adults, generally at low abundance. It
      is a member of the Enterobacteriaceae, the same broad family as
      Escherichia coli. Carriage alone is not a reason for concern or for
      treatment. What changes the picture is a urinary catheter, recent
      hospitalisation, a wound, immunosuppression, or an unusually high relative
      abundance following broad-spectrum antibiotics that have cleared the
      competing flora.
    overgrowth_signal: >
      Sequencing cannot establish clinical significance, and for this organism a
      low-level detection in stool should be read as normal flora. What would
      make it worth noting is a marked increase in relative abundance,
      particularly after broad-spectrum antibiotics or in a person with
      inflammatory bowel disease, since Enterobacteriaceae expansion is a
      recognised marker of a disturbed gut microbiome rather than a specific
      infection. Symptoms elsewhere, especially urinary, matter far more than
      the stool reading, and any such infection needs culture and susceptibility
      testing rather than interpretation of a stool sequence.
    agents:
      - name: Allyl isothiocyanate (from mustard, horseradish and wasabi)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Allyl isothiocyanate vapour had the highest antibacterial activity of
          14 essential oils tested against Morganella morganii, and it
          suppressed growth of histamine-producing bacteria and histamine
          accumulation in tuna and mackerel stored at 12 degrees Celsius. This
          is food-preservation work; there is no study of taking it to reduce
          gut carriage.
        dose_studied: "not established for humans; tested as a vapour at minimum inhibitory dose in a fish storage model"
        reaches_gut: >
          Allyl isothiocyanate is formed when mustard, horseradish or wasabi
          tissue is broken, through the action of the plant enzyme myrosinase.
          It is volatile, highly reactive and readily absorbed and conjugated in
          the upper gut, so very little reaches the colon in active form. Its
          demonstrated value is in the food before eating rather than in the
          intestine.
        citation_title: "Antibacterial activity of essential oil vapor for histamine-producing bacteria"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/22200745/"
        caution: >
          Food-model evidence only, and it fails the requirement of reaching the
          colon intact. Allyl isothiocyanate is a potent irritant to the eyes,
          airways and stomach lining, and concentrated preparations are not
          suitable for ingestion. This does not address gut carriage, which in
          most people needs no treatment anyway.

      - name: Meadowsweet extract (Filipendula ulmaria ellagitannins)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Ellagitannins from meadowsweet, including rugosin D, rugosin A methyl
          ester and tellimagrandin II, inhibited Morganella morganii histidine
          decarboxylase at low micromolar concentrations and reduced histamine
          accumulation in mackerel muscle. This targets the enzyme that makes
          histamine rather than killing the bacterium, and it was demonstrated
          in enzyme assays and a fish model.
        dose_studied: "Half-maximal inhibitory concentrations of 1.5 to 6.8 micromolar against the bacterial enzyme in vitro; no human dose established"
        reaches_gut: >
          Ellagitannins are large polyphenols that are poorly absorbed and reach
          the colon largely intact, where gut bacteria convert them to
          urolithins. So the parent compounds do arrive in the large bowel,
          though the microbial conversion means the molecules that were active
          in the enzyme assay are not necessarily the ones present there.
        citation_title: "Inhibition of Morganella morganii Histidine Decarboxylase Activity and Histamine Accumulation in Mackerel Muscle Derived from Filipendula ulumaria Extracts"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/26939657/"
        caution: >
          Enzyme and food-model evidence only. Meadowsweet contains salicylates,
          so it should be avoided by anyone allergic to aspirin, by people
          taking anticoagulants, and by children with a feverish illness because
          of the theoretical Reye's syndrome risk. It also has no established
          role in reducing gut carriage.

      - name: Aloe vera leaf extract (Aloe barbadensis)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          A crude extract of Aloe barbadensis inhibited a panel of clinically
          isolated bacterial pathogens that included Morganella morganii, along
          with Escherichia coli, Proteus species and Pseudomonas aeruginosa.
          Growth inhibition in culture only, with no animal or human data.
        dose_studied: "not established"
        reaches_gut: >
          Aloe latex contains anthraquinone glycosides such as aloin, which are
          poorly absorbed and are carried to the colon where gut bacteria
          release the active aglycones, which is why aloe latex acts as a
          stimulant laxative. The inner-leaf gel, which is what most aloe
          supplements and drinks contain, is a different preparation with a
          different composition, and the study extract is not necessarily
          equivalent to either.
        citation_title: "Antibacterial activities of crude extract of Aloe barbadensis to clinically isolated bacterial pathogens"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19263248/"
        caution: >
          Culture-dish evidence only, against an organism that in most people
          needs no treatment. Aloe latex is a stimulant laxative that causes
          cramping and potassium loss, and prolonged use leads to bowel
          dependence; it has been withdrawn from over-the-counter laxative use
          in the United States on safety grounds. Whole-leaf aloe extract has
          shown carcinogenic activity in rodent studies. Avoid in pregnancy,
          when breastfeeding, and in children.

      - name: Palmarosa essential oil (geraniol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Palmarosa essential oil and its main component geraniol showed
          antibacterial activity against clinical isolates including Morganella
          morganii, with a minimum inhibitory concentration of 350 micrograms
          per millilitre reported. The isolates in this study came from
          respiratory, skin and soft tissue infections rather than from the gut,
          and the work was entirely in culture.
        dose_studied: "Minimum inhibitory concentration of 350 micrograms per millilitre against M. morganii in vitro; no human dose established"
        reaches_gut: >
          Geraniol is a small terpene alcohol that is stable in acid but is
          rapidly absorbed in the upper small intestine and metabolised by the
          liver, so essentially none of an oral dose reaches the colon in active
          form. This is a clear failure of the requirement that the substance
          must arrive intact where the organism lives.
        citation_title: "Antibacterial Activity of Palmarosa (Cymbopogon martini (Roxb.) Will.Watson) Essential Oil and Geraniol Against Clinical Isolates from Respiratory, Skin, and Soft Tissue Infections"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/41599146/"
        caution: >
          Culture-dish evidence only, and it does not reach the colon. Palmarosa
          oil is intended for topical and aromatic use, not for ingestion, and
          concentrated essential oils irritate the gullet and stomach. Avoid in
          pregnancy and in children. Bear in mind that suppressing normal gut
          Morganella is not a goal supported by any evidence.
