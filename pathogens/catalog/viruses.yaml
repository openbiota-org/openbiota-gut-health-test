      segments are one rotavirus result rather than three. Partial segment
      recovery cannot imply a complete genome or a resolved strain or
      reassortant. Recent live oral rotavirus vaccine context must be preserved:
      rotavirus vaccine shedding is documented, and vaccine-versus-wild-type
      inference requires validated discriminatory evidence rather than detection
      alone. Absent that evidence the report states that vaccine and wild-type
      origin were not discriminated.

