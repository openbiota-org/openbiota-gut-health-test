# Parasite seed catalog compiled from specs/BUILD_SPEC_v05.0.md section 9
# (9.1-9.6). One seed per semicolon-separated organism; explicitly named species
# complexes stay as one seed with member/parent links. Route tokens follow the
# spec's route column (E2 -> EukDetect2, WB:BioProject -> WBPS19:BioProject,
# N -> NCBI); ParaRef is added as a candidate for helminths and intestinal
# protozoa and must be confirmed against its actual accession manifest.
# No route token makes a target reportable before reference checks (spec 9).
schema_version: pathogens.seed.v1
catalog_section: "9"
seeds:
