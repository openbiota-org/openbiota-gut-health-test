version: 1
lane: fungi_parasites

# Evidence-backed, non-prescription agents for gut fungi, protozoa and worms.
#
# Evidence tiers are applied strictly. "in_vitro" means the work was done in a
# dish and no human data exist. Most of the anti-Candida literature is in-vitro
# only, and this area attracts a great deal of low-quality commercial claiming,
# so the effect text says plainly what was and was not shown.
#
# Where the honest answer is that nothing should be taken, the organism has an
# empty agents list and a no_agents_reason instead of an invented protocol.

organisms:

  # ---------------------------------------------------------------------------
  # CANDIDA AND RELATED YEASTS - true gut colonisers, genuine opportunists
  # ---------------------------------------------------------------------------

  fungi.candida_albicans:
    display_name: Candida albicans
    what_it_is: >
      A yeast that lives harmlessly in the mouth, gut and vagina of most healthy
      people. It is the commonest yeast found in human stool and is a normal part
      of the gut community rather than an invader that has arrived from outside.
    why_it_matters: >
      In people whose defences are intact it causes no disease at all. It becomes
      a problem when the balance around it changes: broad-spectrum antibiotics,
      high-dose steroids, chemotherapy, poorly controlled diabetes, an intensive
      care stay or a central venous line can let it overgrow, invade the gut
      lining, or reach the bloodstream. Thrush of the mouth and vagina is the
      common everyday form. Invasive candidiasis is a serious hospital illness and
      is treated with prescription antifungal drugs, not supplements.
    normal_carriage: >
      Very common. Depending on the detection method used, roughly half to
      two-thirds of healthy adults carry Candida albicans somewhere in the
      digestive tract at any one time, and finding it in stool is expected rather
      than abnormal.
    overgrowth_signal: >
      Sequencing counts the DNA that is present; it cannot tell you whether the
      yeast is growing as harmless budding cells or as invasive filaments, and it
      cannot diagnose an infection. A high relative abundance is more meaningful
      when it appears alongside a collapse in bacterial diversity, recent
      antibiotics, or genuine symptoms. On its own, a positive result in a
      well person is a normal finding and no reason to take anything.
    agents:
      - name: Caprylic acid (and capric acid, C8/C10 medium-chain fatty acids)
        kind: nutrient
        evidence_tier: in_vitro
        effect: >
          Killed Candida albicans in culture by disrupting the yeast cell
          membrane, with capric acid the fastest-acting of the fatty acids tested.
          This was a test-tube experiment using millimolar concentrations. There
          are no human trials showing that swallowing caprylic acid reduces
          Candida in the gut, and the concentrations used in the dish are far
          higher than anything a supplement reliably produces in the colon.
        dose_studied: "10 mM in culture for 10 minutes; no established human dose"
        reaches_gut: >
          Free medium-chain fatty acids are largely absorbed in the small
          intestine, so plain capsules deliver little to the colon. Enteric-coated
          or slow-release forms are marketed to get round this, but the amount
          actually arriving in the large bowel has not been measured in people.
          This is a real limitation, not a technicality.
        citation_title: "In vitro killing of Candida albicans by fatty acids and monoglycerides"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC90807/"
        caution: >
          Commonly causes nausea, heartburn and loose stools. It does not treat
          thrush, invasive candidiasis or any diagnosed infection. Avoid if you
          have significant liver disease. Not a substitute for prescription
          antifungals when one is indicated.

      - name: Monolaurin (lauric acid monoglyceride)
        kind: nutrient
        evidence_tier: in_vitro
        effect: >
          Lauric acid was the most active of the saturated fatty acids tested
          against Candida albicans at lower concentrations and longer contact
          times in the same culture experiment. Test-tube result only; no human
          data on gut Candida.
        dose_studied: "2.5-10 mM in culture; no established human dose"
        reaches_gut: >
          Monolaurin resists breakdown by stomach acid better than free lauric
          acid, but it is still substantially digested and absorbed in the small
          intestine. Delivery to the colon in an active form is assumed rather
          than demonstrated.
        citation_title: "In vitro killing of Candida albicans by fatty acids and monoglycerides"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC90807/"
        caution: >
          Generally well tolerated but frequently causes digestive upset at the
          doses sold. No evidence it clears an established infection. Not suitable
          as a replacement for medical treatment.

      - name: Undecylenic acid
        kind: nutrient
        evidence_tier: in_vitro
        effect: >
          At 10 micromolar it reduced the switch from harmless budding yeast to
          the invasive filamentous form roughly sevenfold in culture, without
          slowing growth. In other words, it blunted a virulence behaviour rather
          than killing the organism, and only in a dish. No human gut data exist.
        dose_studied: "10 micromolar in culture; no established oral human dose"
        reaches_gut: >
          A fatty acid absorbed in the small intestine like other medium-chain
          fatty acids, so colonic delivery from an ordinary capsule is doubtful.
          Its established human use is topical, on skin and denture liners.
        citation_title: "Undecylenic acid inhibits morphogenesis of Candida albicans"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC90168/"
        caution: >
          Can irritate the stomach. Avoid in pregnancy, where it has not been
          studied. It has no demonstrated effect on Candida living in the human
          bowel and should not be used in place of antifungal treatment.

      - name: Oregano oil (carvacrol and thymol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Carvacrol inhibited and killed clinical Candida isolates in culture,
          with a mean minimum inhibitory concentration around 25 micrograms per
          millilitre across albicans and non-albicans species, and it worked
          against species that were resistant to standard antifungals. This is a
          laboratory finding; there is no trial showing it reduces gut Candida in
          people.
        dose_studied: "MIC around 25 micrograms/mL in culture; no established human dose for gut Candida"
        reaches_gut: >
          Carvacrol and thymol are lipophilic and largely absorbed in the upper
          small intestine, so plain oregano oil mostly never reaches the colon.
          Enteric-coated preparations are designed to release lower down, but the
          colonic concentration achieved in humans has not been measured.
        citation_title: "The inhibitory effects of carvacrol, nystatin, and their combination on oral candidiasis isolates"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11010274/"
        caution: >
          Undiluted oregano oil burns the mouth, throat and stomach lining and
          must never be swallowed neat. It is an abortifacient and should not be
          taken in pregnancy. It may add to the effect of anticoagulants. Broadly
          antimicrobial, so it will also suppress beneficial gut bacteria.

      - name: Berberine
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited Candida albicans and non-albicans species in both free-floating
          and biofilm form in culture, reducing biofilm formation and thickness.
          Berberine used on its own is a weak antifungal, and much of the published
          enthusiasm rests on its ability to make prescription azoles work better
          rather than on its own activity. No human data for gut Candida.
        dose_studied: "not established for Candida; oral berberine trials for other conditions have used 500 mg two or three times daily"
        reaches_gut: >
          Berberine is very poorly absorbed, typically under one per cent of an
          oral dose, so almost all of what is swallowed stays in the gut lumen and
          reaches the colon. Of the agents here, this is the one with the most
          plausible case for arriving where the yeast actually lives.
        citation_title: "In vitro Antifungal Effects of Berberine Against Candida spp. In Planktonic and Biofilm Conditions"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6957002/"
        caution: >
          Interacts with a long list of medicines because it inhibits CYP3A4 and
          P-glycoprotein, including ciclosporin, some statins and metformin. It can
          lower blood sugar. Do not use in pregnancy or breastfeeding, and never in
          newborns, where it can displace bilirubin and cause kernicterus. Commonly
          causes cramping and diarrhoea.

      - name: Garlic (allicin)
        kind: food
        evidence_tier: in_vitro
        effect: >
          Allicin inhibited six Candida species in culture at concentrations from
          0.05 to 25 micrograms per millilitre, and improved the activity of
          fluconazole and ketoconazole against some, though not most, isolates
          tested. Laboratory work only; the authors themselves state that in-vivo
          testing is needed.
        dose_studied: "MIC50/MIC90 0.05-25 micrograms/mL in culture; no established human dose"
        reaches_gut: >
          Allicin is unstable, forms only when raw garlic is crushed, and degrades
          in stomach acid, so most of it does not survive to the colon.
          Enteric-coated allicin-yielding preparations are intended to solve this;
          whether they do so in practice is not established.
        citation_title: "In vitro investigation of antifungal activity of allicin alone and in combination with azoles against Candida species"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19924565/"
        caution: >
          Increases bleeding risk with warfarin, direct oral anticoagulants and
          antiplatelet drugs, and should be stopped before surgery. It reduces
          blood levels of saquinavir. Causes reflux, wind and body odour. It is a
          food, not a treatment, and will not clear an infection.

      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          In 181 very preterm infants randomised to Saccharomyces boulardii or
          nystatin, stool and skin fungal colonisation rates were no different
          between the two, meaning the probiotic performed as well as a
          prescription antifungal at preventing colonisation, though it did not
          reduce it below that level. No infant on the probiotic developed a
          Candida-positive blood culture, versus two on nystatin. Separately, in
          culture, this yeast secretes capric acid, which suppresses Candida
          albicans filament formation, adhesion and biofilm.
        dose_studied: "250 mg twice daily is the usual adult capsule dose; the neonatal trial used 5 billion CFU per day"
        reaches_gut: >
          It is a live yeast that survives stomach acid and transits the whole
          bowel, reaching high concentrations in the colon while dosing continues.
          It does not colonise permanently and is cleared within a few days of
          stopping.
        citation_title: "Prophylactic Saccharomyces boulardii versus nystatin for the prevention of fungal colonization and invasive fungal infection in premature infants"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/23703468/"
        caution: >
          Must not be given to anyone with a central venous catheter, to the
          severely immunocompromised, or to critically ill patients: fungaemia
          caused by the probiotic yeast itself is a documented complication,
          including from opening capsules near a line. It is a yeast, so it will
          also register on a fungal sequencing panel. Avoid if you have a genuine
          yeast allergy.

      - name: Probiotic lactobacilli (Lacticaseibacillus rhamnosus GG and LC705 with Propionibacterium freudenreichii)
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          In 276 elderly people randomised to probiotic or control cheese for 16
          weeks, the proportion with high salivary yeast counts fell from 30 to 21
          per cent on probiotic and rose from 28 to 34 per cent on control, a 75
          per cent reduction in the odds of a high yeast count. This was oral, not
          intestinal, Candida, and the effect was on carriage level rather than
          eradication.
        dose_studied: "50 g of probiotic cheese daily for 16 weeks"
        reaches_gut: >
          Lactobacilli are acid-tolerant by design and standard preparations are
          recovered alive from stool during dosing, so colonic delivery is
          established. The caveat is that the trial measured the mouth, so
          extending the result to the colon is an inference.
        citation_title: "Probiotics reduce the prevalence of oral candida in the elderly - a randomized controlled trial"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/17251510/"
        caution: >
          Effects are strain-specific, so a different product is not
          interchangeable with the one tested. Avoid live probiotics in severe
          immunosuppression, in the critically ill and in anyone with a central
          line. Bloating in the first week is common.

      - name: Bovine lactoferrin
        kind: nutrient
        evidence_tier: human_rct
        effect: >
          In 472 very low birth weight neonates randomised to bovine lactoferrin,
          lactoferrin plus a probiotic, or placebo, invasive fungal infection fell
          from 7.7 per cent on placebo to 0.7 per cent on lactoferrin. Fungal
          colonisation rates were unchanged; what fell was progression from being
          colonised to becoming infected. This is an important distinction: it did
          not reduce the amount of yeast present.
        dose_studied: "100 mg per day for 4-6 weeks in preterm neonates"
        reaches_gut: >
          Lactoferrin is partly digested by stomach pepsin, but that digestion
          itself releases lactoferricin, the active antimicrobial fragment, and
          intact lactoferrin is recoverable from the stool of supplemented infants.
        citation_title: "Bovine lactoferrin prevents invasive fungal infections in very low birth weight infants: a randomized controlled trial"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/22184648/"
        caution: >
          It is a milk-derived protein, so avoid it with cows' milk protein
          allergy. The trial was in preterm babies at very high risk; there is no
          evidence it does anything useful for a healthy adult who simply has
          Candida detected in stool.

      - name: Curcumin
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited all 14 Candida strains tested, including Candida glabrata, but
          only at minimum inhibitory concentrations of 250 to 2000 micrograms per
          millilitre, and it was clearly weaker than fluconazole in the same
          experiments. Those are very high concentrations, and this should be read
          as weak laboratory activity rather than a promising treatment.
        dose_studied: "MIC 250-2000 micrograms/mL in culture; no established human dose for Candida"
        reaches_gut: >
          Curcumin is very poorly absorbed and heavily metabolised in the gut wall
          and liver, which means almost all of an oral dose stays in the lumen and
          reaches the colon. Piperine-enhanced and phospholipid formulations
          deliberately improve absorption and therefore reduce, rather than
          increase, the amount left in the colon.
        citation_title: "Curcumin as a promising anticandidal of clinical interest"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/21358761/"
        caution: >
          Can increase bleeding risk with anticoagulants, may worsen gallstone
          symptoms, and rare cases of liver injury have been reported, mostly with
          high-absorption formulations. Reduces iron absorption. The concentrations
          that worked in the dish are not achievable in the human bloodstream.

      - name: Green tea catechins (EGCG)
        kind: food
        evidence_tier: in_vitro
        effect: >
          Inhibited Candida albicans in culture, but strongly pH-dependent: it took
          2000 mg/L to inhibit growth at pH 6.0 and 15.6-250 mg/L at pH 7.0. Its
          more consistent finding was making amphotericin B and fluconazole work at
          lower doses, including against resistant strains. No human data.
        dose_studied: "MIC90 15.6-2000 mg/L in culture depending on pH; no established human dose"
        reaches_gut: >
          Only a small fraction of catechins is absorbed in the small intestine and
          the remainder passes into the colon, where the near-neutral pH is
          actually the range in which the antifungal activity was strongest.
        citation_title: "Multiple effects of green tea catechin on the antifungal activity of antimycotics against Candida albicans"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/14688042/"
        caution: >
          High-dose green tea extract capsules, as opposed to brewed tea, have
          caused acute liver injury and should not be taken on an empty stomach or
          at high dose. Catechins block non-haem iron absorption and reduce the
          effect of nadolol. Drinking tea is safe; concentrated extracts are the
          concern.

      - name: Cinnamon (cinnamaldehyde)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Prevented growth of Candida albicans at 62.5 microlitres per millilitre
          and Candida glabrata at 48.8 microlitres per millilitre in culture, and
          killed both at slightly higher concentrations, but was far less potent
          than nystatin tested alongside it. Laboratory only.
        dose_studied: "48.8-93.7 microlitres/mL in culture; no established human dose"
        reaches_gut: >
          Cinnamaldehyde is largely absorbed and rapidly oxidised in the upper gut,
          so very little reaches the colon unmodified. This is a genuine obstacle
          to using it for a colonic organism.
        citation_title: "The Effects of Cinnamaldehyde (Cinnamon Derivatives) and Nystatin on Candida Albicans and Candida Glabrata"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6490497/"
        caution: >
          Cassia cinnamon, the common supermarket type, contains coumarin, which is
          liver-toxic in quantity; Ceylon cinnamon contains far less. Cinnamon oil
          irritates mucous membranes. Can lower blood sugar and add to the effect
          of diabetes medication.

  fungi.candida_glabrata:
    display_name: Candida glabrata (Nakaseomyces glabratus)
    what_it_is: >
      A small yeast, unrelated closely enough to Candida albicans that it has been
      formally renamed Nakaseomyces glabratus. It lives quietly in the mouth, gut
      and urinary tract of many healthy people and is the second or third most
      common Candida species found in humans.
    why_it_matters: >
      It matters mainly because of what it is resistant to. It has naturally
      reduced susceptibility to fluconazole and can acquire resistance to
      echinocandins during treatment, so when it does cause disease the treatment
      options are narrower and the outcome worse than with Candida albicans. It
      causes bloodstream infection, urinary infection and vaginal thrush, mostly in
      older, hospitalised, catheterised or immunocompromised people. Simply
      carrying it in the bowel is not an infection.
    normal_carriage: >
      Common. It is found in the digestive tract of a substantial minority of
      healthy adults and becomes more frequent with age, with diabetes, and after
      courses of fluconazole, which selects for it.
    overgrowth_signal: >
      Sequencing cannot distinguish harmless carriage from infection, and it cannot
      test drug susceptibility, which is the clinically important question for this
      species. A high read count matters more if it follows recent azole treatment
      or accompanies real symptoms. In a well person it is a carriage finding.
    agents:
      - name: Oregano oil (carvacrol and thymol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          In the study of clinical Candida isolates, carvacrol inhibited Candida
          glabrata more strongly than nystatin did, which is notable given how
          poorly this species responds to some standard drugs. This remains a
          test-tube result with no human evidence behind it.
        dose_studied: "MIC around 25 micrograms/mL in culture; no established human dose"
        reaches_gut: >
          Largely absorbed high in the small intestine, so plain preparations reach
          the colon poorly; enteric coating is intended to address this but the
          colonic concentration in people has not been measured.
        citation_title: "The inhibitory effects of carvacrol, nystatin, and their combination on oral candidiasis isolates"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11010274/"
        caution: >
          Must not be swallowed undiluted. Abortifacient, so avoid in pregnancy.
          May add to anticoagulant effects. It has no role in treating a diagnosed
          Candida glabrata infection, which needs specialist prescription therapy
          guided by susceptibility testing.

      - name: Berberine
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Candida glabrata was among the species inhibited in the planktonic and
          biofilm testing, alongside Candida albicans and Candida krusei. Worth
          noting honestly: other work has found that berberine's much-publicised
          synergy with fluconazole is reliable against Candida albicans but
          inconsistent or absent against Candida glabrata.
        dose_studied: "not established for Candida; other oral berberine trials have used 500 mg two or three times daily"
        reaches_gut: >
          Under one per cent is absorbed, so nearly all of an oral dose remains in
          the lumen and reaches the colon intact.
        citation_title: "In vitro Antifungal Effects of Berberine Against Candida spp. In Planktonic and Biofilm Conditions"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6957002/"
        caution: >
          Substantial drug interactions through CYP3A4 and P-glycoprotein. Lowers
          blood sugar. Contraindicated in pregnancy, breastfeeding and in newborns.
          Frequently causes cramping and diarrhoea.

      - name: Curcumin
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Candida glabrata was one of the two reference strains examined in detail;
          curcumin reduced its ergosterol content by 53 per cent and its proteinase
          secretion by 39 per cent at the minimum inhibitory concentration. But
          that concentration was in the hundreds to thousands of micrograms per
          millilitre, and fluconazole was clearly more effective on every measure.
        dose_studied: "MIC 250-2000 micrograms/mL in culture; no established human dose"
        reaches_gut: >
          Poor absorption means most of an oral dose stays in the lumen and reaches
          the colon; high-bioavailability formulations defeat this.
        citation_title: "Curcumin as a promising anticandidal of clinical interest"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/21358761/"
        caution: >
          Bleeding risk with anticoagulants, can provoke gallstone pain, rare liver
          injury with concentrated products, reduces iron absorption.

      - name: Cinnamon (cinnamaldehyde)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Growth of Candida glabrata was prevented at 48.8 microlitres per
          millilitre and the organism was killed at 62.5, making it slightly more
          susceptible than Candida albicans in the same experiment. Nystatin was
          still far more potent. No human data.
        dose_studied: "48.8-62.5 microlitres/mL in culture; no established human dose"
        reaches_gut: >
          Mostly absorbed and metabolised before the colon, which limits its
          plausibility for a large-bowel organism.
        citation_title: "The Effects of Cinnamaldehyde (Cinnamon Derivatives) and Nystatin on Candida Albicans and Candida Glabrata"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6490497/"
        caution: >
          Cassia cinnamon carries a coumarin liver-toxicity risk at high intake.
          Cinnamon oil is a mucosal irritant. May lower blood sugar.

      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          Matched nystatin for preventing fungal colonisation of stool and skin in
          181 very preterm infants, and no infant taking it developed candidaemia.
          The trial reported fungal colonisation overall rather than results split
          by Candida species, so applying it specifically to Candida glabrata is an
          extrapolation.
        dose_studied: "250 mg twice daily in adults; 5 billion CFU per day in the neonatal trial"
        reaches_gut: >
          A live yeast that survives gastric acid and reaches the colon in high
          numbers while being taken; it clears within days of stopping.
        citation_title: "Prophylactic Saccharomyces boulardii versus nystatin for the prevention of fungal colonization and invasive fungal infection in premature infants"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/23703468/"
        caution: >
          Do not use with a central venous catheter, in severe immunosuppression or
          in critical illness, because the probiotic yeast itself can cause
          bloodstream infection. It is a yeast and will appear on fungal sequencing.

      - name: Caprylic acid (and capric acid)
        kind: nutrient
        evidence_tier: in_vitro
        effect: >
          Membrane-disrupting killing was demonstrated against Candida albicans in
          culture. Candida glabrata was not tested in that work, so this is
          extrapolation within the genus and should be read as such; there is no
          human evidence for either species.
        dose_studied: "10 mM in culture; no established human dose"
        reaches_gut: >
          Absorbed in the small intestine, so little reaches the colon from plain
          capsules. A genuine limitation.
        citation_title: "In vitro killing of Candida albicans by fatty acids and monoglycerides"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC90807/"
        caution: >
          Nausea, heartburn and loose stools are common. Does not treat any
          diagnosed infection.

  fungi.candida_krusei:
    display_name: Candida krusei (Pichia kudriavzevii)
    what_it_is: >
      A yeast now more properly called Pichia kudriavzevii. It is used
      industrially in cocoa and some fermented foods, and it also turns up as a
      minor member of the human gut and mouth community. Some detections in stool
      genuinely come from fermented food rather than from the person's own flora.
    why_it_matters: >
      Its clinical significance is almost entirely about drug resistance. Candida
      krusei is intrinsically resistant to fluconazole and has reduced
      susceptibility to flucytosine and amphotericin B, so when it causes
      bloodstream infection the choice of drug is constrained and mortality is
      high. It emerges in people who have had prolonged fluconazole exposure, and
      it is chiefly a problem in haematology and intensive care patients. Finding
      it in stool is not an infection.
    normal_carriage: >
      Uncommon but not rare. It is a minority coloniser of the healthy gut, more
      often detected after antifungal exposure or in people who eat a lot of
      fermented food.
    overgrowth_signal: >
      Sequencing gives you presence and relative abundance, not viability,
      invasiveness or drug susceptibility. In someone who is well, a positive
      result is a carriage or dietary finding. What would make it concerning is not
      the read count but the clinical setting: neutropenia, a central line, recent
      prolonged fluconazole, or signs of systemic infection.
    agents:
      - name: Oregano oil (carvacrol and thymol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Carvacrol inhibited Candida krusei clinical isolates in culture, and did
          so more effectively than nystatin in that experiment. The relevance is
          that carvacrol's mechanism is membrane disruption rather than the
          ergosterol-synthesis route that fluconazole uses, so intrinsic azole
          resistance does not protect against it. Still a dish result with no human
          evidence.
        dose_studied: "MIC around 25 micrograms/mL in culture; no established human dose"
        reaches_gut: >
          Absorbed high in the small bowel unless enteric-coated; colonic delivery
          in humans is unmeasured.
        citation_title: "The inhibitory effects of carvacrol, nystatin, and their combination on oral candidiasis isolates"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11010274/"
        caution: >
          Never swallow undiluted oil. Abortifacient; avoid in pregnancy. May add
          to anticoagulant effect. It is not a treatment for invasive Candida
          krusei infection, which is a medical emergency requiring an echinocandin
          or similar prescription drug.

      - name: Berberine
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Candida krusei was one of the reference strains inhibited in both
          free-floating and biofilm conditions. As with Candida glabrata, the
          reported synergy between berberine and fluconazole is much less
          consistent for this species than for Candida albicans, and in any case
          fluconazole is not usable against Candida krusei.
        dose_studied: "not established for Candida"
        reaches_gut: >
          Almost entirely unabsorbed, so it reaches the colon at high luminal
          concentrations.
        citation_title: "In vitro Antifungal Effects of Berberine Against Candida spp. In Planktonic and Biofilm Conditions"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6957002/"
        caution: >
          Interacts with many medicines via CYP3A4 and P-glycoprotein; lowers blood
          sugar; contraindicated in pregnancy, breastfeeding and newborns.

      - name: Garlic (allicin)
        kind: food
        evidence_tier: in_vitro
        effect: >
          Allicin inhibited a panel of six Candida species in culture in the
          0.05-25 micrograms per millilitre range. Candida krusei is among the
          species reported susceptible to allicin in the wider literature, but the
          specific study cited found azole synergy in only a minority of species
          tested. Laboratory evidence only.
        dose_studied: "MIC50/MIC90 0.05-25 micrograms/mL in culture; no established human dose"
        reaches_gut: >
          Allicin is acid-labile and largely destroyed in the stomach, so raw
          garlic delivers little to the colon. Enteric-coated allicin products aim
          to fix this but human colonic levels are not documented.
        citation_title: "In vitro investigation of antifungal activity of allicin alone and in combination with azoles against Candida species"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19924565/"
        caution: >
          Raises bleeding risk with anticoagulants and antiplatelets; stop before
          surgery. Lowers saquinavir levels. Causes reflux and wind. A food, not a
          treatment.

      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          Performed as well as nystatin at limiting stool and skin fungal
          colonisation in 181 preterm infants, with no candidaemia in the probiotic
          arm. Results were reported for fungal colonisation as a whole rather than
          by species, so the application to Candida krusei is by extension.
        dose_studied: "250 mg twice daily in adults; 5 billion CFU daily in the trial"
        reaches_gut: >
          Survives stomach acid and reaches the colon alive throughout dosing.
        citation_title: "Prophylactic Saccharomyces boulardii versus nystatin for the prevention of fungal colonization and invasive fungal infection in premature infants"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/23703468/"
        caution: >
          Absolutely avoid with a central venous line, in severe immunosuppression
          or in critical illness. Since Candida krusei is largely a disease of
          exactly those patients, this probiotic is the wrong choice for anyone in
          whom Candida krusei is a real clinical worry.

      - name: Caprylic acid (and capric acid)
        kind: nutrient
        evidence_tier: in_vitro
        effect: >
          Rapid membrane-disrupting killing shown against Candida albicans in
          culture. Candida krusei was not included in that study, so this is
          genus-level extrapolation, stated as such. No human data.
        dose_studied: "10 mM in culture; no established human dose"
        reaches_gut: >
          Substantially absorbed in the small intestine; delivery to the colon from
          plain capsules is poor.
        citation_title: "In vitro killing of Candida albicans by fatty acids and monoglycerides"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC90807/"
        caution: >
          Digestive upset is common. No demonstrated effect on human gut Candida.

  fungi.candida_tropicalis:
    display_name: Candida tropicalis
    what_it_is: >
      A yeast that lives in the human gut, mouth and on skin, and is also widely
      present in soil, sewage and on fruit. It is one of the more frequently
      isolated non-albicans Candida species worldwide, particularly in Asia and
      Latin America.
    why_it_matters: >
      Of the common non-albicans species it is among the more aggressive. It has a
      particular association with bloodstream infection in people with blood
      cancers and neutropenia, and it can translocate from the gut into the
      circulation when the intestinal barrier and the immune system are both
      compromised. In healthy people it causes nothing. Azole resistance is rising
      in some regions.
    normal_carriage: >
      Present in the gut of a minority of healthy adults, with rates varying widely
      by geography and diet. Finding it is not in itself abnormal.
    overgrowth_signal: >
      A DNA read count cannot separate harmless carriage from invasion, and the
      circumstance that makes this species dangerous, namely neutropenia with a
      damaged gut lining, is a clinical state rather than something a stool test
      shows. Rising abundance alongside antibiotics, chemotherapy or a collapse in
      bacterial diversity is worth mentioning to a doctor; an isolated finding in a
      well person is not.
    agents:
      - name: Oregano oil (carvacrol and thymol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Carvacrol inhibited Candida tropicalis clinical isolates in culture and
          outperformed nystatin against the non-albicans species in that panel.
          Test-tube result; no human data.
        dose_studied: "MIC around 25 micrograms/mL in culture; no established human dose"
        reaches_gut: >
          Largely absorbed in the upper small intestine unless enteric-coated;
          colonic concentrations in humans are unknown.
        citation_title: "The inhibitory effects of carvacrol, nystatin, and their combination on oral candidiasis isolates"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11010274/"
        caution: >
          Never take neat. Avoid in pregnancy. May potentiate anticoagulants. Also
          suppresses beneficial gut bacteria.

      - name: Garlic (allicin)
        kind: food
        evidence_tier: in_vitro
        effect: >
          Candida tropicalis was one of the species in which allicin showed
          synergy with fluconazole or ketoconazole, on top of its own inhibitory
          activity in the 0.05-25 micrograms per millilitre range. Laboratory only;
          the authors called for in-vivo testing.
        dose_studied: "MIC50/MIC90 0.05-25 micrograms/mL in culture; no established human dose"
        reaches_gut: >
          Allicin degrades in stomach acid, so little survives to the colon from
          raw garlic. Enteric-coated products are designed for this but unproven in
          people.
        citation_title: "In vitro investigation of antifungal activity of allicin alone and in combination with azoles against Candida species"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19924565/"
        caution: >
          Bleeding risk with anticoagulants and antiplatelets; stop before surgery.
          Reduces saquinavir levels. Reflux and wind are common.

      - name: Berberine
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited Candida species in free-floating and biofilm form in culture.
          Candida tropicalis was not one of the named reference strains in that
          particular study, so this is genus-level evidence applied to a close
          relative, stated as such.
        dose_studied: "not established for Candida"
        reaches_gut: >
          Poorly absorbed, so it reaches the colon at high luminal concentration.
        citation_title: "In vitro Antifungal Effects of Berberine Against Candida spp. In Planktonic and Biofilm Conditions"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6957002/"
        caution: >
          Numerous CYP3A4 and P-glycoprotein interactions; lowers blood sugar;
          contraindicated in pregnancy, breastfeeding and newborns.

      - name: Cinnamon (cinnamaldehyde)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Cinnamaldehyde inhibited and killed Candida albicans and Candida glabrata
          in the cited study; Candida tropicalis is reported elsewhere as the least
          susceptible of the common species to it. Read this as weak, indirect
          laboratory evidence rather than a reason to expect an effect.
        dose_studied: "48.8-93.7 microlitres/mL in culture against related species; no established human dose"
        reaches_gut: >
          Largely absorbed and oxidised in the upper gut, so colonic delivery is
          poor.
        citation_title: "The Effects of Cinnamaldehyde (Cinnamon Derivatives) and Nystatin on Candida Albicans and Candida Glabrata"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6490497/"
        caution: >
          Coumarin in cassia cinnamon is liver-toxic in quantity. Cinnamon oil
          irritates mucous membranes. May lower blood sugar.

      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          Equalled nystatin for preventing fungal colonisation in 181 very preterm
          infants and produced no candidaemia. Reported for fungal colonisation
          collectively, not by species, so applying it to Candida tropicalis is an
          extension of the finding.
        dose_studied: "250 mg twice daily in adults; 5 billion CFU daily in the trial"
        reaches_gut: >
          Live yeast, acid-tolerant, reaches the colon in high numbers during
          dosing.
        citation_title: "Prophylactic Saccharomyces boulardii versus nystatin for the prevention of fungal colonization and invasive fungal infection in premature infants"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/23703468/"
        caution: >
          Contraindicated with a central line, in severe immunosuppression and in
          critical illness because of probiotic fungaemia. Since Candida tropicalis
          bloodstream infection occurs in exactly that population, this is the
          wrong agent for anyone at real risk.

      - name: Caprylic acid (and capric acid)
        kind: nutrient
        evidence_tier: in_vitro
        effect: >
          Killed Candida albicans in culture through membrane disruption. Candida
          tropicalis was not tested; this is genus-level extrapolation. No human
          data for any species.
        dose_studied: "10 mM in culture; no established human dose"
        reaches_gut: >
          Absorbed in the small intestine; poor colonic delivery from plain
          capsules.
        citation_title: "In vitro killing of Candida albicans by fatty acids and monoglycerides"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC90807/"
        caution: >
          Nausea, heartburn and loose stools are common. Treats nothing diagnosed.

  fungi.candida_parapsilosis:
    display_name: Candida parapsilosis
    what_it_is: >
      A yeast that lives on human skin, under fingernails and in the gut, and which
      survives well on plastic surfaces. Unlike most Candida species, it is
      genuinely common as an environmental and skin organism as well as a gut one.
    why_it_matters: >
      Its signature problem is not the bowel at all: it sticks to plastic and
      forms biofilm on intravenous catheters and prosthetic material, and it is a
      leading cause of catheter-related bloodstream infection and of infection in
      neonatal intensive care, often spread on the hands of staff. It rarely
      invades from the gut. Finding it in stool is of limited clinical
      significance in someone without a line.
    normal_carriage: >
      Frequently carried on skin and in the digestive tract of healthy people, and
      it is one of the more common yeasts recovered from the hands of healthy
      adults.
    overgrowth_signal: >
      For this species the abundance in stool is close to irrelevant, because the
      route to disease is through indwelling plastic rather than through the gut
      wall. Nothing a stool sequencing test shows would establish that gut carriage
      of Candida parapsilosis is causing harm.
    agents:
      - name: Oregano oil (carvacrol and thymol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Carvacrol inhibited clinical Candida isolates in culture including
          non-albicans species. Candida parapsilosis was not separately reported in
          that panel, so this is genus-level laboratory evidence, stated as such.
        dose_studied: "MIC around 25 micrograms/mL in culture; no established human dose"
        reaches_gut: >
          Absorbed high in the small intestine unless enteric-coated; colonic
          delivery unmeasured in humans.
        citation_title: "The inhibitory effects of carvacrol, nystatin, and their combination on oral candidiasis isolates"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11010274/"
        caution: >
          Never swallow neat. Avoid in pregnancy. It will do nothing about a
          catheter biofilm, which is the way this organism actually causes harm;
          an infected line has to be removed.

      - name: Garlic (allicin)
        kind: food
        evidence_tier: in_vitro
        effect: >
          Candida parapsilosis is among the species reported susceptible to allicin
          in culture, at concentrations in the same 0.05-25 micrograms per
          millilitre range as the rest of the genus. Synergy with azoles was found
          for only some species. No human evidence.
        dose_studied: "MIC50/MIC90 0.05-25 micrograms/mL in culture; no established human dose"
        reaches_gut: >
          Allicin is destroyed by stomach acid; colonic delivery from raw garlic is
          minimal.
        citation_title: "In vitro investigation of antifungal activity of allicin alone and in combination with azoles against Candida species"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19924565/"
        caution: >
          Bleeding risk with anticoagulants; stop before surgery. Reduces saquinavir
          levels.

      - name: Green tea catechins (EGCG)
        kind: food
        evidence_tier: in_vitro
        effect: >
          EGCG inhibited Candida albicans in a pH-dependent way and improved the
          activity of amphotericin B and fluconazole. Wider testing across seven
          Candida species has found Candida parapsilosis among the more susceptible
          to EGCG. Laboratory data only, with no in-vivo work.
        dose_studied: "MIC90 15.6-2000 mg/L in culture depending on pH; no established human dose"
        reaches_gut: >
          Most catechins escape absorption and reach the colon, where the pH is in
          the range where the activity was greatest.
        citation_title: "Multiple effects of green tea catechin on the antifungal activity of antimycotics against Candida albicans"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/14688042/"
        caution: >
          Concentrated green tea extract capsules have caused acute liver injury.
          Blocks non-haem iron absorption; reduces nadolol effect. Brewed tea is
          not the concern.

      - name: Bovine lactoferrin
        kind: nutrient
        evidence_tier: human_rct
        effect: >
          Reduced invasive fungal infection from 7.7 per cent to 0.7 per cent in
          472 very low birth weight neonates, without changing colonisation rates.
          Candida parapsilosis is one of the dominant species in neonatal units,
          which makes this trial population unusually relevant here, though the
          published analysis was not broken down by species.
        dose_studied: "100 mg per day for 4-6 weeks in preterm neonates"
        reaches_gut: >
          Partly digested to lactoferricin, which is itself the active fragment,
          and intact lactoferrin is recoverable from supplemented infants' stool.
        citation_title: "Bovine lactoferrin prevents invasive fungal infections in very low birth weight infants: a randomized controlled trial"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/22184648/"
        caution: >
          Milk-derived; avoid with cows' milk protein allergy. The benefit was in
          extremely high-risk newborns and should not be assumed for a healthy
          adult with an incidental stool finding.

      - name: Caprylic acid (and capric acid)
        kind: nutrient
        evidence_tier: in_vitro
        effect: >
          Membrane-disrupting killing of Candida albicans in culture; Candida
          parapsilosis was not tested, so this is applied at genus level and stated
          as such. No human data.
        dose_studied: "10 mM in culture; no established human dose"
        reaches_gut: >
          Absorbed in the small intestine; poor colonic delivery.
        citation_title: "In vitro killing of Candida albicans by fatty acids and monoglycerides"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC90807/"
        caution: >
          Digestive upset is common. It has no effect on catheter biofilm and does
          not treat any diagnosed infection.

  fungi.candida_orthopsilosis:
    display_name: Candida orthopsilosis
    what_it_is: >
      A yeast that was split off from Candida parapsilosis as a separate species in
      2005, having been indistinguishable from it by older laboratory methods. It
      behaves broadly like Candida parapsilosis and lives on skin and in the gut.
    why_it_matters: >
      It accounts for a small minority of infections previously all attributed to
      Candida parapsilosis, chiefly catheter-associated bloodstream infection and
      neonatal unit infection. It is generally less virulent than Candida
      parapsilosis. There is no established disease caused by gut carriage.
    normal_carriage: >
      Uncommonly reported, partly because most laboratories historically could not
      tell it apart from Candida parapsilosis. It is a normal minor member of skin
      and gut flora where present.
    overgrowth_signal: >
      Nothing in a stool sequencing result establishes harm from this organism.
      Detection in a healthy person is a carriage finding. Its clinical route, like
      Candida parapsilosis, runs through indwelling plastic rather than the bowel.
    agents:
      - name: Oregano oil (carvacrol and thymol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Carvacrol inhibited clinical Candida isolates in culture, including
          non-albicans species. There is no published work on Candida
          orthopsilosis specifically; this is genus-level laboratory evidence
          applied to a close relative, stated as such.
        dose_studied: "MIC around 25 micrograms/mL in culture against other Candida species; no established human dose"
        reaches_gut: >
          Absorbed in the upper small intestine unless enteric-coated; human
          colonic levels are unknown.
        citation_title: "The inhibitory effects of carvacrol, nystatin, and their combination on oral candidiasis isolates"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11010274/"
        caution: >
          Never swallow undiluted. Abortifacient; avoid in pregnancy. Will not
          affect a catheter biofilm.

      - name: Berberine
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited Candida species in planktonic and biofilm conditions in
          culture. Candida orthopsilosis was not among the strains tested, so this
          is genus-level evidence, stated as such.
        dose_studied: "not established for Candida"
        reaches_gut: >
          Almost entirely unabsorbed and therefore reaches the colon at high
          luminal concentration.
        citation_title: "In vitro Antifungal Effects of Berberine Against Candida spp. In Planktonic and Biofilm Conditions"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6957002/"
        caution: >
          Extensive CYP3A4 and P-glycoprotein interactions; lowers blood sugar;
          contraindicated in pregnancy, breastfeeding and newborns.

      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          Matched nystatin for preventing fungal colonisation in 181 very preterm
          infants and produced no candidaemia. Reported for fungal colonisation
          overall, not by species.
        dose_studied: "250 mg twice daily in adults; 5 billion CFU daily in the trial"
        reaches_gut: >
          Acid-tolerant live yeast that reaches the colon during dosing.
        citation_title: "Prophylactic Saccharomyces boulardii versus nystatin for the prevention of fungal colonization and invasive fungal infection in premature infants"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/23703468/"
        caution: >
          Do not use with a central line, in severe immunosuppression or in
          critical illness. It is itself a yeast and will show up on fungal
          sequencing.

      - name: Bovine lactoferrin
        kind: nutrient
        evidence_tier: human_rct
        effect: >
          Cut invasive fungal infection from 7.7 to 0.7 per cent in very low birth
          weight neonates without changing colonisation. Species-level results were
          not published, so its application to Candida orthopsilosis is an
          extension of a whole-genus result.
        dose_studied: "100 mg per day for 4-6 weeks in preterm neonates"
        reaches_gut: >
          Digested to lactoferricin, which is the active fragment; intact protein
          is recoverable from stool.
        citation_title: "Bovine lactoferrin prevents invasive fungal infections in very low birth weight infants: a randomized controlled trial"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/22184648/"
        caution: >
          Milk-derived; avoid with cows' milk protein allergy. No evidence of
          benefit for a healthy adult with an incidental finding.

  fungi.candida_lusitaniae:
    display_name: Candida lusitaniae (Clavispora lusitaniae)
    what_it_is: >
      An uncommon yeast, correctly named Clavispora lusitaniae, found in the human
      gut and also in soil, in the guts of warm-blooded animals and in dairy
      products. It is a minor and usually transient member of human flora.
    why_it_matters: >
      It is clinically notable for one reason: it can develop resistance to
      amphotericin B, sometimes during the course of treatment, which is unusual
      among yeasts. Infections are rare and occur almost exclusively in people with
      blood cancers, prolonged neutropenia or indwelling catheters. Gut carriage
      causes no disease.
    normal_carriage: >
      Infrequent. It is detected in a small percentage of healthy people, and some
      detections reflect recent consumption of dairy or other foods carrying the
      yeast rather than stable colonisation.
    overgrowth_signal: >
      A stool sequencing result cannot show invasion or drug susceptibility, and
      the susceptibility question is the one that matters for this species. In a
      well person the finding is carriage or dietary passage and needs no action.
    agents:
      - name: Berberine
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited Candida species including non-albicans reference strains in
          culture, in both free-floating and biofilm form. Candida lusitaniae was
          not tested; this is genus-level evidence applied to a relative, stated as
          such. No human data.
        dose_studied: "not established for Candida"
        reaches_gut: >
          Under one per cent absorbed, so it reaches the colon essentially intact.
        citation_title: "In vitro Antifungal Effects of Berberine Against Candida spp. In Planktonic and Biofilm Conditions"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6957002/"
        caution: >
          Substantial drug interactions; lowers blood sugar; contraindicated in
          pregnancy, breastfeeding and newborns.

      - name: Oregano oil (carvacrol and thymol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Carvacrol inhibited and killed clinical Candida isolates in culture,
          including species that resist standard antifungals. Candida lusitaniae
          was not among them, so this is genus-level extrapolation.
        dose_studied: "MIC around 25 micrograms/mL against other Candida species; no established human dose"
        reaches_gut: >
          Absorbed in the small intestine unless enteric-coated; colonic delivery
          unproven in people.
        citation_title: "The inhibitory effects of carvacrol, nystatin, and their combination on oral candidiasis isolates"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11010274/"
        caution: >
          Never take undiluted. Avoid in pregnancy. Broadly antimicrobial, so it
          suppresses useful bacteria too.

      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          Equalled nystatin at preventing fungal colonisation of stool and skin in
          181 very preterm infants. Results were for fungal colonisation as a
          whole rather than by species.
        dose_studied: "250 mg twice daily in adults; 5 billion CFU daily in the trial"
        reaches_gut: >
          Survives gastric acid and reaches the colon alive while being taken.
        citation_title: "Prophylactic Saccharomyces boulardii versus nystatin for the prevention of fungal colonization and invasive fungal infection in premature infants"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/23703468/"
        caution: >
          Contraindicated with a central line, in severe immunosuppression and in
          critical illness, which is precisely the population in which Candida
          lusitaniae causes trouble.

  fungi.candida_kefyr:
    display_name: Candida kefyr (Kluyveromyces marxianus)
    what_it_is: >
      A dairy yeast, properly Kluyveromyces marxianus, used in making kefir, some
      cheeses and other fermented milk products. It ferments lactose, which most
      Candida species cannot, and it is widely present in the food supply.
    why_it_matters: >
      For nearly everyone this is a food organism passing through, and a positive
      stool result most often reflects what has been eaten. It has been reported as
      an opportunistic cause of bloodstream infection almost entirely in patients
      with haematological malignancy and profound neutropenia, and there are
      documented cases linked to probiotic or dairy consumption in that specific
      group. In people with normal immunity it does not cause disease.
    normal_carriage: >
      Common in people who eat kefir, live yoghurt or soft cheese, and it is a
      recognised transient of the healthy gut. Its presence usually says more about
      diet than about health.
    overgrowth_signal: >
      Before treating this as an overgrowth, the first question is dietary. A
      sequencing result cannot distinguish yeast that arrived in yesterday's kefir
      from yeast that is established in the bowel, and repeating the test after a
      period without fermented dairy is far more informative than any supplement.
      Only in profound neutropenia does the finding carry clinical weight.
    agents:
      - name: Curcumin
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Candida kefyr was one of the seven Candida species among 200 clinical
          isolates tested; curcumin inhibited them at 32 to 128 micrograms per
          millilitre in culture and acted synergistically with amphotericin B and
          additively or synergistically with fluconazole. This is one of the few
          studies to include this species by name, and it is still only a
          test-tube result. Before considering any agent at all, the dietary
          question above should be settled first.
        dose_studied: "MIC 32-128 micrograms/mL in culture; no established human dose"
        reaches_gut: >
          Curcumin is very poorly absorbed and heavily metabolised in the gut wall,
          so most of an oral dose remains in the lumen and reaches the colon.
          High-bioavailability formulations reduce rather than increase what stays
          in the bowel.
        citation_title: "Enhanced inhibitory effect from interaction of curcumin with amphotericin B or fluconazole against Candida species"
        citation_url: "https://doi.org/10.38212/2224-6614.2831"
        caution: >
          Increases bleeding risk with anticoagulants, can provoke gallstone
          symptoms, rare liver injury with concentrated products, and reduces iron
          absorption. Using it against a yeast that most likely arrived in
          yesterday's kefir would be an over-reaction; stop fermented dairy for two
          to four weeks and retest instead.

      - name: Berberine
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited Candida species in planktonic and biofilm conditions in
          culture. Candida kefyr was not among the tested strains, so this is
          genus-level evidence applied to a relative and stated as such. There is
          no human evidence, and for a dietary yeast there is no good reason to try
          to remove it in the first place.
        dose_studied: "not established for Candida"
        reaches_gut: >
          Barely absorbed, so it reaches the colon at high luminal concentration.
        citation_title: "In vitro Antifungal Effects of Berberine Against Candida spp. In Planktonic and Biofilm Conditions"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6957002/"
        caution: >
          Extensive drug interactions; lowers blood sugar; contraindicated in
          pregnancy, breastfeeding and newborns. Taking this for a dietary yeast
          finding would be an over-reaction.

      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          Matched nystatin for preventing fungal colonisation in preterm infants.
          Reported for fungal colonisation collectively, not by species.
        dose_studied: "250 mg twice daily in adults; 5 billion CFU daily in the trial"
        reaches_gut: >
          Acid-tolerant live yeast reaching the colon during dosing.
        citation_title: "Prophylactic Saccharomyces boulardii versus nystatin for the prevention of fungal colonization and invasive fungal infection in premature infants"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/23703468/"
        caution: >
          Contraindicated with a central line, in severe immunosuppression and in
          critical illness. Note the circularity: swapping one dietary yeast for
          another probiotic yeast is unlikely to achieve anything useful here.

  fungi.candida_norvegensis:
    display_name: Candida norvegensis (Pichia norvegensis)
    what_it_is: >
      A rare yeast, properly Pichia norvegensis, closely related to Candida krusei.
      It is found in the environment, in some fermented foods and occasionally in
      the human gut and mouth.
    why_it_matters: >
      Like its relative Candida krusei, it is intrinsically resistant to
      fluconazole, and it has reduced susceptibility to several other antifungals.
      Human infections are genuinely rare and are reported almost only in people
      with advanced cancer, peritoneal dialysis catheters or severe
      immunosuppression. Gut carriage in a well person is not a disease.
    normal_carriage: >
      Rare. When detected it is usually a transient from food or the environment
      rather than a settled coloniser.
    overgrowth_signal: >
      Because it is so uncommon, the first thing worth checking is whether the
      identification is correct, since Pichia species are easily confused with one
      another by sequence alone. Nothing in a stool test can show that this
      organism is causing harm, and there is no published threshold above which
      carriage becomes significant.
    agents:
      - name: Oregano oil (carvacrol and thymol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Carvacrol inhibited clinical Candida isolates in culture, including
          fluconazole-resistant species such as Candida krusei, its nearest studied
          relative. Candida norvegensis itself has not been tested; this is
          extrapolation from the closest available species and is stated as such.
        dose_studied: "MIC around 25 micrograms/mL against related Candida species; no established human dose"
        reaches_gut: >
          Absorbed in the small intestine unless enteric-coated; human colonic
          delivery is unmeasured.
        citation_title: "The inhibitory effects of carvacrol, nystatin, and their combination on oral candidiasis isolates"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11010274/"
        caution: >
          Never swallow undiluted. Abortifacient; avoid in pregnancy. It is not a
          treatment for any diagnosed infection with this organism, which requires
          specialist advice given the resistance pattern.

      - name: Berberine
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited Candida krusei among other species in planktonic and biofilm
          culture. Candida norvegensis was not tested and this is applied from its
          closest studied relative, stated as such. No human data.
        dose_studied: "not established"
        reaches_gut: >
          Almost entirely unabsorbed, reaching the colon at high luminal
          concentration.
        citation_title: "In vitro Antifungal Effects of Berberine Against Candida spp. In Planktonic and Biofilm Conditions"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6957002/"
        caution: >
          Interacts with many medicines; lowers blood sugar; contraindicated in
          pregnancy, breastfeeding and newborns.

  fungi.candida_inconspicua:
    display_name: Candida inconspicua
    what_it_is: >
      An uncommon yeast that is genetically very close to Candida norvegensis, so
      close that laboratories have often reported the two interchangeably. It
      occurs in the environment, in some fermented products and occasionally in the
      human mouth and gut.
    why_it_matters: >
      It is intrinsically resistant to fluconazole and shows reduced susceptibility
      to amphotericin B in some isolates. Reported infections are rare and largely
      confined to people with haematological malignancy, HIV with a very low CD4
      count, or prolonged broad-spectrum antifungal exposure. Presence in stool
      alone does not indicate disease.
    normal_carriage: >
      Rare in healthy people. Where found it is usually transient, and it is more
      often reported in the mouths of people with advanced HIV or cancer than in
      the general population.
    overgrowth_signal: >
      Given how easily this species is confused with Candida norvegensis, the
      identification itself deserves scepticism before the abundance does. No
      sequencing result can establish invasion or susceptibility, and for a well
      person there is no meaningful threshold.
    agents:
      - name: Oregano oil (carvacrol and thymol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Carvacrol was active in culture against clinical Candida isolates
          including azole-resistant non-albicans species. Candida inconspicua was
          not among them; this is genus-level extrapolation from related
          fluconazole-resistant species and is stated as such.
        dose_studied: "MIC around 25 micrograms/mL against related species; no established human dose"
        reaches_gut: >
          Absorbed high in the small bowel unless enteric-coated.
        citation_title: "The inhibitory effects of carvacrol, nystatin, and their combination on oral candidiasis isolates"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11010274/"
        caution: >
          Do not swallow neat. Avoid in pregnancy. Anyone in whom this species is
          genuinely causing infection is immunosuppressed and needs specialist
          antifungal care, not a botanical.

      - name: Berberine
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited Candida species including fluconazole-resistant Candida krusei
          in culture. Candida inconspicua was not tested; genus-level
          extrapolation, stated as such. No human data.
        dose_studied: "not established"
        reaches_gut: >
          Very poorly absorbed, so it reaches the colon largely intact.
        citation_title: "In vitro Antifungal Effects of Berberine Against Candida spp. In Planktonic and Biofilm Conditions"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6957002/"
        caution: >
          Numerous drug interactions; lowers blood sugar; contraindicated in
          pregnancy, breastfeeding and newborns.

  # ---------------------------------------------------------------------------
  # OTHER OPPORTUNIST FUNGI - real pathogens, but not via the gut.
  # For these the honest answer is that nothing should be taken by mouth: the
  # route to disease does not run through the bowel, so reducing gut carriage
  # would not reduce risk even if a supplement could do it.
  # ---------------------------------------------------------------------------

  fungi.rhodotorula_mucilaginosa:
    display_name: Rhodotorula mucilaginosa
    what_it_is: >
      A pink-pigmented environmental yeast that lives in soil, air, seawater,
      shower curtains, toothbrushes and damp bathroom surfaces. It is also found on
      fruit and in dairy products, and it is picked up constantly from the
      surroundings.
    why_it_matters: >
      In people with intact immunity it does not cause disease. It has become
      recognised as a cause of catheter-related bloodstream infection in patients
      with central venous lines, haematological cancer or advanced HIV, and it is
      intrinsically resistant to fluconazole and the echinocandins, which
      complicates treatment when that happens. The important point is the route: it
      gets into the blood along a plastic catheter, not through the intestinal
      wall.
    normal_carriage: >
      Regularly detected in stool as a transient from food, water and the
      environment. It is not thought to establish stable gut colonisation in most
      people, and it is a common incidental finding on sequencing panels.
    overgrowth_signal: >
      There is no established concept of Rhodotorula overgrowth in the gut and no
      abundance threshold that means anything. Sequencing cannot tell you whether
      the DNA came from live yeast or from yeast eaten with fruit yesterday. The
      circumstances that make this organism dangerous, namely an indwelling
      catheter plus severe immunosuppression, are clinical facts, not stool
      findings.
    agents: []
    no_agents_reason: >
      Nothing is recommended, because there is nothing to treat. Rhodotorula in
      stool is an environmental and dietary passenger, and carrying it in the bowel
      has never been shown to cause illness or to precede illness. The disease this
      organism causes arises from contaminated intravenous lines in hospital, so
      suppressing gut carriage would not reduce that risk even if a supplement
      could achieve it, which none has been shown to do. Taking a broad
      antimicrobial botanical would disturb the bacterial community that keeps
      opportunist yeasts in check, which is the opposite of helpful. If you have a
      central line and develop fever, that is a medical matter to raise urgently
      with your team, not something to address with a supplement.

  fungi.trichosporon_asahii:
    display_name: Trichosporon asahii
    what_it_is: >
      A yeast-like fungus found in soil, water and decaying wood, and also as part
      of the normal flora of human skin, the perianal area and, in some people, the
      gut. It is the organism behind white piedra, a harmless condition in which
      soft nodules form along hair shafts.
    why_it_matters: >
      In healthy people it causes at most superficial and cosmetic problems. In
      patients with prolonged neutropenia, haematological cancer, burns or central
      venous catheters it can cause disseminated trichosporonosis, a serious
      infection with high mortality that is intrinsically resistant to the
      echinocandins and often to amphotericin B. It has also been reported as a
      cause of summer-type hypersensitivity pneumonitis in Japan through inhalation
      at home. None of these routes runs through the healthy bowel.
    normal_carriage: >
      Perianal and skin carriage is common, and gut detection is reported in a
      minority of healthy adults. It is a recognised commensal rather than an
      intruder.
    overgrowth_signal: >
      No abundance threshold has been established for gut Trichosporon, and there
      is no evidence that gut carriage predicts invasive disease in anyone with
      normal immunity. Sequencing cannot distinguish skin or perianal contamination
      of the sample from true intestinal presence, and that distinction is not
      resolvable from the data.
    agents: []
    no_agents_reason: >
      No agent is recommended. Trichosporon asahii in stool is a commensal or a
      contaminant from the perianal skin, and treating it serves no purpose. There
      are no human studies of any supplement, food or probiotic reducing gut
      Trichosporon, and no reason to think doing so would benefit anyone. Where
      this organism causes real disease it does so in profoundly immunosuppressed
      hospital patients and requires voriconazole or another prescription agent
      chosen by a specialist, because the fungus resists several of the standard
      antifungal classes. Anyone in that situation should not be taking botanicals
      instead of, or alongside, proper treatment without medical advice.

  fungi.aspergillus_fumigatus:
    display_name: Aspergillus fumigatus
    what_it_is: >
      A mould, not a yeast, and one of the most abundant fungi in the environment.
      It grows in compost, damp buildings, soil and stored grain, and releases
      enormous numbers of tiny airborne spores. Everybody inhales and swallows
      Aspergillus spores every day.
    why_it_matters: >
      It is a genuinely important pathogen, but of the lungs and sinuses rather
      than the gut. Invasive aspergillosis is a life-threatening infection of people
      with prolonged neutropenia, transplant recipients and those on high-dose
      steroids or certain immune-targeted drugs. It also causes allergic
      bronchopulmonary aspergillosis in asthma and cystic fibrosis, and aspergilloma
      in old lung cavities. Primary gastrointestinal aspergillosis is very rare and
      occurs essentially only in the profoundly immunosuppressed. Finding
      Aspergillus DNA in stool almost always means spores that were breathed in and
      swallowed, or that came in on food, and passed through.
    normal_carriage: >
      Not carriage in any meaningful sense, but detection is common: Aspergillus
      DNA turns up regularly in stool from healthy people because everyone
      constantly ingests spores from the air and from food. It does not colonise
      the healthy bowel.
    overgrowth_signal: >
      Sequencing cannot distinguish a dead inhaled spore from a growing colony, and
      there is no validated stool abundance that indicates aspergillosis. Invasive
      disease is diagnosed on imaging, galactomannan testing and tissue sampling,
      never on a stool result. If you are neutropenic or on strong
      immunosuppression and unwell, that is an urgent hospital matter regardless of
      what a stool test shows.
    agents: []
    no_agents_reason: >
      Nothing is offered here, and this is deliberate. A stool detection of
      Aspergillus fumigatus reflects the air you breathe and the food you eat, not
      an infection to be cleared, so listing agents would imply a course of action
      that is not warranted. There are no human data on reducing Aspergillus in the
      gut with any supplement, and doing so would have no known benefit. If
      invasive aspergillosis is genuinely suspected, it is a medical emergency
      requiring intravenous or oral prescription antifungals such as voriconazole
      or isavuconazole, and delaying that for a botanical would be dangerous. The
      practical action for a home is reducing mould exposure: fixing damp, avoiding
      compost heaps and mouldy food, and using extraction in bathrooms.

  fungi.aspergillus_flavus:
    display_name: Aspergillus flavus
    what_it_is: >
      A common mould of soil and stored crops, particularly groundnuts, maize,
      tree nuts, dried figs and spices. It is best known for producing aflatoxins,
      some of the most potent naturally occurring liver carcinogens.
    why_it_matters: >
      Its main relevance to health is chemical rather than infectious: chronic
      dietary aflatoxin exposure from poorly stored nuts and grains causes liver
      damage and liver cancer, and is a serious public health problem in parts of
      Africa and Asia. As an infection it is second to Aspergillus fumigatus as a
      cause of invasive aspergillosis and is a particularly common cause of sinus
      and eye infections in hot dry climates, again in immunosuppressed people.
      Gastrointestinal infection is very rare. A stool detection normally means
      swallowed spores from food or air.
    normal_carriage: >
      Not a gut coloniser. It is nonetheless detected reasonably often in stool
      because its spores are abundant on nuts, grains and spices, and pass through
      the digestive tract unchanged.
    overgrowth_signal: >
      There is no established threshold and no way for sequencing to distinguish
      transit from growth. A repeated finding is more usefully read as a prompt to
      look at food storage, especially nuts, peanut products and grains kept warm
      and damp, than as a fungal infection needing treatment.
    agents: []
    no_agents_reason: >
      No agent is listed, because there is no gut infection to treat and the real
      risk from this mould is dietary aflatoxin, which no supplement removes. The
      useful response to a repeated Aspergillus flavus finding is to check food
      sources: buy nuts and grains from suppliers with aflatoxin controls, store
      them cool and dry, discard anything visibly mouldy or with an off taste, and
      do not eat shrivelled or discoloured nuts. If invasive aspergillosis is
      suspected in someone immunosuppressed, that requires urgent prescription
      antifungal treatment from a specialist and nothing here substitutes for it.

  fungi.malassezia_sympodialis:
    display_name: Malassezia sympodialis
    what_it_is: >
      A lipid-dependent yeast that lives on human skin, particularly the scalp,
      face, chest and back. It cannot make its own fatty acids and so has to feed on
      skin oils, which is why it grows where sebaceous glands are dense. It is one
      of the dominant fungi of normal human skin.
    why_it_matters: >
      On the skin it contributes to dandruff, seborrhoeic dermatitis and pityriasis
      versicolor, and it aggravates atopic dermatitis in some people, especially on
      the head and neck. These are skin conditions treated with topical antifungals
      such as ketoconazole shampoo. It is not a gut pathogen. Research has begun to
      link Malassezia in the gut with Crohn's disease and pancreatic disease, but
      that work is early, associative and not a basis for any treatment.
    normal_carriage: >
      Universal on skin from adolescence onwards. In stool it is detected
      intermittently and at low levels, and much of that reflects skin contact with
      the sample or swallowed yeast from the scalp and face rather than an
      established gut population.
    overgrowth_signal: >
      There is no defined overgrowth threshold for Malassezia in the gut and no
      evidence that a higher stool read count means anything clinically. Because
      the organism is universal on skin, contamination during sample collection is
      a real and unmeasurable contributor to any stool result. Nothing about the
      abundance figure should be acted on.
    agents: []
    no_agents_reason: >
      No oral agent is recommended and none would make sense. Malassezia is a
      lipid-dependent skin yeast; it needs the fatty environment of sebaceous skin
      and does not thrive on what is available in the colon, so a stool detection
      is not a gut infection. Any Malassezia-related problem is a skin problem and
      is treated on the skin, with ketoconazole or ciclopirox shampoo, selenium
      sulfide or zinc pyrithione, all of which are available without prescription
      and none of which is taken by mouth. Swallowing antifungal botanicals to
      change a scalp yeast would be both ineffective and misdirected.

  fungi.malassezia_furfur:
    display_name: Malassezia furfur
    what_it_is: >
      Another lipid-dependent yeast of normal human skin, historically the
      best-known member of the genus and the one classically associated with
      pityriasis versicolor, the patchy discolouration of the trunk that appears in
      warm weather.
    why_it_matters: >
      Its recognised diseases are dermatological: pityriasis versicolor,
      seborrhoeic dermatitis and Malassezia folliculitis. There is one important
      exception unrelated to the gut: it can cause bloodstream infection in
      neonates and other patients receiving intravenous lipid emulsions through a
      central line, because the lipid feed supplies exactly the fatty acids it
      needs. That is a hospital line infection, not a bowel problem.
    normal_carriage: >
      A universal component of adult skin flora. Its appearance in stool is
      intermittent, at low abundance, and heavily influenced by skin contamination
      of the sample and by swallowing yeast from the face and scalp.
    overgrowth_signal: >
      No threshold exists, and none could be interpreted reliably given how easily
      skin contaminates a stool sample. Sequencing abundance for this organism
      carries no clinical meaning in the gut.
    agents: []
    no_agents_reason: >
      Nothing should be taken by mouth for this finding. Malassezia furfur is a
      skin yeast that depends on skin lipids, and its detection in stool reflects
      skin contact or swallowed material rather than intestinal disease. Where it
      does cause trouble the treatment is topical for skin conditions, with
      ketoconazole shampoo or selenium sulfide, or removal of the intravenous line
      in the specific case of lipid-associated bloodstream infection in hospital.
      Neither of those is helped by anything swallowed, and taking broad
      antimicrobial supplements would only disturb the gut bacteria that are doing
      no harm.

  # ---------------------------------------------------------------------------
  # NORMAL, DIETARY OR ENVIRONMENTAL FUNGI
  # These are expected findings. The correct response is reassurance, not removal.
  # ---------------------------------------------------------------------------

  fungi.saccharomyces_cerevisiae:
    display_name: Saccharomyces cerevisiae
    what_it_is: >
      Brewer's yeast and baker's yeast. It is the yeast that makes bread rise and
      ferments beer and wine, it is sold as nutritional yeast flakes and as yeast
      extract spreads, and the probiotic Saccharomyces boulardii is a strain of the
      same species. Almost all of it in your stool arrived there in food.
    why_it_matters: >
      For practical purposes it does not matter. This is a food organism with a
      long record of safe consumption, and finding it in stool means you have eaten
      bread, beer, wine, nutritional yeast, stock cubes or a probiotic. The
      exceedingly rare exception is fungaemia in patients with central venous
      catheters who are critically ill or severely immunosuppressed, and that has
      been traced to probiotic capsules opened near a line rather than to ordinary
      dietary yeast. Anti-Saccharomyces antibodies are used as a marker in Crohn's
      disease, but that is an immune response, not evidence that the yeast is
      harmful.
    normal_carriage: >
      Extremely common. It is one of the most frequently detected fungi in the
      stool of healthy people in every population that eats leavened bread or
      fermented drinks, and abundance rises and falls with diet from week to week.
    overgrowth_signal: >
      There is no such thing as Saccharomyces cerevisiae overgrowth as a diagnosis.
      A high read count means a diet containing bread, beer, wine or nutritional
      yeast, or a probiotic taken recently. Sequencing cannot tell dietary yeast
      from anything else, and no threshold has ever been shown to predict illness.
    agents: []
    no_agents_reason: >
      This is a normal finding and should not be treated. Saccharomyces cerevisiae
      is brewer's and baker's yeast; it arrives from food, passes through, and does
      not colonise or damage the healthy bowel. Trying to remove it is neither
      necessary nor advisable, and the only reliable way to lower the number would
      be to stop eating bread, beer, wine and yeast extract, which brings no health
      benefit and needlessly narrows the diet. Antifungal botanicals taken for this
      would suppress useful gut bacteria for no gain. The one real caution is
      unrelated to diet: if you have a central venous catheter, are critically ill
      or are severely immunosuppressed, do not take Saccharomyces boulardii
      probiotic capsules without medical advice.

  fungi.geotrichum_candidum:
    display_name: Geotrichum candidum
    what_it_is: >
      The white, velvety mould that forms the rind of Camembert, Brie, Saint-Nectaire
      and many other surface-ripened cheeses, and which is also used in some
      fermented milks. It is deliberately added to cheese and is present in soil,
      silage and raw milk.
    why_it_matters: >
      In the overwhelming majority of cases it does not matter at all: it is a food
      organism eaten on purpose by millions of people. It has been reported very
      rarely as an opportunist in patients with leukaemia and profound neutropenia,
      which is true of a great many environmental fungi and does not make it a
      threat to anyone with a working immune system.
    normal_carriage: >
      Frequently found in the mouth and stool of healthy people, particularly those
      who eat soft cheese, and it is a recognised normal transient of the digestive
      tract.
    overgrowth_signal: >
      No meaningful threshold exists. Abundance tracks cheese and dairy consumption
      in the preceding days. A sequencing result cannot separate a mould eaten on a
      cheese rind from anything else, and there is no published level above which
      this becomes a clinical concern in an immunocompetent person.
    agents: []
    no_agents_reason: >
      This is a normal dietary finding and no treatment is appropriate. Geotrichum
      candidum is the cheese-rind mould; it is put into food on purpose and passes
      through the gut. Attempting to eliminate it would mean giving up
      surface-ripened cheeses for no benefit, and taking antifungal supplements
      would disturb the gut bacterial community while achieving nothing worthwhile.
      There is no evidence that carrying it does any harm to a person with normal
      immunity.

  fungi.debaryomyces_hansenii:
    display_name: Debaryomyces hansenii
    what_it_is: >
      A salt-tolerant yeast that is one of the most common fungi in cheese, cured
      meats, salted fish, brines and pickles. Its ability to grow at high salt
      concentrations is exactly why it dominates those foods, and it is widely used
      as a ripening culture.
    why_it_matters: >
      In healthy people it does not matter. It is among the most frequently eaten
      yeasts in a Western diet. Some research has linked Debaryomyces to impaired
      healing of intestinal wounds in Crohn's disease, but this is early
      experimental work in mice and tissue, not a demonstrated cause of disease in
      people, and it is not a basis for treating anybody.
    normal_carriage: >
      Very common, especially in people who eat cheese, salami, ham or salted fish.
      It is a routine finding in the stool of healthy adults and one of the
      standard dietary yeasts on any fungal sequencing panel.
    overgrowth_signal: >
      No threshold has been established and none is meaningful. Read counts follow
      what has been eaten. Sequencing gives no way to tell yeast that came off a
      slice of cheese from anything with clinical relevance.
    agents: []
    no_agents_reason: >
      A normal dietary finding requiring no action. Debaryomyces hansenii comes
      from cheese, cured meat, salted fish and pickles, and detecting it says that
      you eat those foods. Trying to remove it is neither necessary nor advisable:
      it would mean an arbitrary dietary restriction with no health benefit, and
      antifungal supplements taken for it would suppress beneficial bacteria for
      nothing. The tentative research link to Crohn's disease healing is
      preliminary animal and laboratory work and does not justify treating a
      healthy person, or indeed a person with Crohn's disease, on the basis of a
      stool sequencing result.

  fungi.kodamaea_ohmeri:
    display_name: Kodamaea ohmeri
    what_it_is: >
      A yeast found in fruit, pickled vegetables, fermented foods, sugar-rich
      environments and the guts of insects. It has been used in food fermentation
      and turns up regularly in the diet.
    why_it_matters: >
      For a healthy person, not at all. It has been reported as a rare opportunist
      causing bloodstream infection in neonates and in patients with prosthetic
      valves, burns or central lines, but these are isolated hospital cases in
      severely compromised patients. There is no recognised disease caused by
      carrying it in the gut.
    normal_carriage: >
      Detected intermittently in the stool of healthy people, usually reflecting
      fruit and fermented food in the diet rather than settled colonisation.
    overgrowth_signal: >
      No abundance threshold exists for this organism and none could be interpreted
      usefully. Detection is a dietary and environmental signal. Sequencing cannot
      establish that this yeast is doing anything at all in the bowel.
    agents: []
    no_agents_reason: >
      This is a normal environmental and dietary finding and should be left alone.
      Kodamaea ohmeri arrives with fruit and fermented foods and passes through the
      gut. There is no evidence that gut carriage causes illness in anyone with a
      working immune system, no established way to reduce it, and no reason to try.
      The rare serious infections reported in the literature happened in hospital
      patients with prosthetic material or central lines, a situation that has
      nothing to do with a stool sequencing result in a well person.

  fungi.cyberlindnera_fabianii:
    display_name: Cyberlindnera fabianii
    what_it_is: >
      A yeast used in food and industrial fermentation and found in soil, water,
      fruit and bread. It has repeatedly been misidentified as Candida species by
      older laboratory systems, which is part of why it appears in case reports
      more than it perhaps should.
    why_it_matters: >
      In healthy people it does not matter. There are scattered case reports of
      bloodstream infection in neonates and in adults with central lines or major
      abdominal surgery, and this is the general pattern for environmental yeasts
      encountering a plastic catheter in an intensive care unit. Gut carriage has no
      established consequence.
    normal_carriage: >
      Occasionally detected in the stool of healthy people, generally as a
      transient from food, water or the environment.
    overgrowth_signal: >
      There is no threshold and no clinical meaning attached to its abundance in
      stool. Given its history of misidentification, the identification itself is
      arguably less certain than the abundance figure. Nothing here should be acted
      on.
    agents: []
    no_agents_reason: >
      A normal environmental finding that needs no treatment. Cyberlindnera
      fabianii is a food and environmental yeast, and detecting it in stool
      indicates ordinary exposure rather than infection. There is no evidence that
      reducing gut carriage benefits anyone, no established method of doing so, and
      no reason to disturb a functioning gut community in pursuit of it. The
      hospital case reports involve central venous catheters in critically ill
      patients and are not relevant to a stool result in someone who is well.

  fungi.wickerhamomyces_anomalus:
    display_name: Wickerhamomyces anomalus
    what_it_is: >
      A remarkably tolerant yeast, previously called Pichia anomala, that grows at
      low water activity, low oxygen and extremes of pH. It is used commercially as
      a biological control agent to stop mould growing on stored grain and fruit,
      and it is common in silage, fermented foods and bread.
    why_it_matters: >
      For a healthy person it is a food and environmental organism of no
      consequence. It has caused outbreaks of bloodstream infection in neonatal
      intensive care units, spread on the hands of staff, and occasional infections
      in patients with central lines. That is a hospital transmission problem, not
      something arising from a person's own gut.
    normal_carriage: >
      Detected in stool from time to time in healthy people, usually reflecting
      grain, fruit and fermented food in the diet. It is a recognised dietary yeast.
    overgrowth_signal: >
      No abundance threshold has been established and none would be interpretable.
      Detection reflects food and environmental exposure, and sequencing cannot
      show that the organism is doing anything in the bowel.
    agents: []
    no_agents_reason: >
      A normal dietary and environmental finding, and no attempt should be made to
      remove it. Wickerhamomyces anomalus is used deliberately to protect stored
      food from mould and is eaten routinely as a result. There is no evidence it
      harms the healthy gut, no established way to reduce it, and no benefit in
      trying. The neonatal unit outbreaks in the literature reflect
      hand-transmission between very premature babies with intravenous lines and
      have no bearing on a stool test in a well person.

  fungi.paecilomyces_variotii:
    display_name: Paecilomyces variotii
    what_it_is: >
      A heat-tolerant mould found in soil, compost, wood, damp buildings and, most
      relevantly, as one of the commonest spoilage moulds of pasteurised fruit
      juices, jams, canned fruit and other heat-treated foods, because its spores
      survive pasteurisation.
    why_it_matters: >
      For a healthy person a stool detection is a food and environmental finding.
      This organism is classed as a conditional opportunist in the catalogue
      because it has genuinely caused disease, but essentially only in specific and
      unusual settings: peritonitis in peritoneal dialysis patients, infection
      around prosthetic implants and intraocular lenses, and invasive disease in
      profoundly immunosuppressed patients. It does not colonise or infect the
      healthy gut, and swallowed spores pass through.
    normal_carriage: >
      Not carriage as such, but detection is unsurprising: its spores are abundant
      on heat-treated foods and in indoor air, so everyone ingests them regularly
      and the DNA appears in stool.
    overgrowth_signal: >
      There is no threshold, and sequencing cannot distinguish spores in transit
      from growth. A repeated finding is more usefully read as a pointer to a food
      or damp-housing source than as an infection. The situations in which this
      mould causes disease, such as peritoneal dialysis or a prosthetic implant,
      are known clinical facts, not things a stool test reveals.
    agents: []
    no_agents_reason: >
      No agent is offered, because a stool detection here reflects swallowed
      environmental and food-spoilage spores rather than a gut infection, and
      listing treatments would imply an action that is not warranted. There are no
      human data on reducing Paecilomyces in the gut with any supplement and no
      reason to believe it would help. The sensible practical response is to
      discard fruit juices, jams or canned fruit that have fermented, gone fizzy or
      grown a skin, and to deal with any damp or mould in the home. If you are on
      peritoneal dialysis, have a prosthetic implant, or are significantly
      immunosuppressed and become unwell, that needs medical assessment and
      prescription antifungal treatment, not a botanical.

  # ---------------------------------------------------------------------------
  # PROTOZOA - established enteric pathogens
  # ---------------------------------------------------------------------------

  protozoa.cryptosporidium_hominis:
    display_name: Cryptosporidium hominis
    what_it_is: >
      A single-celled parasite that infects the lining of the small intestine. It
      spreads through swallowing tiny hardy eggs called oocysts, most often from
      contaminated drinking or swimming water, from another infected person, or
      from food. This species is adapted to humans and passes from person to
      person rather than from animals.
    why_it_matters: >
      It causes watery diarrhoea, cramping, nausea and weight loss, typically
      lasting one to two weeks in a healthy adult and usually clearing on its own.
      In young children in low-income settings, repeated infection is linked to
      stunted growth and lasting harm. In people with advanced HIV, transplant
      recipients or those with primary immunodeficiency it can cause prolonged,
      severe, sometimes life-threatening diarrhoea and can spread to the bile
      ducts. The oocysts are highly chlorine-resistant, which is why swimming pool
      outbreaks happen. Confirmed cryptosporidiosis should be discussed with a
      doctor, and in the UK it is a notifiable infection.
    normal_carriage: >
      Not a normal inhabitant. Healthy people in high-income countries do not
      normally carry it, so a positive result means genuine exposure at some point.
      That said, asymptomatic shedding after an infection is common and can
      continue for weeks after symptoms stop, so a positive test does not
      automatically mean current illness.
    overgrowth_signal: >
      This is not an overgrowth question but a presence question: any detection
      means true exposure. Sequencing cannot tell you whether the oocysts are still
      infectious, whether they are simply being shed after a resolved infection, or
      whether they explain current symptoms. The clinically important information
      is your immune status and whether you have diarrhoea now, neither of which
      the test shows.
    agents:
      - name: Bovine colostrum immunoglobulin concentrate
        kind: nutrient
        evidence_tier: human_observational
        effect: >
          In 24 patients with AIDS and severe chronic diarrhoea, those with
          Cryptosporidium given the powder form had mean daily stool weight fall
          from 1158 g to 595 g by the end of treatment and stool frequency fall
          from 6.6 to 5.4 a day. The capsule form did not work, and patients
          without Cryptosporidium showed no improvement. This was an open,
          non-randomised study, and larger placebo-controlled trials of hyperimmune
          colostrum have given mixed and often negative results, so the honest
          summary is promising but unproven.
        dose_studied: "colostrum-derived bovine immunoglobulin concentrate in powder form for 21 consecutive days"
        reaches_gut: >
          These are orally administered antibodies designed to work in the gut
          lumen rather than be absorbed. Immunoglobulin is partly digested by
          stomach acid and pepsin, which is the likely reason the powder worked and
          capsules did not, and it is why acid suppression was used alongside it in
          several trials.
        citation_title: "Treatment of severe diarrhea caused by Cryptosporidium parvum with oral bovine immunoglobulin concentrate in patients with AIDS"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/8948373/"
        caution: >
          A milk product, so unsuitable with cows' milk protein allergy and poorly
          tolerated with severe lactose intolerance. Ordinary supermarket colostrum
          supplements are not the same as the hyperimmune preparations used in
          research and have not been shown to work. It does not replace medical
          care, and in immunocompromised people cryptosporidiosis is a serious
          illness needing specialist management, including restoring immune
          function where possible.

      - name: Curcumin
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          In infected human intestinal cell cultures, curcumin at 50 micromolar
          for 24 hours inhibited parasite growth by more than 95 per cent, and 200
          micromolar cut the invasion of host cells by at least 65 per cent.
          Importantly, it did not reduce the viability of the oocysts themselves,
          meaning it acted on the parasite inside cells rather than on the
          infectious eggs in the gut contents.
        dose_studied: "50-200 micromolar in cell culture; no established human dose"
        reaches_gut: >
          Curcumin is very poorly absorbed and reaches the colon in high luminal
          concentration. The mismatch is that Cryptosporidium infects the small
          intestine and lives just inside the surface cells, so luminal delivery to
          the colon is not obviously the right target.
        citation_title: "Effects of curcumin on Cryptosporidium parvum in vitro"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19557435/"
        caution: >
          Increases bleeding risk with anticoagulants, can trigger gallstone pain,
          rare liver injury with high-absorption products, reduces iron absorption.
          This is laboratory data with a closely related species and no human
          evidence. It must not be used instead of medical assessment.

      - name: Zinc
        kind: nutrient
        evidence_tier: animal
        effect: >
          In mice infected with Cryptosporidium parvum, a commercial zinc
          preparation given for eight days produced a 98.3 per cent reduction in
          oocyst shedding, the largest reduction of the agents tested and greater
          than nitazoxanide at 91.6 per cent in the same experiment. This is a
          mouse study with a closely related species, stated as such. No human
          trial has shown zinc clears Cryptosporidium.
        dose_studied: "commercial zinc preparation daily for 8 days in mice; the WHO dose for childhood diarrhoea is 10-20 mg elemental zinc daily for 10-14 days"
        reaches_gut: >
          Zinc is absorbed in the small intestine, which is where Cryptosporidium
          lives, and unabsorbed zinc continues into the colon. Both the direct
          luminal effect and the effect on gut barrier and immune function are
          plausible routes.
        citation_title: "The Effects of Commercially Available Syzygium aromaticum, Anethum graveolens, Lactobacillus acidophilus LB, and Zinc as Alternatives Therapy in Experimental Mice Challenged with Cryptosporidium parvum"
        citation_url: "https://doi.org/10.2147/idr.s345789"
        caution: >
          Long-term zinc above about 40 mg a day causes copper deficiency, which can
          produce anaemia and irreversible nerve damage. It reduces absorption of
          quinolone and tetracycline antibiotics, so separate the doses. Nausea and
          vomiting are common on an empty stomach. Zinc supports recovery from
          diarrhoea generally; it is not a cure for this parasite.

      - name: Lactobacillus acidophilus LB
        kind: probiotic
        evidence_tier: animal
        effect: >
          In the same mouse experiment, Lactobacillus acidophilus LB reduced
          Cryptosporidium parvum oocyst shedding by 95.8 per cent, matching dill
          seed oil and exceeding nitazoxanide. Mouse data with a closely related
          species. Worth balancing against a human pilot trial in Bangladeshi
          children which found no additional benefit from Lactobacillus reuteri
          added to nitazoxanide.
        dose_studied: "commercial Lactobacillus acidophilus LB preparation daily for 8 days in mice; no established human dose for this indication"
        reaches_gut: >
          Lactobacilli are acid-tolerant and standard preparations are recovered
          alive from stool during dosing, so they reach both the small intestine
          and the colon.
        citation_title: "The Effects of Commercially Available Syzygium aromaticum, Anethum graveolens, Lactobacillus acidophilus LB, and Zinc as Alternatives Therapy in Experimental Mice Challenged with Cryptosporidium parvum"
        citation_url: "https://doi.org/10.2147/idr.s345789"
        caution: >
          Avoid live probiotics in severe immunosuppression, in critical illness and
          in anyone with a central venous catheter, which is exactly the group in
          whom cryptosporidiosis is most dangerous. Effects are strain-specific.
          Bloating is common initially.

  protozoa.cryptosporidium_parvum:
    display_name: Cryptosporidium parvum
    what_it_is: >
      A single-celled intestinal parasite very closely related to Cryptosporidium
      hominis, but this species also infects cattle, sheep and other animals, so
      people commonly catch it from farm contact, petting zoos, contaminated water
      or raw milk as well as from other people.
    why_it_matters: >
      It causes the same illness as Cryptosporidium hominis: profuse watery
      diarrhoea, cramps, nausea and weight loss, usually self-limiting over one to
      two weeks in a healthy adult. In immunocompromised people, particularly those
      with advanced HIV or after transplantation, it can cause chronic
      life-threatening diarrhoea and biliary disease. Nitazoxanide is the only
      approved drug and it works poorly in the immunosuppressed, which is precisely
      why interest in adjunctive measures exists. A confirmed infection warrants
      medical advice, and it is notifiable in the UK.
    normal_carriage: >
      Not a normal gut inhabitant. Detection means real exposure, most often to
      livestock, farm environments, untreated water or a swimming pool. Shedding of
      oocysts can continue for several weeks after symptoms have resolved.
    overgrowth_signal: >
      Presence rather than quantity is the meaningful thing. A stool sequencing
      result cannot say whether oocysts are still viable, whether the infection is
      active or resolving, or whether it accounts for current symptoms. Your immune
      status and current bowel habit matter far more than the read count.
    agents:
      - name: Bovine colostrum immunoglobulin concentrate
        kind: nutrient
        evidence_tier: human_observational
        effect: >
          In patients with AIDS and Cryptosporidium parvum diarrhoea, the powdered
          bovine immunoglobulin concentrate significantly reduced mean daily stool
          weight and stool frequency over 21 days; the capsule form did not. The
          study was open and non-randomised, and subsequent placebo-controlled
          trials of hyperimmune bovine colostrum have been inconsistent, with
          several showing no significant clinical difference from placebo. The
          honest reading is a possible benefit that has never been convincingly
          confirmed.
        dose_studied: "bovine immunoglobulin concentrate in powder form for 21 consecutive days"
        reaches_gut: >
          Designed to act in the gut lumen rather than be absorbed. Gastric acid and
          pepsin degrade some of the antibody, which is the likely explanation for
          powder outperforming capsules and for the use of acid suppression in
          several protocols.
        citation_title: "Treatment of severe diarrhea caused by Cryptosporidium parvum with oral bovine immunoglobulin concentrate in patients with AIDS"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/8948373/"
        caution: >
          Milk-derived, so unsuitable with cows' milk protein allergy. Retail
          colostrum powders are not equivalent to the hyperimmune preparations
          studied. Not a substitute for medical care; in immunocompromised patients
          restoring immune function is the intervention that actually changes
          outcome.

      - name: Curcumin
        kind: botanical
        evidence_tier: animal
        effect: >
          In immunosuppressed BALB/c mice infected with Cryptosporidium parvum, oral
          curcumin stopped oocyst shedding by the end of the treatment period with
          no recurrence ten days after withdrawal, and reduced intestinal lesions in
          the jejunum and ileum. Paromomycin worked faster but curcumin achieved
          more complete elimination in this model. Mouse data; there is no human
          trial.
        dose_studied: "oral curcumin daily for 11 days in mice; no established human dose"
        reaches_gut: >
          Poorly absorbed and heavily metabolised in the gut wall, so most of an
          oral dose stays in the intestinal lumen. It passes the small intestine,
          where this parasite lives, before reaching the colon.
        citation_title: "Comparative efficacy of curcumin and paromomycin against Cryptosporidium parvum infection in a BALB/c model"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/29329627/"
        caution: >
          Bleeding risk with anticoagulants, gallstone symptoms, rare liver injury
          with high-absorption formulations, reduced iron absorption. Mouse results
          frequently fail to reproduce in people, and this must not delay proper
          assessment of a confirmed infection.

      - name: Zinc
        kind: nutrient
        evidence_tier: animal
        effect: >
          Produced a 98.3 per cent reduction in Cryptosporidium parvum oocyst
          shedding in infected mice over eight days, more than nitazoxanide in the
          same experiment. No human trial has demonstrated that zinc clears this
          parasite; what human trials do show is that zinc shortens childhood
          diarrhoea generally, which is a different and weaker claim.
        dose_studied: "commercial zinc preparation daily for 8 days in mice; WHO recommends 10-20 mg elemental zinc daily for 10-14 days in childhood diarrhoea"
        reaches_gut: >
          Absorbed in the small intestine, the site of infection, with the
          remainder continuing into the colon. Both direct and immune-mediated
          routes are plausible.
        citation_title: "The Effects of Commercially Available Syzygium aromaticum, Anethum graveolens, Lactobacillus acidophilus LB, and Zinc as Alternatives Therapy in Experimental Mice Challenged with Cryptosporidium parvum"
        citation_url: "https://doi.org/10.2147/idr.s345789"
        caution: >
          Sustained intake above roughly 40 mg daily causes copper deficiency with
          anaemia and potentially irreversible neurological damage. Interferes with
          quinolone and tetracycline absorption. Causes nausea on an empty stomach.

      - name: Clove oil (Syzygium aromaticum)
        kind: botanical
        evidence_tier: animal
        effect: >
          Reduced Cryptosporidium parvum oocyst shedding by 74.7 per cent in
          infected mice. This was the weakest of the four alternatives tested in
          that experiment, below nitazoxanide, zinc, Lactobacillus and dill seed
          oil, and it is reported here with that ranking rather than in isolation.
          No human data.
        dose_studied: "commercial clove oil preparation daily for 8 days in mice; no established human dose"
        reaches_gut: >
          Eugenol, the main constituent, is absorbed and conjugated in the upper
          small intestine, so only a fraction continues further. Some contact with
          the upper small intestinal surface, where this parasite lives, is
          plausible.
        citation_title: "The Effects of Commercially Available Syzygium aromaticum, Anethum graveolens, Lactobacillus acidophilus LB, and Zinc as Alternatives Therapy in Experimental Mice Challenged with Cryptosporidium parvum"
        citation_url: "https://doi.org/10.2147/idr.s345789"
        caution: >
          Clove oil is toxic in overdose and has caused acute liver failure in
          children who swallowed even small amounts of the neat oil; it must never
          be given to children undiluted. It inhibits platelet aggregation and adds
          to anticoagulant effects. It is a mucosal irritant. Culinary use is safe;
          concentrated oil is not.

  protozoa.cryptosporidium_canis:
    display_name: Cryptosporidium canis
    what_it_is: >
      A Cryptosporidium species whose natural host is the dog. It occasionally
      infects people, usually children or immunocompromised adults with close
      contact with dogs, and it produces the same kind of intestinal infection as
      the human-adapted species.
    why_it_matters: >
      Human infections are uncommon but real, and the illness is the familiar
      watery diarrhoea with cramping and weight loss. In immunocompetent people it
      is generally self-limiting. In immunocompromised people, as with the other
      species, it can become prolonged and severe. A detection is also useful
      information about the household: it points to a dog as the likely source, and
      the animal may benefit from veterinary attention. This should be discussed
      with a doctor.
    normal_carriage: >
      Not a normal human inhabitant at all. Detection indicates genuine
      dog-associated exposure. Because it is uncommon in people, the identification
      itself is worth confirming, since Cryptosporidium species are distinguished
      by sequence and misassignment between species does occur.
    overgrowth_signal: >
      Quantity is not the question; presence is. Sequencing cannot show whether
      the oocysts are viable, whether the infection is active, or whether it
      explains any symptoms. Immune status and current symptoms are what matter.
    agents:
      - name: Bovine colostrum immunoglobulin concentrate
        kind: nutrient
        evidence_tier: human_observational
        effect: >
          Reduced stool weight and frequency in AIDS patients with Cryptosporidium
          parvum diarrhoea in an open non-randomised study, with the powder form
          working and capsules not. This was a different Cryptosporidium species in
          the same genus, stated as such, and later placebo-controlled work has
          been inconsistent.
        dose_studied: "bovine immunoglobulin concentrate powder for 21 consecutive days"
        reaches_gut: >
          Intended to act in the gut lumen; partly degraded by stomach acid and
          pepsin, which is why the powder formulation and acid suppression have
          been used.
        citation_title: "Treatment of severe diarrhea caused by Cryptosporidium parvum with oral bovine immunoglobulin concentrate in patients with AIDS"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/8948373/"
        caution: >
          Milk-derived; unsuitable with cows' milk protein allergy. Retail colostrum
          is not the studied product. Does not replace medical assessment.

      - name: Zinc
        kind: nutrient
        evidence_tier: animal
        effect: >
          Cut oocyst shedding by 98.3 per cent in mice infected with Cryptosporidium
          parvum, a closely related species in the same genus, stated as such. No
          human trial has shown zinc eliminates any Cryptosporidium species.
        dose_studied: "commercial zinc preparation daily for 8 days in mice; WHO childhood diarrhoea dose is 10-20 mg elemental zinc daily for 10-14 days"
        reaches_gut: >
          Absorbed in the small intestine at the site of infection, with the
          remainder passing into the colon.
        citation_title: "The Effects of Commercially Available Syzygium aromaticum, Anethum graveolens, Lactobacillus acidophilus LB, and Zinc as Alternatives Therapy in Experimental Mice Challenged with Cryptosporidium parvum"
        citation_url: "https://doi.org/10.2147/idr.s345789"
        caution: >
          Prolonged high-dose zinc causes copper deficiency with anaemia and nerve
          damage. Blocks quinolone and tetracycline absorption. Nausea on an empty
          stomach is common.

      - name: Curcumin
        kind: botanical
        evidence_tier: animal
        effect: >
          Eliminated Cryptosporidium parvum oocyst shedding with no recurrence in
          immunosuppressed mice and reduced intestinal damage. Again this is a
          different species within the same genus, stated as such, and mouse data
          only.
        dose_studied: "oral curcumin daily for 11 days in mice; no established human dose"
        reaches_gut: >
          Poorly absorbed, so most of an oral dose remains in the intestinal lumen
          throughout its transit.
        citation_title: "Comparative efficacy of curcumin and paromomycin against Cryptosporidium parvum infection in a BALB/c model"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/29329627/"
        caution: >
          Bleeding risk with anticoagulants, gallstone pain, rare liver injury with
          concentrated products, reduced iron absorption. No human evidence.

  protozoa.cyclospora_cayetanensis:
    display_name: Cyclospora cayetanensis (lineage A)
    what_it_is: >
      A single-celled intestinal parasite spread by eating fresh produce or water
      contaminated with human faeces. Outbreaks in Europe and North America are
      repeatedly traced to imported soft fruit, salad leaves, coriander and
      mangetout. Unusually, the oocysts need days to weeks in the environment
      before becoming infectious, which is why it does not spread directly from
      person to person.
    why_it_matters: >
      It causes a distinctive and often prolonged illness: watery diarrhoea that
      comes and goes in waves, profound fatigue, loss of appetite and weight loss,
      which can drag on for six weeks or more if untreated. It is one of the more
      miserable travellers' and foodborne infections. Importantly, it responds very
      well to a specific prescription antibiotic, co-trimoxazole, usually within a
      few days, so there is a real cost to not being treated. A confirmed detection
      should be taken to a doctor.
    normal_carriage: >
      Not a normal inhabitant of the human gut anywhere. In endemic regions
      asymptomatic shedding does occur, but in a European or North American context
      a detection means genuine exposure, almost always via imported fresh produce
      or foreign travel.
    overgrowth_signal: >
      This is not an overgrowth question. Any detection is significant because it
      indicates real exposure to an organism that does not belong there. Sequencing
      cannot say whether the parasite is still active or whether it explains current
      symptoms, but the relapsing pattern of the illness makes symptom history more
      informative than quantity.
    agents: []
    no_agents_reason: >
      Nothing is listed here, and that is a deliberate statement about the
      evidence rather than an oversight. Cyclospora cannot be maintained in
      laboratory culture, which is the practical reason almost no natural products
      have ever been tested against it, and there is no credible published evidence
      that any supplement, botanical, probiotic or food reduces Cyclospora infection
      in humans or animals. Any product marketed for it is making a claim with
      nothing behind it. This matters more than usual because there is an effective
      treatment: co-trimoxazole, taken as a prescription course, usually resolves
      the illness in a few days, with ciprofloxacin as an alternative for those with
      sulfonamide allergy. Please see a doctor rather than treating this yourself.
      Supportive measures such as fluid and electrolyte replacement are sensible
      alongside proper treatment, not instead of it.

  protozoa.cyclospora_cayetanensis_sensu_lato:
    display_name: Cyclospora cayetanensis sensu lato
    what_it_is: >
      The broader grouping used when a test detects Cyclospora but cannot resolve
      which of the closely related lineages, now named as separate species such as
      Cyclospora ashfordi and Cyclospora henanensis, is present. Practically it
      means the same organism and the same illness.
    why_it_matters: >
      Identical to Cyclospora cayetanensis: relapsing watery diarrhoea, severe
      fatigue, appetite loss and weight loss, potentially lasting many weeks
      untreated, contracted from contaminated fresh produce or water. It responds
      well to co-trimoxazole, so a confirmed detection should be taken to a doctor
      rather than managed at home.
    normal_carriage: >
      Not a normal gut organism. A detection indicates genuine exposure, typically
      through imported soft fruit or salad, or travel to an endemic region.
    overgrowth_signal: >
      Presence rather than abundance is what counts. Sequencing cannot establish
      whether the infection is active, and the unresolved lineage assignment does
      not change the clinical meaning: it is still Cyclospora, and it is still
      treatable.
    agents: []
    no_agents_reason: >
      No agent is listed because there is no honest evidence to list. Cyclospora
      cannot be grown in routine culture, so the natural-product literature that
      exists for Giardia, Entamoeba and Cryptosporidium simply does not exist here,
      and nothing has been shown in humans or animals to reduce Cyclospora
      infection. Fabricating a protocol would be worse than useless in this case,
      because an effective and inexpensive prescription treatment exists:
      co-trimoxazole usually resolves the illness within days, with ciprofloxacin as
      an alternative in sulfonamide allergy. See a doctor. Rehydration and
      electrolyte replacement are sensible support alongside treatment, not a
      replacement for it.

  protozoa.giardia_duodenalis:
    display_name: Giardia duodenalis
    what_it_is: >
      A single-celled parasite, also called Giardia lamblia or Giardia intestinalis,
      that attaches to the lining of the upper small intestine using a suction disc.
      It is swallowed as a tough cyst from contaminated water, food, or contact with
      an infected person or animal, and is the commonest parasitic cause of
      diarrhoea worldwide.
    why_it_matters: >
      It causes bloating, foul-smelling greasy stools that float, wind, cramping,
      nausea, fatigue and weight loss, often lasting weeks. Because it damages the
      absorptive surface of the small intestine it commonly causes temporary
      lactose intolerance and can cause fat and vitamin malabsorption; in children
      repeated infection is linked to poor growth. It also triggers post-infectious
      irritable bowel syndrome in a substantial minority. Standard treatment is a
      short prescription course of metronidazole or tinidazole, which works well,
      and a confirmed infection is worth taking to a doctor.
    normal_carriage: >
      Not a normal inhabitant. Asymptomatic carriage is genuinely common, however,
      particularly in children and in endemic areas, so a positive result does not
      by itself mean the parasite is causing your symptoms. In high-income
      countries a detection usually reflects travel, untreated water, a nursery, or
      contact with an infected person.
    overgrowth_signal: >
      Presence is the finding, not quantity. Giardia is shed intermittently, so
      abundance in one sample says little, and sequencing cannot distinguish
      asymptomatic carriage from active disease. What matters clinically is whether
      you have the characteristic symptoms of malabsorption, and that is a question
      for a doctor rather than a read count.
    agents:
      - name: Berberine
        kind: botanical
        evidence_tier: human_observational
        effect: >
          In a controlled comparative clinical trial in children aged five months
          to fourteen years, berberine at 10 mg per kilogram per day for ten days
          gave parasitological cure rates comparable to established antigiardial
          drugs including metronidazole, quinacrine and furazolidone. The trial was
          group-comparative and is not described as randomised or blinded, it dates
          from 1975, and very little has been done since to confirm it, so this
          should be read as encouraging but weakly supported. In culture, berberine
          sulphate separately caused the Giardia trophozoite to swell, accumulate
          glycogen and develop enlarging cytoplasmic vacuoles.
        dose_studied: "10 mg/kg/day orally for 10 days in children"
        reaches_gut: >
          Berberine is absorbed at under one per cent, so essentially the entire
          oral dose remains in the intestinal lumen, including the upper small
          intestine where Giardia attaches. Of the botanicals here, its delivery to
          the right place is the best established.
        citation_title: "Use of berberine in treatment of giardiasis"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/1096596/"
        caution: >
          Interacts with many medicines through CYP3A4 and P-glycoprotein, including
          ciclosporin, some statins and metformin. Lowers blood sugar.
          Contraindicated in pregnancy and breastfeeding, and must never be given to
          newborns because it displaces bilirubin and can cause kernicterus. Causes
          cramping and diarrhoea. It is not a substitute for metronidazole or
          tinidazole, which are well proven.

      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          In a double-blind placebo-controlled trial in 65 adults with giardiasis,
          all patients received metronidazole and half also received Saccharomyces
          boulardii. Two weeks later Giardia cysts were still present in six of 35
          patients on metronidazole alone, 17 per cent, and in none of the 30 taking
          the probiotic as well. The same six were still positive at four weeks.
          This is an adjunct to treatment, not a replacement for it, and that is
          how the trial was designed.
        dose_studied: "250 mg twice daily for 10 days, alongside metronidazole"
        reaches_gut: >
          A live yeast that survives stomach acid and reaches high concentrations
          throughout the small and large intestine while being taken; it is cleared
          within a few days of stopping.
        citation_title: "Saccharomyces boulardii and infection due to Giardia lamblia"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/16798698/"
        caution: >
          Must not be used in anyone with a central venous catheter, in severe
          immunosuppression or in critical illness, because probiotic fungaemia has
          been documented. It is a yeast and will appear on fungal sequencing
          panels. The evidence supports it alongside standard treatment, not
          instead of it.

      - name: Bovine lactoferrin
        kind: nutrient
        evidence_tier: human_rct
        effect: >
          In a controlled supplementation study in children, those given bovine
          lactoferrin had a lower prevalence of Giardia colonisation and better
          height-for-age by the end of the study than unsupplemented children. In
          culture, both human and bovine lactoferrin and their N-terminal peptides
          killed Giardia trophozoites outright, with iron partly protecting the
          parasite, and later work showed the peptides are taken up by the
          trophozoite and stop it growing and forming infective cysts.
        dose_studied: "oral bovine lactoferrin supplementation in children; the neonatal literature uses 100 mg per day"
        reaches_gut: >
          Pepsin digestion in the stomach releases lactoferricin, the active
          fragment, so gastric processing generates rather than destroys the active
          agent, and intact lactoferrin is recoverable from supplemented children's
          stool. It reaches the upper small intestine where Giardia lives.
        citation_title: "Impact of lactoferrin supplementation on growth and prevalence of Giardia colonization in children"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/18462105/"
        caution: >
          A milk protein, so unsuitable with cows' milk protein allergy. The study
          was not designed primarily as a Giardia treatment trial, and reduced
          colonisation is not the same as cure. It does not replace metronidazole or
          tinidazole for a symptomatic infection.

      - name: Garlic (aqueous extract)
        kind: food
        evidence_tier: human_observational
        effect: >
          In an uncontrolled treatment series, 26 children with Giardia were given
          either 5 mL of crude aqueous garlic extract in water twice daily or two
          0.6 mg garlic capsules twice daily for three days, and the authors
          reported the treatment efficient, safe and shortening of illness. There
          was no control group, no randomisation and no blinding, the numbers were
          small, and the report is from 1991, so this is weak evidence that has
          never been properly replicated.
        dose_studied: "5 mL crude aqueous garlic extract in 100 mL water twice daily, or two 0.6 mg capsules twice daily, for 3 days"
        reaches_gut: >
          Allicin is unstable and degraded by stomach acid, so much of the active
          compound does not survive intact. The study used a crude aqueous extract
          swallowed directly, which at least delivers material to the upper small
          intestine where Giardia attaches.
        citation_title: "Evaluation of the antiparasitic effect of aqueous garlic (Allium sativum) extract in hymenolepiasis nana and giardiasis"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/1875077/"
        caution: >
          Increases bleeding risk with warfarin, direct oral anticoagulants and
          antiplatelet drugs; stop before surgery. Reduces saquinavir levels.
          Causes reflux and wind. The study quality is poor and this should not be
          chosen over a proven prescription course.

      - name: Curcumin
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Inhibited Giardia growth and its ability to stick to surfaces in a
          dose- and time-dependent way in culture, disrupting the ventral disc,
          flagella and caudal region and reducing tubulin expression. Since the
          ventral disc is precisely what the parasite uses to hold on to the
          intestinal wall, the mechanism is interesting. It is still a laboratory
          finding with no human trial.
        dose_studied: "3-15 micromolar in culture; no established human dose"
        reaches_gut: >
          Very poorly absorbed, so most of an oral dose stays in the gut lumen and
          passes through the small intestine where Giardia attaches before
          continuing to the colon.
        citation_title: "Curcumin alters the cytoskeleton and microtubule organization on trophozoites of Giardia lamblia"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/28465123/"
        caution: >
          Bleeding risk with anticoagulants, can provoke gallstone pain, rare liver
          injury with high-absorption products, reduces iron absorption. Dish
          results do not establish a clinical effect.

  protozoa.entamoeba_histolytica:
    display_name: Entamoeba histolytica
    what_it_is: >
      A single-celled parasite, an amoeba, that is swallowed as a cyst in
      contaminated food or water. Unlike its harmless look-alikes, this species can
      invade: it uses enzymes to dissolve the lining of the large intestine and can
      travel through the bloodstream to the liver.
    why_it_matters: >
      Most infections stay in the bowel and cause nothing, but when it invades it
      causes amoebic dysentery, with bloody diarrhoea, fever and abdominal pain, and
      it can produce an amoebic liver abscess weeks or months later, sometimes with
      no preceding diarrhoea at all. Untreated, invasive amoebiasis kills tens of
      thousands of people a year. This is a confirmed detection that needs a doctor:
      treatment is a course of metronidazole or tinidazole followed by a luminal
      agent such as paromomycin or diloxanide to clear residual cysts, and skipping
      the second drug leads to relapse.
    normal_carriage: >
      Not a normal inhabitant. Asymptomatic cyst passage is common in endemic areas
      and most carriers never become ill, but this species is never considered
      harmless, and current guidance is to treat even asymptomatic carriers to
      prevent later invasive disease and onward spread.
    overgrowth_signal: >
      Presence, not quantity, is the finding. Nothing in a sequencing result can
      tell you whether the amoeba is sitting harmlessly in the lumen or actively
      invading the bowel wall, and that distinction is the whole clinical question.
      What sequencing does do well here, and what microscopy cannot do at all, is
      distinguish this species from the harmless Entamoeba dispar, which is
      genuinely valuable.
    agents:
      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          In 50 children with acute bloody diarrhoea from Entamoeba histolytica, all
          treated with metronidazole, those also given Saccharomyces boulardii had
          bloody diarrhoea lasting 42 hours instead of 72, and by day five amoebic
          cysts had cleared in all of them versus six children still positive on
          metronidazole alone. This was an open-label randomised trial. A separate
          trial in 85 children found no difference, so the evidence is genuinely
          mixed and this is an adjunct at best.
        dose_studied: "250 mg twice daily for 7 days alongside metronidazole"
        reaches_gut: >
          Acid-tolerant live yeast that reaches the colon, where this parasite
          lives, in high numbers while being taken.
        citation_title: "Clinical efficacy of Saccharomyces boulardii and metronidazole compared to metronidazole alone in children with acute bloody diarrhea caused by amebiasis: a prospective, randomized, open label study"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/19478257/"
        caution: >
          Contraindicated with a central venous catheter, in severe
          immunosuppression and in critical illness because of probiotic fungaemia.
          It is a yeast and appears on fungal panels. The trials tested it alongside
          metronidazole, never instead of it, and amoebiasis is not an infection to
          experiment with.

      - name: Garlic (allicin)
        kind: food
        evidence_tier: in_vitro
        effect: >
          Allicin strongly inhibited the cysteine proteinases and alcohol
          dehydrogenase of Entamoeba histolytica and blocked the ability of
          trophozoites to destroy monolayers of mammalian cells in culture. Since
          those cysteine proteinases are the tools the amoeba uses to dissolve
          tissue, this targets the invasion machinery specifically. It remains a
          test-tube result, and no human trial exists.
        dose_studied: "5 micrograms/mL inhibited virulence by 90 per cent in culture; 30 micrograms/mL fully inhibited growth; no established human dose"
        reaches_gut: >
          Allicin is destroyed by stomach acid, so little of what is in raw garlic
          survives to the colon where this amoeba lives. This is a real obstacle,
          and enteric-coated allicin-yielding products have not been tested against
          this organism in people.
        citation_title: "Allicin from garlic strongly inhibits cysteine proteinases and cytopathic effects of Entamoeba histolytica"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/9333064/"
        caution: >
          Bleeding risk with anticoagulants and antiplatelets; stop before surgery.
          Reduces saquinavir levels. Causes reflux and wind. This is a food with
          laboratory activity, not a treatment for a disease that causes liver
          abscesses; use of garlic instead of proper treatment would be dangerous.

      - name: Berberine
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Berberine sulphate inhibited the growth of Entamoeba histolytica in
          culture and caused clumping of nuclear chromatin and the formation of
          autophagic vacuoles in the trophozoites. Earlier animal work found it
          amoebicidal but inferior to the comparator drug and unable to kill cysts,
          which is a meaningful limitation given that residual cysts cause relapse.
          No modern human data.
        dose_studied: "growth inhibition in culture; no established human dose for amoebiasis"
        reaches_gut: >
          Under one per cent absorbed, so almost all of an oral dose reaches the
          colon, which is where the amoeba lives. Delivery is the strongest part of
          the case for berberine here.
        citation_title: "In vitro effects of berberine sulphate on the growth and structure of Entamoeba histolytica, Giardia lamblia and Trichomonas vaginalis"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/1796883/"
        caution: >
          Extensive CYP3A4 and P-glycoprotein interactions; lowers blood sugar;
          contraindicated in pregnancy, breastfeeding and newborns. It has no
          demonstrated cysticidal activity, so it cannot do the job of paromomycin
          or diloxanide. Invasive amoebiasis requires prescription treatment.

  protozoa.blastocystis_spp:
    display_name: Blastocystis spp.
    what_it_is: >
      A single-celled organism that lives in the large intestine. It is one of the
      most commonly detected eukaryotes in human stool anywhere in the world, and
      it comes in at least twenty-eight genetically distinct subtypes, of which
      about nine are found in people.
    why_it_matters: >
      Honestly: nobody is sure it matters. Despite being classed as an established
      pathogen in some frameworks, the catalogue records it as of uncertain enteric
      role, and that is the fairer description. It has been associated with
      irritable bowel syndrome symptoms, bloating and urticaria in some studies,
      but large microbiome studies consistently find it more often in people with
      diverse, healthy-looking gut communities and less often in those with
      inflammatory bowel disease, which is the opposite of what a pathogen usually
      does. Current expert consensus is that treatment should be reserved for
      people with persistent symptoms in whom every other cause has been properly
      excluded. If you are well, the right answer is very likely to leave it alone.
    normal_carriage: >
      Extremely common. Carriage rates run from roughly 5 to 20 per cent in
      high-income countries and above 50 per cent, sometimes far above, in many
      low- and middle-income countries. Most carriers have no symptoms at all, and
      colonisation is frequently long-term and stable.
    overgrowth_signal: >
      There is no validated abundance threshold and no evidence that a higher read
      count means more symptoms. Subtype has been proposed as a better predictor
      than quantity, with subtype 7 more often linked to symptoms and more
      resistant to treatment, but this is not settled and most panels do not report
      subtype reliably. Sequencing cannot establish that Blastocystis is causing
      anything, and attributing symptoms to it before excluding coeliac disease,
      inflammatory bowel disease, bile acid diarrhoea and other causes is a common
      and unhelpful mistake.
    agents:
      - name: Saccharomyces boulardii
        kind: probiotic
        evidence_tier: human_rct
        effect: >
          In a randomised single-blind trial in symptomatic children, clinical cure
          at 15 days was 77.7 per cent with Saccharomyces boulardii, 66.6 per cent
          with metronidazole and 40 per cent with no treatment, and cyst clearance
          was 72.2, 80 and 26.6 per cent respectively. By one month the probiotic
          arm had a 94.4 per cent clinical cure rate against 73.3 per cent for
          metronidazole. Note the untreated group: 40 per cent got better on their
          own, which is a reminder of how much of this resolves without anything.
        dose_studied: "250 mg twice daily for 10 days"
        reaches_gut: >
          Acid-tolerant live yeast reaching the colon, where Blastocystis lives, in
          high numbers throughout dosing.
        citation_title: "Clinical efficacy of Saccharomyces boulardii or metronidazole in symptomatic children with Blastocystis hominis infection"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/20922415/"
        caution: >
          Contraindicated with a central venous catheter, in severe
          immunosuppression and in critical illness because of probiotic fungaemia.
          It is a yeast and will show on fungal panels. It should only be considered
          if you have persistent symptoms and other causes have been excluded, not
          because Blastocystis was detected.

      - name: Oregano oil (emulsified, carvacrol and thymol)
        kind: botanical
        evidence_tier: human_observational
        effect: >
          In 14 adults with enteric parasites on stool testing, six weeks of 600 mg
          emulsified oregano oil daily was followed by complete disappearance of
          Blastocystis in eight of eleven cases and reduced scores in three more,
          with gastrointestinal symptoms improving in seven of the eleven. This was
          a small uncontrolled case series from 2000 with no comparison group and no
          blinding, and Blastocystis is known to clear spontaneously, so the result
          is suggestive at best.
        dose_studied: "600 mg emulsified oregano oil daily for 6 weeks"
        reaches_gut: >
          Carvacrol and thymol are absorbed high in the small intestine, which is
          why the study used an emulsified preparation intended to carry the oil
          further down. The actual colonic concentration achieved was not measured.
        citation_title: "Inhibition of enteric parasites by emulsified oil of oregano in vivo"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/10815019/"
        caution: >
          Never swallow undiluted oregano oil. It is an abortifacient and must be
          avoided in pregnancy. May add to anticoagulant effects. It is broadly
          antimicrobial and will suppress beneficial gut bacteria over six weeks,
          which is a real cost when the organism being targeted may well be
          harmless.

      - name: Garlic (aqueous extract)
        kind: food
        evidence_tier: in_vitro
        effect: >
          Garlic extract was one of the two most inhibitory of the plant extracts
          tested against Blastocystis subtype 3 in culture, with a half-maximal
          inhibitory concentration in the 3.8 to 4.8 micrograms per millilitre
          range. Crucially, no concentration tested completely eradicated the
          organism, and subtype 7 was markedly more resistant than subtype 3. A
          test-tube finding only.
        dose_studied: "IC50 3.8-4.8 micrograms/mL against subtype 3 in culture; no established human dose"
        reaches_gut: >
          Allicin is degraded by stomach acid so relatively little reaches the
          colon, where Blastocystis lives. This limits how much the culture result
          can be expected to translate.
        citation_title: "The influence of plant extracts on viability of ST3 and ST7 subtypes of Blastocystis sp."
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10988960/"
        caution: >
          Bleeding risk with anticoagulants and antiplatelets; stop before surgery.
          Reduces saquinavir levels. Reflux and wind are common. Given the
          uncertainty about whether Blastocystis causes harm at all, using this to
          chase a test result is not a good use of anyone's effort.

      - name: Turmeric (Curcuma longa extract)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Turmeric extract was among the most inhibitory tested against both
          Blastocystis subtype 3 and the more resistant subtype 7 in culture, with
          IC50 values in the 3.3 to 72 micrograms per millilitre range depending on
          subtype. As with garlic, none of the concentrations tested eliminated the
          organism entirely. Laboratory data only.
        dose_studied: "IC50 3.3-72 micrograms/mL in culture depending on subtype; no established human dose"
        reaches_gut: >
          Curcuminoids are very poorly absorbed and reach the colon at high luminal
          concentration, which is the right destination for this organism.
        citation_title: "The influence of plant extracts on viability of ST3 and ST7 subtypes of Blastocystis sp."
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10988960/"
        caution: >
          Bleeding risk with anticoagulants, gallstone symptoms, rare liver injury
          with concentrated formulations, reduced iron absorption. There is no human
          evidence for turmeric against Blastocystis, and no established reason to
          try to remove an organism that may be a normal part of a healthy gut.

  # ---------------------------------------------------------------------------
  # PROTOZOA - commensal or of uncertain significance
  # These are normal findings or organisms not established as harmful.
  # ---------------------------------------------------------------------------

  protozoa.entamoeba_dispar:
    display_name: Entamoeba dispar
    what_it_is: >
      A harmless amoeba that lives in the large intestine. Under a microscope it is
      completely indistinguishable from Entamoeba histolytica, the species that
      causes amoebic dysentery: same size, same shape, same four-nucleus cysts. The
      two can only be separated by DNA testing or specific antigen tests.
    why_it_matters: >
      It does not cause disease. It lacks the enzymes and surface machinery that
      Entamoeba histolytica uses to invade tissue, it does not produce dysentery,
      and it does not cause liver abscesses. What matters enormously is telling the
      two apart, and this is the single strongest argument for DNA-based testing
      over microscopy here. Entamoeba dispar is roughly ten times more common than
      Entamoeba histolytica worldwide, which means that historically the great
      majority of people diagnosed with amoebiasis by microscopy alone were given
      metronidazole they did not need. A DNA result naming Entamoeba dispar
      specifically is genuinely useful information: it tells you and your doctor
      that no treatment is required and that the search for the cause of any
      symptoms should continue elsewhere.
    normal_carriage: >
      Common, and much more common than Entamoeba histolytica. Carriage rates reach
      double figures as a percentage in many tropical and subtropical regions and
      are also found in travellers and in high-income countries. Colonisation is
      usually long-lasting and entirely without symptoms.
    overgrowth_signal: >
      There is no such thing. No abundance of Entamoeba dispar has ever been shown
      to cause illness, so there is no threshold to exceed. If you have bowel
      symptoms and this is what the test found, the correct conclusion is that the
      cause has not yet been identified, not that this amoeba is responsible.
    agents: []
    no_agents_reason: >
      This is a normal, non-invasive commensal and it should not be treated.
      Entamoeba dispar has no capacity to invade the bowel wall and causes no
      disease, so removing it is neither necessary nor advisable. Current
      international guidance is explicit that infection with Entamoeba dispar does
      not require treatment, precisely so that people are not given unnecessary
      metronidazole. The important clinical value of this result is what it rules
      out: because it is identical to Entamoeba histolytica under the microscope, a
      DNA test that names Entamoeba dispar has spared you a course of antibiotics
      you did not need. If you do have symptoms, they need investigating for another
      cause rather than being attributed to this organism.

  protozoa.entamoeba_coli:
    display_name: Entamoeba coli
    what_it_is: >
      A harmless amoeba of the large intestine, despite the confusing name, which
      has nothing to do with the bacterium Escherichia coli. It feeds on bacteria
      and food debris in the bowel and has been part of the normal human intestinal
      fauna for as long as we have looked.
    why_it_matters: >
      It does not cause disease, and this has been established for over a century.
      Its one genuine use is as a marker: because it is acquired the same way as the
      harmful parasites, through the faecal-oral route, finding it tells you that
      you have at some point swallowed something contaminated. It is a hygiene and
      exposure indicator, not an illness.
    normal_carriage: >
      Very common. It is one of the most frequently found intestinal protozoa in
      people worldwide, with carriage rates ranging from a few per cent in
      high-income settings to well over half the population in areas with poor
      sanitation.
    overgrowth_signal: >
      None exists. No quantity of Entamoeba coli has been shown to cause symptoms,
      so there is no threshold and nothing to monitor. If you have bowel symptoms
      alongside this finding, the cause lies elsewhere and should be looked for.
    agents: []
    no_agents_reason: >
      A normal finding that needs no treatment. Entamoeba coli is a
      non-pathogenic commensal that has never been shown to cause disease in
      humans, and attempting to remove it is neither necessary nor advisable.
      Guidelines are consistent that no treatment is indicated. Taking
      antiparasitic drugs or broad antimicrobial botanicals for it would expose you
      to side effects and disturb the normal gut community for no benefit at all.
      The one thing worth taking from a positive result is that it indicates
      faecal-oral exposure at some point, so it is reasonable to review water
      sources, food hygiene and handwashing, particularly after travel.

  protozoa.entamoeba_moshkovskii:
    display_name: Entamoeba moshkovskii
    what_it_is: >
      An amoeba that is also microscopically identical to Entamoeba histolytica and
      Entamoeba dispar. It was originally described from sewage and can grow at room
      temperature, unusually for an Entamoeba, which is why it was long assumed to
      be a free-living organism that merely passed through people.
    why_it_matters: >
      Its status is genuinely unresolved, and the catalogue classes it as of
      uncertain enteric role, which is the honest position. A few studies,
      particularly in children in Bangladesh, have reported an association with
      diarrhoea, and it can produce intestinal inflammation in mice. Against that,
      it is commonly found in people with no symptoms whatever, no invasive disease
      or liver abscess has ever been attributed to it, and no controlled trial has
      shown that treating it improves anything. It is not regarded as an established
      pathogen, and current practice is generally not to treat it.
    normal_carriage: >
      Reasonably common where it has been looked for with DNA methods, including in
      South Asia, Africa, Australia and among travellers. It is frequently found
      alongside Entamoeba dispar and in people who are entirely well.
    overgrowth_signal: >
      No threshold has been established and none is meaningful. Sequencing cannot
      show that this organism is doing anything, and because it is often found
      together with other protozoa and with genuine pathogens, attributing symptoms
      to it specifically is not justified by the evidence.
    agents: []
    no_agents_reason: >
      No agent is recommended, because this organism is not established as harmful
      and there is nothing reliable to act on. Entamoeba moshkovskii is found
      routinely in healthy people, it has never been shown to invade tissue, and no
      trial has demonstrated that eliminating it relieves symptoms. Treating an
      organism of uncertain significance means accepting definite side effects for
      a speculative benefit, which is the wrong trade. The value of a DNA result
      here is again largely in what it excludes: it confirms that the amoeba seen
      is not Entamoeba histolytica, sparing unnecessary treatment. If you have
      symptoms, they warrant a proper search for another cause rather than being
      pinned on this.

  protozoa.dientamoeba_fragilis:
    display_name: Dientamoeba fragilis
    what_it_is: >
      A single-celled organism of the large intestine which, despite the name, is
      not an amoeba at all but a flagellate related to Trichomonas that has lost its
      flagella. It has no cyst stage, and how it spreads is still not fully
      understood, though transmission inside pinworm eggs has been proposed.
    why_it_matters: >
      Its role is genuinely contested, and the catalogue records it as of uncertain
      enteric role. It has been reported in association with abdominal pain,
      diarrhoea and irritable-bowel-type symptoms, particularly in children, and
      some clinicians treat it. But it is found just as often in people with no
      symptoms at all, several controlled studies have found no difference in
      carriage between symptomatic and asymptomatic people, and treatment trials
      have not convincingly shown that clearing it relieves symptoms. A growing
      body of opinion regards it as a commensal.
    normal_carriage: >
      Common, and probably more common than older figures suggested because it is
      easily missed on ordinary microscopy. DNA-based studies report carriage in
      roughly 5 to 40 per cent of people depending on the population, with a
      majority having no symptoms.
    overgrowth_signal: >
      No validated threshold exists and higher loads have not been convincingly
      linked to symptoms. Sequencing cannot establish causation here, and because it
      frequently accompanies other organisms, attributing symptoms to it
      specifically is not supported. If symptoms persist, coeliac disease,
      inflammatory bowel disease, bile acid diarrhoea and food intolerance are all
      more likely explanations and should be excluded first.
    agents: []
    no_agents_reason: >
      No agent is offered, because the organism is not established as harmful and
      there is no evidence base for removing it with anything non-prescription.
      Dientamoeba fragilis is carried without symptoms by large numbers of healthy
      people, and the trials that exist have not shown that eradicating it makes
      people feel better. Even the prescription options, metronidazole and
      paromomycin, are used inconsistently for exactly this reason. Treating an
      organism whose harmfulness is unproven, with agents whose effectiveness
      against it is also unproven, means certain side effects for a speculative
      gain. If you have ongoing bowel symptoms, they deserve a proper diagnostic
      work-up rather than being attributed to this finding.

  protozoa.pentatrichomonas_hominis:
    display_name: Pentatrichomonas hominis
    what_it_is: >
      A flagellated single-celled organism of the large intestine, related to the
      Trichomonas species found elsewhere in the body but quite distinct from the
      sexually transmitted Trichomonas vaginalis. It has no cyst stage and is
      spread through the faecal-oral route, including from dogs, cats and farm
      animals.
    why_it_matters: >
      It is generally regarded as a harmless commensal of the human bowel. A small
      number of reports have linked it to diarrhoea, particularly in children and
      in immunocompromised people, and it can cause diarrhoea in some animals, but
      it has never been established as a human pathogen and it is routinely found
      in people who are perfectly well. Its more useful signal, like Entamoeba coli,
      is what it says about faecal-oral exposure.
    normal_carriage: >
      Reported in a small percentage of healthy people in most surveys, and more
      commonly where sanitation is poor or where there is close animal contact.
      Almost all carriers have no symptoms.
    overgrowth_signal: >
      No threshold exists and none has been proposed. There is no evidence that a
      higher abundance produces symptoms, and sequencing cannot show that this
      organism is doing anything at all. Symptoms occurring alongside this finding
      need investigating for another cause.
    agents: []
    no_agents_reason: >
      This is a normal finding and should not be treated. Pentatrichomonas hominis
      is not established as a human pathogen; it is carried without symptoms by
      healthy people and there is no evidence that removing it benefits anyone.
      Attempting to eliminate it is neither necessary nor advisable, and there is in
      any case no non-prescription agent with credible evidence against it. What the
      result does indicate is faecal-oral exposure, so it is reasonable to review
      handwashing, food and water hygiene and, given the animal reservoir, hygiene
      around pets and livestock. If you have bowel symptoms, they need a proper
      diagnostic assessment rather than being attributed to this organism.

  # ---------------------------------------------------------------------------
  # WORMS (HELMINTHS)
  #
  # Read this before the individual entries. A confirmed worm is treated with
  # prescription anthelmintic drugs. Albendazole, mebendazole, praziquantel and
  # ivermectin are cheap, given as one to three doses, extremely well tolerated
  # and highly effective, with cure rates that no botanical comes close to. The
  # botanicals below are listed because some of them have real evidence behind
  # them, not because they are alternatives. None of them is a substitute for
  # standard treatment, and every one of these entries says so. See a doctor.
  # ---------------------------------------------------------------------------

  helminths.ascaris_lumbricoides:
    display_name: Ascaris lumbricoides
    what_it_is: >
      The large human roundworm. Adults are pale pink and can reach 20 to 35
      centimetres long, and they live free in the small intestine without attaching
      to the wall. Infection begins by swallowing microscopic eggs from soil,
      unwashed vegetables or contaminated hands; the larvae then travel through the
      lungs before being coughed up, swallowed and maturing in the gut.
    why_it_matters: >
      A confirmed roundworm infection is treated with prescription anthelmintic
      drugs and you should see a doctor. Albendazole or mebendazole, given as a
      single dose or over three days, cures the great majority of cases, costs very
      little and is well tolerated. This matters because untreated Ascaris causes
      real harm: heavy infections in children impair growth and nutrition, and a
      mass of worms can obstruct the bowel, block the bile duct or the pancreatic
      duct, or perforate the intestine, all of which are surgical emergencies.
      During the lung phase it can cause a cough, wheeze and fever. Herbal
      alternatives are not equivalent to the drugs and should not replace them.
    normal_carriage: >
      Never normal. Ascaris is not part of anyone's gut flora. It is, however,
      extremely common globally, infecting hundreds of millions of people,
      overwhelmingly in areas with inadequate sanitation. A detection in a
      high-income country usually reflects travel, migration, or contaminated
      imported produce.
    overgrowth_signal: >
      Any detection means a genuine infection, so this is not a question of
      abundance. That said, a sequencing read count does not reliably indicate worm
      burden, which is what determines the risk of obstruction, and stool DNA can
      occasionally come from eggs eaten on contaminated food rather than from
      established worms. A doctor will want conventional egg microscopy to confirm
      and gauge intensity.
    agents:
      - name: Papaya seeds (Carica papaya, benzyl isothiocyanate)
        kind: food
        evidence_tier: human_rct
        effect: >
          In 60 Nigerian children randomised to an elixir of air-dried papaya seeds
          in honey or to honey alone, stools cleared of parasites in 23 of 30 on
          papaya, 76.7 per cent, versus 5 of 30 on honey, 16.7 per cent, at seven
          days, with no harmful effects. In a separate Kenyan school trial, porridge
          fortified with ground papaya seeds reduced Ascaris egg counts by 63.9 per
          cent over two months against 78.8 per cent for albendazole, so the drug
          still performed better.
        dose_studied: "about 4 g of dried powdered seeds mixed with 20 mL honey as a single dose; 10 g of seed-fortified flour in 300 mL porridge daily for 2 months in the Kenyan trial"
        reaches_gut: >
          The active compound, benzyl isothiocyanate, is released from a precursor
          by an enzyme in the seed itself when it is crushed, and it acts directly
          on worms in the intestinal lumen. Heat destroys the enzyme, so the seeds
          must be used dried or raw rather than cooked.
        citation_title: "Effectiveness of dried Carica papaya seeds against human intestinal parasitosis: a pilot study"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/17472487/"
        caution: >
          This is not a substitute for standard treatment: albendazole outperformed
          it head to head, and a heavy Ascaris burden can obstruct the bowel, which
          is not something to gamble with. Papaya seeds are peppery and can cause
          nausea and diarrhoea. Avoid in pregnancy, where papaya preparations have
          traditional associations with uterine activity and have not been studied.
          People with latex allergy may react to papaya.

      - name: Pumpkin seeds (Cucurbita pepo, cucurbitin)
        kind: food
        evidence_tier: animal
        effect: >
          Pumpkin seed extracts killed first and second stage larvae of the
          nematode Heligmosomoides bakeri in culture and, given orally to infected
          mice, reduced both faecal egg counts and adult worm burden, with the
          largest effect at 8 grams per kilogram. This was a mouse nematode, a
          relative rather than Ascaris itself, and that is stated as such. The
          extracts contained cucurbitin, and the authors also identified berberine
          and palmatine in them for the first time.
        dose_studied: "8 g/kg of ethanol seed extract in mice; no established human dose for roundworm"
        reaches_gut: >
          Cucurbitin is a water-soluble amino acid that is not well absorbed and
          acts on worms directly in the intestinal lumen, which is where Ascaris
          lives. Traditional protocols pair it with a purgative because the
          paralysis it causes is temporary.
        citation_title: "Evaluation of Anthelmintic Activity and Composition of Pumpkin (Cucurbita pepo L.) Seed Extracts - In Vitro and in Vivo Studies"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5037735/"
        caution: >
          Not a substitute for albendazole or mebendazole; the evidence is in mice
          with a different worm. Cucurbitin paralyses worms rather than killing
          them, so without a purgative they may simply recover. Large quantities of
          seeds cause bloating and diarrhoea. Do not rely on this for a confirmed
          infection.

      - name: Clove (Syzygium aromaticum, eugenol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Ethanol extract of clove leaf killed adult Ascaridia galli, the poultry
          roundworm, in a dose- and time-dependent way in culture, with the highest
          mortality at 140 mg per millilitre, and electron microscopy showed damage
          to the worm's cuticle. Ascaridia galli is a relative of Ascaris
          lumbricoides in the same order, stated as such; this is a dish result with
          no human data.
        dose_studied: "20-140 mg/mL in culture against a related nematode; no established human dose"
        reaches_gut: >
          Eugenol is absorbed and conjugated fairly rapidly in the upper small
          intestine, so only a fraction continues along the bowel. Since Ascaris
          lives in the small intestine, some contact is plausible, but the
          concentrations used in the dish are far above anything achievable there.
        citation_title: "In vitro anthelmintic activity of clove-leaf extract (Syzygium aromaticum) against Ascaridia galli"
        citation_url: "http://www.lrrd.org/lrrd33/7/3391irka.html"
        caution: >
          Not a substitute for standard treatment; this is laboratory work on a
          poultry parasite. Clove oil is genuinely dangerous in overdose and has
          caused acute liver failure in children who swallowed small amounts of the
          neat oil. It inhibits platelet function and adds to anticoagulants.
          Culinary clove is safe; concentrated oil is not.

  helminths.necator_americanus:
    display_name: Necator americanus
    what_it_is: >
      A hookworm, and the commonest one infecting people worldwide. Adults are
      about a centimetre long and bite onto the lining of the small intestine to
      feed on blood. The larvae penetrate bare skin, usually the feet, from
      contaminated soil, then travel through the lungs before reaching the gut.
    why_it_matters: >
      A confirmed hookworm infection is treated with prescription anthelmintic
      drugs and you should see a doctor. Albendazole, usually as a single dose,
      cures most infections cheaply and safely. The reason this matters is blood
      loss: each worm consumes a small amount of blood daily, and a moderate burden
      over months causes iron deficiency anaemia, fatigue and breathlessness, and in
      children impairs growth and cognitive development. In pregnancy hookworm
      anaemia raises the risk to mother and baby. Iron supplementation alone treats
      the anaemia but not its cause. Herbal alternatives are not equivalent to
      albendazole and should not replace it.
    normal_carriage: >
      Never normal. Hookworm is not part of anyone's gut flora. It remains very
      common in tropical and subtropical regions with poor sanitation and a habit of
      going barefoot. In a high-income setting a detection almost always reflects
      travel or migration.
    overgrowth_signal: >
      Any detection is an infection, so abundance is not the question. Read counts
      do not reliably reflect worm burden, and burden is what determines whether you
      become anaemic. The practical follow-up is a full blood count and ferritin
      alongside conventional egg microscopy, which are things a stool sequencing
      panel cannot provide.
    agents:
      - name: Papaya seeds (Carica papaya, benzyl isothiocyanate)
        kind: food
        evidence_tier: human_rct
        effect: >
          In the randomised Nigerian trial, dried papaya seed elixir cleared stool
          parasites in 76.7 per cent of children versus 16.7 per cent on honey
          alone, with clearance rates for the individual parasite types encountered
          running from 71.4 to 100 per cent. It has to be said plainly that
          hookworm-specific efficacy is not established: the later Kenyan school
          trial explicitly reported that hookworm was too rare in that population to
          allow any conclusion about it.
        dose_studied: "about 4 g of dried powdered seeds in 20 mL honey as a single dose"
        reaches_gut: >
          Benzyl isothiocyanate is generated from a precursor by the seed's own
          enzyme when the seed is crushed, and it acts on worms directly in the
          intestinal lumen. Heating destroys the enzyme, so the seeds must be raw
          or air-dried.
        citation_title: "Effectiveness of dried Carica papaya seeds against human intestinal parasitosis: a pilot study"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/17472487/"
        caution: >
          Not a substitute for albendazole, and specifically unproven against
          hookworm. That matters here more than usual, because the harm from
          hookworm is cumulative blood loss and every month of ineffective treatment
          costs more iron. Papaya seeds cause nausea and diarrhoea in quantity.
          Avoid in pregnancy. Possible cross-reaction in latex allergy.

      - name: Benzyl isothiocyanate (the isolated active compound of papaya seed)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Fractionation of papaya seed extracts showed that anthelmintic activity
          tracked benzyl isothiocyanate content precisely across every preparation
          tested, and that heat-treated seed extracts had neither the compound nor
          the activity until the seed enzyme was added back. In other words this is
          the active ingredient, and the finding explains why preparation method
          matters so much. Testing was done on the free-living nematode
          Caenorhabditis elegans, not on hookworm, and that is stated as such.
        dose_studied: "not established; activity in nematode viability assays correlated with seed benzyl isothiocyanate content"
        reaches_gut: >
          It is generated in the gut from crushed raw seed and acts locally on
          worms in the lumen. It degrades over hours at room temperature, which is
          why fresh preparation matters.
        citation_title: "Benzyl isothiocyanate is the chief or sole anthelmintic in papaya seed extracts"
        citation_url: "https://www.sciencedirect.com/science/article/abs/pii/S0031942201000772"
        caution: >
          Not a substitute for standard anthelmintic treatment. Isothiocyanates are
          irritant to the stomach and at high concentration are cytotoxic to human
          cells as well as to worms. There is no established safe oral dose of the
          isolated compound, and this entry is included to explain how papaya seed
          works rather than to recommend the pure chemical.

      - name: Pumpkin seeds (Cucurbita pepo, cucurbitin)
        kind: food
        evidence_tier: animal
        effect: >
          Ethanol extract of pumpkin seed reduced faecal egg counts and adult worm
          burden in mice infected with the intestinal nematode Heligmosomoides
          bakeri, and killed larval stages in culture. That worm is a relative in
          the same broad group as hookworm, stated as such, and the result has not
          been tested against human hookworm.
        dose_studied: "8 g/kg of ethanol seed extract in mice; no established human dose"
        reaches_gut: >
          Cucurbitin is poorly absorbed and acts on worms directly in the gut lumen,
          including the small intestine where hookworms attach.
        citation_title: "Evaluation of Anthelmintic Activity and Composition of Pumpkin (Cucurbita pepo L.) Seed Extracts - In Vitro and in Vivo Studies"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5037735/"
        caution: >
          Not a substitute for albendazole. Cucurbitin paralyses rather than kills,
          and a hookworm that lets go and then recovers has simply reattached. Large
          quantities of seeds cause bloating and loose stools. Do not use this
          approach for a confirmed infection that is causing anaemia.

  helminths.ancylostoma_duodenale:
    display_name: Ancylostoma duodenale
    what_it_is: >
      The other main human hookworm, sometimes called the Old World hookworm. It is
      similar to Necator americanus but has cutting teeth rather than plates, feeds
      more voraciously, and can also be acquired by swallowing larvae as well as
      through skin penetration. It can additionally pass to an infant through breast
      milk.
    why_it_matters: >
      A confirmed hookworm infection is treated with prescription anthelmintic
      drugs and you should see a doctor. Albendazole as a single dose is highly
      effective, cheap and safe. Ancylostoma duodenale draws roughly five times more
      blood per worm per day than Necator americanus, so it causes iron deficiency
      anaemia faster and at lower worm burdens, with fatigue, breathlessness and, in
      children, impaired growth and learning. It can also lie dormant in the tissues
      for months and reactivate. Herbal alternatives are not equivalent to
      albendazole and should not replace it.
    normal_carriage: >
      Never normal. It is not part of human gut flora. It is endemic across parts
      of the Mediterranean, the Middle East, North Africa, northern India and East
      Asia. In a high-income country a detection reflects travel or migration.
    overgrowth_signal: >
      Detection means infection; abundance is not the useful measure. Sequencing
      read counts do not track worm burden, and burden is what determines the rate
      of blood loss. The right next steps are a full blood count, ferritin and
      conventional stool microscopy through a doctor.
    agents:
      - name: Papaya seeds (Carica papaya, benzyl isothiocyanate)
        kind: food
        evidence_tier: human_rct
        effect: >
          Dried papaya seed elixir cleared intestinal parasites from the stools of
          76.7 per cent of Nigerian children versus 16.7 per cent given honey alone.
          As with Necator americanus, hookworm-specific efficacy is not established;
          the follow-up Kenyan trial had too few hookworm cases to assess it, and
          that limitation should not be glossed over.
        dose_studied: "about 4 g of dried powdered seeds in 20 mL honey as a single dose"
        reaches_gut: >
          Benzyl isothiocyanate is released from the crushed raw seed by the seed's
          own enzyme and acts directly on worms in the intestinal lumen. Cooking
          destroys the enzyme and the activity with it.
        citation_title: "Effectiveness of dried Carica papaya seeds against human intestinal parasitosis: a pilot study"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/17472487/"
        caution: >
          Not a substitute for albendazole, and unproven against hookworm
          specifically. Because this species causes anaemia faster than the other
          hookworm, delaying effective treatment is more costly. Papaya seeds cause
          nausea and diarrhoea in quantity, should be avoided in pregnancy, and may
          cross-react in latex allergy.

      - name: Pumpkin seeds (Cucurbita pepo, cucurbitin)
        kind: food
        evidence_tier: animal
        effect: >
          Reduced faecal egg counts and adult worm burden in mice infected with the
          gastrointestinal nematode Heligmosomoides bakeri, and killed larval stages
          in culture. A related nematode rather than hookworm, stated as such, with
          no human hookworm data.
        dose_studied: "8 g/kg of ethanol seed extract in mice; no established human dose"
        reaches_gut: >
          Cucurbitin is poorly absorbed and acts on worms in the intestinal lumen,
          which includes the upper small intestine where this hookworm attaches.
        citation_title: "Evaluation of Anthelmintic Activity and Composition of Pumpkin (Cucurbita pepo L.) Seed Extracts - In Vitro and in Vivo Studies"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5037735/"
        caution: >
          Not a substitute for prescription treatment. The paralysis cucurbitin
          causes is reversible, so a detached worm may simply reattach. Large seed
          quantities cause bloating and diarrhoea.

  helminths.strongyloides_stercoralis:
    display_name: Strongyloides stercoralis
    what_it_is: >
      A very small roundworm, only about two millimetres long, whose larvae
      penetrate bare skin from contaminated soil. What makes it unlike every other
      human worm is autoinfection: some larvae mature inside the bowel and
      re-penetrate the intestinal wall or perianal skin without ever leaving the
      body, so a single exposure can maintain an infection for the rest of a
      person's life.
    why_it_matters: >
      A confirmed Strongyloides infection is treated with prescription anthelmintic
      drugs and you must see a doctor, promptly. Ivermectin is the treatment of
      choice and is highly effective. This is the most urgent entry in this file, and
      the reason is specific: because of the autoinfection cycle, anything that
      suppresses cell-mediated immunity, above all corticosteroids, can convert a
      quiet decades-old infection into hyperinfection syndrome and disseminated
      strongyloidiasis, in which massive numbers of larvae spread through the lungs,
      brain and bloodstream, dragging gut bacteria with them and causing sepsis and
      meningitis. Mortality then exceeds 60 per cent and can approach 90 per cent.
      Even a short course of steroids, of the kind given routinely for asthma, gout,
      a skin flare, chemotherapy or COVID-19, can trigger it. HTLV-1 infection and
      transplant immunosuppression carry the same risk. If you have ever lived in or
      travelled to a tropical or subtropical region and this organism has been
      detected, tell any doctor who is about to prescribe you steroids or any
      immunosuppressant, before you take them.
    normal_carriage: >
      Never normal, and never something to watch and wait on. Chronic infection is
      commonly entirely asymptomatic or produces only intermittent mild abdominal
      discomfort, itchy skin or a characteristic fast-moving rash on the trunk, and
      it can persist silently for 30 to 60 years after someone has left an endemic
      area. Being symptom-free is not reassurance here.
    overgrowth_signal: >
      Abundance is irrelevant and potentially misleading. Strongyloides sheds larvae
      in very small and intermittent numbers in chronic infection, so a low read
      count carries exactly the same clinical weight as a high one, and conventional
      stool microscopy is notoriously insensitive for the same reason. Any
      detection, at any level, warrants medical attention and serological
      confirmation. The one situation in which a high burden is expected is
      hyperinfection, which is a medical emergency.
    agents: []
    no_agents_reason: >
      Deliberately no agents are listed, and this is the strongest recommendation in
      this file. Strongyloides must be treated with ivermectin, on prescription,
      under medical supervision, and nothing here should be used in its place or to
      delay getting it. The reason is not that botanicals are merely weaker: it is
      that this infection can kill. Because the worm reinfects you from inside your
      own bowel, an incompletely treated infection does not fade away, it persists
      indefinitely and waits for the day you are given steroids or another
      immunosuppressant, at which point disseminated disease carries a mortality
      above 60 per cent. Partial suppression by an unproven remedy could also mask
      the infection while leaving it intact, which is worse than doing nothing.
      Please make an appointment, mention where you have lived and travelled, ask
      for Strongyloides serology, and ensure the detection is recorded prominently
      in your notes so that nobody prescribes you corticosteroids without treating
      this first. Cure should be confirmed afterwards, not assumed.

  helminths.enterobius_vermicularis:
    display_name: Enterobius vermicularis
    what_it_is: >
      The pinworm or threadworm, a small white worm about a centimetre long that
      lives in the large intestine. At night the female migrates out through the
      anus to lay thousands of eggs on the surrounding skin, which is what causes the
      characteristic night-time itching. The eggs become infectious within hours and
      spread easily on fingers, bedding and dust.
    why_it_matters: >
      A confirmed pinworm infection is treated with prescription or pharmacy
      anthelmintic drugs and you should see a doctor or pharmacist. Mebendazole as a
      single dose repeated after two weeks cures nearly everyone, and the whole
      household should normally be treated together because reinfection is so easy.
      In fairness this is the most benign of the intestinal worms: the main problems
      are itching, disturbed sleep and irritability in children, with occasional
      secondary skin infection from scratching, and rarely vulvovaginitis in girls or
      involvement of the appendix. It is common in high-income countries, especially
      among school-age children, and is not a marker of poor hygiene. Herbal
      alternatives are not equivalent to the standard drugs and should not replace
      them.
    normal_carriage: >
      Never normal, though extremely common: it is the most frequent worm infection
      in Western Europe and North America, with a substantial minority of primary
      school children affected at any time. Reinfection within a household is the
      rule rather than the exception.
    overgrowth_signal: >
      Detection means infection, so abundance is not the point, and stool testing is
      in fact a poor way to find this worm because the eggs are deposited on
      perianal skin rather than passed in faeces. A negative stool result does not
      exclude it, and the conventional test is a sticky-tape sample taken from the
      perianal skin first thing in the morning.
    agents:
      - name: Wormwood (Artemisia absinthium) extract
        kind: botanical
        evidence_tier: animal
        effect: >
          In mice infected with Syphacia obvolata, the mouse pinworm and a member of
          the same family Oxyuridae as human pinworm, stated as such, alcoholic
          wormwood extract at 5 and 10 per cent concentrations eliminated pinworm
          eggs from the faeces entirely, matching the standard drug pyrantel
          pamoate; a 2.5 per cent concentration was not significantly better than
          control. This is an animal study with a related worm, and no human trial
          exists.
        dose_studied: "5-10 per cent alcoholic extract given orally to mice for 10 days; no established human dose"
        reaches_gut: >
          Given orally and acting on worms in the intestinal lumen, which is where
          pinworms live. The sesquiterpene lactones are only partly absorbed, so
          material does reach the large bowel.
        citation_title: "Antiparasitic efficacy of worm wood (Artemisia absinthium) alcoholic extract on Syphacia obvolata"
        citation_url: "https://ijvm.ut.ac.ir/article_24625_870d67dfba587c4b5032c0ceb1ebe78f.pdf"
        caution: >
          Not a substitute for mebendazole, which is inexpensive, available from a
          pharmacy and reliably effective. Wormwood contains thujone, a
          neurotoxin that causes seizures in overdose, and preparations vary
          enormously in thujone content. Do not use in pregnancy, breastfeeding,
          epilepsy or kidney disease, and do not use it in children, who are the
          people most often affected by pinworm. It should not be taken for more
          than short periods.

      - name: Pumpkin seeds (Cucurbita pepo, cucurbitin)
        kind: food
        evidence_tier: animal
        effect: >
          Pumpkin seed extract killed larval stages of the mouse nematode
          Heligmosomoides bakeri in culture and reduced egg counts and adult worm
          burden in infected mice. This is a different nematode from pinworm, stated
          as such, and there is no evidence specific to Enterobius in people.
        dose_studied: "8 g/kg of ethanol seed extract in mice; no established human dose"
        reaches_gut: >
          Cucurbitin is poorly absorbed and acts on worms directly in the gut lumen,
          reaching the large intestine where pinworms live.
        citation_title: "Evaluation of Anthelmintic Activity and Composition of Pumpkin (Cucurbita pepo L.) Seed Extracts - In Vitro and in Vivo Studies"
        citation_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5037735/"
        caution: >
          Not a substitute for standard treatment. Whatever is used, the hygiene
          measures are what actually break the reinfection cycle: treat the whole
          household at once, wash bedding and nightwear hot on treatment day, keep
          fingernails short, wash hands and scrub under the nails in the morning,
          and shower rather than bath first thing. Without those steps any treatment
          will be followed by reinfection.

  helminths.hymenolepis_nana:
    display_name: Hymenolepis nana
    what_it_is: >
      The dwarf tapeworm, and the commonest tapeworm of humans worldwide. It is
      small, up to about four centimetres, and unusual among tapeworms in needing no
      intermediate host: eggs passed by one person are directly infectious to
      another, and the worm can also complete its whole cycle inside a single person,
      allowing infections to build up and persist.
    why_it_matters: >
      A confirmed tapeworm infection is treated with prescription anthelmintic
      drugs and you should see a doctor. Praziquantel as a single dose is highly
      effective, with nitazoxanide as an alternative. Light infections often cause
      nothing at all; heavier ones, particularly in children, cause abdominal pain,
      diarrhoea, loss of appetite, irritability and weight loss. Because the worm can
      reinfect a person internally, treatment failure and persistence are more common
      than with other tapeworms, and a repeat dose is often needed. In severely
      immunosuppressed people there are rare reports of massive proliferation. Herbal
      alternatives are not equivalent to praziquantel and should not replace it.
    normal_carriage: >
      Never normal. It is nonetheless common, especially among children in warm
      climates and in institutional settings, and spreads readily within households
      and schools by the faecal-oral route.
    overgrowth_signal: >
      Any detection is an infection. Because the worm can multiply within one host,
      a heavy burden is possible without new exposure, but a sequencing read count
      is not a reliable measure of that. Conventional egg microscopy through a
      doctor, and retesting after treatment, are what matter.
    agents:
      - name: Garlic (aqueous extract)
        kind: food
        evidence_tier: human_observational
        effect: >
          Serial dilutions of crude garlic extract killed adult Hymenolepis nana in
          the laboratory at a minimum lethal concentration of one part in twenty,
          and ten children with the infection were then given either 5 mL of crude
          extract in water twice daily or two 0.6 mg garlic capsules twice daily for
          three days, which the authors described as efficient, safe and shortening
          treatment. There was no control group, no randomisation and only ten
          children, so this is weak evidence and has not been replicated in the
          thirty-odd years since.
        dose_studied: "5 mL crude aqueous garlic extract in 100 mL water twice daily, or two 0.6 mg capsules twice daily, for 3 days"
        reaches_gut: >
          Swallowed as an aqueous extract, it contacts the small intestine where
          this tapeworm attaches. Allicin is degraded by stomach acid, so how much
          active compound survives is uncertain.
        citation_title: "Evaluation of the antiparasitic effect of aqueous garlic (Allium sativum) extract in hymenolepiasis nana and giardiasis"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/1875077/"
        caution: >
          Not a substitute for praziquantel, which is a single well-tolerated dose
          with a high cure rate. Because this worm reinfects internally, an
          incomplete treatment leaves the cycle running. Garlic increases bleeding
          risk with anticoagulants and antiplatelets, should be stopped before
          surgery, and reduces saquinavir levels.

      - name: Pumpkin seeds (Cucurbita pepo)
        kind: food
        evidence_tier: animal
        effect: >
          In mice infected with Hymenolepis nana, aqueous pumpkin seed extract
          significantly reduced the number and length of adult worms and the number
          and viability of eggs compared with both untreated controls and
          praziquantel-treated animals. Later work from the same group found it
          preserved the intestinal lining better than praziquantel did. These are
          mouse studies with the correct worm species, which is unusually good for a
          botanical, but they are still not human trials.
        dose_studied: "aqueous pumpkin seed extract in mice; a related mouse study reported complete egg and worm clearance at 500-625 mg/kg. No established human dose"
        reaches_gut: >
          Cucurbitin is poorly absorbed and works directly on the worm in the
          intestinal lumen, which is where Hymenolepis nana lives.
        citation_title: "Anthelmintic Potential of Cucurbita pepo Seeds on Hymenolepis nana"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/30778840/"
        caution: >
          Not a substitute for praziquantel. Mouse results do not reliably transfer
          to people, no human dose has been established, and the internal
          reinfection cycle of this worm makes incomplete treatment particularly
          unhelpful. Large quantities of seeds cause bloating and loose stools.

      - name: Wormwood (Artemisia absinthium) extract
        kind: botanical
        evidence_tier: animal
        effect: >
          Crude aqueous wormwood extract paralysed and killed adult Hymenolepis nana
          in culture and caused tegumental damage, lipid accumulation and destruction
          of the intrauterine eggs on electron microscopy. In infected mice it
          produced significant reductions in egg counts and worm burden at 400 and
          800 mg per kilogram. The authors were explicit that praziquantel still gave
          the best results.
        dose_studied: "1-5 mg/mL in culture; 400-800 mg/kg orally in mice. No established human dose"
        reaches_gut: >
          Given orally and acting on worms in the intestinal lumen. Sesquiterpene
          lactones are incompletely absorbed, so material reaches the small
          intestine where this worm lives.
        citation_title: "Therapeutic efficacy of Artemisia absinthium against Hymenolepis nana: in vitro and in vivo studies in comparison with the anthelmintic praziquantel"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/28606189/"
        caution: >
          Not a substitute for praziquantel, and the study itself found praziquantel
          superior. Wormwood contains thujone, a neurotoxin that causes seizures in
          overdose, and content varies widely between products. Avoid in pregnancy,
          breastfeeding, epilepsy and kidney disease, and avoid in children, who are
          the group most often infected with this worm.

  helminths.taenia_solium:
    display_name: Taenia solium
    what_it_is: >
      The pork tapeworm. The adult worm, which can reach several metres, lives in
      the small intestine and is acquired by eating undercooked pork containing
      cysts. Segments full of eggs break off and pass in the stool.
    why_it_matters: >
      A confirmed tapeworm infection is treated with prescription anthelmintic
      drugs and you must see a doctor. This species is by far the most serious of
      the human tapeworms, and not because of the worm in your gut, which often
      causes only mild symptoms. The danger is that the eggs it sheds are infectious
      to people, including to you: if swallowed, they hatch and the larvae lodge in
      muscle, the eye and above all the brain, causing cysticercosis and
      neurocysticercosis, the leading preventable cause of acquired epilepsy
      worldwide. Anyone carrying an adult Taenia solium is a public health risk to
      their household. Treatment needs medical supervision for a specific reason:
      praziquantel can provoke a severe inflammatory reaction if undiagnosed brain
      cysts are already present, so some clinicians prefer niclosamide, or screen
      first. Do not attempt to manage this at home.
    normal_carriage: >
      Never normal. It is endemic in parts of Latin America, sub-Saharan Africa and
      Asia where pigs have access to human faeces, and it appears in high-income
      countries mainly through travel and migration.
    overgrowth_signal: >
      Detection means infection, and abundance is not the relevant measure. What is
      relevant is that DNA-based identification to species is genuinely important
      here: distinguishing Taenia solium from Taenia saginata changes the risk
      completely, because only Taenia solium eggs cause cysticercosis in humans, and
      microscopy of eggs cannot tell the two apart.
    agents:
      - name: Pumpkin seeds with areca nut extract
        kind: food
        evidence_tier: human_observational
        effect: >
          In a community treatment programme in northwest Sichuan, 40 of 45
          confirmed taeniasis cases, 88.9 per cent, expelled intact worms after the
          combination, with a mean time to expulsion of two hours and 89 per cent
          passing the worm within three hours. Each component alone was less
          effective: pumpkin seeds alone cured 75 per cent but took about fourteen
          hours, areca nut alone 63.6 per cent. A separate comparison of 250 cases
          found cure rates of 91.7 per cent for the combination against 93.7 per cent
          for praziquantel, with more complete worms recovered on the herbal
          regimen. Notably, some clinicians favour this regimen specifically where
          Taenia solium is present, because it does not carry praziquantel's risk of
          provoking symptoms in undiagnosed brain cysts.
        dose_studied: "80 g of pumpkin seeds followed by areca nut extract, then a purgative, in the Sichuan programme; the 1976 study used 75-150 g areca nuts with 50-100 g pumpkin seeds"
        reaches_gut: >
          Both act in the intestinal lumen. Cucurbitin from pumpkin seed and
          arecoline from areca nut are poorly absorbed and paralyse the worm in
          place; a purgative is then given to sweep it out before it recovers.
        citation_title: "Usefulness of pumpkin seeds combined with areca nut extract in community-based treatment of human taeniasis in northwest Sichuan Province, China"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/22910218/"
        caution: >
          This is not a substitute for proper medical management, and Taenia solium
          is the worst possible worm to self-treat. Whatever expels the worm, the
          critical questions are whether you already have cysts elsewhere in the
          body and whether your household has been screened, and neither is
          answerable at home. Areca nut is a recognised human carcinogen with
          long-term use and is strongly linked to oral cancer; it causes nausea,
          dizziness and, in the 1976 series, one case of coma and abdominal pain. It
          is unsuitable in pregnancy, cardiac disease and asthma. Around 46 per cent
          of people in the Sichuan programme had nausea or dizziness. See a doctor.

  helminths.taenia_saginata:
    display_name: Taenia saginata
    what_it_is: >
      The beef tapeworm. It is the largest human tapeworm, commonly four to ten
      metres long, and lives attached to the wall of the small intestine. It is
      acquired by eating raw or undercooked beef containing cysts.
    why_it_matters: >
      A confirmed tapeworm infection is treated with prescription anthelmintic
      drugs and you should see a doctor. Praziquantel or niclosamide as a single dose
      is highly effective. Compared with the pork tapeworm this species is far less
      dangerous, because its eggs do not cause cysticercosis in humans, and many
      people have no symptoms beyond the unpleasant experience of passing motile
      segments, which often crawl out independently of a bowel movement. Some people
      get abdominal discomfort, nausea, appetite change or weight loss. It should
      still be treated: it is a metres-long parasite, it sheds continuously, and it
      does not clear on its own.
    normal_carriage: >
      Never normal. It occurs worldwide wherever raw or lightly cooked beef is
      eaten, including in Europe, and is particularly common in parts of Africa,
      Latin America and Central Asia.
    overgrowth_signal: >
      Detection is the finding; abundance is not meaningful, and a single worm is a
      complete infection. Species-level DNA identification is valuable here for
      reassurance rather than alarm: confirming Taenia saginata rather than Taenia
      solium means there is no cysticercosis risk, which microscopy of eggs alone
      cannot establish.
    agents:
      - name: Pumpkin seeds with areca nut extract
        kind: food
        evidence_tier: human_observational
        effect: >
          In the original 1976 Taiwanese series, 33 people with Taenia saginata were
          treated with a mixture of boiled areca nuts and pumpkin seeds and 48 worms
          including 42 scolices were recovered from 29 of them, the recovery of the
          head being what determines whether the worm regrows. The mixture was judged
          effective and safe, though four people had side effects, three with
          dizziness, tinnitus, nausea and vomiting, and one with coma and abdominal
          pain. Later Chinese work put the cure rate of the combination at around 89
          to 92 per cent, close to praziquantel.
        dose_studied: "75-150 g areca nuts with 50-100 g pumpkin seeds, boiled, followed by a purgative"
        reaches_gut: >
          Cucurbitin and arecoline are both poorly absorbed and act on the worm
          directly in the intestinal lumen, paralysing it so that a purgative can
          expel it before it recovers its grip.
        citation_title: "Treatment of Taenia saginata infection with mixture of areca nuts and pumpkin seeds"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/1036985/"
        caution: >
          Not a substitute for praziquantel or niclosamide, which are single doses
          with fewer side effects and no carcinogen involved. Areca nut is
          classified as a human carcinogen and is strongly associated with oral
          cancer with regular use; it is also cardioactive and bronchoconstrictive,
          so it is unsuitable in pregnancy, heart disease and asthma. The coma
          reported in the 1976 series is a reminder that this is not a gentle
          remedy. Cure must be confirmed afterwards, because if the head remains the
          worm regrows.

  helminths.taenia_asiatica:
    display_name: Taenia asiatica
    what_it_is: >
      The Asian tapeworm, recognised as a separate species relatively recently. It
      looks like the beef tapeworm but is acquired from eating raw or undercooked
      pig liver and offal rather than beef, and it is found across East and
      Southeast Asia.
    why_it_matters: >
      A confirmed tapeworm infection is treated with prescription anthelmintic
      drugs and you should see a doctor. Praziquantel is effective. Symptoms are
      generally mild, much like the beef tapeworm, with abdominal discomfort, nausea
      and passage of segments. Whether its eggs can cause cysticercosis in humans
      remains debated, which is a good reason not to leave it untreated and to let a
      clinician weigh the risk. It is easily confused with Taenia saginata by
      appearance, so DNA identification is genuinely helpful.
    normal_carriage: >
      Never normal. It is endemic in Taiwan, Korea, Indonesia, Thailand, China and
      neighbouring countries, associated with the custom of eating raw pig liver.
    overgrowth_signal: >
      Detection means infection and a single worm is a full infection, so abundance
      does not signify. The useful thing a DNA test adds is the species assignment
      itself, since this species cannot be distinguished from Taenia saginata by
      egg microscopy.
    agents:
      - name: Pumpkin seeds with areca nut extract
        kind: food
        evidence_tier: human_observational
        effect: >
          In the Sichuan community programme, 88.9 per cent of confirmed taeniasis
          cases expelled intact worms after pumpkin seeds combined with areca nut
          extract, with a mean expulsion time of two hours. Clinicians experienced
          with this regimen report it works for Taenia solium, Taenia saginata and
          Taenia asiatica alike, though the published series did not always separate
          the species, and that limitation is stated here.
        dose_studied: "80 g pumpkin seeds followed by areca nut extract and a purgative"
        reaches_gut: >
          Both cucurbitin and arecoline are poorly absorbed and act on the worm in
          the intestinal lumen, paralysing it so a purgative can expel it.
        citation_title: "Usefulness of pumpkin seeds combined with areca nut extract in community-based treatment of human taeniasis in northwest Sichuan Province, China"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/22910218/"
        caution: >
          Not a substitute for praziquantel. Areca nut is a recognised human
          carcinogen linked to oral cancer, and causes nausea and dizziness in
          roughly half of those treated. Avoid in pregnancy, heart disease and
          asthma. Because the cysticercosis potential of this species is still
          debated, this is a worm to have properly identified and treated under
          medical supervision, with cure confirmed afterwards.

  helminths.trichuris_trichiura:
    display_name: Trichuris trichiura
    what_it_is: >
      The whipworm, named for its shape: a slender thread-like front end that
      burrows into the lining of the large intestine and a thicker rear end that
      hangs free in the bowel. It is acquired by swallowing eggs from contaminated
      soil, food or hands.
    why_it_matters: >
      A confirmed whipworm infection is treated with prescription anthelmintic
      drugs and you should see a doctor. It is worth saying that whipworm is the
      hardest of the soil-transmitted worms to treat: a single dose of albendazole
      cures only a minority, and current practice usually requires a three-day
      course, a combination such as albendazole with ivermectin, or the newer
      combination regimens. Light infections cause little. Heavy infections cause
      chronic bloody diarrhoea, abdominal pain, anaemia, poor growth in children
      and, in the heaviest, rectal prolapse. Herbal alternatives are not equivalent
      to the drugs, and given that even the drugs struggle here, that gap is wider
      than usual.
    normal_carriage: >
      Never normal. It is very common globally in areas with poor sanitation,
      infecting several hundred million people, and it frequently occurs alongside
      Ascaris. In high-income countries a detection reflects travel, migration or
      contaminated imported produce.
    overgrowth_signal: >
      Detection means infection. Burden matters clinically, because symptoms are
      strongly dose-related and light infections genuinely cause little, but a
      sequencing read count is not a validated measure of burden. Conventional egg
      counting through a doctor is what quantifies it.
    agents:
      - name: Papaya seeds (Carica papaya, benzyl isothiocyanate)
        kind: food
        evidence_tier: human_rct
        effect: >
          In the randomised Nigerian trial, dried papaya seed elixir cleared stool
          parasites in 76.7 per cent of children against 16.7 per cent on honey
          alone, across the range of parasites present. Whipworm-specific efficacy
          is not established, however: the later Kenyan school trial found whipworm
          too uncommon in that population to analyse, and stated so explicitly.
          Given how resistant whipworm is even to albendazole, this should be
          treated as unproven rather than promising.
        dose_studied: "about 4 g of dried powdered seeds in 20 mL honey as a single dose"
        reaches_gut: >
          Benzyl isothiocyanate is generated from crushed raw seed by the seed's own
          enzyme and acts on worms in the intestinal lumen. Whether it reaches the
          caecum and ascending colon, where whipworm burrows into the mucosa, at any
          useful concentration is unknown.
        citation_title: "Effectiveness of dried Carica papaya seeds against human intestinal parasitosis: a pilot study"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/17472487/"
        caution: >
          Not a substitute for standard treatment, and particularly so here, because
          whipworm partially embeds itself in the bowel wall and resists even
          proven drugs. Papaya seeds cause nausea and diarrhoea in quantity, should
          be avoided in pregnancy, and may cross-react in latex allergy.

      - name: Clove (Syzygium aromaticum, eugenol)
        kind: botanical
        evidence_tier: in_vitro
        effect: >
          Eugenol killed both adults and muscle larvae of Trichinella spiralis in
          culture, reaching 100 per cent larval mortality at 1218 and 3045
          micromolar within 10 to 24 hours, matching albendazole, with massive
          cuticular destruction on electron microscopy. Trichinella is a member of
          the same order Trichinellida as Trichuris and is its nearest well-studied
          relative, stated as such. This is not whipworm and it is not a human
          study.
        dose_studied: "IC50 187.5 micromolar for larvae and 190.4 micromolar for adults in culture against a related nematode; no established human dose"
        reaches_gut: >
          Eugenol is absorbed and conjugated in the upper small intestine, so
          relatively little reaches the caecum and ascending colon where whipworm
          lives. This is a significant obstacle for this particular worm.
        citation_title: "Eugenol; Effective Anthelmintic Compound against Foodborne Parasite Trichinella spiralis Muscle Larvae and Adult"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/36678475/"
        caution: >
          Not a substitute for prescription treatment; this is laboratory work with
          a different worm. Clove oil is toxic in overdose and has caused acute
          liver failure in children who swallowed small amounts of the neat oil. It
          inhibits platelet function and adds to anticoagulant effects, and irritates
          mucous membranes. Culinary clove is safe; concentrated oil is not.

  helminths.clonorchis_sinensis:
    display_name: Clonorchis sinensis
    what_it_is: >
      The Chinese liver fluke, a flat leaf-shaped worm one to two centimetres long
      that lives in the bile ducts inside the liver rather than in the intestine
      itself. It is acquired by eating raw, undercooked, pickled or smoked
      freshwater fish containing the larval stage.
    why_it_matters: >
      A confirmed liver fluke infection is treated with prescription anthelmintic
      drugs and you should see a doctor. Praziquantel is highly effective, and
      tribendimidine is used in some countries. The reason this cannot be left is
      that Clonorchis is classified by the International Agency for Research on
      Cancer as a Group 1 carcinogen: chronic infection causes bile duct
      inflammation, stones and scarring, and substantially raises the risk of
      cholangiocarcinoma, cancer of the bile ducts, which has a very poor outlook.
      Infections can persist for twenty to thirty years, often with few symptoms
      until damage is advanced. Herbal alternatives are not equivalent to
      praziquantel and should not replace it.
    normal_carriage: >
      Never normal. It is endemic in China, Korea, Taiwan, Vietnam and eastern
      Russia, where tens of millions are infected. Elsewhere a detection reflects
      travel, migration, or eating imported raw freshwater fish, and infections
      acquired decades earlier may still be present.
    overgrowth_signal: >
      Detection means infection and any detection warrants treatment, regardless of
      abundance, because the cancer risk accumulates with duration rather than with
      worm count. Egg shedding is intermittent, so a low read count does not mean a
      light infection. Long-standing infection also warrants imaging of the biliary
      tree, which is a decision for a doctor.
    agents:
      - name: Artesunate or artemether (sweet wormwood, Artemisia annua derivatives)
        kind: botanical
        evidence_tier: animal
        effect: >
          In rats infected with adult Clonorchis sinensis, a single oral dose of
          artesunate or artemether at 150 mg per kilogram reduced worm burden by
          98.6 to 100 per cent. Follow-up work confirmed dose-dependent killing, with
          16 and 70 mg per kilogram of artesunate reducing worm burden by 50 and 95
          per cent respectively. This is among the strongest animal evidence for any
          botanical-derived agent against a human parasite, but it remains animal
          data: no clinical trial of artemisinins for human clonorchiasis has been
          published.
        dose_studied: "single oral dose of 75-300 mg/kg in rats, with 150 mg/kg near-curative; no established human dose for clonorchiasis"
        reaches_gut: >
          This one is different from the other agents here, and in the right way.
          Artesunate and artemether are well absorbed from the gut and reach the
          liver and biliary system through the portal circulation, which is exactly
          where this fluke lives. A luminal agent would be useless for a parasite in
          the bile ducts; systemic absorption is the point.
        citation_title: "Effect of artesunate and artemether against Clonorchis sinensis and Opisthorchis viverrini in rodent models"
        citation_url: "https://pubmed.ncbi.nlm.nih.gov/16973335/"
        caution: >
          Not a substitute for praziquantel, which is proven in humans against a
          parasite that causes bile duct cancer, and the stakes here make
          experimentation a bad idea. There is a further public health reason for
          caution: artemisinins are the backbone of malaria treatment worldwide, and
          casual unsupervised use for other purposes drives resistance that costs
          lives. Artemisinin derivatives are contraindicated in the first trimester
          of pregnancy, can cause a delayed haemolytic anaemia, and interact with
          several drugs through CYP enzymes. Doses in the rat studies were far above
          human antimalarial dosing.

