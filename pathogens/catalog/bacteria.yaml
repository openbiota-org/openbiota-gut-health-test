    negative_limitation_codes: [sampling, shedding, extraction, depth, reference_diversity]
    clinical_source_urls: ["https://www.fda.gov/food/foodborne-pathogens/bad-bug-book-second-edition"]
    note: >-
      Installed as the competitor the Escherichia/Shigella rows were missing,
      not as a finding. Ordinary gut Escherichia coli lives in most healthy
      adults, and every Shigella species and diarrhoeagenic E. coli pathotype
      is the same genomic species as it: GTDB R07-RS207 reclassified Shigella
      as later heterotypic synonyms of E. coli, its earlier compromise having
      renamed about 60% of E. coli genomes, K-12 among them, to "E. flexneri".
      Without a commensal E. coli genome in the bundle, ordinary E. coli reads
      had no correct home. Competitive alignment placed them on the nearest
      available reference, which is a Shigella genome, and the k-mer ownership
      pass never masked the sequence the two share, so shared regions were
      credited as Shigella-specific. Detection here is expected and must never
      be surfaced as an infection, a risk score or a treatment trigger; the
      pathotype rows remain the only route to a diarrhoeagenic call and they
      require their own virulence markers.
