    negative_limitation_codes: [sampling, shedding, extraction, depth, reference_diversity, low_abundance]
    clinical_source_urls: ["https://academic.oup.com/cid/article-abstract/47/5/659/296177"]
    note: >-
      Conditional carriage versus disease: a positive stool sequence is NOT
      Whipple disease. Asymptomatic faecal carriage is documented in a
      substantial minority of healthy adults and at much higher rates in
      sewage workers and some high-prevalence populations, so stool positivity
      has poor specificity for disease. Classic Whipple disease requires
      duodenal biopsy with PAS-positive macrophages plus confirmatory PCR or
      immunohistochemistry, interpreted by a specialist. Never emit a Whipple
      disease label, and never recommend the prolonged antibiotic course on
      the basis of a stool sequence.
